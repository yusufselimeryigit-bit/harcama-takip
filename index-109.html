<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cüzdan">
<title>Cüzdan</title>
<style>
/* =====================================================================
   DESIGN SYSTEM · Liquid Glass
   Tokens → Base → Glass primitives → Components → Screens → Motion
   ===================================================================== */

/* ---------- 1. Tokens ---------- */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --r-xl:30px;--r-lg:24px;--r-md:18px;--r-sm:13px;
  --blue:#0a84ff;--indigo:#5e5ce6;--purple:#bf5af2;--pink:#ff375f;--red:#ff453a;
  --orange:#ff9f0a;--yellow:#ffd60a;--green:#30d158;--teal:#64d2ff;
  --blur:blur(28px) saturate(185%);
}
[data-theme=dark]{
  --bg:#000;                                   /* OLED siyah */
  --text:#f5f5f7;--text2:rgba(235,235,245,.62);--text3:rgba(235,235,245,.32);
  --glass:rgba(255,255,255,.065);--glass-2:rgba(255,255,255,.1);
  --glass-strong:rgba(30,30,34,.62);--sheet:rgba(24,24,28,.86);
  --glass-border:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.2);
  --sheen:rgba(255,255,255,.1);
  --shadow:0 12px 40px rgba(0,0,0,.6);--shadow-sm:0 4px 16px rgba(0,0,0,.4);
  --sep:rgba(255,255,255,.08);--fill:rgba(118,118,128,.24);
  --blob-op:.38;--solid:#121214;
}
[data-theme=light]{
  --bg:#eef0f6;
  --text:#1c1c1e;--text2:rgba(60,60,67,.66);--text3:rgba(60,60,67,.36);
  --glass:rgba(255,255,255,.5);--glass-2:rgba(255,255,255,.68);
  --glass-strong:rgba(255,255,255,.66);--sheet:rgba(248,248,252,.9);
  --glass-border:rgba(255,255,255,.75);--glass-hi:rgba(255,255,255,.95);
  --sheen:rgba(255,255,255,.55);
  --shadow:0 12px 34px rgba(40,50,110,.13);--shadow-sm:0 4px 14px rgba(40,50,110,.1);
  --sep:rgba(60,60,67,.12);--fill:rgba(118,118,128,.13);
  --blob-op:.5;--solid:#f7f8fb;
}

/* ---------- 2. Base ---------- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);transition:background .4s var(--ease)}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 110px)}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--text);font-size:16px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* Ambient renk katmanı: camın arkasındaki canlı gradyanlar */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-op);animation:drift 22s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:340px;height:340px;background:var(--blue);top:-90px;left:-110px}
.ambient i:nth-child(2){width:300px;height:300px;background:var(--purple);top:28%;right:-130px;animation-duration:26s}
.ambient i:nth-child(3){width:280px;height:280px;background:var(--teal);bottom:-60px;left:10%;animation-duration:30s;opacity:calc(var(--blob-op)*.7)}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}

/* ---------- 3. Glass primitives ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-hi);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(140deg,var(--sheen) 0%,transparent 38%,transparent 70%,rgba(255,255,255,.03) 100%)}
.glass-strong{background:var(--glass-strong)}
.pressable{transition:transform .45s var(--spring),opacity .2s;will-change:transform;user-select:none;-webkit-user-select:none}
.pressable:active{transform:scale(.96);transition-duration:.1s}

/* ---------- 4. Layout ---------- */
#screen{max-width:520px;margin:0 auto;padding:0 16px}
.section{margin-top:26px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.section-head h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.section-head button{color:var(--blue);font-size:15px}
.muted{color:var(--text2)}.faint{color:var(--text3)}.sm{font-size:13px}.xs{font-size:11.5px}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--orange)}

/* ---------- 5. Components ---------- */
/* Top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 4px}
.topbar .t-sub{font-size:13px;color:var(--text2);font-weight:500}
.topbar h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:1px}
.top-actions{display:flex;gap:10px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 4px 14px rgba(94,92,230,.45)}

/* Hero */
.hero{padding:22px 22px 18px;border-radius:var(--r-xl);margin-top:16px;overflow:hidden}
.hero::after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;
  background:radial-gradient(circle,rgba(10,132,255,.45),transparent 70%);z-index:-1}
.hero-label{font-size:13px;color:var(--text2);font-weight:600;letter-spacing:.02em}
.hero-amount{font-size:44px;font-weight:800;letter-spacing:-.04em;margin:4px 0 14px;line-height:1.05}
.hero-amount .dec{font-size:24px;font-weight:700;color:var(--text2)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12.5px;padding:7px 11px;border-radius:20px;background:var(--glass-2);border:1px solid var(--glass-border);font-weight:600}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--sep)}
.hero-foot b{display:block;font-size:20px;letter-spacing:-.02em;margin-top:2px}
.delta{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:12px}
.delta.up{color:var(--red);background:rgba(255,69,58,.14)}
.delta.down{color:var(--green);background:rgba(48,209,88,.14)}
.delta.flat{color:var(--text2);background:var(--fill)}

/* Quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;border-radius:var(--r-md);font-size:12px;font-weight:600}
.qa .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;color:#fff}
.qa .soon{position:absolute;top:6px;right:6px;font-size:9px;padding:2px 5px;border-radius:6px;background:var(--fill);color:var(--text2)}

/* Card carousel */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 14px;margin:0 -16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.ccard{text-align:left;flex:0 0 82%;max-width:330px;height:190px;border-radius:var(--r-lg);padding:18px;color:#fff;scroll-snap-align:center;
  position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.ccard::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%),radial-gradient(circle at 90% 120%,rgba(255,255,255,.22),transparent 55%)}
.ccard>*{position:relative}
.ccard .cc-top{display:flex;justify-content:space-between;align-items:flex-start}
.ccard .cc-name{font-weight:700;font-size:16px}.ccard .cc-bank{font-size:12px;opacity:.8}
.ccard .chip{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,#f6e27a,#c9a227);opacity:.9}
.ccard .cc-lbl{font-size:11.5px;opacity:.8;font-weight:600}
.ccard .cc-amt{font-size:27px;font-weight:800;letter-spacing:-.03em}
.ccard .cc-bar{height:6px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin-top:8px}
.ccard .cc-bar span{display:block;height:100%;background:#fff;border-radius:4px;transition:width .8s var(--ease)}
.ccard .cc-foot{display:flex;justify-content:space-between;font-size:12px;opacity:.92;margin-top:8px}
.acc-tile{text-align:left;flex:0 0 42%;max-width:170px;height:190px;border-radius:var(--r-lg);padding:16px;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:space-between}
.acc-tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.acc-tile .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.add-tile{display:grid;place-items:center;text-align:center;color:var(--text2);font-weight:600;font-size:13px}
.add-tile span{font-size:30px;display:block;color:var(--blue)}

/* Insights */
.insights{display:flex;flex-direction:column;gap:10px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md)}
.insight .ic{flex-shrink:0;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px}
.insight b{display:block;font-size:14.5px;margin-bottom:2px}
.insight p{font-size:13px;color:var(--text2)}
.sev-danger .ic{background:rgba(255,69,58,.18)}.sev-warn .ic{background:rgba(255,159,10,.18)}
.sev-info .ic{background:rgba(10,132,255,.18)}.sev-good .ic{background:rgba(48,209,88,.18)}

/* Segmented control */
.seg{position:relative;display:flex;background:var(--fill);border-radius:11px;padding:2px}
.seg button{position:relative;z-index:1;flex:1;padding:7px 12px;font-size:13px;font-weight:600;border-radius:9px;transition:color .3s}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:9px;background:var(--glass-hi);box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .45s var(--spring),width .3s}
[data-theme=dark] .seg .thumb{background:rgba(255,255,255,.18)}

/* Donut */
.spend{padding:18px}
.spend-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.donut-wrap{display:flex;align-items:center;gap:18px;margin-top:16px}
.donut{position:relative;width:170px;height:170px;flex-shrink:0}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:20;stroke-linecap:round;transition:opacity .3s,stroke-width .3s var(--spring);cursor:pointer}
.donut circle.track{stroke:var(--fill);cursor:default}
.donut circle.dim{opacity:.25}.donut circle.on{stroke-width:25}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut-center b{font-size:21px;letter-spacing:-.02em}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.legend button{display:flex;align-items:center;gap:8px;font-size:13px;text-align:left;width:100%;transition:opacity .3s}
.legend button.dim{opacity:.35}
.legend .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.legend .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{color:var(--text2);font-variant-numeric:tabular-nums}

/* Installment bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:4px 2px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bar-col .v{font-size:10.5px;color:var(--text2);height:16px;white-space:nowrap}
.bar-stack{flex:1;width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:9px;overflow:hidden;background:var(--fill)}
.bar-stack span{display:block;width:100%;transform-origin:bottom}
.bar-col .l{font-size:11.5px;color:var(--text2);margin-top:6px;font-weight:600}
.bar-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--text2)}
.bar-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Lists */
.list{border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:64px;right:0;height:1px;background:var(--sep)}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:12.5px;color:var(--text2)}
.row .end{text-align:right;flex-shrink:0}
.row .end b{font-size:15px;display:block}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;margin-top:3px}
.badge.red{background:rgba(255,69,58,.16);color:var(--red)}.badge.orange{background:rgba(255,159,10,.16);color:var(--orange)}
.badge.blue{background:rgba(10,132,255,.16);color:var(--blue)}.badge.green{background:rgba(48,209,88,.16);color:var(--green)}
.mini-btn{font-size:12px;font-weight:700;color:var(--blue);padding:5px 10px;border-radius:9px;background:rgba(10,132,255,.13);margin-top:4px}

/* Progress */
.prog{height:7px;border-radius:5px;background:var(--fill);overflow:hidden}
.prog span{display:block;height:100%;border-radius:5px;transition:width .8s var(--ease)}

/* Empty / welcome */
.welcome{padding:26px 22px;text-align:center;border-radius:var(--r-xl);margin-top:16px}
.welcome .big-ic{font-size:46px}
.welcome h2{font-size:22px;letter-spacing:-.02em;margin:10px 0 6px}
.welcome p{color:var(--text2);font-size:14px;margin-bottom:6px}

/* Buttons */
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-size:16px;font-weight:700;text-align:center;margin-top:12px;background:var(--fill)}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--indigo));color:#fff;box-shadow:0 8px 22px rgba(10,132,255,.35)}
.btn.danger{color:var(--red)}

/* Floating tab bar */
.tabbar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(calc(100% - 28px),430px);height:68px;border-radius:34px;display:flex;align-items:center;padding:0 8px;z-index:50;
  background:var(--glass-strong);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.tab{position:relative;z-index:1;flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:600;color:var(--text2);transition:color .3s}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue)}
.tab-ind{position:absolute;top:7px;height:54px;border-radius:27px;background:var(--glass-2);border:1px solid var(--glass-border);transition:transform .55s var(--spring),width .4s var(--ease)}
.tab-add{position:relative;z-index:1;width:54px;height:54px;margin:0 4px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:300;
  background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 20px rgba(94,92,230,.5),inset 0 1px 0 rgba(255,255,255,.4)}

/* Sheet (bottom modal) */
.sheet-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
.sheet{width:100%;max-width:520px;max-height:93vh;overflow-y:auto;border-radius:32px 32px 0 0;padding:8px 20px calc(28px + env(safe-area-inset-bottom));
  background:var(--sheet);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--glass-border);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:sheetUp .5s var(--ease)}
.sheet-backdrop.closing{animation:fadeOut .25s forwards}
.sheet-backdrop.closing .sheet{animation:sheetDown .25s ease-in forwards}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--text3);margin:2px auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head h3{font-size:20px;letter-spacing:-.02em}
.sheet-head button{font-size:15px;color:var(--blue);font-weight:600}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:12.5px;color:var(--text2);margin:0 4px 6px;font-weight:600}
.input{width:100%;padding:14px;border-radius:14px;border:1px solid transparent;background:var(--fill);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s}
.input:focus{border-color:var(--blue)}
input[type=date].input{min-height:50px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount-in{width:100%;text-align:center;font-size:46px;font-weight:800;letter-spacing:-.04em;background:none;border:0;outline:none;padding:10px 0 2px}
.amount-cur{text-align:center;color:var(--text2);font-size:13px;font-weight:600}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:14px;background:var(--fill);font-size:11px;font-weight:600;border:2px solid transparent}
.cat-opt .e{font-size:21px}
.cat-opt.on{border-color:var(--blue);background:rgba(10,132,255,.14)}
.preview{margin-top:14px;padding:13px 14px;border-radius:14px;background:rgba(10,132,255,.1);font-size:13.5px;color:var(--text2);line-height:1.5}
.preview b{color:var(--text)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--text)}
.action-list .row{padding:15px 4px}
.action-list .row+.row::before{left:54px}

/* Toast */
.toasts{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;padding:12px 18px;border-radius:22px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);
  background:var(--glass-strong);box-shadow:var(--shadow);animation:toastIn .5s var(--spring)}
.toast.out{animation:toastOut .3s forwards}

/* AI */
.ai-card{padding:18px;border-radius:var(--r-lg)}
.ai-card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:linear-gradient(135deg,rgba(94,92,230,.9),rgba(191,90,242,.45),rgba(100,210,255,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ai-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.ai-head b{font-size:16px}
.ai-orb{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:conic-gradient(from 0deg,#0a84ff,#bf5af2,#ff375f,#64d2ff,#0a84ff);
  animation:spin 7s linear infinite;box-shadow:0 0 18px rgba(191,90,242,.45)}
.ai-orb.busy{animation-duration:1.1s;box-shadow:0 0 26px rgba(191,90,242,.8)}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-headline{font-size:15.5px;font-weight:600;line-height:1.42;margin-bottom:6px}
.tip{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--sep)}
.tip .pr{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.tip b{font-size:14px;display:block}.tip p{font-size:13px;color:var(--text2);margin-top:2px;line-height:1.4}
.save-pill{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--green);background:rgba(48,209,88,.13);padding:3px 8px;border-radius:8px}
.score{font-size:12px;font-weight:800;padding:5px 9px;border-radius:10px;background:rgba(94,92,230,.18);color:#8f8dff;white-space:nowrap}
.ai-sub{font-size:11.5px;font-weight:700;color:var(--text2);letter-spacing:.05em;margin:12px 0 2px}
.shimmer{height:12px;border-radius:6px;margin:11px 0;background:linear-gradient(90deg,var(--fill) 25%,var(--glass-2) 50%,var(--fill) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.err-box{margin:4px 0 10px;padding:11px 13px;border-radius:13px;background:rgba(255,69,58,.12);color:var(--red);font-size:13.5px}
.ai-banner{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45;color:var(--text);
  background:linear-gradient(135deg,rgba(94,92,230,.2),rgba(191,90,242,.14));border:1px solid rgba(160,140,255,.3)}
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.scan-btn{padding:22px 10px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.scan-btn .e{font-size:32px}
.scan-prev{position:relative;margin-top:14px;border-radius:18px;overflow:hidden;background:var(--fill);min-height:120px;display:grid;place-items:center}
.scan-prev img{display:block;width:100%;max-height:320px;object-fit:contain}
.scan-prev .doc{font-size:54px;padding:26px}
.scan-prev .beam{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#bf5af2,#64d2ff,transparent);
  box-shadow:0 0 18px #bf5af2;animation:beam 1.8s ease-in-out infinite alternate}
@keyframes beam{from{top:4%}to{top:94%}}
.link{color:var(--blue);text-decoration:none;font-weight:600}

/* ---------- 6. Motion ---------- */
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes toastIn{from{transform:translateY(-30px) scale(.9);opacity:0}}
@keyframes toastOut{to{transform:translateY(-20px);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dasharray:0 999}}
.enter .stagger>*{animation:rise .6s var(--ease) both}
.enter .stagger>*:nth-child(2){animation-delay:.04s}.enter .stagger>*:nth-child(3){animation-delay:.08s}
.enter .stagger>*:nth-child(4){animation-delay:.12s}.enter .stagger>*:nth-child(5){animation-delay:.16s}
.enter .stagger>*:nth-child(6){animation-delay:.2s}.enter .stagger>*:nth-child(7){animation-delay:.24s}
.enter .stagger>*:nth-child(n+8){animation-delay:.28s}
.enter .bar-stack span{animation:grow .8s var(--ease) both}
.enter .donut circle.s{animation:draw 1s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* =====================================================================
   v3 · Sayfalar, detaylar, takvim, matrix, kilit ekranı, yazdırma
   ===================================================================== */
/* Pages & navigation */
.page-head{display:flex;justify-content:space-between;align-items:center;padding:4px 0 0;min-height:44px}
.back{font-size:17px;color:var(--blue);font-weight:600;padding:8px 12px 8px 0;display:flex;align-items:center;gap:4px}
.back b{font-size:30px;font-weight:300;line-height:20px;margin-top:-4px}
.page-title{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 4px 2px}
.page-sub{font-size:13.5px;color:var(--text2);margin:0 4px}
.head-btn{color:var(--blue);font-weight:600;font-size:16px;padding:8px 0 8px 12px}
.enter-push{animation:pushIn .42s var(--ease)}
.enter-pop{animation:popIn .38s var(--ease)}
@keyframes pushIn{from{transform:translateX(40px);opacity:0}}
@keyframes popIn{from{transform:translateX(-26px);opacity:.2}}

/* Search, chips, filters */
.search{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:14px;background:var(--fill);margin-top:14px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;padding:12px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:20px;font-size:13.5px;font-weight:600;background:var(--glass);border:1px solid var(--glass-border);transition:background .25s,color .25s}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.filters select{padding:10px 12px;font-size:14px}
.sumbar{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text2);margin:14px 4px 0;flex-wrap:wrap}
.sumbar b{color:var(--text)}
.day-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text2);margin:18px 6px 8px}

/* Stats & action buttons */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:14px;border-radius:var(--r-md)}
.stat .l{font-size:12px;color:var(--text2);font-weight:600}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.stat .s{font-size:11.5px;color:var(--text3);margin-top:2px}
.actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r-md);font-size:12px;font-weight:600;text-align:center}
.act .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--fill)}
.ccard.big{flex:none;width:100%;max-width:none;height:205px;margin-top:10px;cursor:default}

/* Statements */
.stmt{padding:14px 16px;border-radius:var(--r-md);margin-bottom:10px}
.stmt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.stmt-top b{font-size:15.5px}
.stmt-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:12px;color:var(--text2)}
.stmt-nums b{display:block;color:var(--text);font-size:14.5px;margin-top:2px}
.stmt-lines{margin-top:10px;border-top:1px solid var(--sep)}
.sline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--sep)}
.sline span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{margin-top:0;padding:11px 8px;font-size:14px}

/* Detail */
.dhero{text-align:center;padding:24px 18px 20px;border-radius:var(--r-xl);margin-top:8px}
.dhero .ic{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:31px;margin:0 auto 10px}
.dhero .amt{font-size:38px;font-weight:800;letter-spacing:-.03em}
.dhero .t{font-size:17px;font-weight:700;margin-top:4px}
.info .row{padding:13px 16px}
.info .row .mid{font-size:14px;color:var(--text2)}
.info .row .end{font-weight:600;font-size:14.5px;max-width:62%;white-space:normal;text-align:right}
.att img{width:100%;border-radius:16px;display:block}
.countdown{display:flex;gap:10px;margin-top:10px}
.countdown>div{flex:1;padding:12px;border-radius:14px;background:var(--fill);text-align:center}
.countdown b{display:block;font-size:22px;letter-spacing:-.02em}

/* Matrix */
.matrix-wrap{overflow-x:auto;margin:12px -16px 0;padding:0 16px 6px}
.matrix{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.matrix th,.matrix td{padding:10px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--sep)}
.matrix th{color:var(--text2);font-weight:700;font-size:11.5px}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--solid);z-index:1;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.matrix td.zero{color:var(--text3)}
.matrix tr.tot td{font-weight:800;border-bottom:0;padding-top:12px}
.matrix .now{background:rgba(10,132,255,.12)}
.matrix td:first-child small{display:block;color:var(--text2);font-weight:500;font-size:11px}

/* Calendar */
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 10px}
.cal-nav b{font-size:18px;letter-spacing:-.01em}
.cal-nav button{width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--blue);background:var(--fill)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:12px 10px;border-radius:var(--r-lg)}
.cal .wd{text-align:center;font-size:11px;color:var(--text3);font-weight:700;padding-bottom:6px}
.cal .d{min-height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding-top:5px;font-size:14px;font-weight:600;position:relative}
.cal .d .n{width:25px;height:25px;display:grid;place-items:center;border-radius:50%}
.cal .d.today .n{background:var(--blue);color:#fff}
.cal .d.sel{background:var(--glass-2);box-shadow:inset 0 0 0 1.5px var(--blue)}
.cal .d .sp{font-size:8.5px;color:var(--text2);font-weight:700}
.cal .dots{display:flex;gap:2px;position:absolute;bottom:4px}
.cal .dots i{width:5px;height:5px;border-radius:50%}

/* Rings, goals */
.ring{position:relative;display:inline-grid;place-items:center}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-linecap:round;transition:stroke-dasharray 1s var(--ease)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{padding:16px 12px;border-radius:var(--r-md);text-align:center}
.goal b{display:block;margin-top:8px;font-size:14.5px}
.goal-row{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px;scrollbar-width:none}
.goal-row::-webkit-scrollbar{display:none}
.goal-row .goal{flex:0 0 140px}

/* Charts */
.lchart{width:100%;height:auto;display:block;overflow:visible}
.lchart text{font-size:10px;fill:var(--text2);font-family:var(--font)}
.dbars{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:10px}
.dbars span{flex:1;border-radius:3px 3px 1px 1px;background:var(--blue);min-height:2px;opacity:.85}
.dbars span.z{background:var(--fill)}
.dbars-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text3);margin-top:5px}
.cmp{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--sep)}
.cmp:first-child{border-top:0}
.cmp .e{font-size:18px;width:26px;text-align:center}
.cmp .mid{flex:1;min-width:0}
.cmp .mid b{font-size:14px;display:block}
.cmp .bar2{height:6px;border-radius:4px;background:var(--fill);margin-top:6px;overflow:hidden}
.cmp .bar2 span{display:block;height:100%;border-radius:4px}
.cmp .end{text-align:right;font-size:13.5px;font-weight:700}
.cmp .end small{display:block;font-size:11.5px;font-weight:700}

/* Lock screen */
#lock{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:20px}
#lock .ambient{z-index:-1}
#lock.out{animation:fadeOut .35s forwards}
#lock h2{font-size:20px;margin-top:14px}
.lock-dots{display:flex;gap:16px;margin:22px 0 34px}
.lock-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text2);transition:background .15s}
.lock-dots i.on{background:var(--text);border-color:var(--text)}
.lock-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 24px}
.key{width:76px;height:76px;border-radius:50%;font-size:30px;font-weight:400;display:grid;place-items:center}
.key.ghost{background:none;border:0;box-shadow:none;font-size:15px;font-weight:600;color:var(--blue)}
.key.ghost::before{display:none}

/* Toast action, tags, misc */
.toast{display:flex;align-items:center;gap:14px}
.toast-act{color:var(--blue);font-weight:800;font-size:14px;padding:2px 0}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--fill);color:var(--text2);margin-left:5px;vertical-align:2px}
.empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px}
.empty .e{font-size:42px;display:block;margin-bottom:8px}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap}
.emoji-row button{width:42px;height:42px;border-radius:12px;background:var(--fill);font-size:21px;border:2px solid transparent}
.emoji-row button.on{border-color:var(--blue)}
.imp-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--sep)}
.imp-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue);flex-shrink:0}
.imp-row .mid{flex:1;min-width:0}
.imp-row .mid b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-row .mid span{font-size:12px;color:var(--text2)}
.imp-row .end{text-align:right;font-weight:700;font-size:14px;flex-shrink:0}
.switch{position:relative;width:51px;height:31px;flex-shrink:0;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:.3s}
.switch span::after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--sep);font-size:15px}
.set-row:last-child{border-bottom:0}
.set-row small{display:block;color:var(--text2);font-size:12px;margin-top:2px}
.quick-amts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick-amts button{padding:9px 12px;border-radius:12px;background:var(--fill);font-size:13px;font-weight:700}
.quick-amts button small{display:block;font-size:10.5px;color:var(--text2);font-weight:600}
.overflow-note{font-size:12px;color:var(--text3);text-align:center;margin-top:12px}

/* Print (PDF) */
#print{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important;padding:0!important;min-height:0}
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#111;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:10.5pt}
  #print h1{font-size:18pt;margin:0 0 2px}
  #print h2{font-size:12.5pt;margin:18px 0 6px}
  #print .meta{color:#555;font-size:9.5pt}
  #print table{width:100%;border-collapse:collapse;margin:6px 0}
  #print th,#print td{border-bottom:1px solid #ddd;padding:5px 6px;text-align:left;vertical-align:top}
  #print th{background:#f3f4f7;font-size:9pt;color:#333}
  #print .r{text-align:right;white-space:nowrap}
  #print .sum{display:flex;gap:10px;margin:12px 0}
  #print .sum div{flex:1;border:1px solid #ddd;border-radius:8px;padding:8px 10px}
  #print .sum b{display:block;font-size:13pt}
  #print .foot{margin-top:18px;color:#888;font-size:8.5pt}
}

<script>

/* ---------- 10_core.js ---------- */
'use strict';
/* =====================================================================
   CÜZDAN · Kişisel Finans  (v3)
   Kaynak modüller → build.sh ile tek index.html'e birleştirilir:
     10_core       yardımcılar, sabitler, kategoriler
     20_store      reaktif store, reducer, kalıcılık + şema göçü
     30_domain     finansal hesap motoru (saf, memoize fonksiyonlar)
     35_services   tema, haptik, bildirim, dosya deposu, güvenlik, dışa aktarma
     40_ai         Google Gemini (Interactions API) katmanı
     50_components saf HTML bileşenleri
     60_screens    sekmeler + detay sayfaları
     70_sheets     formlar / alt pencereler
     80_app        router, kontrolcü, demo verisi, başlatma
   ===================================================================== */

let PRIVACY=false;   // gizlilik modu: tüm tutarlar •••• gösterilir

/* ===================== core/utils ===================== */
const U={
  uid:()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4),
  esc:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  r2:n=>Math.round((+n||0)*100)/100,
  p2:n=>String(n).padStart(2,'0'),
  sym:cur=>({TRY:'₺',USD:'$',EUR:'€',XAU:'gr'}[cur]||cur||'₺'),
  money(n,{dec=true,sign=false,cur='TRY',raw=false}={}){
    const sym=U.sym(cur),suffix=cur==='TRY'||cur==='XAU'||!cur;
    if(PRIVACY&&!raw)return suffix?'•••• '+sym:sym+'••••';
    n=U.r2(n);const neg=n<0,a=Math.abs(n);
    const s=a.toLocaleString('tr-TR',{minimumFractionDigits:dec&&a%1?2:0,maximumFractionDigits:dec?2:0});
    return (neg?'−':sign&&n>0?'+':'')+(suffix?s+' '+sym:sym+s)},
  bigMoney(n){if(PRIVACY)return `<span class="num">••••</span><span class="dec"> ₺</span>`;
    n=U.r2(n);const neg=n<0,a=Math.abs(n),i=Math.floor(a),d=Math.round((a-i)*100);
    return `<span class="num">${neg?'−':''}${i.toLocaleString('tr-TR')}</span><span class="dec">${d?','+U.p2(d):''} ₺</span>`},
  short:n=>PRIVACY?'•':Math.abs(n)>=1000?(n/1000).toLocaleString('tr-TR',{maximumFractionDigits:1})+'k':String(Math.round(n)),
  num:n=>String(U.r2(n)).replace('.',','),
  parseNum(s){s=String(s??'').trim().replace(/\s|₺|\$|€/g,'');if(!s)return NaN;
    if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
    return parseFloat(s)},
  dim:(y,m)=>new Date(y,m+1,0).getDate(),
  iso:d=>d.getFullYear()+'-'+U.p2(d.getMonth()+1)+'-'+U.p2(d.getDate()),
  today:()=>U.iso(new Date()),
  parse(s){const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d||1)},
  addMonths(s,k){const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+k,1);
    return U.iso(new Date(t.getFullYear(),t.getMonth(),Math.min(d,U.dim(t.getFullYear(),t.getMonth()))))},
  addDays(s,k){const d=U.parse(s);d.setDate(d.getDate()+k);return U.iso(d)},
  daysUntil(s){const t=new Date();t.setHours(0,0,0,0);return Math.round((U.parse(s)-t)/864e5)},
  monthStart:(y,m)=>U.iso(new Date(y,m,1)),
  monthEnd:(y,m)=>U.iso(new Date(y,m+1,0)),
  MONTHS:['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'],
  DAYS:['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],
  mon:i=>U.MONTHS[i].slice(0,3),
  fmtDate(s,long){const d=U.parse(s),y=new Date().getFullYear();
    return d.getDate()+' '+(long?U.MONTHS[d.getMonth()]:U.mon(d.getMonth()))+(d.getFullYear()!==y||long==='y'?' '+d.getFullYear():'')},
  relDate(s){const n=U.daysUntil(s);return n===0?'Bugün':n===-1?'Dün':n===1?'Yarın':U.fmtDate(s)},
  dayHeader(s){const n=U.daysUntil(s),d=U.parse(s);
    return (n===0?'Bugün':n===-1?'Dün':U.DAYS[d.getDay()])+', '+U.fmtDate(s,true)},
  dayLoc(n){const o=n%10,t=n%100;const e=o?{1:'inde',2:'sinde',3:'ünde',4:'ünde',5:'inde',6:'sında',7:'sinde',8:'inde',9:'unda'}[o]:{10:'unda',20:'sinde',30:'unda'}[t];return n+"'"+e},
  dayOf(n){const o=n%10,t=n%100;const e=o?{1:'i',2:'si',3:'ü',4:'ü',5:'i',6:'sı',7:'si',8:'i',9:'u'}[o]:{10:'u',20:'si',30:'u'}[t];return n+"'"+e},
  /* durum (state) referansına bağlı çok girişli önbellek: aynı state + aynı argümanlar → aynı sonuç */
  memo(fn){const wm=new WeakMap();return(s,...a)=>{let m=wm.get(s);if(!m){m=new Map();wm.set(s,m)}
    const k=a.length?JSON.stringify(a):'';if(m.has(k))return m.get(k);const r=fn(s,...a);m.set(k,r);return r}},
  split(total,n){const base=Math.floor(total/n*100)/100;const out=Array(n).fill(base);out[n-1]=U.r2(total-base*(n-1));return out},
  debounce(fn,ms=180){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}},
  b64url:buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  unb64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))},
  lc:s=>String(s||'').toLocaleLowerCase('tr')
};

const SCHEMA_VERSION=3;
function emptyState(){return{
  version:SCHEMA_VERSION,
  settings:{name:'Yusuf',theme:'system',rates:{USD:42,EUR:49,XAU:5500},aiModel:'gemini-3.8-flash',privacy:false},   // kurlar örnektir
  security:{pinHash:'',pinLen:4,bioId:'',lockAfter:1},
  /* Hesaplar: {id,type,name,bank,color,currency,opening,overdraft?, credit?:{limit,cutDay,dueDay,sharedWith,minRate,contractRate,lateRate}} */
  accounts:[],
  /* İşlemler: {id,kind,accountId,toAccountId?,toAmount?,amount,date,category,merchant,note,installments,source,
               refOf?,closedIdx?,loanId?,goalId?,dir?,recurringId?,attachmentId?,items?,vat?,warrantyMonths?} */
  transactions:[],
  budgets:[],      // {id,category,limit}
  recurring:[],    // {id,type:'expense'|'income',name,amount,day,category,accountId,icon,paid:{'YYYY-MM':txId}}
  loans:[],        // {id,name,bank,monthly,count,firstDate,paidBefore,accountId,principal}
  goals:[],        // {id,name,icon,target,deadline,color}
  templates:[],    // {id,name,amount,category,accountId,merchant}
  categories:[],   // özel kategoriler {id,name,icon,color,income}
  paidStatements:{},// elle "ödendi" işaretlenen ekstreler {"accId|idx":true}
  ai:{pending:{},errors:{},coach:null,calls:0}
}}

function reducer(s,a){
  const up=(list,item)=>list.some(x=>x.id===item.id)?list.map(x=>x.id===item.id?item:x):[...list,item];
  switch(a.type){
    case 'upsert':return{...s,[a.col]:up(s[a.col],a.item)};
    case 'remove':{
      if(a.col==='accounts'){const id=a.id;return{...s,
        accounts:s.accounts.filter(x=>x.id!==id).map(x=>x.credit&&x.credit.sharedWith===id?{...x,credit:{...x.credit,sharedWith:''}}:x),
        transactions:s.transactions.filter(t=>t.accountId!==id&&!(t.kind==='payment'&&t.toAccountId===id)).map(t=>t.toAccountId===id?{...t,toAccountId:''}:t),
        recurring:s.recurring.map(r=>r.accountId===id?{...r,accountId:''}:r),
        templates:s.templates.filter(t=>t.accountId!==id),
        loans:s.loans.map(l=>l.accountId===id?{...l,accountId:''}:l),
        paidStatements:Object.fromEntries(Object.entries(s.paidStatements).filter(([k])=>!k.startsWith(id+'|')))}}
      if(a.col==='transactions'){const drop=new Set([a.id,...s.transactions.filter(t=>t.refOf===a.id).map(t=>t.id)]);
        return{...s,transactions:s.transactions.filter(t=>!drop.has(t.id)),
          recurring:s.recurring.map(r=>({...r,paid:Object.fromEntries(Object.entries(r.paid||{}).filter(([,v])=>!drop.has(v)))}))}}
      if(a.col==='loans')return{...s,loans:s.loans.filter(x=>x.id!==a.id),transactions:s.transactions.filter(t=>t.loanId!==a.id)};
      if(a.col==='goals')return{...s,goals:s.goals.filter(x=>x.id!==a.id),transactions:s.transactions.filter(t=>t.goalId!==a.id)};
      if(a.col==='categories')return{...s,categories:s.categories.filter(c=>c.id!==a.id),
        transactions:s.transactions.map(t=>t.category===a.id?{...t,category:'other'}:t),budgets:s.budgets.filter(b=>b.category!==a.id)};
      return{...s,[a.col]:s[a.col].filter(x=>x.id!==a.id)}}
    case 'batch':return a.actions.reduce(reducer,s);
    case 'statement/toggle':{const p={...s.paidStatements};if(p[a.key])delete p[a.key];else p[a.key]=true;return{...s,paidStatements:p}}
    /* AI asenkron görev yaşam döngüsü: start → success | error */
    case 'ai/start':return{...s,ai:{...s.ai,pending:{...s.ai.pending,[a.task]:true},errors:{...s.ai.errors,[a.task]:null}}};
    case 'ai/success':{const ai={...s.ai,pending:{...s.ai.pending,[a.task]:false},calls:(s.ai.calls||0)+1,lastAt:new Date().toISOString()};
      if(a.task==='coach')ai.coach={at:new Date().toISOString(),model:s.settings.aiModel,data:a.data};return{...s,ai}}
    case 'ai/error':return{...s,ai:{...s.ai,pending:{...s.ai.pending,[a.task]:false},errors:{...s.ai.errors,[a.task]:a.error}}};
    case 'settings/update':return{...s,settings:{...s.settings,...a.payload}};
    case 'security/update':return{...s,security:{...s.security,...a.payload}};
    case 'state/replace':return a.payload;
    default:return s}
}

const Store=(()=>{
  let state;const subs=new Set();
  return{
    init(s){state=s},
    get:()=>state,
    dispatch(action){const next=reducer(state,action);if(next===state)return;state=next;Persist.save(state);subs.forEach(fn=>fn(state,action))},
    subscribe(fn){subs.add(fn);return()=>subs.delete(fn)}
  }})();

/* ===================== data/persist ===================== */
const Persist={
  KEY:'cuzdan_v2',
  load(){
    try{const s=JSON.parse(localStorage.getItem(this.KEY));if(s&&s.version)return this.migrate(s)}catch(e){}
    return this.fromTaksitlerim()||emptyState()},
  save(s){try{localStorage.setItem(this.KEY,JSON.stringify(s))}catch(e){Toast.show('⚠️ Kaydedilemedi: tarayıcı hafızası dolu ya da kapalı')}},
  /* Şema göçü: v2 → v3 (işlem türü 'kind', kredi/kumbara/şablon/kategori koleksiyonları, güvenlik) */
  migrate(s){const b=emptyState();
    const o={...b,...s,
      settings:{...b.settings,...(s.settings||{}),rates:{...b.settings.rates,...((s.settings||{}).rates||{})}},
      security:{...b.security,...(s.security||{})},
      ai:{...b.ai,...(s.ai||{}),pending:{}}};   // yarım kalmış AI istekleri sıfırlanır
    ['accounts','transactions','budgets','recurring','loans','goals','templates','categories'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
    if(!o.paidStatements||typeof o.paidStatements!=='object')o.paidStatements={};
    o.transactions=o.transactions.map(t=>{const x=t.kind?{...t}:{...t,kind:t.type==='income'?'income':'expense'};delete x.type;return x});
    o.recurring=o.recurring.map(r=>({type:'expense',paid:{},...r}));
    o.accounts=o.accounts.map(a=>a.type==='credit'?{...a,credit:{minRate:20,contractRate:'',lateRate:'',sharedWith:'',...a.credit}}:{overdraft:0,...a});
    o.version=SCHEMA_VERSION;return o},
  /* Taksitlerim (v1) verisini otomatik taşı */
  fromTaksitlerim(){
    try{const o=JSON.parse(localStorage.getItem('taksitlerim_v1'));if(!o||!Array.isArray(o.cards)||!o.purchases?.length)return null;
      const map={'Elektronik':'electronics','Giyim':'clothing','Market':'market','Yeme-İçme':'food','Abonelik':'subscription','Ulaşım':'transport','Eğlence':'fun','Sağlık':'health','Eğitim':'education'};
      const s=emptyState();
      s.accounts=o.cards.map((c,i)=>({id:c.id,type:'credit',name:c.name,bank:'',color:i,currency:'TRY',opening:0,
        credit:{limit:+c.limit||0,cutDay:c.cutDay||15,dueDay:c.dueDay||25,sharedWith:c.sharedWith||'',minRate:20,contractRate:'',lateRate:''}}));
      s.transactions=o.purchases.map(p=>({id:p.id,kind:'expense',accountId:p.cardId,amount:p.total,date:p.date,category:map[p.cat]||'other',merchant:p.name,note:'',installments:p.count||1,source:'manual'}));
      s.paidStatements={...(o.paid||{})};s._migrated=true;return s}catch(e){return null}}
};

/* ---------- 30_domain.js ---------- */

/* =====================================================================
   domain · Finansal hesap motoru
   Tüm fonksiyonlar saf: (state, ...) → sonuç. State referansına göre önbelleklenir.
   ===================================================================== */
const D={};

/* ---------- Kredi kartı ekstre takvimi ----------
   Ekstre indeksi = kesim ayının (yıl*12+ay) değeri. Kesim günü dahil harcama o ekstreye düşer. */
D.ym=i=>[Math.floor(i/12),i%12];
D.cutDate=(c,i)=>{const[y,m]=D.ym(i);return U.iso(new Date(y,m,Math.min(c.cutDay,U.dim(y,m))))};
D.dueDate=(c,i)=>{let[y,m]=D.ym(i);if(c.dueDay<=c.cutDay){m++;if(m>11){m=0;y++}}return U.iso(new Date(y,m,Math.min(c.dueDay,U.dim(y,m))))};
D.stmtIdx=(c,dateStr)=>{const[y,m,d]=dateStr.split('-').map(Number);let i=y*12+(m-1);if(d>Math.min(c.cutDay,U.dim(y,m-1)))i++;return i};
D.openIdx=c=>D.stmtIdx(c,U.today());
D.stmtName=i=>{const[y,m]=D.ym(i);return U.MONTHS[m]+(y!==new Date().getFullYear()?' '+y:'')};

D.account=(s,id)=>id?s.accounts.find(a=>a.id===id):undefined;
D.isCredit=(s,id)=>D.account(s,id)?.type==='credit';
D.limitRoot=(s,acc)=>{const r=acc.credit?.sharedWith&&D.account(s,acc.credit.sharedWith);return r&&!r.credit?.sharedWith?r:acc};
D.tx=(s,id)=>s.transactions.find(t=>t.id===id);
D.toTRY=(s,amount,cur)=>!cur||cur==='TRY'?amount:amount*(+s.settings.rates[cur]||0);

/* ---------- Kart satırları: taksitler + iade alacakları ---------- */
D.refundMap=U.memo(s=>{const m={};s.transactions.forEach(t=>{if(t.kind==='refund'&&t.refOf)(m[t.refOf]=m[t.refOf]||[]).push(t)});return m});
D.cardLines=U.memo(s=>{const out=[],rm=D.refundMap(s);
  for(const t of s.transactions){const acc=D.account(s,t.accountId);if(!acc||acc.type!=='credit')continue;const c=acc.credit;
    if(t.kind==='expense'){
      const n=Math.max(1,t.installments|0),f=D.stmtIdx(c,t.date),parts=U.split(t.amount,n),refs=rm[t.id]||[];
      const full=refs.find(r=>r.amount>=t.amount-0.01),r=full?D.stmtIdx(c,full.date):Infinity;let billed=0;
      parts.forEach((amount,k)=>{let idx=f+k;if(t.closedIdx!=null&&idx>t.closedIdx)idx=Math.max(f,t.closedIdx);
        if(full&&idx>=r)return;              // tam iade: henüz faturalanmamış taksitler iptal
        if(full)billed+=amount;out.push({kind:'inst',tx:t,k,n,amount,accId:acc.id,idx})});
      if(full&&billed>0)out.push({kind:'refund',tx:full,orig:t,amount:-U.r2(billed),accId:acc.id,idx:r});   // faturalanmış kısım alacak olarak döner
      refs.filter(x=>x!==full).forEach(x=>out.push({kind:'refund',tx:x,orig:t,amount:-x.amount,accId:acc.id,idx:D.stmtIdx(c,x.date)}))}
    else if(t.kind==='refund'&&!(t.refOf&&D.tx(s,t.refOf)))out.push({kind:'refund',tx:t,amount:-t.amount,accId:acc.id,idx:D.stmtIdx(c,t.date)})}
  return out});

/* ---------- Ekstreler + ödeme dağıtımı (FIFO) ----------
   Ödemeler en eski ekstreden başlayarak kapatılır; fazlası açık dönem/gelecek taksitlere sayılır. */
D.statements=U.memo((s,accId)=>{const acc=D.account(s,accId),c=acc.credit,o=D.openIdx(c);
  const by={};D.cardLines(s).forEach(l=>{if(l.accId===accId)(by[l.idx]=by[l.idx]||[]).push(l)});
  const idxs=new Set(Object.keys(by).map(Number));idxs.add(o);idxs.add(o-1);
  const list=[...idxs].sort((a,b)=>a-b).map(i=>{const lines=(by[i]||[]).sort((x,y)=>x.tx.date.localeCompare(y.tx.date));
    return{idx:i,lines,total:U.r2(lines.reduce((a,l)=>a+l.amount,0)),paid:0,flag:!!s.paidStatements[accId+'|'+i]}});
  list.forEach(st=>{if(st.flag)st.paid=Math.max(0,st.total)});
  const payments=s.transactions.filter(t=>t.kind==='payment'&&t.toAccountId===accId).sort((a,b)=>a.date.localeCompare(b.date));
  let pool=U.r2(payments.reduce((a,t)=>a+t.amount,0));
  list.forEach(st=>{if(st.total<0&&!st.flag)pool=U.r2(pool-st.total)});        // eksi bakiyeli (iade) ekstreler havuza alacak ekler
  for(const st of list){if(st.total<=0)continue;const take=Math.min(U.r2(st.total-st.paid),pool);st.paid=U.r2(st.paid+take);pool=U.r2(pool-take)}
  const rate=+c.minRate||20;
  list.forEach(st=>{st.remaining=U.r2(Math.max(0,st.total-st.paid));st.cut=D.cutDate(c,st.idx);st.due=D.dueDate(c,st.idx);
    st.minPay=U.r2(Math.max(0,st.total)*rate/100);st.minLeft=U.r2(Math.max(0,Math.min(st.remaining,st.minPay-st.paid)));
    const late=st.idx<o&&U.daysUntil(st.due)<0;
    st.status=st.idx>o?'future':st.idx===o?'open':st.total<=0.009?'empty':st.remaining<=0.009?'paid':late?(st.minLeft<=0.009?'partial-late':'overdue'):(st.paid>0?'partial':'due');
    st.interest=null;
    if(late&&st.remaining>0){const days=-U.daysUntil(st.due),r=st.minLeft>0?+c.lateRate:+c.contractRate;st.lateDays=days;
      if(r>0)st.interest=U.r2(st.remaining*r/100*days/30)}});
  return{list,open:o,credit:pool,payments}});
D.stmtAt=(s,accId,idx)=>{const st=D.statements(s,accId).list.find(x=>x.idx===idx);if(st)return st;const c=D.account(s,accId).credit;
  return{idx,lines:[],total:0,paid:0,remaining:0,minPay:0,minLeft:0,cut:D.cutDate(c,idx),due:D.dueDate(c,idx),status:idx>D.openIdx(c)?'future':'empty'}};
D.ST={future:['Gelecek','blue'],open:['Dönem açık','blue'],empty:['Borç yok','green'],paid:['Ödendi','green'],partial:['Kısmi ödendi','orange'],
  due:['Ödenecek','orange'],overdue:['Gecikti','red'],'partial-late':['Asgari ödendi · faiz işler','orange']};

/* ---------- Kart özeti ---------- */
D.cardSummary=U.memo((s,accId)=>{
  const acc=D.account(s,accId),root=D.limitRoot(s,acc),c=acc.credit;
  const group=s.accounts.filter(a=>a.type==='credit'&&D.limitRoot(s,a).id===root.id);
  let used=0,credit=0;group.forEach(a=>{const st=D.statements(s,a.id);used+=st.list.reduce((x,y)=>x+y.remaining,0);credit+=st.credit});
  used=U.r2(used);credit=U.r2(credit);
  const st=D.statements(s,accId),o=st.open,last=D.stmtAt(s,accId,o-1),open=D.stmtAt(s,accId,o);
  const limit=+root.credit.limit||0,overdue=st.list.filter(x=>x.idx<o&&x.remaining>0);
  const own=U.r2(st.list.reduce((x,y)=>x+y.remaining,0));
  const active=new Set(D.cardLines(s).filter(l=>l.accId===accId&&l.kind==='inst'&&l.n>1&&l.idx>=o).map(l=>l.tx.id)).size;
  return{acc,root,shared:root.id!==acc.id,limit,used:U.r2(used-credit),own,available:U.r2(limit-used+credit),usage:limit?Math.max(0,used-credit)/limit:0,credit,
    open:o,openTotal:open.total,openRemaining:open.remaining,openCut:open.cut,openDue:open.due,
    last:o-1,lastTotal:last.total,lastRemaining:last.remaining,lastPaid:last.remaining<=0.009,lastDue:last.due,lastStatus:last.status,
    minPay:last.minLeft,minTotal:last.minPay,dueNow:U.r2(overdue.reduce((a,x)=>a+x.remaining,0)),activeInstallments:active,
    interest:overdue.reduce((a,x)=>a+(x.interest||0),0)||null}});

/* ---------- Nakit / vadesiz / döviz bakiyesi ---------- */
D.effect=(t,accId)=>{let v=0;
  if(t.accountId===accId){switch(t.kind){
    case 'income':case 'refund':v+=t.amount;break;
    case 'goal':v+=t.dir==='out'?t.amount:-t.amount;break;
    default:v-=t.amount}}
  if(t.toAccountId===accId&&t.kind==='transfer')v+=(t.toAmount??t.amount);
  return v};
D.balance=U.memo((s,accId)=>{const a=D.account(s,accId);let b=+a.opening||0;for(const t of s.transactions)b+=D.effect(t,accId);return U.r2(b)});
D.ledger=U.memo((s,accId)=>{const a=D.account(s,accId);let b=+a.opening||0;
  const list=s.transactions.map((t,i)=>({t,i})).filter(({t})=>t.accountId===accId||t.toAccountId===accId)
    .sort((x,y)=>x.t.date.localeCompare(y.t.date)||x.i-y.i).map(({t})=>{const d=D.effect(t,accId);b=U.r2(b+d);return{t,delta:d,bal:b}});
  return list.reverse()});
D.balanceSeries=U.memo((s,accId,days=90)=>{const a=D.account(s,accId),T=U.today(),start=U.addDays(T,-days+1);let b=+a.opening||0;const byDay={};
  for(const t of s.transactions){const d=D.effect(t,accId);if(!d)continue;if(t.date<start)b+=d;else byDay[t.date]=(byDay[t.date]||0)+d}
  const out=[];for(let i=0;i<days;i++){const d=U.addDays(start,i);b+=byDay[d]||0;out.push({label:d,value:U.r2(b)})}return out});

/* ---------- Kumbaralar ---------- */
D.goalSaved=U.memo((s,gid)=>U.r2(s.transactions.filter(t=>t.kind==='goal'&&t.goalId===gid).reduce((a,t)=>a+(t.dir==='out'?-t.amount:t.amount),0)));
D.goal=U.memo((s,gid)=>{const g=s.goals.find(x=>x.id===gid);if(!g)return null;const saved=D.goalSaved(s,gid),left=Math.max(0,U.r2(g.target-saved));
  let months=null,perMonth=null;if(g.deadline){const t=new Date(),d=U.parse(g.deadline);months=Math.max(1,(d.getFullYear()-t.getFullYear())*12+d.getMonth()-t.getMonth());perMonth=U.r2(left/months)}
  return{...g,saved,left,pct:g.target?Math.min(1,saved/g.target):0,months,perMonth,done:saved>=g.target}});

/* ---------- Krediler ---------- */
D.loan=U.memo((s,lid)=>{const l=s.loans.find(x=>x.id===lid);if(!l)return null;
  const pays=s.transactions.filter(t=>t.kind==='loan'&&t.loanId===l.id).sort((a,b)=>a.date.localeCompare(b.date));
  const paidAmt=pays.reduce((a,t)=>a+t.amount,0),pb=+l.paidBefore||0;
  const paidCount=Math.min(l.count,pb+Math.floor(paidAmt/l.monthly+0.001));
  const schedule=Array.from({length:l.count},(_,k)=>({k,date:U.addMonths(l.firstDate,k),amount:l.monthly,paid:k<paidCount}));
  const next=schedule[paidCount]||null;
  return{...l,pays,paidCount,schedule,next,remaining:U.r2((l.count-paidCount)*l.monthly),total:U.r2(l.count*l.monthly),
    overdue:!!next&&U.daysUntil(next.date)<0,done:paidCount>=l.count,pct:paidCount/l.count}});

/* ---------- Net varlık ---------- */
D.netWorth=U.memo(s=>{let assets=0,debts=0,cards=0,loans=0,goals=0;
  for(const a of s.accounts){if(a.type==='credit'){if(D.limitRoot(s,a).id===a.id){const m=D.cardSummary(s,a.id);cards+=Math.max(0,m.used);if(m.used<0)assets-=m.used}}
    else assets+=D.toTRY(s,D.balance(s,a.id),a.currency)}
  for(const g of s.goals)goals+=D.goalSaved(s,g.id);
  for(const l of s.loans)loans+=D.loan(s,l.id).remaining;
  assets+=goals;debts=cards+loans;
  return{assets:U.r2(assets),debts:U.r2(debts),cards:U.r2(cards),loans:U.r2(loans),goals:U.r2(goals),net:U.r2(assets-debts)}});
D.netWorthAt=(s,E)=>{let assets=0,debts=0;
  for(const a of s.accounts){if(a.type==='credit')continue;let b=+a.opening||0;for(const t of s.transactions)if(t.date<=E)b+=D.effect(t,a.id);assets+=D.toTRY(s,b,a.currency)}
  for(const t of s.transactions)if(t.kind==='goal'&&t.date<=E)assets+=t.dir==='out'?-t.amount:t.amount;
  for(const l of D.cardLines(s))if(l.tx.date<=E)debts+=l.amount;
  for(const t of s.transactions)if(t.kind==='payment'&&t.date<=E&&D.isCredit(s,t.toAccountId))debts-=t.amount;
  for(const[k]of Object.entries(s.paidStatements)){const[aid,i]=k.split('|');const a=D.account(s,aid);if(!a)continue;
    const st=D.stmtAt(s,aid,+i);if(st.due<=E)debts-=Math.max(0,st.total)}
  for(const l of s.loans){if(U.addMonths(l.firstDate,-1)>E)continue;const L=D.loan(s,l.id);
    debts+=L.total-(+l.paidBefore||0)*l.monthly-L.pays.filter(t=>t.date<=E).reduce((a,t)=>a+t.amount,0)}
  return{assets:U.r2(assets),debts:U.r2(Math.max(0,debts)),net:U.r2(assets-Math.max(0,debts))}};
D.netWorthHistory=U.memo((s,n=12)=>{const t=new Date(),out=[];
  /* yalnızca ilk kayıttan bu yana: öncesinde veri olmadığı için çizmek yanıltıcı olur */
  const first=U.parse(s.transactions.reduce((m,x)=>x.date<m?x.date:m,U.today()));
  n=Math.max(2,Math.min(n,(t.getFullYear()-first.getFullYear())*12+t.getMonth()-first.getMonth()+1));
  for(let k=n-1;k>=0;k--){const d=new Date(t.getFullYear(),t.getMonth()-k,1);const E=k===0?U.today():U.monthEnd(d.getFullYear(),d.getMonth());
    const w=D.netWorthAt(s,E);out.push({label:U.mon(d.getMonth()),...w,value:w.net})}
  return out});

/* ---------- Harcama analitiği (taksitler her aya kendi payıyla yansır) ---------- */
D.allocations=U.memo(s=>{const out=[];
  for(const t of s.transactions){
    if(t.kind==='expense'){const n=Math.max(1,t.installments|0);U.split(t.amount,n).forEach((amount,k)=>out.push({tx:t,k,n,amount,category:t.category,date:U.addMonths(t.date,k)}))}
    else if(t.kind==='refund'){const o=t.refOf&&D.tx(s,t.refOf);out.push({tx:t,k:0,n:1,amount:-t.amount,category:o?.category||t.category||'other',date:t.date})}}
  return out});
D.spendIn=(s,from,to)=>D.allocations(s).filter(x=>x.date>=from&&x.date<=to);
D.sumBy=(items,key='category')=>{const m={};items.forEach(x=>m[x[key]]=(m[x[key]]||0)+x.amount);return m};
D.periodRange=p=>{const t=new Date(),T=U.today();
  if(p==='week')return[U.addDays(T,-6),T,'Son 7 gün'];
  if(p==='year')return[t.getFullYear()+'-01-01',U.monthEnd(t.getFullYear(),t.getMonth()),String(t.getFullYear())];
  return[U.monthStart(t.getFullYear(),t.getMonth()),U.monthEnd(t.getFullYear(),t.getMonth()),U.MONTHS[t.getMonth()]]};
D.monthCompare=U.memo(s=>{const t=new Date(),day=t.getDate();
  const curFrom=U.monthStart(t.getFullYear(),t.getMonth()),curTo=U.today();
  const lf=new Date(t.getFullYear(),t.getMonth()-1,1),prevFrom=U.iso(lf),prevTo=U.iso(new Date(lf.getFullYear(),lf.getMonth(),Math.min(day,U.dim(lf.getFullYear(),lf.getMonth()))));
  const cur=D.spendIn(s,curFrom,curTo),prev=D.spendIn(s,prevFrom,prevTo),tot=a=>U.r2(a.reduce((x,y)=>x+y.amount,0));
  return{cur:tot(cur),prev:tot(prev),curBy:D.sumBy(cur),prevBy:D.sumBy(prev)}});

/* ---------- Bütçe + tükenme projeksiyonu ---------- */
D.budgetStatus=U.memo(s=>{const t=new Date(),day=t.getDate(),days=U.dim(t.getFullYear(),t.getMonth());
  const by=D.sumBy(D.spendIn(s,U.monthStart(t.getFullYear(),t.getMonth()),U.today()));
  return s.budgets.map(b=>{const spent=U.r2(by[b.category]||0),pace=spent/day,projected=U.r2(pace*days);
    const ex=pace>0&&spent<b.limit?Math.ceil(b.limit/pace):null;
    return{...b,spent,projected,ratio:b.limit?spent/b.limit:0,over:spent>=b.limit,left:U.r2(b.limit-spent),
      willExceed:projected>b.limit&&spent<b.limit,exhaustDay:ex&&ex<=days?ex:null,daily:U.r2(Math.max(0,b.limit-spent)/Math.max(1,days-day+1))}})});

/* ---------- Düzenli ödemeler ---------- */
D.recurCycle=(r,ref=U.today())=>{const t=U.parse(ref);
  const make=(y,m)=>{const d=U.iso(new Date(y,m,Math.min(r.day,U.dim(y,m))));return{date:d,ym:d.slice(0,7)}};
  let c=make(t.getFullYear(),t.getMonth());if(r.paid?.[c.ym]){const n=new Date(t.getFullYear(),t.getMonth()+1,1);c=make(n.getFullYear(),n.getMonth())}
  return{...c,paid:!!r.paid?.[c.ym]}};

/* ---------- Yaklaşan ödemeler ---------- */
D.upcoming=U.memo((s,horizon=35)=>{const out=[];
  for(const a of s.accounts.filter(a=>a.type==='credit')){const st=D.statements(s,a.id);
    st.list.filter(x=>x.idx<st.open&&x.remaining>0).forEach(x=>out.push({kind:'stmt',date:x.due,accId:a.id,idx:x.idx,title:a.name+' ekstresi',
      sub:D.stmtName(x.idx)+(x.minLeft>0?' · asgari '+U.money(x.minLeft):' · asgari ödendi'),amount:x.remaining,icon:'💳',color:gcol(a.color)}));
    const op=D.stmtAt(s,a.id,st.open);if(op.remaining>0)out.push({kind:'open',date:op.due,accId:a.id,title:a.name+' · dönem içi',sub:'Kesim '+U.fmtDate(op.cut)+' · tahmini',amount:op.remaining,icon:'🧾',color:gcol(a.color)})}
  for(const r of s.recurring){const c=D.recurCycle(r);out.push({kind:'rec',id:r.id,date:c.date,ym:c.ym,title:r.name,income:r.type==='income',
    sub:(r.type==='income'?'Gelir':cat(r.category).name)+' · her ayın '+U.dayOf(r.day),amount:r.amount,icon:r.icon||cat(r.category).icon,color:cat(r.category).color})}
  for(const l0 of s.loans){const l=D.loan(s,l0.id);if(l.next)out.push({kind:'loan',id:l.id,date:l.next.date,title:l.name+' taksiti',sub:`${l.paidCount+1}/${l.count}. taksit`,amount:l.monthly,icon:'🏦',color:'#8e8e93'})}
  return out.filter(x=>U.daysUntil(x.date)<=horizon).sort((a,b)=>a.date.localeCompare(b.date))});

/* ---------- Taksit yükü ve Taksit Matrix'i ---------- */
D.installmentLoad=U.memo((s,months=6)=>{const cards=s.accounts.filter(a=>a.type==='credit');if(!cards.length)return null;
  const start=Math.min(...cards.map(a=>D.openIdx(a.credit)))-1,cols=[];let max=0;
  for(let i=start;i<start+months;i++){const parts=cards.map(a=>({acc:a,v:Math.max(0,D.stmtAt(s,a.id,i).total)}));const tot=U.r2(parts.reduce((x,y)=>x+y.v,0));max=Math.max(max,tot);cols.push({i,parts,tot})}
  return{cols,max,cards}});
D.matrix=U.memo((s,accId='',months=12)=>{const cards=s.accounts.filter(a=>a.type==='credit'&&(!accId||a.id===accId));if(!cards.length)return null;
  const start=Math.min(...cards.map(a=>D.openIdx(a.credit)))-1,idxs=Array.from({length:months},(_,k)=>start+k),ids=cards.map(a=>a.id);
  const lines=D.cardLines(s).filter(l=>ids.includes(l.accId));
  const rows={};lines.filter(l=>l.kind==='inst'&&l.n>1).forEach(l=>{const r=rows[l.tx.id]=rows[l.tx.id]||{tx:l.tx,acc:D.account(s,l.accId),cells:{},left:0,leftAmt:0,n:l.n};
    r.cells[l.idx]=U.r2((r.cells[l.idx]||0)+l.amount);const st=D.stmtAt(s,l.accId,l.idx);if(st.remaining>0.009||l.idx>=D.openIdx(r.acc.credit)){r.left++;r.leftAmt=U.r2(r.leftAmt+l.amount)}});
  const list=Object.values(rows).filter(r=>idxs.some(i=>r.cells[i])&&r.left>0).sort((a,b)=>b.leftAmt-a.leftAmt);
  const totals={},single={};idxs.forEach(i=>{totals[i]=U.r2(cards.reduce((a,c)=>a+Math.max(0,D.stmtAt(s,c.id,i).total),0));
    single[i]=U.r2(totals[i]-list.reduce((a,r)=>a+(r.cells[i]||0),0))});
  return{idxs,rows:list,totals,single,open:Math.min(...cards.map(a=>D.openIdx(a.credit)))}});

/* ---------- Takvim ---------- */
D.calendar=U.memo((s,y,m)=>{const days={},from=U.monthStart(y,m),to=U.monthEnd(y,m),ym=from.slice(0,7);
  for(let d=1;d<=U.dim(y,m);d++)days[U.iso(new Date(y,m,d))]={spent:0,income:0,events:[],txs:[]};
  for(const t of s.transactions){const day=days[t.date];if(!day)continue;day.txs.push(t);if(t.kind==='expense')day.spent+=t.amount;if(t.kind==='income')day.income+=t.amount}
  for(const a of s.accounts.filter(a=>a.type==='credit')){const st=D.statements(s,a.id);
    for(let i=st.open-2;i<=st.open+6;i++){const x=D.stmtAt(s,a.id,i);if(x.total<=0)continue;
      if(days[x.due])days[x.due].events.push({type:'stmt',title:a.name+' ekstresi',sub:D.stmtName(i),amount:x.remaining>0?x.remaining:x.total,done:x.remaining<=0.009,color:gcol(a.color),accId:a.id,idx:i,projected:i>=st.open});
      if(days[x.cut]&&i>=st.open-1)days[x.cut].events.push({type:'cut',title:a.name+' hesap kesimi',amount:x.total,color:gcol(a.color),info:true})}}
  for(const r of s.recurring){const d=U.iso(new Date(y,m,Math.min(r.day,U.dim(y,m))));if(days[d])days[d].events.push({type:'rec',id:r.id,ym,title:r.name,amount:r.amount,income:r.type==='income',done:!!r.paid?.[ym],color:cat(r.category).color})}
  for(const l0 of s.loans){const l=D.loan(s,l0.id);l.schedule.forEach(x=>{if(days[x.date])days[x.date].events.push({type:'loan',id:l.id,title:l.name+' taksiti',sub:(x.k+1)+'/'+l.count,amount:x.amount,done:x.paid,color:'#8e8e93'})})}
  for(const t of s.transactions){if(!t.warrantyMonths)continue;const e=U.addMonths(t.date,t.warrantyMonths);if(days[e])days[e].events.push({type:'warranty',title:'Garanti bitiyor: '+(t.merchant||cat(t.category).name),color:'#ffd60a',info:true,txId:t.id})}
  return days});

/* ---------- Aylık rapor ---------- */
D.monthReport=U.memo((s,y,m)=>{const from=U.monthStart(y,m),to=U.monthEnd(y,m),pf=new Date(y,m-1,1);
  const alloc=D.spendIn(s,from,to),prevAlloc=D.spendIn(s,U.iso(pf),U.monthEnd(pf.getFullYear(),pf.getMonth()));
  const inMonth=s.transactions.filter(t=>t.date>=from&&t.date<=to);
  const income=U.r2(inMonth.filter(t=>t.kind==='income').reduce((a,t)=>a+t.amount,0));
  const expense=U.r2(alloc.reduce((a,x)=>a+x.amount,0)),prevExpense=U.r2(prevAlloc.reduce((a,x)=>a+x.amount,0));
  const by=D.sumBy(alloc),pby=D.sumBy(prevAlloc);
  const cats=Object.keys({...by,...pby}).map(k=>({key:k,cur:U.r2(by[k]||0),prev:U.r2(pby[k]||0)})).filter(x=>x.cur>0||x.prev>0).sort((a,b)=>b.cur-a.cur);
  const daily=Array.from({length:U.dim(y,m)},(_,i)=>{const d=U.iso(new Date(y,m,i+1));return U.r2(alloc.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0))});
  const merch={};inMonth.filter(t=>t.kind==='expense').forEach(t=>{const k=(t.merchant||cat(t.category).name).trim();merch[k]=merch[k]||{name:k,count:0,total:0,cat:t.category};merch[k].count++;merch[k].total+=t.amount});
  const payments=U.r2(inMonth.filter(t=>t.kind==='payment').reduce((a,t)=>a+t.amount,0));
  const biggest=inMonth.filter(t=>t.kind==='expense').sort((a,b)=>b.amount-a.amount)[0]||null;
  return{y,m,from,to,income,expense,prevExpense,net:U.r2(income-expense),saveRate:income>0?(income-expense)/income:null,cats,daily,
    merchants:Object.values(merch).sort((a,b)=>b.total-a.total).slice(0,10),payments,biggest,txCount:inMonth.length,txs:inMonth.sort((a,b)=>a.date.localeCompare(b.date))}});

/* ---------- İşlem filtreleme ---------- */
D.filterTx=(s,f={})=>{const q=U.lc(f.q).trim(),T=new Date();let from='',to='';
  if(f.range==='month'){from=U.monthStart(T.getFullYear(),T.getMonth())}
  else if(f.range==='last'){from=U.monthStart(T.getFullYear(),T.getMonth()-1);to=U.monthEnd(T.getFullYear(),T.getMonth()-1)}
  else if(f.range==='3m'){from=U.addMonths(U.today(),-3)}
  return s.transactions.filter(t=>{
    if(from&&t.date<from)return false;if(to&&t.date>to)return false;
    if(f.acc&&t.accountId!==f.acc&&t.toAccountId!==f.acc)return false;
    if(f.cat&&t.category!==f.cat)return false;
    if(f.kind==='expense'&&t.kind!=='expense')return false;
    if(f.kind==='income'&&!['income','refund'].includes(t.kind))return false;
    if(f.kind==='move'&&!['transfer','payment','goal','loan'].includes(t.kind))return false;
    if(f.kind==='inst'&&!(t.kind==='expense'&&t.installments>1))return false;
    if(f.kind==='ocr'&&!['ocr','import'].includes(t.source))return false;
    if(q){const acc=D.account(s,t.accountId);const hay=U.lc([t.merchant,t.note,cat(t.category).name,acc?.name,KINDS[t.kind],String(t.amount),U.num(t.amount)].join(' '));if(!hay.includes(q))return false}
    return true}).sort((a,b)=>b.date.localeCompare(a.date)||s.transactions.indexOf(b)-s.transactions.indexOf(a))};
D.txSign=t=>['income','refund'].includes(t.kind)||(t.kind==='goal'&&t.dir==='out')?1:t.kind==='transfer'?0:-1;

/* ---------- İşlemin taksit durumu ---------- */
D.txPlan=(s,t)=>{const acc=D.account(s,t.accountId);if(!acc||acc.type!=='credit'||t.kind!=='expense')return null;
  const lines=D.cardLines(s).filter(l=>l.kind==='inst'&&l.tx.id===t.id),o=D.openIdx(acc.credit);
  const rows=lines.map(l=>{const st=D.stmtAt(s,acc.id,l.idx);return{...l,stmt:st,state:st.remaining<=0.009&&l.idx<o?'paid':l.idx<o?'due':l.idx===o?'open':'future'}});
  const refunded=(D.refundMap(s)[t.id]||[]);
  return{rows,acc,paid:rows.filter(r=>r.state==='paid').length,future:rows.filter(r=>r.idx>=o),refunded,canClose:rows.some(r=>r.idx>o)&&!refunded.length}};

/* ---------- Akıllı içgörüler ---------- */
D.insights=U.memo(s=>{const out=[];const t=new Date();
  for(const a of s.accounts.filter(a=>a.type==='credit')){const st=D.statements(s,a.id);
    st.list.filter(x=>x.status==='overdue'||x.status==='partial-late').forEach(x=>out.push({sev:x.status==='overdue'?'danger':'warn',icon:'⏰',
      title:a.name+' · '+D.stmtName(x.idx)+' ekstresi gecikti',text:`Kalan ${U.money(x.remaining)}${x.minLeft>0?', asgari bile ödenmedi':''}.${x.interest?' Tahmini faiz: '+U.money(x.interest)+'.':''}`,go:['card',{id:a.id}]}))}
  for(const l0 of s.loans){const l=D.loan(s,l0.id);if(l.overdue)out.push({sev:'danger',icon:'🏦',title:l.name+' taksiti gecikti',text:`${U.fmtDate(l.next.date)} tarihli ${U.money(l.monthly)} ödenmedi.`,go:['loan',{id:l.id}]})}
  for(const b of D.budgetStatus(s)){const c=cat(b.category);
    if(b.over)out.push({sev:'danger',icon:c.icon,title:c.name+' bütçesi aşıldı',text:`${U.money(b.limit)} limitin ${U.money(b.spent-b.limit)} aşıldı.`});
    else if(b.exhaustDay)out.push({sev:'warn',icon:c.icon,title:'Bu hızla gidersen…',text:`${c.name} bütçen ayın ${U.dayLoc(b.exhaustDay)} bitecek. Günlük ${U.money(b.daily,{dec:false})} harcarsan yeter.`})}
  for(const a of s.accounts.filter(a=>a.type==='credit'&&D.limitRoot(s,a).id===a.id)){const m=D.cardSummary(s,a.id);
    if(m.limit>0&&m.usage>=.85)out.push({sev:'danger',icon:'💳',title:a.name+' limiti dolmak üzere',text:`Kullanılabilir limit ${U.money(m.available)} (%${Math.max(0,Math.round((1-m.usage)*100))}).`,go:['card',{id:a.id}]})}
  for(const a of s.accounts.filter(a=>a.type==='checking')){const b=D.balance(s,a.id);if(b<0)out.push({sev:'warn',icon:'🏦',title:a.name+' eksi bakiyede',text:`KMH kullanımı ${U.money(-b)}${a.overdraft?' / '+U.money(a.overdraft):''}. Faiz işleyebilir.`,go:['account',{id:a.id}]})}
  for(const tx of s.transactions){if(tx.kind!=='expense')continue;
    if(tx.warrantyMonths){const d=U.daysUntil(U.addMonths(tx.date,tx.warrantyMonths));if(d>=0&&d<=30)out.push({sev:'info',icon:'🛡️',title:'Garanti bitiyor',text:`${tx.merchant||'Ürün'} garantisi ${d} gün içinde bitiyor.`,go:['tx',{id:tx.id}]})}
    if(tx.source==='ocr'&&!D.refundMap(s)[tx.id]){const d=14-(-U.daysUntil(tx.date));if(d>=0&&d<=3&&tx.amount>=500)out.push({sev:'info',icon:'↩️',title:'İade süresi doluyor',text:`${tx.merchant||'Alışveriş'} için iade hakkı ${d} gün içinde bitiyor (14 gün varsayımı).`,go:['tx',{id:tx.id}]})}}
  const mc=D.monthCompare(s);if(t.getDate()>=5){
    Object.keys({...mc.curBy,...mc.prevBy}).map(k=>{const c=mc.curBy[k]||0,p=mc.prevBy[k]||0;return{k,c,p,pct:p?(c-p)/p*100:null}})
      .filter(x=>x.p>=100&&x.c>0&&x.pct!==null&&Math.abs(x.pct)>=15).sort((a,b)=>Math.abs(b.c-b.p)-Math.abs(a.c-a.p)).slice(0,2)
      .forEach(x=>out.push({sev:x.pct>0?'warn':'good',icon:x.pct>0?'📈':'📉',title:'Geçen aya göre',
        text:`${cat(x.k).name} harcaman %${Math.round(Math.abs(x.pct))} ${x.pct>0?'arttı':'azaldı'} (${U.money(x.p,{dec:false})} → ${U.money(x.c,{dec:false})}).`}))}
  const order={danger:0,warn:1,info:2,good:3};return out.sort((a,b)=>order[a.sev]-order[b.sev])});

/* ---------- AI koçuna gönderilecek ÖZET veri ---------- */
D.coachPayload=s=>{const t=new Date(),tot=a=>Math.round(a.reduce((x,y)=>x+y.amount,0));
  const aylar=[0,1,2].map(k=>{const d=new Date(t.getFullYear(),t.getMonth()-k,1);const to=k===0?U.today():U.monthEnd(d.getFullYear(),d.getMonth());const items=D.spendIn(s,U.iso(d),to);
    return{ay:U.MONTHS[d.getMonth()]+' '+d.getFullYear(),devam_ediyor:k===0,toplam:tot(items),kategoriler:Object.fromEntries(Object.entries(D.sumBy(items)).map(([c,v])=>[cat(c).name,Math.round(v)]))}});
  const from60=U.addDays(U.today(),-60),merch={};

/* ===================== services/ai · Google Gemini (Interactions API) =====================
   Belge: ai.google.dev/gemini-api/docs/interactions · structured-output
   POST /v1beta/interactions  { model, system_instruction, input:[parts], generation_config, response_format }
   Yanıt: steps[type=model_output].content[type=text].text                                              */
const Secrets={K:'cuzdan_gemini_key',   // anahtar state'in DIŞINDA tutulur → yedek dosyasına girmez
  get(){try{return localStorage.getItem(this.K)||''}catch(e){return ''}},
  set(v){try{v?localStorage.setItem(this.K,v):localStorage.removeItem(this.K)}catch(e){}}};

class AIError extends Error{constructor(code,msg,status){super(msg||code);this.code=code;this.status=status}}

const AI={
  ENDPOINT:'https://generativelanguage.googleapis.com/v1beta/interactions',
  MODELS:[['gemini-3.8-flash','Gemini 3.8 Flash · önerilen'],['gemini-3.6-flash','Gemini 3.6 Flash'],['gemini-3.5-flash-lite','Gemini 3.5 Flash-Lite · ekonomik'],['gemini-3-flash-preview','Gemini 3 Flash · preview']],
  async call({system,input,schema,thinking='low',maxTokens=2048,timeout=90000}){
    const key=Secrets.get();if(!key)throw new AIError('NO_KEY');
    const body={model:Store.get().settings.aiModel||'gemini-3.8-flash',input,generation_config:{thinking_level:thinking,max_output_tokens:maxTokens}};
    if(system)body.system_instruction=system;
    if(schema)body.response_format={type:'text',mime_type:'application/json',schema};
    let res,lastErr;
    for(let attempt=0;attempt<3;attempt++){         // 429 / 5xx → üstel geri çekilme ile yeniden dene
      const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),timeout);
      try{res=await fetch(this.ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal:ctl.signal})}
      catch(e){clearTimeout(tm);lastErr=new AIError(e.name==='AbortError'?'TIMEOUT':'NETWORK',e.message);if(e.name==='AbortError')throw lastErr;res=null;await this.wait(attempt);continue}
      clearTimeout(tm);
      if(res.status===429||res.status>=500){lastErr=await this.toError(res);if(attempt<2){await this.wait(attempt);continue}throw lastErr}
      break}
    if(!res)throw lastErr||new AIError('NETWORK');
    if(!res.ok)throw await this.toError(res);
    const data=await res.json();
    if(data.status&&!['completed','incomplete'].includes(data.status))throw new AIError('FAILED',data.errors?.[0]?.message||data.status);
    const text=this.extractText(data);
    if(!text)throw new AIError('EMPTY');
    return schema?this.parseJSON(text):text},
  wait:a=>new Promise(r=>setTimeout(r,[800,2500,5000][a]||5000)),
  async toError(res){let msg='';try{const j=await res.json();msg=j.error?.message||j.errors?.[0]?.message||''}catch(e){}
    const st=res.status,low=msg.toLowerCase();
    const code=st===429?'RATE':st===401||st===403||(st===400&&low.includes('api key'))?'INVALID_KEY':st===404?'MODEL':st>=500?'SERVER':'BAD_REQUEST';
    return new AIError(code,msg,st)},
  extractText(d){
    const steps=(d.steps||[]).filter(x=>x.type==='model_output').flatMap(x=>x.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    if(steps)return steps;
    if(typeof d.output_text==='string')return d.output_text;
    return (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')},   // eski generateContent biçimine de dayanıklı
  parseJSON(t){try{return JSON.parse(t)}catch(e){const m=t.replace(/```json|```/g,'').match(/[\[{][\s\S]*[\]}]/);if(m){try{return JSON.parse(m[0])}catch(e2){}}throw new AIError('BAD_JSON')}},
  human(e){const m={NO_KEY:'Gemini API anahtarı eklenmemiş. Ayarlar → Yapay zekâ bölümünden ekle.',INVALID_KEY:'API anahtarı geçersiz ya da yetkisiz.',
    RATE:'İstek sınırına takıldın. Biraz bekleyip tekrar dene.',TIMEOUT:'Gemini zamanında yanıt vermedi. Tekrar dene.',NETWORK:'Bağlantı kurulamadı. İnternetini kontrol et.',
    MODEL:'Seçili model bulunamadı. Ayarlar\'dan başka bir model seç.',SERVER:'Gemini şu an yanıt veremiyor. Biraz sonra tekrar dene.',
    BAD_JSON:'Yapay zekâ yanıtı okunamadı. Tekrar dene.',EMPTY:'Yapay zekâ boş yanıt döndü.',FILE_BIG:'Dosya çok büyük (en fazla 15 MB).',FILE_TYPE:'Bu dosya türü desteklenmiyor.'};
    return m[e?.code]||(e?.message?'Hata: '+e.message:'Beklenmeyen bir hata oluştu.')}
};

/* Görsel/PDF hazırlama: görseli küçült + JPEG'e çevir (hız ve kota için) */
const Media={MAX:15*1024*1024,
  async prepare(file,maxSide=1800){
    if(file.size>this.MAX)throw new AIError('FILE_BIG');
    if(file.type==='application/pdf'){const data=await this.b64(file);return{kind:'document',mime:'application/pdf',data,preview:null,dataUrl:'data:application/pdf;base64,'+data,name:file.name}}
    if(!file.type.startsWith('image/'))throw new AIError('FILE_TYPE');
    const url=URL.createObjectURL(file);
    try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
      const sc=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');
      cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const du=cv.toDataURL('image/jpeg',.85);return{kind:'image',mime:'image/jpeg',data:du.split(',')[1],preview:du,dataUrl:du,name:file.name}}
    catch(e){const data=await this.b64(file);return{kind:'image',mime:file.type,data,preview:url,dataUrl:`data:${file.type};base64,${data}`,name:file.name}}},
  b64:f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)})
};
