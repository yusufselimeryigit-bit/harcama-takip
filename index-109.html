    if(!r||r.is_receipt===false||!(+r.total>0))return{ok:false,reason:r?.notes||'Belgede okunabilir bir toplam tutar bulunamadı.'};
    const T=U.today();let date=/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:T;if(date>T)date=T;
    const n=Math.min(36,Math.max(1,parseInt(r.installments)||1)),nOpt=INSTALLMENT_OPTS.reduce((a,b)=>Math.abs(b-n)<Math.abs(a-n)?b:a);
    const m=this.matchAccount(s,r.card_hint,n),acc=m.acc;
    return{ok:true,
      draft:{amount:U.r2(+r.total),merchant:String(r.merchant||'').slice(0,60),date,category:expenseCats().includes(r.category)?r.category:'other',
        accountId:acc?.id,installments:acc?.type==='credit'?nOpt:1,source:'ocr',
        items:(r.items||[]).slice(0,30),vat:{total:r.vat_total??null,lines:r.vat_lines||[]},warrantyMonths:r.warranty_months??null},
      meta:{confidence:r.confidence,currency:r.currency,cardHint:r.card_hint,matched:m.matched,installments:n,notes:r.notes,itemCount:(r.items||[]).length}}},
  matchAccount(s,hint,n){const h=U.lc(hint);
    if(h){const tok=h.split(/[^a-zçğıöşü0-9]+/i).filter(x=>x.length>=3);
      const acc=s.accounts.find(a=>tok.some(t=>U.lc(a.name+' '+(a.bank||'')).includes(t)));if(acc)return{acc,matched:true}}
    return{acc:(n>1&&s.accounts.find(a=>a.type==='credit'))||s.accounts.find(a=>a.type==='credit')||s.accounts[0],matched:false}}
};

/* Ekstre yanıtını doğrula → içe aktarılacak işlem adayları */
const StatementImport={
  normalize(r,s,accId){
    if(!r||r.is_statement===false||!Array.isArray(r.transactions)||!r.transactions.length)return{ok:false,reason:'Belgede ekstre işlemi bulunamadı.'};
    const acc=D.account(s,accId),c=acc.credit,T=U.today();
    const valid=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'');
    const cutIdx=valid(r.cut_date)?D.stmtIdx(c,r.cut_date):D.stmtIdx(c,r.transactions.map(x=>x.date).filter(valid).sort().pop()||T);
    const rows=r.transactions.filter(x=>+x.amount>0).map((x,i)=>{
      const amount=U.r2(+x.amount),date=valid(x.date)&&x.date<=T?x.date:D.cutDate(c,cutIdx);
      const base={id:'r'+i,sel:true,desc:String(x.description||'').slice(0,60)||'İşlem',category:expenseCats().includes(x.category)?x.category:'other',raw:x};
      if(x.kind==='payment')return{...base,type:'payment',amount,date,label:'Ödeme'};
      if(x.kind==='refund')return{...base,type:'refund',amount,date,label:'İade / alacak'};
      const n=+x.installment_total||1,k=+x.installment_no||1;
      if(n>1&&k>=1&&k<=n){const startIdx=cutIdx-(k-1),orig=x.original_total>0?U.r2(+x.original_total):U.r2(amount*n);
        const d=valid(x.date)&&D.stmtIdx(c,x.date)===startIdx?x.date:D.cutDate(c,startIdx);
        return{...base,type:'expense',amount:orig,date:d,installments:n,label:`${k}/${n} taksit · bu ekstrede ${U.money(amount,{raw:true})}`,lineAmount:amount}}
      const ex=x.kind==='interest'||x.kind==='fee';
      return{...base,type:'expense',amount,date,installments:1,category:ex?'fees':base.category,label:ex?(x.kind==='interest'?'Faiz / vergi':'Ücret'):'Tek çekim'}});
    /* mükerrer tespiti: aynı kartta ±3 gün içinde aynı tutar */
    rows.forEach(row=>{const dup=s.transactions.find(t=>(t.accountId===accId||t.toAccountId===accId)&&Math.abs(t.amount-row.amount)<0.01&&Math.abs(U.daysUntil(t.date)-U.daysUntil(row.date))<=3&&(row.type!=='payment'||t.kind==='payment'));
      if(dup){row.dup=true;row.sel=false}});
    return{ok:true,rows,meta:{card:r.card_name,cut:r.cut_date,due:r.due_date,total:r.statement_total,min:r.min_payment}}},
  toActions(rows,accId){return rows.filter(r=>r.sel).map(r=>{const id=U.uid();
    if(r.type==='payment')return{type:'upsert',col:'transactions',item:{id,kind:'payment',accountId:'',toAccountId:accId,amount:r.amount,date:r.date,merchant:'Kart ödemesi',note:'Ekstreden',source:'import'}};
    if(r.type==='refund')return{type:'upsert',col:'transactions',item:{id,kind:'refund',accountId:accId,amount:r.amount,date:r.date,merchant:r.desc,category:r.category,source:'import'}};
    return{type:'upsert',col:'transactions',item:{id,kind:'expense',accountId:accId,amount:r.amount,date:r.date,merchant:r.desc,category:r.category,installments:r.installments||1,note:'',source:'import'}}})}
};

/* Asenkron AI eylemleri: her görev ai/start → ai/success | ai/error ile state'e yansır */
const AIActions={
  async run(task,fn){Store.dispatch({type:'ai/start',task});
    try{const r=await fn();Store.dispatch({type:'ai/success',task,data:r});return r}
    catch(e){Store.dispatch({type:'ai/error',task,error:AI.human(e)});throw e}},
  async coach(){const s=Store.get();if(!Secrets.get())return SettingsSheet.open('ai');
    if(s.ai.pending.coach)return;
    if(s.transactions.filter(t=>t.kind==='expense').length<3){Toast.show('Analiz için önce birkaç harcama ekle');return}
    Haptic.tap();try{await this.run('coach',()=>AI.call(Prompts.coach(D.coachPayload(s))));Haptic.success()}catch(e){}},
  async scan(file){const media=await Media.prepare(file);ScanSheet.loading(media);
    const r=await this.run('scan',()=>AI.call(Prompts.receipt(media)));return{...Receipt.normalize(r,Store.get()),media}},
  async statement(file,accId){const media=await Media.prepare(file,2400);ImportSheet.loading(media);
    const r=await this.run('statement',()=>AI.call(Prompts.statement(media)));return StatementImport.normalize(r,Store.get(),accId)},
  async test(){SettingsSheet.persist();Toast.show('⏳ Gemini\'ye bağlanılıyor…',1500);
    try{await this.run('ping',()=>AI.call(Prompts.ping()));Toast.show('✓ Gemini bağlantısı çalışıyor')}catch(e){Toast.show('⚠️ '+AI.human(e),4000)}}
};

/* --- Line chart (SVG, gradyan dolgulu) --- */
C.lineChart=(pts,{h=150,color='#0a84ff',labels=true,id='lc'}={})=>{if(!pts.length)return '';
  const W=340,H=h,pad=8,vals=pts.map(p=>p.value),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const x=i=>pad+i*(W-2*pad)/Math.max(1,pts.length-1),y=v=>pad+(H-28)*(1-(v-mn)/rng);
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.value).toFixed(1)).join(' ');
  const area=d+` L${x(pts.length-1).toFixed(1)} ${H-20} L${x(0).toFixed(1)} ${H-20} Z`,li=pts.length-1;
  const lbl=labels?pts.map((p,i)=>i%Math.ceil(pts.length/6)===0||i===li?`<text x="${x(i)}" y="${H-4}" text-anchor="${i===0?'start':i===li?'end':'middle'}">${U.esc(p.label)}</text>`:'').join(''):'';
  return `<svg class="lchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(li)}" cy="${y(pts[li].value)}" r="4.5" fill="${color}" stroke="var(--bg)" stroke-width="2"/>${lbl}</svg>`};

/* --- Harcama dağılımı (donut) --- */
C.donut=(items,total,sel)=>{const R=70,CIRC=2*Math.PI*R;let off=0;const gap=items.length>1?3:0;
  const segs=items.map((it,i)=>{const len=total?Math.max(0,it.amount)/total*CIRC:0;
    const el=`<circle class="s ${sel!==null?(sel===i?'on':'dim'):''}" r="${R}" cx="90" cy="90" stroke="${it.color}" stroke-dasharray="${Math.max(.01,len-gap)} ${CIRC}" stroke-dashoffset="${-off}" onclick="App.selSeg(${i})"/>`;
    off+=len;return el}).join('');
  const center=sel!==null&&items[sel]?`<span class="muted xs">${items[sel].icon} ${U.esc(items[sel].name)}</span><b class="num">${U.money(items[sel].amount,{dec:false})}</b><span class="faint xs">%${Math.round(items[sel].amount/total*100)}</span>`
    :`<span class="muted xs">Toplam</span><b class="num">${U.money(total,{dec:false})}</b><span class="faint xs">${items.length} kategori</span>`;
  return `<div class="donut"><svg viewBox="0 0 180 180"><circle class="track" r="${R}" cx="90" cy="90"/>${segs}</svg><div class="donut-center">${center}</div></div>`};
C.spending=(s,ui)=>{const[from,to,label]=D.periodRange(ui.period);const by=D.sumBy(D.spendIn(s,from,to));
  const items=Object.entries(by).filter(([,v])=>v>0).map(([k,v])=>({key:k,amount:U.r2(v),...cat(k)})).sort((a,b)=>b.amount-a.amount);
  const total=U.r2(items.reduce((a,b)=>a+b.amount,0)),sel=ui.seg!==null&&ui.seg<items.length?ui.seg:null;
  return `<div class="section"><div class="glass spend"><div class="spend-top"><div><div style="font-weight:700;font-size:17px">Harcama Dağılımı</div><div class="muted xs">${label}</div></div>
    ${C.segmented([['week','Hafta'],['month','Ay'],['year','Yıl']],ui.period,'App.setPeriod')}</div>
    ${items.length?`<div class="donut-wrap">${C.donut(items,total,sel)}<div class="legend">${items.slice(0,6).map((it,i)=>`<button class="${sel!==null&&sel!==i?'dim':''}" onclick="App.selSeg(${i})"><span class="sw" style="background:${it.color}"></span><span class="nm">${it.name}</span><span class="pc">%${Math.round(it.amount/total*100)}</span></button>`).join('')}</div></div>`
      :`<p class="muted sm" style="padding:30px 0;text-align:center">Bu dönemde harcama yok.</p>`}</div></div>`};

C.installments=s=>{const L=D.installmentLoad(s);if(!L||!L.cols.some(c=>c.tot))return '';
  return C.section('Taksit Yükü',`<button onclick="App.push('matrix',{})">Matrix ›</button>`,`<div class="glass pressable" style="padding:18px 16px 14px" onclick="App.push('matrix',{})">

    <div class="bar-legend">${L.cards.map(a=>`<span><i style="background:${grad(a.color)}"></i>${U.esc(a.name)}</span>`).join('')}</div></div>`)};

/* --- Yaklaşan ödemeler --- */
C.dueBadge=(date,kind)=>{const n=U.daysUntil(date);
  return kind==='open'?`<span class="badge blue">${U.fmtDate(date)}</span>`:n<0?`<span class="badge red">${-n} gün gecikti</span>`:n<=3?`<span class="badge orange">${n===0?'Bugün':n+' gün kaldı'}</span>`:`<span class="badge blue">${U.fmtDate(date)}</span>`};
C.upItem=x=>{const btn=x.kind==='stmt'?`<button class="mini-btn pressable" onclick="event.stopPropagation();PaySheet.open('${x.accId}')">Öde</button>`
    :x.kind==='rec'?`<button class="mini-btn pressable" onclick="event.stopPropagation();RecurringForm.pay('${x.id}')">${x.income?'Aldım':'Öde'}</button>`
    :x.kind==='loan'?`<button class="mini-btn pressable" onclick="event.stopPropagation();LoanForm.pay('${x.id}')">Öde</button>`:'';
  const go=x.kind==='stmt'||x.kind==='open'?`App.push('card',{id:'${x.accId}'})`:x.kind==='loan'?`App.push('loan',{id:'${x.id}'})`:`RecurringForm.open('${x.id}')`;
  return `<div class="row pressable" onclick="${go}"><span class="ic" style="background:${x.color}26">${x.icon}</span><div class="mid"><b>${U.esc(x.title)}</b><span>${U.esc(x.sub)}</span></div>
    <div class="end"><b class="num ${x.income?'pos':''}">${x.income?'+':''}${U.money(x.amount)}</b>${C.dueBadge(x.date,x.kind)}${btn?'<br>'+btn:''}</div></div>`};
C.upcoming=s=>{const list=D.upcoming(s).slice(0,6);if(!list.length)return '';
  return C.section('Yaklaşan Ödemeler',`<button onclick="App.go('plan')">Takvim ›</button>`,`<div class="glass list">${list.map(C.upItem).join('')}</div>`)};

/* --- Kumbaralar (mini) --- */
C.goalsRow=s=>!s.goals.length?'':C.section('Kumbaralar',`<button onclick="App.go('plan','goals')">Tümü ›</button>`,
  `<div class="goal-row">${s.goals.map(g0=>{const g=D.goal(s,g0.id);return `<button class="goal glass pressable" onclick="App.push('goal',{id:'${g.id}'})">${C.ring(g.pct,64,gcol(g.color),g.icon||'🎯',7)}<b>${U.esc(g.name)}</b><span class="muted xs">${U.money(g.saved,{dec:false})} / ${U.money(g.target,{dec:false})}</span></button>`}).join('')}</div>`);

/* --- İşlem satırı --- */
C.txVis=(s,t,ctx)=>{const c=cat(t.category),a=D.account(s,t.accountId),b=D.account(s,t.toAccountId);
  switch(t.kind){
    case 'income':return{icon:c.icon,color:c.color,title:t.merchant||c.name,sub:c.name+(a?' · '+a.name:''),sign:1};
    case 'transfer':return{icon:'⇄',color:'#64d2ff',title:t.merchant||'Transfer',sub:(a?.name||'?')+' → '+(b?.name||'?'),sign:ctx?(t.toAccountId===ctx?1:-1):0,amt:ctx&&t.toAccountId===ctx?(t.toAmount??t.amount):t.amount,cur:ctx&&t.toAccountId===ctx?b?.currency:a?.currency};
    case 'payment':return{icon:'💳',color:'#0a84ff',title:'Kart borcu ödemesi',sub:(a?.name||'Dış hesap')+' → '+(b?.name||'Kart'),sign:ctx&&t.toAccountId===ctx?1:-1};
    case 'refund':{const o=t.refOf&&D.tx(s,t.refOf);return{icon:'↩️',color:'#30d158',title:'İade · '+(o?.merchant||t.merchant||'Alışveriş'),sub:(a?.name||'')+(o?' · '+cat(o.category).name:''),sign:1}}
    case 'goal':{const g=s.goals.find(x=>x.id===t.goalId);return{icon:g?.icon||'🎯',color:gcol(g?.color),title:(g?.name||'Kumbara'),sub:(t.dir==='out'?'Kumbaradan → ':'Kumbaraya ← ')+(a?.name||''),sign:ctx===t.goalId?(t.dir==='out'?-1:1):(t.dir==='out'?1:-1)}}
    case 'loan':{const l=s.loans.find(x=>x.id===t.loanId);return{icon:'🏦',color:'#8e8e93',title:(l?.name||'Kredi')+' taksiti',sub:a?.name||'',sign:-1}}
    default:return{icon:c.icon,color:c.color,title:t.merchant||c.name,sub:c.name+(a?' · '+a.name:'')+(t.installments>1?' · '+t.installments+' taksit':''),sign:-1}}};
C.txRow=(s,t,ctx,extra='')=>{const v=C.txVis(s,t,ctx),refunded=t.kind==='expense'&&D.refundMap(s)[t.id];
  const amt=v.amt??t.amount,cur=v.cur||D.account(s,t.accountId)?.currency||'TRY';
  return `<button class="row pressable" onclick="App.push('tx',{id:'${t.id}'})"><span class="ic" style="background:${v.color}26">${v.icon}</span>
    <div class="mid"><b>${U.esc(v.title)}${refunded?'<span class="tag">iade</span>':''}${t.source==='ocr'?'<span class="tag">✨</span>':''}</b><span>${U.esc(v.sub)}</span></div>
    <div class="end"><b class="num ${v.sign>0?'pos':''}">${v.sign>0?'+':v.sign<0?'−':''}${U.money(amt,{cur:cur==='XAU'?'XAU':cur})}</b><span class="muted xs">${extra||U.relDate(t.date)}</span></div></button>`};
C.dayGroups=(s,list,ctx,{limit=150,balances}={})=>{if(!list.length)return C.empty('🧾','Bu filtrede işlem yok.');
  const groups=[];list.slice(0,limit).forEach(t=>{const g=groups[groups.length-1];if(g&&g.date===t.date)g.items.push(t);else groups.push({date:t.date,items:[t]})});
  return groups.map(g=>{const net=g.items.reduce((a,t)=>{const v=C.txVis(s,t,ctx);return a+(v.sign||0)*(v.amt??t.amount)},0);
    return `<div class="day-h"><span>${U.dayHeader(g.date)}</span><span class="num">${net?U.money(net,{sign:true,dec:false}):''}</span></div>
      <div class="glass list">${g.items.map(t=>C.txRow(s,t,ctx,balances?('Bakiye '+U.money(balances[t.id],{dec:false})):' ')).join('')}</div>`}).join('')
    +(list.length>limit?`<p class="overflow-note">İlk ${limit} işlem gösteriliyor · ${list.length} işlem var. Filtreyle daralt.</p>`:'')};
C.recent=s=>{const list=[...s.transactions].sort((a,b)=>b.date.localeCompare(a.date)||s.transactions.indexOf(b)-s.transactions.indexOf(a)).slice(0,6);if(!list.length)return '';
  return C.section('Son İşlemler',`<button onclick="App.go('txs')">Tümü ›</button>`,`<div class="glass list">${list.map(t=>C.txRow(s,t)).join('')}</div>`)};

/* --- Ekstre kartı --- */
C.statement=(s,acc,st,open)=>{const exp=open;
  const lineHtml=l=>{const t=l.tx,n=l.n>1?` <span class="tag">${l.k+1}/${l.n}</span>`:'';
    return `<div class="sline pressable" onclick="App.push('tx',{id:'${(l.kind==='refund'&&l.orig?l.orig:t).id}'})"><span>${l.kind==='refund'?'↩️ İade · ':''}${U.esc(t.merchant||(l.orig&&l.orig.merchant)||cat(t.category).name)}${n}</span><span class="num ${l.amount<0?'pos':''}">${l.amount<0?'+':''}${U.money(Math.abs(l.amount))}</span></div>`};
  const pays=st.idx<=D.openIdx(acc.credit)&&st.paid>0;
  return `<div class="glass stmt"><div class="stmt-top" onclick="App.toggleStmt(${st.idx})"><div><b>${D.stmtName(st.idx)} ekstresi</b>
      <div class="muted xs">Kesim ${U.fmtDate(st.cut)} · Son ödeme ${U.fmtDate(st.due)}</div></div><div style="text-align:right">${C.badge(st.status)}<div class="faint xs" style="margin-top:4px">${exp?'▲ gizle':'▼ detay'}</div></div></div>
    <div class="stmt-nums"><div>Toplam<b class="num">${U.money(st.total)}</b></div><div>Ödenen<b class="num">${U.money(st.paid)}</b></div><div>Kalan<b class="num ${st.remaining>0&&st.idx<D.openIdx(acc.credit)?'warn':''}">${U.money(st.remaining)}</b></div></div>
    ${st.remaining>0&&st.idx<D.openIdx(acc.credit)?`<div class="muted xs" style="margin-top:8px">Asgari ödeme ${U.money(st.minPay)}${st.minLeft>0?' · kalan asgari <b>'+U.money(st.minLeft)+'</b>':' · ✓ karşılandı'}${st.interest?` · tahmini faiz <b class="neg">${U.money(st.interest)}</b>`:''}</div>`:''}
    ${exp?`<div class="stmt-lines">${st.lines.length?st.lines.map(lineHtml).join(''):'<p class="muted sm" style="padding:10px 0">Bu dönemde harcama yok.</p>'}</div>
      <div class="btn-row">${st.remaining>0&&st.idx<=D.openIdx(acc.credit)?`<button class="btn primary pressable" onclick="PaySheet.open('${acc.id}',${st.idx})">Öde</button>`:''}
      ${st.lines.length?`<button class="btn pressable" onclick="Reports.printStatement('${acc.id}',${st.idx})">📄 PDF</button>`:''}</div>`:''}</div>`};

/* --- Bütçe satırı --- */
C.budgetRow=b=>{const c=cat(b.category),col=b.over?'var(--red)':b.ratio>.8||b.willExceed?'var(--orange)':'var(--green)';
  return `<button class="row pressable" style="flex-wrap:wrap" onclick="BudgetForm.open('${b.id}')"><span class="ic" style="background:${c.color}26">${c.icon}</span><div class="mid"><b>${c.name}</b>
    <span>${U.money(b.spent,{dec:false})} / ${U.money(b.limit,{dec:false})}${b.exhaustDay?' · ayın '+U.dayLoc(b.exhaustDay)+' biter':b.over?'':' · günlük '+U.money(b.daily,{dec:false})}</span></div>
    <div class="end"><b class="num" style="color:${col}">${b.over?'Aşıldı':U.money(b.left,{dec:false})}</b><span class="muted xs">${b.over?U.money(-b.left,{dec:false})+' fazla':'kaldı'}</span></div>
    <div class="prog" style="width:100%;margin:10px 0 2px 50px"><span style="width:${Math.min(100,b.ratio*100)}%;background:${col}"></span></div></button>`};

C.soon=(title,items)=>`<div class="section"><div class="glass" style="padding:18px"><div style="font-weight:700;margin-bottom:8px">${title}</div>${items.map(i=>`<div class="muted sm" style="margin-top:5px">• ${i}</div>`).join('')}</div></div>`;

/* ---------- 60_screens.js ---------- */

/* ===================== ui/screens · sekmeler ===================== */
const Screens={
  home(s,ui){
    if(!s.accounts.length)return C.topbar(s)+`<section class="glass welcome"><div class="big-ic">✨</div><h2>Cüzdanına hoş geldin</h2>
      <p>Kartlarını, hesaplarını, taksitlerini, kredilerini ve bütçeni tek yerden yönet. Veriler sadece bu cihazda saklanır.</p>
      <button class="btn primary pressable" onclick="AccForm.open()">İlk hesabımı ekle</button>
      <button class="btn pressable" onclick="App.loadDemo()">Örnek verilerle keşfet</button></section>`;
    return `<div class="stagger">${C.topbar(s)}${C.hero(s)}${C.quick()}</div>${C.templates(s)}
      ${C.section('Kartlar & Hesaplar',`<button onclick="App.push('accounts',{})">Tümü ›</button>`,C.accounts(s))}
      ${C.insights(s)}${C.upcoming(s)}${C.coach(s)}${C.spending(s,ui)}${C.goalsRow(s)}${C.installments(s)}${C.recent(s)}`},

  /* --- İşlem geçmişi --- */
  txs(s,ui){const f=ui.txf;
    const accOpts=`<option value="">Tüm hesaplar</option>`+s.accounts.map(a=>`<option value="${a.id}" ${f.acc===a.id?'selected':''}>${U.esc(a.name)}</option>`).join('');
    const catOpts=`<option value="">Tüm kategoriler</option>`+[...expenseCats(),...incomeCats().filter(k=>k!=='other')].map(k=>`<option value="${k}" ${f.cat===k?'selected':''}>${cat(k).icon} ${cat(k).name}</option>`).join('');
    return C.tabHead('İşlemler','Hesap hareketlerin',`${C.eye()}<button class="icon-btn glass pressable" onclick="App.exportFiltered()" aria-label="CSV">⬇️</button>`)+
      `<div class="search"><span>🔍</span><input id="tx-q" placeholder="Mağaza, not, tutar ara" value="${U.esc(f.q)}" oninput="App.txSearch(this.value)" autocomplete="off"></div>
      ${C.chips([['all','Tümü'],['expense','Harcama'],['income','Gelir'],['move','Transfer & ödeme'],['inst','Taksitli'],['ocr','✨ AI ile']],f.kind,'App.txKind')}
      ${C.chips([['month','Bu ay'],['last','Geçen ay'],['3m','Son 3 ay'],['all','Tümü']],f.range,'App.txRange')}
      <div class="filters"><select class="input" onchange="App.txFilter('acc',this.value)">${accOpts}</select><select class="input" onchange="App.txFilter('cat',this.value)">${catOpts}</select></div>
      <div id="tx-list">${Screens.txList(s,ui)}</div>`},
  txList(s,ui){const list=D.filterTx(s,ui.txf);
    const exp=list.filter(t=>t.kind==='expense').reduce((a,t)=>a+t.amount,0),inc=list.filter(t=>t.kind==='income'||t.kind==='refund').reduce((a,t)=>a+t.amount,0);
    return `<div class="sumbar"><span>${list.length} işlem</span><span>Gider <b class="num">${U.money(exp,{dec:false})}</b> · Gelir <b class="num pos">${U.money(inc,{dec:false})}</b></span></div>`+C.dayGroups(s,list)},

  /* --- Planla: takvim, bütçe, düzenli ödemeler, kumbaralar --- */
  plan(s,ui){const tab=ui.planTab;
    const add={cal:'',budget:`<button class="icon-btn glass pressable" onclick="BudgetForm.open()">＋</button>`,rec:`<button class="icon-btn glass pressable" onclick="RecurringForm.open()">＋</button>`,goals:`<button class="icon-btn glass pressable" onclick="GoalForm.open()">＋</button>`}[tab];
    return C.tabHead('Planla','Takvim, bütçe ve hedefler',add)+`<div style="margin-top:12px">${C.segmented([['cal','Takvim'],['budget','Bütçe'],['rec','Düzenli'],['goals','Kumbara']],tab,'App.planTab')}</div>`+
      ({cal:Screens.calendar,budget:Screens.budget,rec:Screens.recurring,goals:Screens.goals})[tab](s,ui)},
  calendar(s,ui){const{y,m}=ui.cal,days=D.calendar(s,y,m),first=new Date(y,m,1),lead=(first.getDay()+6)%7,T=U.today();
    const sel=ui.cal.sel&&days[ui.cal.sel]?ui.cal.sel:(T.slice(0,7)===U.monthStart(y,m).slice(0,7)?T:U.monthStart(y,m));
    let cells=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d=>`<div class="wd">${d}</div>`).join('')+'<div></div>'.repeat(lead);
    Object.entries(days).forEach(([d,v])=>{const dots=v.events.filter(e=>!e.info).slice(0,3).map(e=>`<i style="background:${e.done?'var(--text3)':e.color}"></i>`).join('')+(v.events.some(e=>e.info)?'<i style="background:var(--yellow)"></i>':'');
      cells+=`<button class="d pressable ${d===T?'today':''} ${d===sel?'sel':''}" onclick="App.calSel('${d}')"><span class="n">${+d.slice(8)}</span>${v.spent>0?`<span class="sp">${U.short(v.spent)}</span>`:''}<span class="dots">${dots}</span></button>`});
    const all=Object.values(days).flatMap(v=>v.events).filter(e=>!e.info&&!e.done&&!e.income),planned=U.r2(all.reduce((a,e)=>a+e.amount,0));
    const spent=U.r2(Object.values(days).reduce((a,v)=>a+v.spent,0));
    const dv=days[sel];
    const evHtml=dv.events.map(e=>{const btn=e.done||e.info?'':e.type==='stmt'&&!e.projected?`<button class="mini-btn" onclick="PaySheet.open('${e.accId}',${e.idx})">Öde</button>`:e.type==='rec'?`<button class="mini-btn" onclick="RecurringForm.pay('${e.id}')">${e.income?'Aldım':'Öde'}</button>`:e.type==='loan'?`<button class="mini-btn" onclick="LoanForm.pay('${e.id}')">Öde</button>`:'';
      return `<div class="row"><span class="ic" style="background:${e.color}26">${{stmt:'💳',cut:'✂️',rec:'🔁',loan:'🏦',warranty:'🛡️'}[e.type]}</span><div class="mid"><b>${U.esc(e.title)}</b><span>${e.sub?U.esc(e.sub)+' · ':''}${e.done?'✓ tamamlandı':e.info?'bilgi':e.projected?'tahmini':'bekliyor'}</span></div>
        <div class="end"><b class="num ${e.income?'pos':''}">${e.amount!=null?U.money(e.amount):''}</b>${btn}</div></div>`}).join('');
    return `<div class="cal-nav"><button class="pressable" onclick="App.calMove(-1)">‹</button><b>${U.MONTHS[m]} ${y}</b><button class="pressable" onclick="App.calMove(1)">›</button></div>
      <div class="glass cal">${cells}</div>
      <div class="sumbar"><span>Bu ay harcanan <b class="num">${U.money(spent,{dec:false})}</b></span><span>Bekleyen ödemeler <b class="num">${U.money(planned,{dec:false})}</b></span></div>
      <div class="day-h"><span>${U.dayHeader(sel)}</span><span class="num">${dv.spent?'−'+U.money(dv.spent,{dec:false}):''}</span></div>
      ${dv.events.length?`<div class="glass list" style="margin-bottom:10px">${evHtml}</div>`:''}
      ${dv.txs.length?`<div class="glass list">${dv.txs.map(t=>C.txRow(s,t,null,' ')).join('')}</div>`:dv.events.length?'':`<p class="muted sm" style="text-align:center;padding:16px">Bu gün için kayıt yok.</p>`}`},
  budget(s){const st=D.budgetStatus(s),t=new Date(),left=U.dim(t.getFullYear(),t.getMonth())-t.getDate();
    if(!st.length)return C.empty('🎯','Kategorilere aylık limit koy; harcama hızına göre seni önceden uyarayım.',`<button class="btn primary pressable" onclick="BudgetForm.open()">Bütçe ekle</button>`);
    const lim=st.reduce((a,b)=>a+b.limit,0),sp=st.reduce((a,b)=>a+b.spent,0),pr=st.reduce((a,b)=>a+b.projected,0);
    return `<div class="glass" style="padding:18px;margin-top:14px;display:flex;gap:16px;align-items:center">${C.ring(sp/lim,92,sp>lim?'var(--red)':pr>lim?'var(--orange)':'var(--green)',`<b style="font-size:16px">%${Math.round(sp/lim*100)}</b>`,10)}
      <div><div class="muted sm">${U.MONTHS[t.getMonth()]} bütçesi · ${left} gün kaldı</div><div style="font-size:22px;font-weight:800;margin:3px 0" class="num">${U.money(sp,{dec:false})} <span class="muted sm">/ ${U.money(lim,{dec:false})}</span></div>
      <div class="sm ${pr>lim?'warn':'pos'}">Ay sonu tahmini ${U.money(pr,{dec:false})}</div></div></div>
      <div class="section"><div class="glass list">${st.map(C.budgetRow).join('')}</div></div>`},
  recurring(s){if(!s.recurring.length)return C.empty('🔁','Kira, abonelik, fatura ve harçlık gibi her ay tekrarlayan kalemleri ekle; takvime ve hatırlatmalara otomatik düşsün.',`<button class="btn primary pressable" onclick="RecurringForm.open()">Düzenli ödeme ekle</button>`);
    const list=s.recurring.map(r=>({r,c:D.recurCycle(r)})).sort((a,b)=>a.c.date.localeCompare(b.c.date));
    const out=U.r2(s.recurring.filter(r=>r.type!=='income').reduce((a,r)=>a+r.amount,0)),inc=U.r2(s.recurring.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0));
    return `<div class="stats"><div class="stat glass"><div class="l">Aylık sabit gider</div><div class="v num">${U.money(out,{dec:false})}</div><div class="s">${s.recurring.filter(r=>r.type!=='income').length} kalem</div></div>
      <div class="stat glass"><div class="l">Aylık düzenli gelir</div><div class="v num pos">${U.money(inc,{dec:false})}</div><div class="s">${inc?'Gelirinin %'+Math.round(out/inc*100)+'\'i sabit gider':'—'}</div></div></div>
      <div class="section"><div class="glass list">${list.map(({r,c})=>{const thisYm=U.today().slice(0,7),paidNow=!!r.paid?.[thisYm];const n=U.daysUntil(c.date);
        return `<div class="row pressable" onclick="RecurringForm.open('${r.id}')"><span class="ic" style="background:${cat(r.category).color}26">${r.icon||cat(r.category).icon}</span>
          <div class="mid"><b>${U.esc(r.name)}</b><span>Her ayın ${U.dayOf(r.day)} · ${paidNow?'✓ bu ay '+(r.type==='income'?'alındı':'ödendi'):n<0?'gecikti':n===0?'bugün':n+' gün kaldı'}</span></div>
          <div class="end"><b class="num ${r.type==='income'?'pos':''}">${r.type==='income'?'+':''}${U.money(r.amount)}</b>${paidNow?'':`<button class="mini-btn" onclick="event.stopPropagation();RecurringForm.pay('${r.id}')">${r.type==='income'?'Aldım':'Öde'}</button>`}</div></div>`}).join('')}</div></div>`},
  goals(s){if(!s.goals.length)return C.empty('🐷','Bir hedef koy (yeni telefon, tatil…), ne kadar biriktirmen gerektiğini hesaplayayım.',`<button class="btn primary pressable" onclick="GoalForm.open()">Kumbara oluştur</button>`);
    const tot=D.netWorth(s).goals;
    return `<div class="sumbar" style="margin-top:16px"><span>Toplam birikim</span><b class="num">${U.money(tot)}</b></div>
      <div class="goal-grid" style="margin-top:10px">${s.goals.map(g0=>{const g=D.goal(s,g0.id);return `<button class="goal glass pressable" onclick="App.push('goal',{id:'${g.id}'})">${C.ring(g.pct,86,gcol(g.color),g.icon||'🎯',9)}
        <b>${U.esc(g.name)}</b><div class="muted xs" style="margin-top:3px">${U.money(g.saved,{dec:false})} / ${U.money(g.target,{dec:false})}</div>
        <div class="xs" style="margin-top:4px;color:${g.done?'var(--green)':'var(--text2)'}">${g.done?'🎉 Tamamlandı':g.perMonth?'Ayda '+U.money(g.perMonth,{dec:false}):'%'+Math.round(g.pct*100)}</div></button>`}).join('')}</div>`},

  /* --- Raporlar --- */
  reports(s,ui){const{y,m}=ui.rep,r=D.monthReport(s,y,m),mx=Math.max(1,...r.daily);
    const nwh=D.netWorthHistory(s,12),last=nwh[nwh.length-1],first=nwh[0];
    const ch=r.prevExpense?Math.round((r.expense-r.prevExpense)/r.prevExpense*100):null;
    return C.tabHead('Raporlar','Hesap özeti ve analiz',C.eye())+
      `<div class="cal-nav"><button class="pressable" onclick="App.repMove(-1)">‹</button><b>${U.MONTHS[m]} ${y}</b><button class="pressable" onclick="App.repMove(1)">›</button></div>
      <div class="stats" style="margin-top:0">
        <div class="stat glass"><div class="l">Gelen</div><div class="v num pos">${U.money(r.income,{dec:false})}</div><div class="s">${r.txCount} işlem</div></div>

  card(s,ui,p){const a=D.account(s,p.id);if(!a)return null;const m=D.cardSummary(s,a.id),st=D.statements(s,a.id),tab=ui.cardTab;

  account(s,ui,p){const a=D.account(s,p.id);if(!a)return null;const b=D.balance(s,a.id),led=D.ledger(s,a.id),bal={};led.forEach(x=>bal[x.t.id]=x.bal);

  tx(s,ui,p){const t=D.tx(s,p.id);if(!t)return null;const v=C.txVis(s,t),a=D.account(s,t.accountId),plan=D.txPlan(s,t),refunds=D.refundMap(s)[t.id]||[];

  matrix(s,ui,p){const accId=ui.matrixAcc??p.acc??'',M=D.matrix(s,accId,12);const cards=s.accounts.filter(a=>a.type==='credit');

    sh.addEventListener('touchend',()=>{if(y0===null)return;sh.style.transition='transform .35s var(--ease)';if(dy>110)this.close();else sh.style.transform='';y0=null;dy=0});

const TxForm={draft:null,aiMeta:null,

    this.draft=t?{...t}:{id:'',kind,amount:'',merchant:'',category:kind==='income'?'income':'market',
      accountId:(kind==='expense'?s.accounts[0]:nc[0]||s.accounts[0]).id,toAccountId:'',toAmount:null,date:U.today(),installments:1,note:'',source:'manual'};
    if(!t&&kind==='transfer'){this.draft.toAccountId=(nc.find(a=>a.id!==this.draft.accountId)||{}).id||''}
    if(!t&&preset.prefill)Object.entries(preset.prefill).forEach(([k,v])=>{if(v!==undefined&&v!==null)this.draft[k]=v});

  fixAccounts(){const s=Store.get(),d=this.draft,nc=F.nonCredit();

    if(!D.isCredit(s,d.accountId))d.installments=1},
  banner(){const m=this.aiMeta;if(!m)return '';const w=[];
    if(!m.matched)w.push('Kart eşleşmedi'+(m.cardHint?` (“${U.esc(m.cardHint)}”)`:'')+', hesabı kontrol et.');
    if(m.currency&&m.currency!=='TRY')w.push(`Belge ${m.currency} ile; tutarı TL'ye çevirmen gerekebilir.`);
    if(m.installments>1&&!D.isCredit(Store.get(),this.draft.accountId))w.push(`Belgede ${m.installments} taksit yazıyor; kredi kartı seçersen plana işlenir.`);

    return `<div class="ai-banner">✨ <b>Gemini ile dolduruldu</b>${m.confidence!=null?' · güven %'+Math.round(m.confidence*100):''}${m.itemCount?' · '+m.itemCount+' kalem okundu':''}. Kaydetmeden önce kontrol et.${w.length?'<br>⚠️ '+w.join('<br>⚠️ '):''}</div>`},
  render(){const s=Store.get(),d=this.draft,acc=D.account(s,d.accountId),to=D.account(s,d.toAccountId),isCredit=acc?.type==='credit',k=d.kind;
    const nc=F.nonCredit(),title=d.id?'Düzenle':{expense:'Harcama Ekle',income:'Gelir Ekle',transfer:'Transfer'}[k];
    const fx=k==='transfer'&&acc&&to&&acc.currency!==to.currency;
    Sheet.open(Sheet.head(title,{onRight:'TxForm.save()'})+
      `${d.id||d._rec?'':C.segmented([['expense','Harcama'],['income','Gelir'],['transfer','Transfer']],k,'TxForm.setKind')}
      <input class="amount-in num" id="tx-amount" inputmode="decimal" placeholder="0" value="${F.money(d.amount)}" autocomplete="off">
      <div class="amount-cur">${acc?.currency&&acc.currency!=='TRY'?acc.currency:'Türk Lirası'}</div>${this.banner()}
      ${k==='transfer'?`<div class="grid2"><label class="field"><span>Nereden</span><select class="input" onchange="TxForm.set('accountId',this.value)">${F.accOpts(nc,d.accountId)}</select></label>
        <label class="field"><span>Nereye</span><select class="input" onchange="TxForm.set('toAccountId',this.value)">${F.accOpts(nc.filter(a=>a.id!==d.accountId),d.toAccountId)}</select></label></div>
        ${fx?`<label class="field"><span>Alınan tutar (${to.currency}) · kur ${U.money(s.settings.rates[to.currency]||s.settings.rates[acc.currency]||0,{raw:true})}</span><input class="input" id="tx-toamount" inputmode="decimal" value="${F.money(d.toAmount)}" placeholder="otomatik hesaplanır"></label>`:''}
        <label class="field"><span>Açıklama</span><input class="input" id="tx-merchant" value="${U.esc(d.merchant)}" placeholder="ör. ATM'den para çekme"></label>`
      :`<label class="field"><span>${k==='income'?'Açıklama':'Nereden / ne aldın?'}</span><input class="input" id="tx-merchant" value="${U.esc(d.merchant)}" placeholder="${k==='income'?'ör. Aylık harçlık':'ör. Migros, Kulaklık'}"></label>
        <div class="field"><span>Kategori</span>${F.catGrid(k==='income'?incomeCats():expenseCats(),d.category,'TxForm.setCat')}</div>
        <div class="grid2"><label class="field"><span>Hesap</span><select class="input" onchange="TxForm.set('accountId',this.value)">${F.accOpts(k==='income'?nc:s.accounts,d.accountId)}</select></label>
        <label class="field"><span>Tarih</span><input class="input" type="date" id="tx-date" value="${d.date}"></label></div>`}
      ${k==='transfer'?`<label class="field"><span>Tarih</span><input class="input" type="date" id="tx-date" value="${d.date}"></label>`:''}
      ${isCredit&&k==='expense'?`<label class="field"><span>Taksit</span><select class="input" id="tx-inst">${INSTALLMENT_OPTS.map(n=>`<option value="${n}" ${+d.installments===n?'selected':''}>${n===1?'Tek çekim':n+' taksit'}</option>`).join('')}</select></label>`:''}
      <label class="field"><span>Not</span><input class="input" id="tx-note" value="${U.esc(d.note||'')}" placeholder="opsiyonel"></label>
      ${k==='expense'?`<label class="btn pressable" style="font-size:14px">📎 ${d._attach||d.attachmentId?'Belge eklendi · değiştir':'Fiş / fatura görseli ekle'}<input type="file" accept="image/*,application/pdf" hidden onchange="TxForm.attach(this)"></label>`:''}

      ${d.id?`<button class="btn danger pressable" onclick="App.deleteTx('${d.id}')">İşlemi sil</button>`:''}`,

  sync(){const d=this.draft;if(!Sheet.el('#tx-amount'))return;d.amount=Sheet.val('#tx-amount');d.merchant=Sheet.val('#tx-merchant');d.date=Sheet.val('#tx-date')||U.today();d.note=Sheet.val('#tx-note');
    const i=Sheet.el('#tx-inst');d.installments=i?+i.value:1;if(Sheet.el('#tx-toamount'))d.toAmount=Sheet.val('#tx-toamount');this.preview()},
  set(k,v){this.sync();this.draft[k]=v;this.fixAccounts();Haptic.tap();this.render()},
  setCat(c){this.set('category',c)},

    if(k==='transfer'&&F.nonCredit().length<2){Toast.show('Transfer için en az iki nakit/vadesiz/döviz hesabı gerekir');d.kind='expense';d.category='market'}
    this.fixAccounts();this.render()},
  async attach(inp){const f=inp.files&&inp.files[0];if(!f)return;this.sync();try{const m=await Media.prepare(f,1600);this.draft._attach=m.dataUrl;Toast.show('📎 Belge eklendi');this.render()}catch(e){Toast.show('⚠️ '+AI.human(e))}},
  preview(){const s=Store.get(),d=this.draft,box=Sheet.el('#tx-preview');if(!box)return;const acc=D.account(s,d.accountId),amt=U.parseNum(d.amount);
    if(!acc||!(amt>0)){box.innerHTML='';return}
    if(d.kind==='transfer'){const to=D.account(s,d.toAccountId);if(!to){box.innerHTML='';return}
      const recv=this.toAmountFor(amt);box.innerHTML=`<div class="preview">${U.esc(acc.name)}: <b>${U.money(D.balance(s,acc.id),{cur:acc.currency})}</b> → <b>${U.money(D.balance(s,acc.id)-(d.id?0:amt),{cur:acc.currency})}</b><br>${U.esc(to.name)}: +<b>${U.money(recv,{cur:to.currency})}</b></div>`;return}
    if(d.kind!=='expense'){box.innerHTML='';return}
    if(acc.type==='credit'){const n=+d.installments||1,f=D.stmtIdx(acc.credit,d.date),parts=U.split(amt,n),m=D.cardSummary(s,acc.id),after=U.r2(m.available-(d.id?0:amt));
      box.innerHTML=`<div class="preview">${n>1?`Aylık <b>${U.money(parts[0])}</b> × ${n} taksit<br>`:''}İlk ödeme <b>${D.stmtName(f)} ekstresi</b> (son ödeme ${U.fmtDate(D.dueDate(acc.credit,f))})${n>1?`<br>Son taksit <b>${D.stmtName(f+n-1)}</b>`:''}
        ${d.id?'':`<br>Kullanılabilir limit: <b>${U.money(m.available)}</b> → <b style="color:${after<0?'var(--red)':'inherit'}">${U.money(after)}</b>`}</div>`}
    else{const b=D.balance(s,acc.id),after=b-amt,od=+acc.overdraft||0;box.innerHTML=d.id?'':`<div class="preview">Bakiye: <b>${U.money(b,{cur:acc.currency})}</b> → <b style="color:${after<-od?'var(--red)':after<0?'var(--orange)':'inherit'}">${U.money(after,{cur:acc.currency})}</b>${after<0?(od&&after>=-od?' · KMH kullanılır':' · yetersiz bakiye'):''}</div>`}},
  toAmountFor(amt){const s=Store.get(),d=this.draft,a=D.account(s,d.accountId),b=D.account(s,d.toAccountId);if(!a||!b||a.currency===b.currency)return amt;
    const manual=U.parseNum(d.toAmount);if(manual>0)return manual;const r=s.settings.rates,tl=D.toTRY(s,amt,a.currency);return U.r2(b.currency==='TRY'?tl:tl/(+r[b.currency]||1))},
  async save(){this.sync();const s=Store.get(),d=this.draft,amt=U.parseNum(d.amount);
    if(!(amt>0)){Toast.show('Geçerli bir tutar gir');Haptic.error();return}
    if(!D.account(s,d.accountId)){Toast.show('Hesap seç');return}
    if(d.kind==='transfer'&&(!D.account(s,d.toAccountId)||d.toAccountId===d.accountId)){Toast.show('Farklı bir hedef hesap seç');return}
    const item={...d,id:d.id||U.uid(),amount:U.r2(amt),merchant:(d.merchant||'').trim(),note:(d.note||'').trim(),installments:d.kind==='expense'?(+d.installments||1):1};
    if(d.kind==='transfer'){const a=D.account(s,d.accountId),b=D.account(s,d.toAccountId);item.toAmount=a.currency!==b.currency?this.toAmountFor(amt):null;item.category='';delete item.installments}
    else{delete item.toAccountId;delete item.toAmount}
    if(d._attach){const aid=d.attachmentId||U.uid();try{await Attach.put(aid,d._attach);item.attachmentId=aid}catch(e){Toast.show('⚠️ Belge kaydedilemedi')}}
    const rec=d._rec;delete item._attach;delete item._rec;
    if(rec){const r=s.recurring.find(x=>x.id===rec.id);item.recurringId=rec.id;
      Store.dispatch({type:'batch',actions:[{type:'upsert',col:'transactions',item},...(r?[{type:'upsert',col:'recurring',item:{...r,paid:{...(r.paid||{}),[rec.ym]:item.id}}}]:[])]})}
    else Store.dispatch({type:'upsert',col:'transactions',item});
    Haptic.success();Sheet.close();Toast.show(d.id?'✓ Güncellendi':'✓ Kaydedildi')}
};

const PinSetup={step:1,first:'',buf:'',len:4,
  open(){this.step=1;this.first='';this.buf='';this.len=Store.get().security.pinLen||4;this.render()},
  render(){Sheet.open(Sheet.head(this.step===1?'PIN belirle':'PIN\'i tekrar gir',{left:'Vazgeç',right:''})+
    `${this.step===1?C.segmented([['4','4 haneli'],['6','6 haneli']],String(this.len),'PinSetup.setLen'):''}
    <div style="display:flex;flex-direction:column;align-items:center;margin-top:10px"><div class="lock-dots" id="pin-dots">${Array.from({length:this.len},(_,i)=>`<i class="${i<this.buf.length?'on':''}"></i>`).join('')}</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="key glass pressable" onclick="PinSetup.press('${k}')">${k}</button>`).join('')}</div></div>`)},
  setLen(l){this.len=+l;this.buf='';this.render()},
  async press(k){Haptic.tap();if(k==='⌫')this.buf=this.buf.slice(0,-1);else if(this.buf.length<this.len)this.buf+=k;
    document.querySelectorAll('#pin-dots i').forEach((e,i)=>e.classList.toggle('on',i<this.buf.length));
    if(this.buf.length<this.len)return;
    if(this.step===1){this.first=this.buf;this.buf='';this.step=2;setTimeout(()=>this.render(),150)}
    else if(this.buf===this.first){Store.dispatch({type:'security/update',payload:{pinHash:await Security.hash(this.buf),pinLen:this.len}});Security.unlocked=true;Haptic.success();Sheet.close();Toast.show('🔒 PIN kilidi açıldı');setTimeout(()=>SettingsSheet.open('security'),300)}
    else{const d=document.getElementById('pin-dots');d.classList.add('shake');Haptic.error();Toast.show('PIN\'ler eşleşmedi, baştan dene');this.step=1;this.buf='';this.first='';setTimeout(()=>this.render(),450)}}
};
const LockScreen={buf:'',
  show(){let el=document.getElementById('lock');if(el)el.remove();const sec=Store.get().security,s=Store.get();this.buf='';
    el=document.createElement('div');el.id='lock';el.innerHTML=`<div class="ambient"><i></i><i></i><i></i></div><div class="avatar" style="width:64px;height:64px;font-size:26px">${U.esc((s.settings.name||'?')[0].toUpperCase())}</div>
      <h2>Cüzdan kilitli</h2><div class="muted sm">PIN'ini gir</div><div class="lock-dots" id="lock-dots">${Array.from({length:sec.pinLen||4},()=>'<i></i>').join('')}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9,sec.bioId&&Security.bioAvailable()?'bio':'',0,'⌫'].map(k=>k===''?'<span></span>':k==='bio'?`<button class="key ghost pressable" onclick="LockScreen.bio()">Face ID</button>`:`<button class="key glass pressable" onclick="LockScreen.press('${k}')">${k}</button>`).join('')}</div>`;
    document.body.appendChild(el);if(sec.bioId&&Security.bioAvailable())setTimeout(()=>this.bio(),450)},
  async press(k){if(Date.now()<Security.blockedUntil){Toast.show('Çok fazla deneme. '+Math.ceil((Security.blockedUntil-Date.now())/1000)+' sn bekle');return}
    Haptic.tap();const len=Store.get().security.pinLen||4;if(k==='⌫')this.buf=this.buf.slice(0,-1);else if(this.buf.length<len)this.buf+=k;
    document.querySelectorAll('#lock-dots i').forEach((e,i)=>e.classList.toggle('on',i<this.buf.length));
    if(this.buf.length<len)return;
    if(await Security.hash(this.buf)===Store.get().security.pinHash){Security.fails=0;this.unlock()}
    else{Security.fails++;if(Security.fails>=5){Security.blockedUntil=Date.now()+30000;Security.fails=0}Haptic.error();const d=document.getElementById('lock-dots');d.classList.add('shake');
      setTimeout(()=>{d.classList.remove('shake');this.buf='';d.querySelectorAll('i').forEach(e=>e.classList.remove('on'))},420)}},
  async bio(){try{await Security.bioVerify();this.unlock()}catch(e){}},
  unlock(){Security.unlocked=true;Haptic.success();const el=document.getElementById('lock');if(el){el.classList.add('out');setTimeout(()=>el.remove(),340)}Reminders.run()}
};

  loading(m){const b=Sheet.el('#im-body');if(b)b.innerHTML=`<div class="scan-prev">${m.preview?`<img src="${m.preview}" alt="">`:'<span class="doc">📄</span>'}<span class="beam"></span></div><p class="muted sm" style="text-align:center;margin-top:12px">✨ Gemini ekstreyi satır satır okuyor… (uzun ekstrelerde 1 dakikayı bulabilir)</p>`},
  async pick(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;this.accId=Sheet.val('#im-acc')||this.accId;
    try{const r=await AIActions.statement(f,this.accId);if(!r.ok){Sheet.el('#im-body').innerHTML=`<div class="err-box" style="margin-top:14px">🤔 ${U.esc(r.reason)}</div>`;return}
      this.rows=r.rows;this.meta=r.meta;Haptic.success();this.review()}
    catch(e){const b=Sheet.el('#im-body');if(b)b.innerHTML=`<div class="err-box" style="margin-top:14px">⚠️ ${U.esc(AI.human(e))}</div>`}},
  review(){const s=Store.get(),a=D.account(s,this.accId),m=this.meta||{},sel=this.rows.filter(r=>r.sel);
    Sheet.open(Sheet.head('Kontrol et',{left:'Vazgeç',right:`Ekle (${sel.length})`,onRight:'ImportSheet.commit()'})+
      `<div class="preview"><b>${U.esc(a.name)}</b>${m.cut?' · kesim '+U.fmtDate(m.cut,'y'):''}${m.due?' · son ödeme '+U.fmtDate(m.due,'y'):''}${m.total?'<br>Ekstre toplamı <b>'+U.money(m.total,{raw:true})+'</b>':''}${m.min?' · asgari '+U.money(m.min,{raw:true}):''}
        <br>${this.rows.length} satır okundu${this.rows.some(r=>r.dup)?' · <b>'+this.rows.filter(r=>r.dup).length+' tanesi zaten kayıtlı görünüyor</b> (işaretsiz)':''}.</div>
      <div style="margin-top:8px">${this.rows.map(r=>`<label class="imp-row"><input type="checkbox" ${r.sel?'checked':''} onchange="ImportSheet.toggle('${r.id}',this.checked)">
        <span style="font-size:20px">${r.type==='payment'?'💳':r.type==='refund'?'↩️':cat(r.category).icon}</span>
        <div class="mid"><b>${U.esc(r.desc)}</b><span>${U.fmtDate(r.date)} · ${U.esc(r.label)}${r.dup?' · ⚠️ mükerrer olabilir':''}</span></div>
        <div class="end num ${r.type!=='expense'?'pos':''}">${r.type!=='expense'?'+':''}${U.money(r.lineAmount||r.amount,{raw:true})}</div></label>`).join('')}</div>
      <p class="muted xs" style="margin-top:10px">Taksitli satırlar, toplam tutar ve taksit sayısıyla tek alışveriş olarak eklenir; geçmiş taksitler doğru ekstrelere yerleşir.</p>`)},
  toggle(id,v){const r=this.rows.find(x=>x.id===id);if(r)r.sel=v;const b=document.querySelector('#sheet .sheet-head button:last-child');if(b)b.textContent=`Ekle (${this.rows.filter(r=>r.sel).length})`},
  commit(){const acts=StatementImport.toActions(this.rows,this.accId);if(!acts.length){Toast.show('Seçili satır yok');return}

};

/* ---------- 80_app.js ---------- */

/* ===================== app/controller · router ===================== */
const T0=new Date();
const UI={tab:'home',stack:[],period:'month',seg:null,
  txf:{q:'',kind:'all',range:'all',acc:'',cat:''},
  planTab:'cal',cal:{y:T0.getFullYear(),m:T0.getMonth(),sel:null},rep:{y:T0.getFullYear(),m:T0.getMonth()},
  cardTab:'stmts',openStmt:null,matrixAcc:null};
const TABS=[['home','Ana Sayfa','<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'],
  ['txs','İşlemler','<path d="M4 6h16M4 12h16M4 18h10"/>'],
  ['add'],
  ['plan','Planla','<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'],

const App={
  current(){return UI.stack.length?UI.stack[UI.stack.length-1]:null},
  render(anim){const s=Store.get(),scr=document.getElementById('screen');PRIVACY=!!s.settings.privacy;
    const keep=[...scr.querySelectorAll('[data-keep-scroll]')].map(e=>[e.dataset.keepScroll,e.scrollLeft]);
    const top=this.current();let html=top?Pages[top.name](s,UI,top.params||{}):Screens[UI.tab](s,UI);
    if(html===null){UI.stack.pop();try{history.replaceState({d:UI.stack.length},'')}catch(e){}return this.render()}
    const focus=document.activeElement&&document.activeElement.id==='tx-q'?document.activeElement.selectionStart:null;
    scr.innerHTML=html;
    keep.forEach(([k,v])=>{const e=scr.querySelector(`[data-keep-scroll="${k}"]`);if(e)e.scrollLeft=v});
    if(focus!==null){const q=document.getElementById('tx-q');if(q){q.focus();try{q.setSelectionRange(focus,focus)}catch(e){}}}
    scr.classList.remove('enter','enter-push','enter-pop');
    if(anim){void scr.offsetWidth;scr.classList.add(anim==='push'?'enter-push':anim==='pop'?'enter-pop':'enter');clearTimeout(this._et);this._et=setTimeout(()=>scr.classList.remove('enter','enter-push','enter-pop'),1100)}
    if(top&&top.name==='tx'){const t=D.tx(s,top.params.id);if(t&&t.attachmentId)this.loadAttachment(t.attachmentId)}
    this.renderTabbar()},
  async loadAttachment(id){const box=document.getElementById('att-box');if(!box)return;
    try{const d=await Attach.get(id);if(!d){box.innerHTML='<p class="muted sm">Belge bu cihazda bulunamadı.</p>';return}
      box.innerHTML=d.startsWith('data:application/pdf')?`<button class="btn pressable" onclick="App.openPdf('${id}')">📄 PDF'i aç</button>`:`<img src="${d}" alt="Belge">`}
    catch(e){box.innerHTML='<p class="muted sm">Belge yüklenemedi.</p>'}},
  async openPdf(id){const d=await Attach.get(id);if(!d)return;const b=await (await fetch(d)).blob();window.open(URL.createObjectURL(b),'_blank')},
  renderTabbar(){const nav=document.getElementById('tabbar');
    if(!nav.dataset.ready){nav.innerHTML='<span class="tab-ind" id="tab-ind"></span>'+TABS.map(t=>t[0]==='add'
      ?`<button class="tab-add pressable" onclick="App.openAdd()" aria-label="Ekle">+</button>`
      :`<button class="tab pressable" data-tab="${t[0]}" onclick="App.go('${t[0]}')"><svg viewBox="0 0 24 24">${t[2]}</svg>${t[1]}</button>`).join('');nav.dataset.ready=1}
    nav.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
    requestAnimationFrame(()=>{const on=nav.querySelector('.tab.on'),ind=document.getElementById('tab-ind');if(on&&ind){ind.style.width=on.offsetWidth+'px';ind.style.transform=`translateX(${on.offsetLeft}px)`}})},
  /* navigasyon: sekmeler + detay sayfa yığını (Android geri hareketi / tarayıcı geri tuşu desteklenir) */
  go(tab,sub){const same=UI.tab===tab&&!UI.stack.length;if(sub&&tab==='plan')UI.planTab=sub;
    if(same&&!sub){window.scrollTo({top:0,behavior:'smooth'});return}
    UI.tab=tab;UI.stack=[];UI.seg=null;try{history.replaceState({d:0},'')}catch(e){}Haptic.tap();window.scrollTo(0,0);this.render('fade')},
  push(name,params){const cur=this.current();if(cur)cur.scroll=window.scrollY;else UI.tabScroll=window.scrollY;
    if(name==='card'){UI.cardTab='stmts';UI.openStmt=null}if(name==='matrix')UI.matrixAcc=params&&params.acc!=null?params.acc:null;
    UI.stack.push({name,params:params||{}});try{history.pushState({d:UI.stack.length},'')}catch(e){}Haptic.tap();this.render('push');window.scrollTo(0,0)},
  back(force){if(!UI.stack.length)return;if(!force&&history.state&&history.state.d===UI.stack.length){history.back();return}this.pop()},
  pop(){UI.stack.pop();this.render('pop');const cur=this.current();window.scrollTo(0,cur?cur.scroll||0:UI.tabScroll||0)},
  onPop(e){const d=(e.state&&e.state.d)||0;if(document.getElementById('sheet')){Sheet.close();try{history.pushState({d:UI.stack.length},'')}catch(x){}return}
    if(UI.stack.length>d){while(UI.stack.length>d+1)UI.stack.pop();this.pop()}},

  /* ekran eylemleri */
  setPeriod(p){UI.period=p;UI.seg=null;Haptic.tap();this.render()},
  selSeg(i){UI.seg=UI.seg===i?null:i;Haptic.tap();this.render()},
  txSearch:U.debounce(function(v){UI.txf.q=v;const box=document.getElementById('tx-list');if(box)box.innerHTML=Screens.txList(Store.get(),UI)},160),
  txKind(k){UI.txf.kind=k;Haptic.tap();this.render()},
  txRange(k){UI.txf.range=k;Haptic.tap();this.render()},
  txFilter(k,v){UI.txf[k]=v;this.render()},
  planTab(t){UI.planTab=t;Haptic.tap();this.render()},
  calMove(d){const c=UI.cal,n=new Date(c.y,c.m+d,1);c.y=n.getFullYear();c.m=n.getMonth();c.sel=null;Haptic.tap();this.render()},
  calSel(d){UI.cal.sel=d;Haptic.tap();this.render()},
  repMove(d){const r=UI.rep,n=new Date(r.y,r.m+d,1);if(n>new Date())return;r.y=n.getFullYear();r.m=n.getMonth();Haptic.tap();this.render()},
  cardTab(t){UI.cardTab=t;Haptic.tap();this.render()},
  toggleStmt(i){const cur=UI.openStmt??(()=>{const top=this.current();const a=top&&D.account(Store.get(),top.params.id);return a?D.openIdx(a.credit)-1:null})();UI.openStmt=cur===i?-999:i;this.render()},
  matrixAcc(a){UI.matrixAcc=a;this.render()},
  toggleTheme(){Theme.toggle()},
  togglePrivacy(v){const on=typeof v==='boolean'?v:!Store.get().settings.privacy;Store.dispatch({type:'settings/update',payload:{privacy:on}});Haptic.tap()},
  openAdd(){Haptic.tap();AddMenu.open()},
  openSettings(sec){SettingsSheet.open(sec)},
  quick(k){Sheet.close(true);({scan:()=>ScanSheet.open(),import:()=>ImportSheet.open(),account:()=>AccForm.open(),pay:()=>PaySheet.open(),loan:()=>LoanForm.open(),
    goal:()=>GoalForm.open(),rec:()=>RecurringForm.open()}[k]||(()=>TxForm.open(null,{type:k})))()},
  useTemplate(id){const s=Store.get(),t=s.templates.find(x=>x.id===id);if(!t)return;const acc=D.account(s,t.accountId);if(!acc){Toast.show('Şablonun hesabı silinmiş');return TemplateForm.open(id)}
    const item={id:U.uid(),kind:t.kind||'expense',accountId:acc.id,amount:t.amount,date:U.today(),category:t.category,merchant:t.merchant||t.name,note:'',installments:1,source:'manual'};
    Store.dispatch({type:'upsert',col:'transactions',item});Haptic.success();
    Toast.show(`✓ ${U.esc(t.name)} · ${U.money(t.amount)} eklendi`,4500,{label:'Geri al',fn:()=>Store.dispatch({type:'remove',col:'transactions',id:item.id})})},
  deleteTx(id){const s=Store.get(),t=D.tx(s,id);if(!t)return;const refs=(D.refundMap(s)[id]||[]).length;
    if(!confirm(refs?'İşlem ve bağlı iade kayıtları silinsin mi?':'Bu işlem silinsin mi?'))return;
    const att=t.attachmentId;Store.dispatch({type:'remove',col:'transactions',id});if(att)Attach.del(att).catch(()=>{});
    Sheet.close(true);if(this.current()?.name==='tx')this.back(true);Toast.show('İşlem silindi')},
  closeInstallments(id){const s=Store.get(),t=D.tx(s,id),acc=D.account(s,t.accountId),o=D.openIdx(acc.credit),plan=D.txPlan(s,t);
    const amt=U.r2(plan.rows.filter(r=>r.idx>o).reduce((a,r)=>a+r.amount,0));
    if(!confirm(`Kalan ${plan.rows.filter(r=>r.idx>o).length} taksit (${U.money(amt,{raw:true})}) ${D.stmtName(o)} ekstresine alınacak. Onaylıyor musun?`))return;
    Store.dispatch({type:'upsert',col:'transactions',item:{...t,closedIdx:Math.max(o,D.stmtIdx(acc.credit,t.date))}});Haptic.success();Toast.show('✓ Taksitler bu döneme alındı')},
  exportFiltered(){const s=Store.get(),list=D.filterTx(s,UI.txf);if(!list.length){Toast.show('Dışa aktarılacak işlem yok');return}Exporter.csv(s,list)},
  exportMonth(y,m){const s=Store.get(),r=D.monthReport(s,y,m);if(!r.txs.length){Toast.show('Bu ayda işlem yok');return}Exporter.csv(s,r.txs,`cuzdan-${y}-${U.p2(m+1)}.csv`)},
  loadDemo(){const s=Store.get();if((s.accounts.length||s.transactions.length)&&!confirm('Mevcut verilerin yerine örnek veriler yüklensin mi?'))return;
    Store.dispatch({type:'state/replace',payload:Demo.build(s)});Sheet.close();UI.tab='home';UI.stack=[];this.render('fade');Toast.show('✨ Örnek veriler yüklendi')},
  resetAll(){if(!confirm('Tüm veriler silinecek. Emin misin?'))return;const s=Store.get();
    Store.dispatch({type:'state/replace',payload:{...emptyState(),settings:s.settings,security:s.security}});Sheet.close();UI.stack=[];Toast.show('Veriler silindi')},
  exportJSON(){Exporter.download(JSON.stringify(Store.get(),null,1),'cuzdan-yedek-'+U.today()+'.json','application/json')},
  importJSON(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.accounts)||!Array.isArray(d.transactions))throw 0;
      if(!confirm('Mevcut verilerin yerine bu yedek yüklensin mi?'))return;Store.dispatch({type:'state/replace',payload:Persist.migrate(d)});Sheet.close();UI.stack=[];Toast.show('✓ Yedek yüklendi')}
      catch(e){Toast.show('⚠️ Geçerli bir yedek dosyası değil')}};rd.readAsText(f)},
  init(){Store.init(Persist.load());Theme.apply();PRIVACY=!!Store.get().settings.privacy;
    Theme.mq&&Theme.mq.addEventListener&&Theme.mq.addEventListener('change',()=>{Theme.apply();this.render()});
    Store.subscribe((s,a)=>{if(a.type==='settings/update')Theme.apply();this.render(a.type==='state/replace'?'fade':null)});
    window.addEventListener('popstate',e=>this.onPop(e));try{history.replaceState({d:0},'')}catch(e){}
    this.render('fade');
    if(Store.get()._migrated){Toast.show('📥 Taksitlerim verilerin taşındı');const s={...Store.get()};delete s._migrated;Store.dispatch({type:'state/replace',payload:s})}
    Security.init();if(Security.unlocked)Reminders.run()}
};

/* ===================== Demo verisi ===================== */
const Demo={build(prev){
  const s=emptyState();s.settings={...s.settings,...prev.settings};s.security={...prev.security};let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const T=U.today(),ago=n=>U.addDays(T,-n),dom=n=>((new Date().getDate()+n-1)%28)+1,id=U.uid;
  const cc={id:id(),type:'credit',name:'Bonus Kart',bank:'Kredi Kartı',color:0,currency:'TRY',opening:0,credit:{limit:10000,cutDay:15,dueDay:25,sharedWith:'',minRate:20,contractRate:'',lateRate:''}};
  const vc={id:id(),type:'credit',name:'Sanal Kart',bank:'',color:1,currency:'TRY',opening:0,credit:{limit:0,cutDay:15,dueDay:25,sharedWith:cc.id,minRate:20,contractRate:'',lateRate:''}};
  const chk={id:id(),type:'checking',name:'Vadesiz Hesap',bank:'Banka',color:2,currency:'TRY',opening:9000,overdraft:2000};
  const cash={id:id(),type:'cash',name:'Cüzdan',bank:'',color:3,currency:'TRY',opening:1500};
  const usd={id:id(),type:'fx',name:'Dolar Birikimi',bank:'',color:5,currency:'USD',opening:150};
  const gold={id:id(),type:'fx',name:'Altın',bank:'',color:3,currency:'XAU',opening:5};
  s.accounts=[cc,vc,chk,usd,gold,cash];
  const tx=(acc,amount,days,category,merchant,installments=1,kind='expense',extra={})=>{const t={id:id(),kind,accountId:acc.id,amount,date:ago(days),category,merchant,note:'',installments,source:'manual',...extra};s.transactions.push(t);return t};
  const inc=tx(chk,5000,new Date().getDate()-1,'gift','Aylık harçlık',1,'income');tx(chk,5000,new Date().getDate()+29,'gift','Aylık harçlık',1,'income');tx(chk,5000,new Date().getDate()+59,'gift','Aylık harçlık',1,'income');
  tx(cc,2400,38,'electronics','Kablosuz kulaklık',3,'expense',{warrantyMonths:24});tx(vc,3000,19,'clothing','Spor ayakkabı',6);tx(cc,1200,62,'electronics','Telefon kılıfı + şarj',3);
  const kb=tx(cc,650,9,'clothing','Tişört',1);s.transactions.push({id:id(),kind:'refund',refOf:kb.id,accountId:cc.id,amount:650,date:ago(4),category:'clothing',merchant:'Tişört',source:'manual'});
  const shops={market:['Migros','A101','BİM','ŞOK'],food:['Starbucks','Burger King','Kahve Dünyası','Dönerci','Simit Sarayı'],transport:['İstanbulkart dolum','Taksi'],fun:['Steam','Sinema'],other:['Kırtasiye']};
  const ranges={market:[180,750],food:[95,340],transport:[100,300],fun:[150,450],other:[60,200]};
  for(let d=0;d<75;d++){if(rnd()<.5){const k=['market','food','food','food','transport','fun','other'][Math.floor(rnd()*7)];
    const[a,b]=ranges[k];const amt=Math.round(a+rnd()*(b-a));const acc=rnd()<.35?cc:rnd()<.3?vc:rnd()<.6?chk:cash;tx(acc,amt,d,k,shops[k][Math.floor(rnd()*shops[k].length)])}}
  tx(chk,1500,6,'',"ATM'den para çekme",1,'transfer',{toAccountId:cash.id,category:''});
  s.budgets=[{id:id(),category:'food',limit:1800},{id:id(),category:'market',limit:2500},{id:id(),category:'fun',limit:600},{id:id(),category:'transport',limit:900}];
  const ym=T.slice(0,7);
  s.recurring=[{id:id(),type:'income',name:'Aylık harçlık',amount:5000,day:Math.max(1,new Date().getDate()-1),category:'gift',accountId:chk.id,icon:'🎁',paid:{[ym]:inc.id}},
    {id:id(),type:'expense',name:'Spotify',amount:99,day:dom(3),category:'subscription',accountId:cc.id,icon:'🎧',paid:{}},
    {id:id(),type:'expense',name:'Telefon faturası',amount:350,day:dom(1),category:'bills',accountId:chk.id,icon:'📶',paid:{}},
    {id:id(),type:'expense',name:'YouTube Premium',amount:80,day:dom(12),category:'subscription',accountId:vc.id,icon:'📺',paid:{}},
    {id:id(),type:'expense',name:'Spor salonu',amount:900,day:dom(20),category:'health',accountId:cc.id,icon:'🏋️',paid:{}}];
  const tdy=new Date().getDate();s.recurring.forEach(r=>{if(r.type==='expense'&&r.day<tdy){const t=tx(s.accounts.find(a=>a.id===r.accountId),r.amount,tdy-r.day,r.category,r.name,1,'expense',{recurringId:r.id});r.paid[ym]=t.id}});
  const ln={id:id(),name:'Laptop kredisi',bank:'Banka',monthly:850,count:12,firstDate:U.addMonths(U.addDays(T,8),-4),paidBefore:0,accountId:chk.id,principal:9000};s.loans=[ln];
  for(let k=0;k<4;k++)s.transactions.push({id:id(),kind:'loan',loanId:ln.id,accountId:chk.id,amount:850,date:U.addDays(U.addMonths(ln.firstDate,k),-1),source:'manual'});
  const g1={id:id(),name:'Yeni telefon',icon:'📱',target:15000,deadline:U.addMonths(T,6),color:0},g2={id:id(),name:'Yaz tatili',icon:'🏖️',target:8000,deadline:U.addMonths(T,8),color:3};s.goals=[g1,g2];
  [[g1,1500,40],[g1,1000,10],[g2,1200,20]].forEach(([g,a,d])=>s.transactions.push({id:id(),kind:'goal',goalId:g.id,dir:'in',accountId:chk.id,amount:a,date:ago(d),source:'manual'}));
  s.templates=[{id:id(),kind:'expense',name:'Kahve',amount:120,category:'food',accountId:cc.id,merchant:'Kahve Dünyası'},{id:id(),kind:'expense',name:'Simit',amount:25,category:'food',accountId:cash.id,merchant:'Simit Sarayı'},
    {id:id(),kind:'expense',name:'Kart dolum',amount:200,category:'transport',accountId:chk.id,merchant:'İstanbulkart dolum'}];
  /* geçmiş ekstreleri vadesiz hesaptan öde (son ödeme gününden 2 gün önce) */
  const o=D.openIdx(cc.credit);
  for(const card of [cc,vc])for(let i=o-4;i<=o-2;i++){const st=D.stmtAt(s,card.id,i);if(st.total>0)s.transactions.push({id:id(),kind:'payment',accountId:chk.id,toAccountId:card.id,amount:st.total,date:U.addDays(st.due,-2),merchant:'Kart ödemesi',source:'manual'})}
  return{...s,transactions:[...s.transactions]}}};   // yeni referans → hesap önbelleği temiz başlar

App.init();
