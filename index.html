.zr-p .zr-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#e30a17,#7a0010)}
.zr-p .zr-ic .i{width:19px;height:19px}
.zr-p.on{box-shadow:inset 0 0 0 2px #e30a17}
.zr-lh{text-align:left;color:var(--blue)}
.zr-links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px}
.zr-links .chip{display:inline-flex;align-items:center;gap:6px}.zr-links .chip .i{width:15px;height:15px}
.zr-sub{color:var(--text2)}

/* Ekstre özeti */
.fut-hero .hero-amount{margin:4px 0 2px}
.fut-bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:14px}
.fut-b{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;font-size:10.5px;color:var(--text2);padding:0}
.fut-b i{width:100%;max-width:30px;border-radius:7px 7px 4px 4px;background:color-mix(in srgb,var(--blue) 55%,transparent);display:block;transition:height .5s var(--ease)}
.fut-b.now i{background:var(--blue)}.fut-b.due i{background:var(--orange)}
.fut-m{margin-top:10px}
.fut-cards{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--text2)}
.fut-cards span{display:inline-flex;align-items:center;gap:6px}.fut-cards i{width:9px;height:9px;border-radius:50%;display:inline-block}
.fut-cards b{color:var(--text)}

/* Bulut durumu */
.cloud-st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;flex-shrink:0}
.cloud-st i{width:7px;height:7px;border-radius:50%;display:inline-block}
.fut-m .stmt-top b.num{white-space:nowrap}.fut-m .stmt-top>div:first-child{min-width:0}

/* ===================== v10 ===================== */
.recon-line{display:flex;justify-content:space-between;align-items:center;width:100%;margin:10px 0 2px;padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:600;text-align:left}
.recon-line.ok{background:rgba(48,209,88,.12);color:var(--green)}.recon-line.warn{background:rgba(255,159,10,.14);color:var(--orange)}
.recon-line span{opacity:.8;font-weight:500;white-space:nowrap}
.pts-hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px}
.pts-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;background:linear-gradient(135deg,#30d158,#0a7d32);flex-shrink:0}
.pts-n{font-size:28px;font-weight:800;letter-spacing:-.4px}
.pts-chip{color:var(--green)}
.fx-toggle{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px auto 0;font-size:13px;font-weight:600;color:var(--blue);padding:6px 12px;border-radius:14px;background:color-mix(in srgb,var(--blue) 12%,transparent)}
.fx-toggle .i{width:16px;height:16px}
.fx-in{padding:10px 12px 12px;border-radius:18px;margin-top:10px}
.grid3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px}.grid3 .field{min-width:0}.grid3 .input{min-width:0;width:100%}
.dcard .cc-foot span:last-child{letter-spacing:2px;font-weight:700;opacity:.8}
.debit-tile .ic{border-radius:9px}
.fx-toggle{min-height:36px;padding:8px 14px}
.fx-in .link.xs{min-height:34px;padding:8px 4px;display:inline-flex;align-items:center}
.recon-list .mid span{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}.recon-list .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* =====================================================================
   v11 · GlassWorkspace — photo backdrop, glass chrome, rail + main panel, dock
   ===================================================================== */
html{background:var(--background);color-scheme:light dark}
html,body{overflow-x:hidden;overflow-x:clip}
html.wide .wgrid .strip,html.wide .wgrid .carousel,html.wide .wgrid .chips,html.wide .wgrid .goal-row{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
[data-theme=light]{color-scheme:light}[data-theme=dark]{color-scheme:dark}
body{background:transparent;letter-spacing:-.012em;font-variant-numeric:tabular-nums}
::selection{background:color-mix(in srgb,var(--primary) 26%,transparent)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--foreground) 22%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--foreground) 20%,transparent);border-radius:10px;border:3px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input,textarea{caret-color:var(--primary)}
.ambient,#lock .ambient{display:none}

/* Backdrop: real photo + shade; mood colour bleeds in softly when "Duruma göre renk" is on */
.gw-bg{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;
  background:radial-gradient(120% 90% at 15% 0%,#f0dcc0 0%,transparent 60%),radial-gradient(90% 80% at 100% 100%,#d9b48a 0%,transparent 60%),#e8d6c0}
[data-theme=dark] .gw-bg{background:radial-gradient(120% 90% at 15% 0%,#6a4628 0%,transparent 60%),radial-gradient(90% 80% at 100% 100%,#4a2e18 0%,transparent 60%),#24170e}
.gw-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;filter:sepia(.28) saturate(1.1)}
[data-theme=dark] .gw-bg img{filter:sepia(.45) saturate(1.15) brightness(.78)}
.gw-bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(110% 70% at 90% 0%,color-mix(in srgb,var(--amb1,transparent) 16%,transparent),transparent 62%),var(--gw-shade)}

/* Glass material: chrome surfaces only */
.gw-top,.gw-rail,#screen::before,.tabbar,.dock-add,.gw-pop,.toast,.chat-bar,.w-editbar,#ptr,#navbar{
  background:linear-gradient(var(--gw-tint-l),var(--gw-tint-l)),var(--glass-strong);
  -webkit-backdrop-filter:blur(var(--gw-blur)) saturate(var(--gw-saturation));backdrop-filter:blur(var(--gw-blur)) saturate(var(--gw-saturation));
  box-shadow:var(--gw-ring),0 20px 52px -25px var(--drop)}
.sheet,.ctx,.gw-pop,.toast{background:linear-gradient(var(--gw-tint-l),var(--gw-tint-l)),var(--sheet)}
.sheet,.ctx{-webkit-backdrop-filter:blur(calc(var(--gw-blur) + 18px)) saturate(var(--gw-saturation));backdrop-filter:blur(calc(var(--gw-blur) + 18px)) saturate(var(--gw-saturation));
  box-shadow:var(--gw-ring),0 30px 70px -28px var(--drop)}
#navbar{box-shadow:var(--gw-ring)}
html.solid .gw-top,html.solid .gw-rail,html.solid #screen::before,html.solid .gw-pop{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

/* Shell */
body{padding:calc(var(--sat) + 8px) 0 calc(var(--sab) + var(--dock-h) + 44px)}
.gw-shell{position:relative}
#screen{position:relative;isolation:isolate;max-width:none;margin:0 6px;padding:20px var(--pad) 24px;border-radius:var(--r-xl)}
#screen::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none}
.gw-rail{display:none}

/* Top bar */
.gw-top{position:relative;z-index:46;height:62px;border-radius:20px;margin:0 6px 10px;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px}
.gw-brand{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:1}
.gw-mark{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:var(--primary-foreground);background:var(--primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.gw-mark svg.i{width:17px;height:17px;stroke-width:1.8}
.gw-name{font-weight:600;font-size:15px;white-space:nowrap}
.gw-div{width:1px;height:18px;background:var(--border);flex-shrink:0}
.gw-kind{color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw-tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.gw-tb{position:relative;height:38px;min-width:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0;
  color:var(--text);font-size:13px;font-weight:500;transition:background .2s,color .2s,transform .3s var(--spring)}
.gw-tb svg.i{width:18px;height:18px;stroke-width:1.7}
.gw-tb:hover{background:var(--fill)}
.gw-tb:active{transform:scale(.94)}
.gw-tb.on{background:color-mix(in srgb,var(--secondary) 70%,transparent)}
.gw-tb.has-lbl{border-radius:9px}
.gw-tb .lbl{display:none}
.gw-dot{position:absolute;top:7px;right:9px;width:5px;height:5px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--surface) 70%,transparent)}
.gw-dot[hidden]{display:none}
.gw-av{width:32px;height:32px;min-width:32px;margin-left:2px;font:600 13px/1 Georgia,"Times New Roman",serif;letter-spacing:0;color:var(--primary-foreground);background:var(--primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.gw-av:hover{background:var(--primary)}
@media (max-width:479px){.gw-div,.gw-kind{display:none}.gw-tools{gap:2px}}
@media (min-width:700px){.gw-tb .lbl{display:inline}.gw-tb.has-lbl{padding:8px 10px;height:34px}.gw-tb{height:34px;min-width:34px}.gw-av{width:30px;height:30px;min-width:30px;font-size:12px}.gw-tools{gap:10px}.gw-top{padding:0 20px}}

/* Popover (Cam görünümü / Bildirimler) */
.gw-pop-bd{position:fixed;inset:0;z-index:240}
.gw-pop{position:fixed;z-index:241;right:8px;width:min(352px,calc(100vw - 16px));max-height:calc(100dvh - 120px);overflow-y:auto;border-radius:22px;padding:18px;
  animation:gwPop .32s var(--ease);transform-origin:top right;overscroll-behavior:contain}
@keyframes gwPop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.gw-pop h3{font-size:16px;font-weight:600}
.gw-pop .gw-pop-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.gw-pop .gw-pop-s{font-size:13px;color:var(--text2);margin-bottom:14px}
.gw-x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--text2);background:var(--fill)}
.gw-x svg.i{width:16px;height:16px}
.gw-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border-radius:14px;background:var(--fill)}
.gw-presets button{height:34px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--text2);transition:background .2s,color .2s}
.gw-presets button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 14px -8px var(--drop)}
.gw-sl{display:block;margin-top:16px}
.gw-sl-h{display:flex;justify-content:space-between;font-size:13.5px;font-weight:500;margin-bottom:8px}
.gw-sl-h output{color:var(--text2);font-variant-numeric:tabular-nums}
.gw-sl input[type=range]{width:100%;height:22px;-webkit-appearance:none;appearance:none;background:none;cursor:pointer}
.gw-sl input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--primary) var(--p,50%),var(--fill) var(--p,50%))}
.gw-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-8.5px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
.gw-sl input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--fill)}
.gw-sl input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--primary)}
.gw-sl input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.gw-tint{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13.5px;font-weight:500}
.gw-tint label{display:flex;align-items:center;gap:8px;color:var(--text2);font-variant-numeric:tabular-nums;cursor:pointer}
.gw-tint input[type=color]{width:34px;height:34px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.gw-tint input[type=color]::-webkit-color-swatch-wrapper{padding:0}.gw-tint input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.gw-reset{width:100%;margin-top:18px;height:42px;border-radius:14px;font-size:14.5px;font-weight:600;color:var(--text);background:var(--fill)}
.gw-reset:hover{background:color-mix(in srgb,var(--foreground) 10%,transparent)}
.gw-nl{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.gw-ni{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 8px;border-radius:14px}
.gw-ni:hover{background:var(--fill)}
.gw-ni .gw-chip{width:34px;height:34px}
.gw-ni b{display:block;font-size:14px;font-weight:600}.gw-ni p{font-size:13px;color:var(--text2);line-height:1.38;margin-top:2px}
.gw-ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 8px 8px;color:var(--text2);font-size:13.5px}
.gw-ok .gw-chip{width:44px;height:44px;margin-bottom:4px}
.gw-ok b{color:var(--text);font-size:15px;font-weight:600}

/* Chips used by panels (round, tinted) */
.gw-chip{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--primary);background:var(--primary-soft)}
.gw-chip svg.i{width:18px;height:18px;stroke-width:1.7}
.sev-danger.gw-chip{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.sev-warn.gw-chip{color:var(--orange);background:color-mix(in srgb,var(--orange) 15%,transparent)}
.sev-good.gw-chip{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}

/* View heading */
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;padding:2px 2px 0;margin-bottom:22px}
.topbar .t-sub{font-size:13px;font-weight:400;color:var(--text2);margin-bottom:4px}
.topbar h1,.page-title{font-size:clamp(27px,2.3vw,31px);font-weight:500;letter-spacing:-.035em;line-height:1.1}
.top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.gw-date{font-size:12px;color:var(--text2);margin-right:6px;white-space:nowrap;display:none}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--glass)!important;box-shadow:var(--gw-card-ring)}
.icon-btn svg.i{width:19px;height:19px;stroke-width:1.7}
.gw-btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px 0 13px;border-radius:20px;font-size:14px;font-weight:500;background:var(--glass);box-shadow:var(--gw-card-ring);white-space:nowrap}
.gw-btn svg.i{width:17px;height:17px;stroke-width:1.7}
.gw-head-search{align-items:center}
#screen>.gw-flow{margin-top:16px}
.gw-pop:focus{outline:none}
@media (max-width:699px){.gw-btn .lbl{display:none}.gw-btn{width:40px;padding:0;justify-content:center}}
.gw-head-search .top-actions{flex:1 1 100%}
.gw-head-search .search{flex:1;margin:0;min-width:0}
.page-head{min-height:40px}
.back,.head-btn{color:var(--primary);font-weight:500}
.page-sub{font-size:14px;margin-top:2px}

/* Section rhythm inside the main panel */
.section{margin-top:28px}
.section-head{margin:0 2px 12px}
.section-head h2{font-size:17px;font-weight:600;letter-spacing:-.015em}
.section-head button{color:var(--primary);font-size:14px;font-weight:500}
.muted{color:var(--text2)}.faint{color:var(--text3)}
.pos{color:var(--primary)}.neg{color:var(--red)}.warn{color:var(--orange)}

/* Panels (lighter cards) */
.gw-panel{padding:21px;border-radius:17px}
.gw-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px;font-size:12px;color:var(--text2);min-height:22px}
.gw-title h2{font-size:14px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.gw-title>svg.i{width:17px;height:17px;opacity:.65;color:var(--text)}
.gw-title>button{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--text2);padding:6px 0 6px 8px}
.gw-title>button:hover{color:var(--text)}
.gw-title>button svg.i{width:13px;height:13px}
.gw-ps{font-size:11px;color:var(--text3);margin-left:auto;align-self:flex-end}
.gw-seg{display:inline-flex;gap:3px;padding:3px;border-radius:8px;background:color-mix(in srgb,var(--muted) 25%,transparent);flex-shrink:0}
.gw-seg button{padding:5px 9px;border-radius:6px;font-size:11px;font-weight:500;color:var(--text2);transition:background .2s,color .2s}
.gw-seg button:hover{color:var(--text)}
.gw-seg button.on{background:color-mix(in srgb,var(--card) 85%,transparent);color:var(--text);box-shadow:0 2px 4px rgba(0,0,0,.12)}

/* Balance panel */
.gw-bal{display:flex;flex-direction:column}
.hero{padding:21px;border-radius:17px;margin-top:0;background:var(--glass);overflow:visible}
.hero::after{display:none}
.hero-label{font-size:13px;font-weight:500;color:var(--text2)}
.hero-amount{font-size:clamp(34px,3.15vw,43px);font-weight:500;letter-spacing:-.04em;margin:0 0 10px;line-height:1.05}
.hero-amount .dec{font-size:.55em;font-weight:500;color:var(--text2);letter-spacing:-.02em}
.gw-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--text2)}
.gw-meta .mood{margin-left:auto}
.gw-chg{display:inline-flex;align-items:center;padding:3px 5px;border-radius:5px;font-size:11px;font-weight:600;background:var(--primary-soft);color:var(--primary)}
.gw-chg.down{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.gw-chg.flat{background:var(--fill);color:var(--text2)}
.gw-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:16px;font-size:12px;color:var(--text2)}
.gw-foot b{color:var(--text);font-weight:500}
.gw-acc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:auto;padding-top:28px}
.gw-box{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--secondary) 45%,transparent)}
.gw-box svg.i{width:17px;height:17px;stroke-width:1.7}
.gw-acc .mid{flex:1;min-width:0}
.gw-acc .mid b{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gw-acc .mid small{display:block;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.gw-arrow{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:color-mix(in srgb,var(--secondary) 45%,transparent);color:var(--text);transition:background .2s,transform .3s var(--spring)}

let PRIVACY=false;   // gizlilik modu: tüm tutarlar •••• gösterilir

/* ===================== core/utils ===================== */
const U={
  uid:()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4),
  esc:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  r2:n=>Math.round((+n||0)*100)/100,
  p2:n=>String(n).padStart(2,'0'),
  sym:cur=>({TRY:'₺',USD:'$',EUR:'€',XAU:'gr'}[cur]||cur||'₺'),
  money(n,{dec=true,sign=false,cur='TRY',raw=false}={}){
    const sym=U.sym(cur),suffix=cur==='TRY'||cur==='XAU'||!cur;
    if(PRIVACY&&!raw)return suffix?'•••• '+sym:sym+'••••';
    n=U.r2(n);const neg=n<0,a=Math.abs(n);
    const s=a.toLocaleString('tr-TR',{minimumFractionDigits:dec&&a%1?2:0,maximumFractionDigits:dec?2:0});
    return (neg?'−':sign&&n>0?'+':'')+(suffix?s+' '+sym:sym+s)},
  bigMoney(n){if(PRIVACY)return `<span class="num">••••</span><span class="dec"> ₺</span>`;
    n=U.r2(n);const neg=n<0,a=Math.abs(n),i=Math.floor(a),d=Math.round((a-i)*100);
    return `<span class="num">${neg?'−':''}${i.toLocaleString('tr-TR')}</span><span class="dec">${d?','+U.p2(d):''} ₺</span>`},
  short:n=>PRIVACY?'•':Math.abs(n)>=1000?(n/1000).toLocaleString('tr-TR',{maximumFractionDigits:1})+'k':String(Math.round(n)),
  num:n=>String(U.r2(n)).replace('.',','),
  parseNum(s){s=String(s??'').trim().replace(/\s|₺|\$|€/g,'');if(!s)return NaN;
    if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');

  dim:(y,m)=>new Date(y,m+1,0).getDate(),
  iso:d=>d.getFullYear()+'-'+U.p2(d.getMonth()+1)+'-'+U.p2(d.getDate()),
  today:()=>U.iso(new Date()),
  parse(s){const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d||1)},
  addMonths(s,k){const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+k,1);

  daysUntil(s){const t=new Date();t.setHours(0,0,0,0);return Math.round((U.parse(s)-t)/864e5)},
  monthStart:(y,m)=>U.iso(new Date(y,m,1)),

  mon:i=>U.MONTHS[i].slice(0,3),
  fmtDate(s,long){const d=U.parse(s),y=new Date().getFullYear();
    return d.getDate()+' '+(long?U.MONTHS[d.getMonth()]:U.mon(d.getMonth()))+(d.getFullYear()!==y||long==='y'?' '+d.getFullYear():'')},

  dayHeader(s){const n=U.daysUntil(s),d=U.parse(s);

  dayOf(n){const o=n%10,t=n%100;const e=o?{1:'i',2:'si',3:'ü',4:'ü',5:'i',6:'sı',7:'si',8:'i',9:'u'}[o]:{10:'u',20:'si',30:'u'}[t];return n+"'"+e},
  /* durum (state) referansına bağlı çok girişli önbellek: aynı state + aynı argümanlar → aynı sonuç */

const SCHEMA_VERSION=3;
function emptyState(){return{
  version:SCHEMA_VERSION,
  settings:{name:'Yusuf',theme:'dark',rates:{USD:49.55,EUR:55.6,XAU:6560},aiModel:'gemini-3.8-flash',privacy:false,autoRates:true,subIgnore:[],chatConsent:false},   // kurlar ilk açılışta internetten güncellenir
  security:{pinHash:'',pinLen:4,bioId:'',lockAfter:1},
  /* Hesaplar: {id,type,name,bank,color,currency,opening,overdraft?, credit?:{limit,cutDay,dueDay,sharedWith,minRate,contractRate,lateRate}} */
  accounts:[],
  /* İşlemler: {id,kind,accountId,toAccountId?,toAmount?,amount,date,category,merchant,note,installments,source,
               refOf?,closedIdx?,loanId?,goalId?,dir?,recurringId?,attachmentId?,items?,vat?,warrantyMonths?} */
  transactions:[],
  budgets:[],      // {id,category,limit}
  recurring:[],    // {id,type:'expense'|'income',name,amount,day,category,accountId,icon,paid:{'YYYY-MM':txId}}
  loans:[],        // {id,name,bank,monthly,count,firstDate,paidBefore,accountId,principal}
  goals:[],        // {id,name,icon,target,deadline,color}
  templates:[],    // {id,name,amount,category,accountId,merchant}
  categories:[],   // özel kategoriler {id,name,icon,color,income}
  debts:[],        // borç/alacak {id,dir:'lent'|'owe',person,amount,date,due,note,linkTx}
  paidStatements:{},// elle "ödendi" işaretlenen ekstreler {"accId|idx":true}
  ai:{pending:{},errors:{},coach:null,calls:0}
}}

function reducer(s,a){
  const up=(list,item)=>list.some(x=>x.id===item.id)?list.map(x=>x.id===item.id?item:x):[...list,item];
  switch(a.type){
    case 'upsert':return{...s,[a.col]:up(s[a.col],a.item)};
    case 'remove':{
      if(a.col==='accounts'){const id=a.id;return{...s,
        accounts:s.accounts.filter(x=>x.id!==id).map(x=>x.credit&&x.credit.sharedWith===id?{...x,credit:{...x.credit,sharedWith:''}}:x),
        transactions:s.transactions.filter(t=>t.accountId!==id&&!(t.kind==='payment'&&t.toAccountId===id)).map(t=>t.toAccountId===id?{...t,toAccountId:''}:t),
        recurring:s.recurring.map(r=>r.accountId===id?{...r,accountId:''}:r),
        templates:s.templates.filter(t=>t.accountId!==id),
        loans:s.loans.map(l=>l.accountId===id?{...l,accountId:''}:l),
        paidStatements:Object.fromEntries(Object.entries(s.paidStatements).filter(([k])=>!k.startsWith(id+'|')))}}
      if(a.col==='transactions'){const drop=new Set([a.id,...s.transactions.filter(t=>t.refOf===a.id).map(t=>t.id)]);
        return{...s,transactions:s.transactions.filter(t=>!drop.has(t.id)),
          recurring:s.recurring.map(r=>({...r,paid:Object.fromEntries(Object.entries(r.paid||{}).filter(([,v])=>!drop.has(v)))}))}}
      if(a.col==='debts')return{...s,debts:s.debts.filter(x=>x.id!==a.id),transactions:s.transactions.filter(t=>t.debtId!==a.id)};
      if(a.col==='loans')return{...s,loans:s.loans.filter(x=>x.id!==a.id),transactions:s.transactions.filter(t=>t.loanId!==a.id)};
      if(a.col==='goals')return{...s,goals:s.goals.filter(x=>x.id!==a.id),transactions:s.transactions.filter(t=>t.goalId!==a.id)};
      if(a.col==='categories')return{...s,categories:s.categories.filter(c=>c.id!==a.id),
        transactions:s.transactions.map(t=>t.category===a.id?{...t,category:'other'}:t),budgets:s.budgets.filter(b=>b.category!==a.id)};
      return{...s,[a.col]:s[a.col].filter(x=>x.id!==a.id)}}
    case 'batch':return a.actions.reduce(reducer,s);
    case 'statement/toggle':{const p={...s.paidStatements};if(p[a.key])delete p[a.key];else p[a.key]=true;return{...s,paidStatements:p}}
    /* AI asenkron görev yaşam döngüsü: start → success | error */
    case 'ai/start':return{...s,ai:{...s.ai,pending:{...s.ai.pending,[a.task]:true},errors:{...s.ai.errors,[a.task]:null}}};
    case 'ai/success':{const ai={...s.ai,pending:{...s.ai.pending,[a.task]:false},calls:(s.ai.calls||0)+1,lastAt:new Date().toISOString()};
      if(a.task==='coach')ai.coach={at:new Date().toISOString(),model:s.settings.aiModel,data:a.data};return{...s,ai}}
    case 'ai/error':return{...s,ai:{...s.ai,pending:{...s.ai.pending,[a.task]:false},errors:{...s.ai.errors,[a.task]:a.error}}};
    case 'settings/update':return{...s,settings:{...s.settings,...a.payload}};
    case 'security/update':return{...s,security:{...s.security,...a.payload}};
    case 'state/replace':return a.payload;
    default:return s}
}

const Store=(()=>{
  let state;const subs=new Set();
  return{
    init(s){state=s},
    get:()=>state,
    dispatch(action){const next=reducer(state,action);if(next===state)return;state=next;Persist.save(state);subs.forEach(fn=>fn(state,action))},
    subscribe(fn){subs.add(fn);return()=>subs.delete(fn)}
  }})();

/* ===================== data/persist ===================== */
const Persist={
  KEY:'cuzdan_v2',
  load(){
    try{const s=JSON.parse(localStorage.getItem(this.KEY));if(s&&s.version)return this.migrate(s)}catch(e){}
    return this.fromTaksitlerim()||emptyState()},
  save(s){try{localStorage.setItem(this.KEY,JSON.stringify(s))}catch(e){Toast.show('⚠️ Kaydedilemedi: tarayıcı hafızası dolu ya da kapalı')}},
  /* Şema göçü: v2 → v3 (işlem türü 'kind', kredi/kumbara/şablon/kategori koleksiyonları, güvenlik) */
  migrate(s){const b=emptyState();
    const o={...b,...s,
      settings:{...b.settings,...(s.settings||{}),rates:{...b.settings.rates,...((s.settings||{}).rates||{})}},
      security:{...b.security,...(s.security||{})},
      ai:{...b.ai,...(s.ai||{}),pending:{}}};   // yarım kalmış AI istekleri sıfırlanır
    ['accounts','transactions','budgets','recurring','loans','goals','templates','categories','debts'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
    if(!o.paidStatements||typeof o.paidStatements!=='object')o.paidStatements={};
    o.transactions=o.transactions.map(t=>{const x=t.kind?{...t}:{...t,kind:t.type==='income'?'income':'expense'};delete x.type;return x});
    o.recurring=o.recurring.map(r=>({type:'expense',paid:{},...r}));
    o.accounts=o.accounts.map(a=>a.type==='credit'?{...a,credit:{minRate:20,contractRate:'',lateRate:'',sharedWith:'',...a.credit}}:{overdraft:0,...a});
    o.version=SCHEMA_VERSION;return o},
  /* Taksitlerim (v1) verisini otomatik taşı */
  fromTaksitlerim(){
    try{const o=JSON.parse(localStorage.getItem('taksitlerim_v1'));if(!o||!Array.isArray(o.cards)||!o.purchases?.length)return null;
      const map={'Elektronik':'electronics','Giyim':'clothing','Market':'market','Yeme-İçme':'food','Abonelik':'subscription','Ulaşım':'transport','Eğlence':'fun','Sağlık':'health','Eğitim':'education'};
      const s=emptyState();
      s.accounts=o.cards.map((c,i)=>({id:c.id,type:'credit',name:c.name,bank:'',color:i,currency:'TRY',opening:0,
        credit:{limit:+c.limit||0,cutDay:c.cutDay||15,dueDay:c.dueDay||25,sharedWith:c.sharedWith||'',minRate:20,contractRate:'',lateRate:''}}));
      s.transactions=o.purchases.map(p=>({id:p.id,kind:'expense',accountId:p.cardId,amount:p.total,date:p.date,category:map[p.cat]||'other',merchant:p.name,note:'',installments:p.count||1,source:'manual'}));
      s.paidStatements={...(o.paid||{})};s._migrated=true;return s}catch(e){return null}}
};

/* ---------- 30_domain.js ---------- */

/* =====================================================================
   domain · Finansal hesap motoru
   Tüm fonksiyonlar saf: (state, ...) → sonuç. State referansına göre önbelleklenir.
   ===================================================================== */
const D={};

/* ---------- Kredi kartı ekstre takvimi ----------
   Ekstre indeksi = kesim ayının (yıl*12+ay) değeri. Kesim günü dahil harcama o ekstreye düşer. */
D.ym=i=>[Math.floor(i/12),i%12];
D.cutDate=(c,i)=>{const[y,m]=D.ym(i);return U.iso(new Date(y,m,Math.min(c.cutDay,U.dim(y,m))))};
D.dueDate=(c,i)=>{let[y,m]=D.ym(i);if(c.dueDay<=c.cutDay){m++;if(m>11){m=0;y++}}return U.iso(new Date(y,m,Math.min(c.dueDay,U.dim(y,m))))};
D.stmtIdx=(c,dateStr)=>{const[y,m,d]=dateStr.split('-').map(Number);let i=y*12+(m-1);if(d>Math.min(c.cutDay,U.dim(y,m-1)))i++;return i};
D.openIdx=c=>D.stmtIdx(c,U.today());
D.stmtName=i=>{const[y,m]=D.ym(i);return U.MONTHS[m]+(y!==new Date().getFullYear()?' '+y:'')};

D.account=(s,id)=>id?s.accounts.find(a=>a.id===id):undefined;
D.isCredit=(s,id)=>D.account(s,id)?.type==='credit';
D.limitRoot=(s,acc)=>{const r=acc.credit?.sharedWith&&D.account(s,acc.credit.sharedWith);return r&&!r.credit?.sharedWith?r:acc};
D.tx=(s,id)=>s.transactions.find(t=>t.id===id);
D.toTRY=(s,amount,cur)=>!cur||cur==='TRY'?amount:amount*(+s.settings.rates[cur]||0);

/* ---------- Kart satırları: taksitler + iade alacakları ---------- */
D.refundMap=U.memo(s=>{const m={};s.transactions.forEach(t=>{if(t.kind==='refund'&&t.refOf)(m[t.refOf]=m[t.refOf]||[]).push(t)});return m});
D.cardLines=U.memo(s=>{const out=[],rm=D.refundMap(s);
  for(const t of s.transactions){const acc=D.account(s,t.accountId);if(!acc||acc.type!=='credit')continue;const c=acc.credit;
    if(t.kind==='expense'){
      const n=Math.max(1,t.installments|0),f=t.billIdx!=null?t.billIdx:D.stmtIdx(c,t.date),parts=U.split(t.amount,n),refs=rm[t.id]||[];
      const full=refs.find(r=>r.amount>=t.amount-0.01),r=full?D.stmtIdx(c,full.date):Infinity;let billed=0;
      parts.forEach((amount,k)=>{let idx=f+k;if(t.closedIdx!=null&&idx>t.closedIdx)idx=Math.max(f,t.closedIdx);
        if(full&&idx>=r)return;              // tam iade: henüz faturalanmamış taksitler iptal
        if(full)billed+=amount;out.push({kind:'inst',tx:t,k,n,amount,accId:acc.id,idx})});
      if(full&&billed>0)out.push({kind:'refund',tx:full,orig:t,amount:-U.r2(billed),accId:acc.id,idx:r});   // faturalanmış kısım alacak olarak döner
      refs.filter(x=>x!==full).forEach(x=>out.push({kind:'refund',tx:x,orig:t,amount:-x.amount,accId:acc.id,idx:D.stmtIdx(c,x.date)}))}
    else if(t.kind==='refund'&&!(t.refOf&&D.tx(s,t.refOf)))out.push({kind:'refund',tx:t,amount:-t.amount,accId:acc.id,idx:t.billIdx!=null?t.billIdx:D.stmtIdx(c,t.date)})}
  return out});

/* ---------- Ekstreler + ödeme dağıtımı (FIFO) ----------
   Ödemeler en eski ekstreden başlayarak kapatılır; fazlası açık dönem/gelecek taksitlere sayılır. */
D.statements=U.memo((s,accId)=>{const acc=D.account(s,accId),c=acc.credit,o=D.openIdx(c);
  const by={};D.cardLines(s).forEach(l=>{if(l.accId===accId)(by[l.idx]=by[l.idx]||[]).push(l)});
  const idxs=new Set(Object.keys(by).map(Number));idxs.add(o);idxs.add(o-1);
  const list=[...idxs].sort((a,b)=>a-b).map(i=>{const lines=(by[i]||[]).sort((x,y)=>x.tx.date.localeCompare(y.tx.date));
    return{idx:i,lines,total:U.r2(lines.reduce((a,l)=>a+l.amount,0)),paid:0,flag:!!s.paidStatements[accId+'|'+i]}});
  list.forEach(st=>{if(st.flag)st.paid=Math.max(0,st.total)});
  const payments=s.transactions.filter(t=>t.kind==='payment'&&t.toAccountId===accId).sort((a,b)=>a.date.localeCompare(b.date));
  /* tarih sırasıyla dağıtılır: kesimden önce yapılan ödemeler asgariyi (bankadaki gibi dönem borcunun %'si) düşürür */
  const alloc=(amt,d)=>{for(const st of list){if(amt<=0)break;if(st.total<=0)continue;const take=Math.min(U.r2(st.total-st.paid),amt);if(take<=0)continue;
    st.paid=U.r2(st.paid+take);if(d<=D.cutDate(c,st.idx))st.paidAtCut=U.r2((st.paidAtCut||0)+take);amt=U.r2(amt-take)}return amt};
  let pool=0;
  list.forEach(st=>{if(st.total<0&&!st.flag)pool=U.r2(pool+alloc(-st.total,D.cutDate(c,st.idx)))});        // eksi bakiyeli (iade) ekstreler alacak ekler
  payments.forEach(t=>{pool=U.r2(pool+alloc(t.amount,t.date))});
  const rate=+c.minRate||20;
  list.forEach(st=>{st.remaining=U.r2(Math.max(0,st.total-st.paid));st.cut=D.cutDate(c,st.idx);st.due=D.dueDate(c,st.idx);
    const pre=st.flag?0:st.paidAtCut||0;st.minPay=U.r2(Math.max(0,st.total-pre)*rate/100);st.minLeft=U.r2(Math.max(0,Math.min(st.remaining,st.minPay-(st.paid-pre))));
    const late=st.idx<o&&U.daysUntil(st.due)<0;
    st.status=st.idx>o?'future':st.idx===o?'open':st.total<=0.009?'empty':st.remaining<=0.009?'paid':late?(st.minLeft<=0.009?'partial-late':'overdue'):(st.paid-pre>0.009?'partial':'due');
    st.interest=null;
    if(late&&st.remaining>0){const days=-U.daysUntil(st.due),r=st.minLeft>0?+c.lateRate:+c.contractRate;st.lateDays=days;
      if(r>0)st.interest=U.r2(st.remaining*r/100*days/30)}});
  return{list,open:o,credit:pool,payments}});
D.stmtAt=(s,accId,idx)=>{const st=D.statements(s,accId).list.find(x=>x.idx===idx);if(st)return st;const c=D.account(s,accId).credit;
  return{idx,lines:[],total:0,paid:0,remaining:0,minPay:0,minLeft:0,cut:D.cutDate(c,idx),due:D.dueDate(c,idx),status:idx>D.openIdx(c)?'future':'empty'}};
D.ST={future:['Gelecek','blue'],open:['Dönem açık','blue'],empty:['Borç yok','green'],paid:['Ödendi','green'],partial:['Kısmi ödendi','orange'],
  due:['Ödenecek','orange'],overdue:['Gecikti','red'],'partial-late':['Asgari ödendi · faiz işler','orange']};

/* ---------- Kart özeti ---------- */
D.cardSummary=U.memo((s,accId)=>{
  const acc=D.account(s,accId),root=D.limitRoot(s,acc),c=acc.credit;
  const group=s.accounts.filter(a=>a.type==='credit'&&D.limitRoot(s,a).id===root.id);
  let used=0,credit=0;group.forEach(a=>{const st=D.statements(s,a.id);used+=st.list.reduce((x,y)=>x+y.remaining,0);credit+=st.credit});
  used=U.r2(used);credit=U.r2(credit);
  const st=D.statements(s,accId),o=st.open,last=D.stmtAt(s,accId,o-1),open=D.stmtAt(s,accId,o);
  const limit=+root.credit.limit||0,overdue=st.list.filter(x=>x.idx<o&&x.remaining>0);
  const own=U.r2(st.list.reduce((x,y)=>x+y.remaining,0));
  const active=new Set(D.cardLines(s).filter(l=>l.accId===accId&&l.kind==='inst'&&l.n>1&&l.idx>=o).map(l=>l.tx.id)).size;
  return{acc,root,shared:root.id!==acc.id,limit,used:U.r2(used-credit),own,available:U.r2(limit-used+credit),usage:limit?Math.max(0,used-credit)/limit:0,credit,
    open:o,openTotal:open.total,openRemaining:open.remaining,openCut:open.cut,openDue:open.due,
    last:o-1,lastTotal:last.total,lastRemaining:last.remaining,lastPaid:last.remaining<=0.009,lastDue:last.due,lastStatus:last.status,
    minPay:last.minLeft,minTotal:last.minPay,dueNow:U.r2(overdue.reduce((a,x)=>a+x.remaining,0)),activeInstallments:active,
    interest:overdue.reduce((a,x)=>a+(x.interest||0),0)||null}});

/* ---------- Nakit / vadesiz / döviz bakiyesi ---------- */
D.effect=(t,accId)=>{let v=0;
  if(t.accountId===accId){switch(t.kind){
    case 'income':case 'refund':v+=t.amount;break;
    case 'goal':v+=t.dir==='out'?t.amount:-t.amount;break;
    case 'debt':v+=t.dir==='in'?t.amount:-t.amount;break;
    default:v-=t.amount}}
  if(t.toAccountId===accId&&t.kind==='transfer')v+=(t.toAmount??t.amount);
  return v};
D.balance=U.memo((s,accId)=>{const a=D.account(s,accId);let b=+a.opening||0;for(const t of s.transactions)b+=D.effect(t,accId);return U.r2(b)});
D.ledger=U.memo((s,accId)=>{const a=D.account(s,accId);let b=+a.opening||0;
  const list=s.transactions.map((t,i)=>({t,i})).filter(({t})=>t.accountId===accId||t.toAccountId===accId)
    .sort((x,y)=>x.t.date.localeCompare(y.t.date)||x.i-y.i).map(({t})=>{const d=D.effect(t,accId);b=U.r2(b+d);return{t,delta:d,bal:b}});
  return list.reverse()});
D.balanceSeries=U.memo((s,accId,days=90)=>{const a=D.account(s,accId),T=U.today(),start=U.addDays(T,-days+1);let b=+a.opening||0;const byDay={};
  for(const t of s.transactions){const d=D.effect(t,accId);if(!d)continue;if(t.date<start)b+=d;else byDay[t.date]=(byDay[t.date]||0)+d}
  const out=[];for(let i=0;i<days;i++){const d=U.addDays(start,i);b+=byDay[d]||0;out.push({label:d,value:U.r2(b)})}return out});

/* ---------- Kumbaralar ---------- */
D.goalSaved=U.memo((s,gid)=>U.r2(s.transactions.filter(t=>t.kind==='goal'&&t.goalId===gid).reduce((a,t)=>a+(t.dir==='out'?-t.amount:t.amount),0)));
D.goal=U.memo((s,gid)=>{const g=s.goals.find(x=>x.id===gid);if(!g)return null;const saved=D.goalSaved(s,gid),left=Math.max(0,U.r2(g.target-saved));
  let months=null,perMonth=null;if(g.deadline){const t=new Date(),d=U.parse(g.deadline);months=Math.max(1,(d.getFullYear()-t.getFullYear())*12+d.getMonth()-t.getMonth());perMonth=U.r2(left/months)}
  return{...g,saved,left,pct:g.target?Math.min(1,saved/g.target):0,months,perMonth,done:saved>=g.target}});

/* ---------- Krediler ---------- */
D.loan=U.memo((s,lid)=>{const l=s.loans.find(x=>x.id===lid);if(!l)return null;
  const pays=s.transactions.filter(t=>t.kind==='loan'&&t.loanId===l.id).sort((a,b)=>a.date.localeCompare(b.date));
  const paidAmt=pays.reduce((a,t)=>a+t.amount,0),pb=+l.paidBefore||0;
  const paidCount=Math.min(l.count,pb+Math.floor(paidAmt/l.monthly+0.001));
  const schedule=Array.from({length:l.count},(_,k)=>({k,date:U.addMonths(l.firstDate,k),amount:l.monthly,paid:k<paidCount}));
  const next=schedule[paidCount]||null;
  return{...l,pays,paidCount,schedule,next,remaining:U.r2((l.count-paidCount)*l.monthly),total:U.r2(l.count*l.monthly),
    overdue:!!next&&U.daysUntil(next.date)<0,done:paidCount>=l.count,pct:paidCount/l.count}});

/* ---------- Net varlık ---------- */
D.netWorth=U.memo(s=>{let assets=0,debts=0,cards=0,loans=0,goals=0;
  for(const a of s.accounts){if(a.type==='credit'){if(D.limitRoot(s,a).id===a.id){const m=D.cardSummary(s,a.id);cards+=Math.max(0,m.used);if(m.used<0)assets-=m.used}}
    else assets+=D.toTRY(s,D.balance(s,a.id),a.currency)}
  for(const g of s.goals)goals+=D.goalSaved(s,g.id);
  for(const l of s.loans)loans+=D.loan(s,l.id).remaining;
  const dt=D.debtTotals(s);assets+=goals+dt.lent;debts=cards+loans+dt.owe;
  return{assets:U.r2(assets),debts:U.r2(debts),cards:U.r2(cards),loans:U.r2(loans),goals:U.r2(goals),lent:dt.lent,owe:dt.owe,net:U.r2(assets-debts)}});
D.netWorthAt=(s,E)=>{let assets=0,debts=0;
  for(const a of s.accounts){if(a.type==='credit')continue;let b=+a.opening||0;for(const t of s.transactions)if(t.date<=E)b+=D.effect(t,a.id);assets+=D.toTRY(s,b,a.currency)}
  for(const t of s.transactions)if(t.kind==='goal'&&t.date<=E)assets+=t.dir==='out'?-t.amount:t.amount;
  for(const l of D.cardLines(s))if(l.tx.date<=E)debts+=l.amount;
  for(const t of s.transactions)if(t.kind==='payment'&&t.date<=E&&D.isCredit(s,t.toAccountId))debts-=t.amount;
  for(const[k]of Object.entries(s.paidStatements)){const[aid,i]=k.split('|');const a=D.account(s,aid);if(!a)continue;
    const st=D.stmtAt(s,aid,+i);if(st.due<=E)debts-=Math.max(0,st.total)}
  for(const l of s.loans){if(U.addMonths(l.firstDate,-1)>E)continue;const L=D.loan(s,l.id);
    debts+=L.total-(+l.paidBefore||0)*l.monthly-L.pays.filter(t=>t.date<=E).reduce((a,t)=>a+t.amount,0)}
  const dd=D.debtAt(s,E);assets+=dd.lent;debts=Math.max(0,debts)+dd.owe;
  return{assets:U.r2(assets),debts:U.r2(debts),net:U.r2(assets-debts)}};
D.netWorthHistory=U.memo((s,n=12)=>{const t=new Date(),out=[];
  /* yalnızca ilk kayıttan bu yana: öncesinde veri olmadığı için çizmek yanıltıcı olur */
  const first=U.parse(s.transactions.reduce((m,x)=>x.date<m?x.date:m,U.today()));
  n=Math.max(2,Math.min(n,(t.getFullYear()-first.getFullYear())*12+t.getMonth()-first.getMonth()+1));
  for(let k=n-1;k>=0;k--){const d=new Date(t.getFullYear(),t.getMonth()-k,1);const E=k===0?U.today():U.monthEnd(d.getFullYear(),d.getMonth());
    const w=D.netWorthAt(s,E);out.push({label:U.mon(d.getMonth()),...w,value:w.net})}
  return out});

/* ---------- Harcama analitiği (taksitler her aya kendi payıyla yansır) ---------- */
D.allocations=U.memo(s=>{const out=[];
  for(const t of s.transactions){
    if(t.kind==='expense'){const n=Math.max(1,t.installments|0);U.split(t.amount,n).forEach((amount,k)=>out.push({tx:t,k,n,amount,category:t.category,date:U.addMonths(t.date,k)}))}
    else if(t.kind==='refund'){const o=t.refOf&&D.tx(s,t.refOf);out.push({tx:t,k:0,n:1,amount:-t.amount,category:o?.category||t.category||'other',date:t.date})}}
  return out});
D.spendIn=(s,from,to)=>D.allocations(s).filter(x=>x.date>=from&&x.date<=to);
D.sumBy=(items,key='category')=>{const m={};items.forEach(x=>m[x[key]]=(m[x[key]]||0)+x.amount);return m};
D.periodRange=p=>{const t=new Date(),T=U.today();
  if(p==='week')return[U.addDays(T,-6),T,'Son 7 gün'];
  if(p==='year')return[t.getFullYear()+'-01-01',U.monthEnd(t.getFullYear(),t.getMonth()),String(t.getFullYear())];
  return[U.monthStart(t.getFullYear(),t.getMonth()),U.monthEnd(t.getFullYear(),t.getMonth()),U.MONTHS[t.getMonth()]]};
D.monthCompare=U.memo(s=>{const t=new Date(),day=t.getDate();
  const curFrom=U.monthStart(t.getFullYear(),t.getMonth()),curTo=U.today();
  const lf=new Date(t.getFullYear(),t.getMonth()-1,1),prevFrom=U.iso(lf),prevTo=U.iso(new Date(lf.getFullYear(),lf.getMonth(),Math.min(day,U.dim(lf.getFullYear(),lf.getMonth()))));
  const cur=D.spendIn(s,curFrom,curTo),prev=D.spendIn(s,prevFrom,prevTo),tot=a=>U.r2(a.reduce((x,y)=>x+y.amount,0));
  return{cur:tot(cur),prev:tot(prev),curBy:D.sumBy(cur),prevBy:D.sumBy(prev)}});

/* ---------- Bütçe + tükenme projeksiyonu ---------- */
D.budgetStatus=U.memo(s=>{const t=new Date(),day=t.getDate(),days=U.dim(t.getFullYear(),t.getMonth());
  const by=D.sumBy(D.spendIn(s,U.monthStart(t.getFullYear(),t.getMonth()),U.today()));
  return s.budgets.map(b=>{const spent=U.r2(by[b.category]||0),pace=spent/day,projected=U.r2(pace*days);
    const ex=pace>0&&spent<b.limit?Math.ceil(b.limit/pace):null;
    return{...b,spent,projected,ratio:b.limit?spent/b.limit:0,over:spent>=b.limit,left:U.r2(b.limit-spent),
      willExceed:projected>b.limit&&spent<b.limit,exhaustDay:ex&&ex<=days?ex:null,daily:U.r2(Math.max(0,b.limit-spent)/Math.max(1,days-day+1))}})});

/* ---------- Düzenli ödemeler ---------- */
D.recurCycle=(r,ref=U.today())=>{const t=U.parse(ref);
  const make=(y,m)=>{const d=U.iso(new Date(y,m,Math.min(r.day,U.dim(y,m))));return{date:d,ym:d.slice(0,7)}};
  let c=make(t.getFullYear(),t.getMonth());if(r.paid?.[c.ym]){const n=new Date(t.getFullYear(),t.getMonth()+1,1);c=make(n.getFullYear(),n.getMonth())}
  return{...c,paid:!!r.paid?.[c.ym]}};

/* ---------- Yaklaşan ödemeler ---------- */
D.upcoming=U.memo((s,horizon=35)=>{const out=[];
  for(const a of s.accounts.filter(a=>a.type==='credit')){const st=D.statements(s,a.id);
    st.list.filter(x=>x.idx<st.open&&x.remaining>0).forEach(x=>out.push({kind:'stmt',date:x.due,accId:a.id,idx:x.idx,title:a.name+' ekstresi',
      sub:D.stmtName(x.idx)+(x.minLeft>0?' · asgari '+U.money(x.minLeft):' · asgari ödendi'),amount:x.remaining,icon:'💳',color:gcol(a.color)}));
    const op=D.stmtAt(s,a.id,st.open);if(op.remaining>0)out.push({kind:'open',date:op.due,accId:a.id,title:a.name+' · dönem içi',sub:'Kesim '+U.fmtDate(op.cut)+' · tahmini',amount:op.remaining,icon:'🧾',color:gcol(a.color)})}
  for(const r of s.recurring){const c=D.recurCycle(r);out.push({kind:'rec',id:r.id,date:c.date,ym:c.ym,title:r.name,income:r.type==='income',
    sub:(r.type==='income'?'Gelir':cat(r.category).name)+' · her ayın '+U.dayOf(r.day),amount:r.amount,icon:r.icon||cat(r.category).icon,color:cat(r.category).color})}
  for(const l0 of s.loans){const l=D.loan(s,l0.id);if(l.next)out.push({kind:'loan',id:l.id,date:l.next.date,title:l.name+' taksiti',sub:`${l.paidCount+1}/${l.count}. taksit`,amount:l.monthly,icon:'🏦',color:'#8e8e93'})}
  for(const x of (s.debts||[])){const d=D.debt(s,x.id);if(d.due&&!d.done)out.push({kind:'debt',id:d.id,person:d.person,date:d.due,title:d.dir==='lent'?d.person+' ödeyecek':d.person+' kişisine ödeme',sub:d.note||(d.dir==='lent'?'Alacak':'Borç'),amount:d.remaining,income:d.dir==='lent',icon:'people',color:d.dir==='lent'?'#30d158':'#ff453a'})}
  return out.filter(x=>U.daysUntil(x.date)<=horizon).sort((a,b)=>a.date.localeCompare(b.date))});

/* ---------- Taksit yükü ve Taksit Matrix'i ---------- */
D.installmentLoad=U.memo((s,months=6)=>{const cards=s.accounts.filter(a=>a.type==='credit');if(!cards.length)return null;
  const start=Math.min(...cards.map(a=>D.openIdx(a.credit)))-1,cols=[];let max=0;
  for(let i=start;i<start+months;i++){const parts=cards.map(a=>({acc:a,v:Math.max(0,D.stmtAt(s,a.id,i).total)}));const tot=U.r2(parts.reduce((x,y)=>x+y.v,0));max=Math.max(max,tot);cols.push({i,parts,tot})}
  return{cols,max,cards}});
D.matrix=U.memo((s,accId='',months=12)=>{const cards=s.accounts.filter(a=>a.type==='credit'&&(!accId||a.id===accId));if(!cards.length)return null;
  const start=Math.min(...cards.map(a=>D.openIdx(a.credit)))-1,idxs=Array.from({length:months},(_,k)=>start+k),ids=cards.map(a=>a.id);
  const lines=D.cardLines(s).filter(l=>ids.includes(l.accId));
  const rows={};lines.filter(l=>l.kind==='inst'&&l.n>1).forEach(l=>{const r=rows[l.tx.id]=rows[l.tx.id]||{tx:l.tx,acc:D.account(s,l.accId),cells:{},left:0,leftAmt:0,n:l.n};
    r.cells[l.idx]=U.r2((r.cells[l.idx]||0)+l.amount);const st=D.stmtAt(s,l.accId,l.idx);if(st.remaining>0.009||l.idx>=D.openIdx(r.acc.credit)){r.left++;r.leftAmt=U.r2(r.leftAmt+l.amount)}});
  const list=Object.values(rows).filter(r=>idxs.some(i=>r.cells[i])&&r.left>0).sort((a,b)=>b.leftAmt-a.leftAmt);
  const totals={},single={};idxs.forEach(i=>{totals[i]=U.r2(cards.reduce((a,c)=>a+Math.max(0,D.stmtAt(s,c.id,i).total),0));
    single[i]=U.r2(totals[i]-list.reduce((a,r)=>a+(r.cells[i]||0),0))});
  return{idxs,rows:list,totals,single,open:Math.min(...cards.map(a=>D.openIdx(a.credit)))}});

/* ---------- Takvim ---------- */
D.calendar=U.memo((s,y,m)=>{const days={},from=U.monthStart(y,m),to=U.monthEnd(y,m),ym=from.slice(0,7);
  for(let d=1;d<=U.dim(y,m);d++)days[U.iso(new Date(y,m,d))]={spent:0,income:0,events:[],txs:[]};
  for(const t of s.transactions){const day=days[t.date];if(!day)continue;day.txs.push(t);if(t.kind==='expense')day.spent+=t.amount;if(t.kind==='income')day.income+=t.amount}
  for(const a of s.accounts.filter(a=>a.type==='credit')){const st=D.statements(s,a.id);
    for(let i=st.open-2;i<=st.open+6;i++){const x=D.stmtAt(s,a.id,i);if(x.total<=0)continue;
      if(days[x.due])days[x.due].events.push({type:'stmt',title:a.name+' ekstresi',sub:D.stmtName(i),amount:x.remaining>0?x.remaining:x.total,done:x.remaining<=0.009,color:gcol(a.color),accId:a.id,idx:i,projected:i>=st.open});
      if(days[x.cut]&&i>=st.open-1)days[x.cut].events.push({type:'cut',title:a.name+' hesap kesimi',amount:x.total,color:gcol(a.color),info:true})}}
  for(const r of s.recurring){const d=U.iso(new Date(y,m,Math.min(r.day,U.dim(y,m))));if(days[d])days[d].events.push({type:'rec',id:r.id,ym,title:r.name,amount:r.amount,income:r.type==='income',done:!!r.paid?.[ym],color:cat(r.category).color})}
  for(const l0 of s.loans){const l=D.loan(s,l0.id);l.schedule.forEach(x=>{if(days[x.date])days[x.date].events.push({type:'loan',id:l.id,title:l.name+' taksiti',sub:(x.k+1)+'/'+l.count,amount:x.amount,done:x.paid,color:'#8e8e93'})})}
  for(const x of (s.debts||[])){const d=D.debt(s,x.id);if(d.due&&!d.done&&days[d.due])days[d.due].events.push({type:'debt',title:(d.dir==='lent'?d.person+' ödeyecek':d.person+' kişisine ödeme'),amount:d.remaining,color:d.dir==='lent'?'#30d158':'#ff453a',income:d.dir==='lent',id:d.id,person:d.person})}
  for(const t of s.transactions){if(!t.warrantyMonths)continue;const e=U.addMonths(t.date,t.warrantyMonths);if(days[e])days[e].events.push({type:'warranty',title:'Garanti bitiyor: '+(t.merchant||cat(t.category).name),color:'#ffd60a',info:true,txId:t.id})}
  return days});

/* ---------- Aylık rapor ---------- */
D.monthReport=U.memo((s,y,m)=>{const from=U.monthStart(y,m),to=U.monthEnd(y,m),pf=new Date(y,m-1,1);
  const alloc=D.spendIn(s,from,to),prevAlloc=D.spendIn(s,U.iso(pf),U.monthEnd(pf.getFullYear(),pf.getMonth()));
  const inMonth=s.transactions.filter(t=>t.date>=from&&t.date<=to);
  const income=U.r2(inMonth.filter(t=>t.kind==='income').reduce((a,t)=>a+t.amount,0));
  const expense=U.r2(alloc.reduce((a,x)=>a+x.amount,0)),prevExpense=U.r2(prevAlloc.reduce((a,x)=>a+x.amount,0));
  const by=D.sumBy(alloc),pby=D.sumBy(prevAlloc);
  const cats=Object.keys({...by,...pby}).map(k=>({key:k,cur:U.r2(by[k]||0),prev:U.r2(pby[k]||0)})).filter(x=>x.cur>0||x.prev>0).sort((a,b)=>b.cur-a.cur);
  const daily=Array.from({length:U.dim(y,m)},(_,i)=>{const d=U.iso(new Date(y,m,i+1));return U.r2(alloc.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0))});
  const merch={};inMonth.filter(t=>t.kind==='expense').forEach(t=>{const k=(t.merchant||cat(t.category).name).trim();merch[k]=merch[k]||{name:k,count:0,total:0,cat:t.category};merch[k].count++;merch[k].total+=t.amount});
  const payments=U.r2(inMonth.filter(t=>t.kind==='payment').reduce((a,t)=>a+t.amount,0));
  const biggest=inMonth.filter(t=>t.kind==='expense').sort((a,b)=>b.amount-a.amount)[0]||null;
  return{y,m,from,to,income,expense,prevExpense,net:U.r2(income-expense),saveRate:income>0?(income-expense)/income:null,cats,daily,
    merchants:Object.values(merch).sort((a,b)=>b.total-a.total).slice(0,10),payments,biggest,txCount:inMonth.length,txs:inMonth.sort((a,b)=>a.date.localeCompare(b.date))}});

/* ---------- İşlem filtreleme ---------- */
D.filterTx=(s,f={})=>{const q=U.lc(f.q).trim(),T=new Date();let from='',to='';
  if(f.range==='month'){if(f.ym){const y=+f.ym.slice(0,4),m=+f.ym.slice(5,7)-1;from=U.monthStart(y,m);to=U.monthEnd(y,m)}else from=U.monthStart(T.getFullYear(),T.getMonth())}
  else if(f.range==='last'){from=U.monthStart(T.getFullYear(),T.getMonth()-1);to=U.monthEnd(T.getFullYear(),T.getMonth()-1)}
  else if(f.range==='3m'){from=U.addMonths(U.today(),-3)}
  return s.transactions.filter(t=>{
    if(from&&t.date<from)return false;if(to&&t.date>to)return false;
    if(f.acc&&t.accountId!==f.acc&&t.toAccountId!==f.acc)return false;
    if(f.cat&&t.category!==f.cat)return false;
    if(f.kind==='expense'&&t.kind!=='expense')return false;
    if(f.kind==='income'&&!['income','refund'].includes(t.kind))return false;
    if(f.kind==='move'&&!['transfer','payment','goal','loan','debt'].includes(t.kind))return false;
    if(f.kind==='inst'&&!(t.kind==='expense'&&t.installments>1))return false;
    if(f.kind==='ocr'&&!['ocr','import'].includes(t.source))return false;

    let h=5381;for(const c of 'cuzdan:v1:'+pin)h=((h<<5)+h+c.charCodeAt(0))|0;return 'd'+h},

/* ===================== services/ai · Google Gemini (Interactions API) =====================
   Belge: ai.google.dev/gemini-api/docs/interactions · structured-output
   POST /v1beta/interactions  { model, system_instruction, input:[parts], generation_config, response_format }
   Yanıt: steps[type=model_output].content[type=text].text                                              */
const Secrets={K:'cuzdan_gemini_key',   // anahtar state'in DIŞINDA tutulur → yedek dosyasına girmez
  get(){try{return localStorage.getItem(this.K)||''}catch(e){return ''}},
  set(v){try{v?localStorage.setItem(this.K,v):localStorage.removeItem(this.K)}catch(e){}}};

class AIError extends Error{constructor(code,msg,status){super(msg||code);this.code=code;this.status=status}}

const AI={
  BASE:'https://generativelanguage.googleapis.com/v1beta',
  /* yedek liste: model listesi alınamazsa gösterilir; "Bağlantıyı test et" anahtarın gerçek modellerini getirir */
  MODELS:[['gemini-3.8-flash','Gemini 3.8 Flash'],['gemini-3.6-flash','Gemini 3.6 Flash'],['gemini-3.5-flash-lite','Gemini 3.5 Flash-Lite'],['gemini-flash-latest','Gemini Flash (en güncel)'],['gemini-3-flash-preview','Gemini 3 Flash · preview']],
  models(){const l=Store.get().settings.aiModels;return l&&l.length?l.map(m=>[m,m]):this.MODELS},
  model(){return String(Store.get().settings.aiModel||'gemini-3.8-flash').replace(/^models\//,'')},
  /* Ortak HTTP katmanı: zaman aşımı + 429/5xx için üstel geri çekilme */
  /* Kimlik doğrulama biçimleri: klasik AIza anahtarı başlıkta; yeni "Authentication Key" (AQ.) bazı hesaplarda farklı biçim isteyebilir */
  AUTH:['header','query','bearer'],
  authed(url,key,mode){const h={'Content-Type':'application/json'};
    if(mode==='bearer')h.Authorization='Bearer '+key;else if(mode==='query')url+=(url.includes('?')?'&':'?')+'key='+encodeURIComponent(key);else h['x-goog-api-key']=key;return{url,h}},
  async request(url,body,timeout=90000){const key=Secrets.get();if(!key)throw new AIError('NO_KEY');
    const st=Store.get().settings,modes=st.aiAuth?[st.aiAuth,...this.AUTH.filter(m=>m!==st.aiAuth)]:this.AUTH;
    let firstErr;for(const mode of (key.startsWith('AQ.')?modes:[st.aiAuth||'header'])){
      try{const r=await this.requestOnce(url,body,timeout,key,mode);if(st.aiAuth!==mode)Store.dispatch({type:'settings/update',payload:{aiAuth:mode}});return r}
      catch(e){if(!['INVALID_KEY'].includes(e.code)||e.status!==401&&e.status!==403&&e.status!==400)throw e;firstErr=firstErr||e}}
    throw firstErr},
  async requestOnce(url0,body,timeout,key,mode){let res,lastErr;const{url,h}=this.authed(url0,key,mode);
    for(let attempt=0;attempt<3;attempt++){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),timeout);
      try{res=await fetch(url,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined,signal:ctl.signal})}
      catch(e){clearTimeout(tm);lastErr=new AIError(e.name==='AbortError'?'TIMEOUT':'NETWORK',e.message);if(e.name==='AbortError')throw lastErr;res=null;await this.wait(attempt);continue}
      clearTimeout(tm);
      if(res.status===429||res.status>=500){lastErr=await this.toError(res);if(attempt<2){await this.wait(attempt);continue}throw lastErr}
      break}
    if(!res)throw lastErr||new AIError('NETWORK');if(!res.ok)throw await this.toError(res);return res.json()},
  /* Ana giriş: önce yeni Interactions API, desteklenmiyorsa generateContent'e otomatik geçer ve bunu hatırlar */
  async call(opts){const api=Store.get().settings.aiApi||'interactions';
    if(api==='generate')return this.callGenerate(opts);
    try{return await this.callInteractions(opts)}
    catch(e){if(['MODEL','BAD_REQUEST','EMPTY','FAILED'].includes(e.code)){const r=await this.callGenerate(opts);Store.dispatch({type:'settings/update',payload:{aiApi:'generate'}});return r}throw e}},
  async callInteractions({system,input,schema,thinking='low',maxTokens=2048,timeout=90000}){
    const body={model:this.model(),input,generation_config:{thinking_level:thinking,max_output_tokens:maxTokens}};
    if(system)body.system_instruction=system;
    if(schema)body.response_format={type:'text',mime_type:'application/json',schema};
    const data=await this.request(this.BASE+'/interactions',body,timeout);
    if(data.status&&!['completed','incomplete'].includes(data.status))throw new AIError('FAILED',data.errors?.[0]?.message||data.status);
    const text=this.extractText(data);if(!text)throw new AIError('EMPTY');return schema?this.parseJSON(text):text},
  async callGenerate({system,input,schema,maxTokens=2048,timeout=90000}){
    const parts=typeof input==='string'?[{text:input}]:input.map(p=>p.type==='text'?{text:p.text}:{inline_data:{mime_type:p.mime_type,data:p.data}});
    const body={contents:[{role:'user',parts}],generationConfig:{maxOutputTokens:Math.max(maxTokens,8192)}};
    if(system)body.systemInstruction={parts:[{text:system}]};
    if(schema){body.generationConfig.responseMimeType='application/json';body.generationConfig.responseJsonSchema=schema}
    const url=`${this.BASE}/models/${encodeURIComponent(this.model())}:generateContent`;let data;
    try{data=await this.request(url,body,timeout)}
    catch(e){if(schema&&e.code==='BAD_REQUEST'){delete body.generationConfig.responseJsonSchema;   // eski modeller JSON şemasını desteklemeyebilir → şemayı talimat olarak ver
        parts.push({text:'Yanıtı SADECE bu JSON şemasına uyan geçerli JSON olarak ver, başka metin ekleme: '+JSON.stringify(schema)});data=await this.request(url,body,timeout)}else throw e}
    if(data.promptFeedback?.blockReason)throw new AIError('BLOCKED',data.promptFeedback.blockReason);
    const text=this.extractText(data);if(!text)throw new AIError('EMPTY',data.candidates?.[0]?.finishReason||'');return schema?this.parseJSON(text):text},
  /* Anahtarın erişebildiği modelleri listele ve en uygun Flash modelini sırala */
  async listModels(){const j=await this.request(this.BASE+'/models?pageSize=500',null,20000);
    const all=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''));
    const ok=n=>/gemini/.test(n)&&/flash/.test(n)&&!/(image|tts|audio|live|embedding|computer|robotics|native)/.test(n);
    const score=n=>{const v=parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);return v*100-(n.includes('lite')?40:0)-(/preview|exp/.test(n)?20:0)-(/latest/.test(n)?4:0)-(/-\d{3}$|\d{2}-\d{4}/.test(n)?6:0)};
    const flash=all.filter(ok).sort((a,b)=>score(b)-score(a));return{all,flash}},
  wait:a=>new Promise(r=>setTimeout(r,[800,2500,5000][a]||5000)),
  async toError(res){let msg='',reason='';try{const j=await res.json();msg=j.error?.message||j.errors?.[0]?.message||'';reason=(j.error?.details||[]).map(d=>d.reason).filter(Boolean)[0]||j.error?.status||''}catch(e){}
    const st=res.status,low=(msg+' '+reason).toLowerCase();if(reason)msg=`${st} ${reason}: ${msg}`;else if(msg)msg=`${st}: ${msg}`;
    const code=st===429?'RATE':low.includes('referer')||low.includes('referrer')?'REFERRER':st===401||st===403||(st===400&&(low.includes('api key')||low.includes('api_key')))?'INVALID_KEY':
      st===404?'MODEL':st>=500?'SERVER':'BAD_REQUEST';
    return new AIError(code,msg,st)},
  extractText(d){
    const steps=(d.steps||[]).filter(x=>x.type==='model_output').flatMap(x=>x.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    if(steps)return steps;
    if(typeof d.output_text==='string'&&d.output_text)return d.output_text;
    return (d.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('')},
  parseJSON(t){try{return JSON.parse(t)}catch(e){const m=t.replace(/```json|```/g,'').match(/[\[{][\s\S]*[\]}]/);if(m){try{return JSON.parse(m[0])}catch(e2){}}throw new AIError('BAD_JSON')}},
  human(e){const det=e?.message&&e.message!==e.code?` (Google: ${e.message.slice(0,220)})`:'';
    const m={NO_KEY:'Gemini API anahtarı eklenmemiş. Ayarlar → Yapay zekâ bölümünden ekle.',
      INVALID_KEY:(Secrets.get().startsWith('AQ.')?'Google bu yeni tür (AQ.) anahtarı kabul etmedi; uygulama bütün gönderim biçimlerini denedi. Bu, Google tarafında bilinen bir sorun.':'API anahtarı geçersiz ya da bu API için yetkisiz. Anahtarı Google AI Studio\'dan kopyaladığından emin ol.')+det,
      REFERRER:'Anahtarın web sitesi kısıtlaması bu sayfayı engelliyor. Google Cloud\'da anahtar kısıtlamasına sitenin adresini ekle ya da kısıtlamayı kaldır.'+det,
      RATE:'İstek sınırına takıldın. Biraz bekleyip tekrar dene.'+det,TIMEOUT:'Gemini zamanında yanıt vermedi. Tekrar dene.',
      NETWORK:'Google\'a bağlanılamadı. İnternetini kontrol et; dosyayı telefonda doğrudan açıyorsan GitHub Pages adresinden açmayı dene.',
      MODEL:'Seçili model bu anahtarla kullanılamıyor. "Bağlantıyı test et" ile uygun modeli otomatik seç.'+det,SERVER:'Gemini şu an yanıt veremiyor. Biraz sonra tekrar dene.'+det,
      BAD_REQUEST:'Google isteği kabul etmedi.'+det,FAILED:'İşlem tamamlanamadı.'+det,BLOCKED:'Gemini bu içeriği işlemeyi reddetti.'+det,
      BAD_JSON:'Yapay zekâ yanıtı okunamadı. Tekrar dene.',EMPTY:'Yapay zekâ boş yanıt döndü.'+det,FILE_BIG:'Dosya çok büyük (en fazla 15 MB).',FILE_TYPE:'Bu dosya türü desteklenmiyor.'};
    return m[e?.code]||(e?.message?'Hata: '+e.message:'Beklenmeyen bir hata oluştu.')}
};

/* Görsel/PDF hazırlama: görseli küçült + JPEG'e çevir (hız ve kota için) */
const Media={MAX:15*1024*1024,
  async prepare(file,maxSide=1800){
    if(file.size>this.MAX)throw new AIError('FILE_BIG');
    if(file.type==='application/pdf'){const data=await this.b64(file);return{kind:'document',mime:'application/pdf',data,preview:null,dataUrl:'data:application/pdf;base64,'+data,name:file.name}}
    if(!file.type.startsWith('image/'))throw new AIError('FILE_TYPE');
    const url=URL.createObjectURL(file);
    try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
      const sc=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');
      cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const du=cv.toDataURL('image/jpeg',.85);return{kind:'image',mime:'image/jpeg',data:du.split(',')[1],preview:du,dataUrl:du,name:file.name}}
    catch(e){const data=await this.b64(file);return{kind:'image',mime:file.type,data,preview:url,dataUrl:`data:${file.type};base64,${data}`,name:file.name}}},
  b64:f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)})
};

/* Fiş yanıtını doğrula → işlem taslağına çevir */
const Receipt={
  normalize(r,s){
    if(!r||r.is_receipt===false||!(+r.total>0))return{ok:false,reason:r?.notes||'Belgede okunabilir bir toplam tutar bulunamadı.'};
    const T=U.today();let date=/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:T;if(date>T)date=T;
    const n=Math.min(36,Math.max(1,parseInt(r.installments)||1)),nOpt=INSTALLMENT_OPTS.reduce((a,b)=>Math.abs(b-n)<Math.abs(a-n)?b:a);
    const rec=r.merchant&&D.recallMerchant(s,r.merchant,'expense');const m=this.matchAccount(s,r.card_hint,n);if(!m.matched&&rec&&D.account(s,rec.accountId)){m.acc=D.account(s,rec.accountId)}const acc=m.acc;
    return{ok:true,
      draft:{amount:U.r2(+r.total),merchant:String(r.merchant||'').slice(0,60),date,category:rec?.category||(expenseCats().includes(r.category)?r.category:'other'),
        accountId:acc?.id,installments:acc?.type==='credit'?nOpt:1,source:'ocr',
        items:(r.items||[]).slice(0,30),vat:{total:r.vat_total??null,lines:r.vat_lines||[]},warrantyMonths:r.warranty_months??null},
      meta:{confidence:r.confidence,currency:r.currency,cardHint:r.card_hint,matched:m.matched,installments:n,notes:r.notes,itemCount:(r.items||[]).length}}},
  matchAccount(s,hint,n){const h=U.lc(hint);
    if(h){const tok=h.split(/[^a-zçğıöşü0-9]+/i).filter(x=>x.length>=3);
      const acc=s.accounts.find(a=>tok.some(t=>U.lc(a.name+' '+(a.bank||'')).includes(t)));if(acc)return{acc,matched:true}}
    return{acc:(n>1&&s.accounts.find(a=>a.type==='credit'))||s.accounts.find(a=>a.type==='credit')||s.accounts[0],matched:false}}
};

/* Ekstre yanıtını doğrula → içe aktarılacak işlem adayları */
const StatementImport={
  normalize(r,s,accId){
    if(!r||r.is_statement===false||!Array.isArray(r.transactions)||!r.transactions.length)return{ok:false,reason:'Belgede ekstre işlemi bulunamadı.'};
    const acc=D.account(s,accId),c=acc.credit,T=U.today();
    const valid=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'');
    const cutIdx=valid(r.cut_date)?D.stmtIdx(c,r.cut_date):D.stmtIdx(c,r.transactions.map(x=>x.date).filter(valid).sort().pop()||T);
    const rows=r.transactions.filter(x=>+x.amount>0).map((x,i)=>{
      const amount=U.r2(+x.amount),date=valid(x.date)&&x.date<=T?x.date:D.cutDate(c,cutIdx);
      const learned=D.recallMerchant(s,x.description||'','expense');
      const base={id:'r'+i,sel:true,desc:String(x.description||'').slice(0,60)||'İşlem',category:learned?.category||(expenseCats().includes(x.category)?x.category:'other'),raw:x};
      if(x.kind==='payment')return{...base,type:'payment',amount,date,label:'Ödeme'};
      if(x.kind==='refund')return{...base,type:'refund',amount,date,label:'İade / alacak',...(valid(r.cut_date)&&D.stmtIdx(c,date)<cutIdx?{billIdx:cutIdx}:{})};
      const n=+x.installment_total||1,k=+x.installment_no||1;
      if(n>1&&k>=1&&k<=n){const startIdx=cutIdx-(k-1),orig=x.original_total>0?U.r2(+x.original_total):U.r2(amount*n);
        const d=valid(x.date)&&D.stmtIdx(c,x.date)===startIdx?x.date:D.cutDate(c,startIdx);
        return{...base,type:'expense',amount:orig,date:d,installments:n,label:`${k}/${n} taksit · bu ekstrede ${U.money(amount,{raw:true})}`,lineAmount:amount}}
      const ex=x.kind==='interest'||x.kind==='fee';
      return{...base,type:'expense',amount,date,installments:1,...(valid(r.cut_date)&&D.stmtIdx(c,date)<cutIdx?{billIdx:cutIdx}:{}),category:ex?'fees':base.category,label:ex?(x.kind==='interest'?'Faiz / vergi':'Ücret'):'Tek çekim'}});
    /* mükerrer tespiti: aynı kartta ±3 gün içinde aynı tutar */
    rows.forEach(row=>{if(row.installments>1){const st=D.stmtIdx(c,row.date),dup=s.transactions.find(t=>t.kind==='expense'&&t.accountId===accId&&(t.installments|0)===row.installments&&Math.abs(t.amount-row.amount)<0.05&&D.stmtIdx(c,t.date)===st);if(dup){row.dup=true;row.sel=false}}});
    rows.forEach(row=>{if(row.dup)return;const dup=s.transactions.find(t=>(t.accountId===accId||t.toAccountId===accId)&&Math.abs(t.amount-row.amount)<0.01&&Math.abs(U.daysUntil(t.date)-U.daysUntil(row.date))<=3&&(row.type==='payment'?t.kind==='payment':row.type==='refund'?t.kind==='refund':t.kind==='expense'));
      if(dup){row.dup=true;row.sel=false}});
    return{ok:true,rows,meta:{card:r.card_name,cut:r.cut_date,due:r.due_date,total:r.statement_total,min:r.min_payment}}},
  toActions(rows,accId){return rows.filter(r=>r.sel).map(r=>{const id=U.uid();
    if(r.type==='payment')return{type:'upsert',col:'transactions',item:{id,kind:'payment',accountId:'',toAccountId:accId,amount:r.amount,date:r.date,merchant:'Kart ödemesi',note:'Ekstreden',source:'import'}};
    if(r.type==='refund')return{type:'upsert',col:'transactions',item:{id,kind:'refund',accountId:accId,amount:r.amount,date:r.date,merchant:r.desc,category:r.category,source:'import',...(r.billIdx!=null?{billIdx:r.billIdx}:{})}};
    return{type:'upsert',col:'transactions',item:{id,kind:'expense',accountId:accId,amount:r.amount,date:r.date,merchant:r.desc,category:r.category,installments:r.installments||1,note:'',source:'import',...(r.billIdx!=null?{billIdx:r.billIdx}:{})}}})}
};

/* =====================================================================
   v5 özellikleri: borç/alacak, kategori öğrenme, abonelik tespiti, canlı kur,
   takvim (.ics), nakit akışı simülasyonu, AI asistan, sesle ekleme, iptal metni
   ===================================================================== */
U.norm=s=>U.lc(s).replace(/[^a-z0-9çğıöşü]+/g,' ').trim();

/* ---------- Borç / alacak ---------- */
D.debt=U.memo((s,id)=>{const d=(s.debts||[]).find(x=>x.id===id);if(!d)return null;
  const moves=s.transactions.filter(t=>t.kind==='debt'&&t.debtId===id).sort((a,b)=>a.date.localeCompare(b.date));
  const paid=U.r2(moves.filter(t=>t.settle).reduce((a,t)=>a+t.amount,0)),remaining=U.r2(Math.max(0,d.amount-paid));
  return{...d,moves,paid,remaining,done:remaining<=0.009,overdue:!!d.due&&remaining>0.009&&U.daysUntil(d.due)<0,pct:d.amount?Math.min(1,paid/d.amount):0}});
D.debtTotals=U.memo(s=>{let lent=0,owe=0;(s.debts||[]).forEach(x=>{const d=D.debt(s,x.id);if(d.dir==='lent')lent+=d.remaining;else owe+=d.remaining});
  return{lent:U.r2(lent),owe:U.r2(owe),net:U.r2(lent-owe)}});
D.people=U.memo(s=>{const m={};(s.debts||[]).forEach(x=>{const d=D.debt(s,x.id),k=U.lc(d.person.trim());
  const p=m[k]=m[k]||{name:d.person.trim(),lent:0,owe:0,items:[]};p.items.push(d);if(d.dir==='lent')p.lent+=d.remaining;else p.owe+=d.remaining});
  return Object.values(m).map(p=>({...p,lent:U.r2(p.lent),owe:U.r2(p.owe),net:U.r2(p.lent-p.owe),open:p.items.filter(d=>!d.done).length}))
    .sort((a,b)=>(b.open>0)-(a.open>0)||Math.abs(b.net)-Math.abs(a.net))});
D.debtAt=(s,E)=>{let lent=0,owe=0;(s.debts||[]).forEach(d=>{if(d.date>E)return;
  const paid=s.transactions.filter(t=>t.kind==='debt'&&t.debtId===d.id&&t.settle&&t.date<=E).reduce((a,t)=>a+t.amount,0),r=Math.max(0,d.amount-paid);
  if(d.dir==='lent')lent+=r;else owe+=r});return{lent,owe}};

/* ---------- Mağaza hafızası: kategori / hesap / tutar öğrenme ---------- */
D.merchantMemory=U.memo(s=>{const m={};
  [...s.transactions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{if(!['expense','income'].includes(t.kind)||!t.merchant)return;const k=U.norm(t.merchant);if(k.length<2)return;
    const e=m[k]=m[k]||{name:t.merchant,count:0};Object.assign(e,{count:e.count+1,category:t.category,accountId:t.accountId,amount:t.amount,kind:t.kind,date:t.date,installments:t.installments||1})});
  return m});
D.recallMerchant=(s,name,kind='expense')=>{const k=U.norm(name);if(k.length<2)return null;const m=D.merchantMemory(s);let e=m[k];
  if(!e){const keys=Object.keys(m).filter(x=>m[x].kind===kind);const key=keys.find(x=>x.startsWith(k))||keys.find(x=>x.length>=4&&k.startsWith(x));e=key?m[key]:null}
  return e&&e.kind===kind?e:null};
D.merchantNames=U.memo(s=>Object.values(D.merchantMemory(s)).sort((a,b)=>b.count-a.count).slice(0,80).map(e=>e.name));

/* ---------- Abonelik otomatik tespiti ---------- */
D.subCandidates=U.memo(s=>{const ign=new Set(s.settings.subIgnore||[]),rec=s.recurring.map(r=>U.norm(r.name)),from=U.monthStart(new Date().getFullYear(),new Date().getMonth()-5),g={};
  s.transactions.filter(t=>t.kind==='expense'&&t.date>=from&&t.merchant&&!t.recurringId&&(t.installments||1)===1).forEach(t=>{const k=U.norm(t.merchant);if(k)(g[k]=g[k]||[]).push(t)});
  const out=[];for(const[k,list]of Object.entries(g)){if(ign.has(k)||rec.some(r=>r===k||(r.length>3&&(r.includes(k)||k.includes(r)))))continue;
    const byM={};list.forEach(t=>{byM[t.date.slice(0,7)]=t});const ms=Object.values(byM);if(ms.length<3||list.length>ms.length*1.4)continue;
    const amts=ms.map(t=>t.amount),avg=amts.reduce((a,b)=>a+b,0)/amts.length;if(amts.some(a=>Math.abs(a-avg)/avg>.12))continue;
    const days=ms.map(t=>+t.date.slice(8)).sort((a,b)=>a-b),med=days[Math.floor(days.length/2)];if(days.some(d=>Math.abs(d-med)>5))continue;
    const last=[...ms].sort((a,b)=>b.date.localeCompare(a.date))[0];
    out.push({key:k,name:last.merchant,amount:U.r2(last.amount),day:med,category:last.category,accountId:last.accountId,months:ms.length,lastTx:last})}
  return out.sort((a,b)=>b.amount-a.amount)});

/* ---------- 6 aylık nakit akışı projeksiyonu ("Ya şöyle olursa?") ---------- */
D.liquid=s=>U.r2(s.accounts.filter(a=>a.type==='checking'||a.type==='cash').reduce((x,a)=>x+D.toTRY(s,D.balance(s,a.id),a.currency),0));
D.variableSpend=U.memo(s=>{const t=new Date();let sum=0;
  for(let k=1;k<=3;k++){const y=t.getFullYear(),m=t.getMonth()-k,from=U.monthStart(y,m),to=U.monthEnd(y,m);
    sum+=s.transactions.filter(x=>x.kind==='expense'&&x.date>=from&&x.date<=to&&!x.recurringId&&(x.installments||1)===1).reduce((a,x)=>a+x.amount,0)}
  return U.r2(sum/3)});
D.cashflow=(s,extra)=>{const t=new Date(),T=U.today(),rows=[];let bal=D.liquid(s);const start=bal,variable=D.variableSpend(s);
  for(let k=0;k<6;k++){const y=t.getFullYear(),m=t.getMonth()+k,from=k===0?T:U.monthStart(y,m),to=U.monthEnd(y,m),ym=U.monthStart(y,m).slice(0,7);
    const factor=k===0?(U.dim(t.getFullYear(),t.getMonth())-t.getDate()+1)/U.dim(t.getFullYear(),t.getMonth()):1;
    let income=0,fixed=0,cards=0,loans=0,debts=0,np=0;
    s.recurring.forEach(r=>{if(k===0&&r.paid?.[ym])return;const d=U.iso(new Date(y,m,Math.min(r.day,U.dim(y,m))));if(d<from||d>to)return;
      if(r.type==='income')income+=r.amount;else if(!D.isCredit(s,r.accountId))fixed+=r.amount});
    s.accounts.filter(a=>a.type==='credit').forEach(a=>{const o=D.openIdx(a.credit);for(let i=o-3;i<=o+24;i++){const st=D.stmtAt(s,a.id,i);if(st.due>=from&&st.due<=to)cards+=Math.max(0,st.remaining)}});
    s.loans.forEach(l0=>{D.loan(s,l0.id).schedule.forEach(x=>{if(!x.paid&&x.date<=to&&(x.date>=from||(k===0&&x.date<T)))loans+=x.amount})});
    (s.debts||[]).forEach(d0=>{const d=D.debt(s,d0.id);if(d.dir==='owe'&&!d.done&&d.due&&d.due<=to&&(d.due>=from||k===0))debts+=d.remaining});
    if(extra&&extra.amount>0){const acc=D.account(s,extra.accId);
      if(acc&&acc.type==='credit'){const f=D.stmtIdx(acc.credit,extra.date||T),parts=U.split(extra.amount,extra.n||1);parts.forEach((p,i)=>{const due=D.dueDate(acc.credit,f+i);if(due>=from&&due<=to)np+=p})}
      else{const d=extra.date||T;if(d>=from&&d<=to)np+=extra.amount}}
    const v=U.r2(variable*factor),out=U.r2(fixed+cards+loans+debts+v+np);bal=U.r2(bal+income-out);
    rows.push({label:U.mon(((m%12)+12)%12),ym,income:U.r2(income),fixed,cards:U.r2(cards),loans,debts,variable:v,np:U.r2(np),out,balance:bal})}
  return{start,rows,min:Math.min(...rows.map(r=>r.balance)),variable}};

/* ---------- AI asistanı için veri bağlamı (kompakt tablo) ---------- */
D.chatContext=s=>{const from=U.addMonths(U.today(),-4),nw=D.netWorth(s);
  const txs=s.transactions.filter(t=>t.date>=from).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,400).map(t=>{const v=C.txVis(s,t);
    return[t.date,KINDS[t.kind]||t.kind,(t.merchant||v.title||'').slice(0,40),['expense','income','refund'].includes(t.kind)?cat(t.category).name:'',D.account(s,t.accountId)?.name||'',(v.sign||-1)*t.amount,t.installments>1?t.installments:'']});
  return{bugun:U.today(),
    hesaplar:s.accounts.map(a=>a.type==='credit'?(m=>({ad:a.name,tur:'kredi kartı',limit:m.limit,kullanilabilir:m.available,kart_borcu:m.own,son_ekstre_kalan:m.lastRemaining,asgari:m.minPay,son_odeme:m.lastDue,hesap_kesim_gunu:a.credit.cutDay}))(D.cardSummary(s,a.id))
      :{ad:a.name,tur:ACCOUNT_TYPES[a.type].name,bakiye:D.balance(s,a.id),para_birimi:a.currency}),
    net_varlik:nw,krediler:s.loans.map(l=>{const L=D.loan(s,l.id);return{ad:l.name,aylik:l.monthly,odenen:L.paidCount,toplam:l.count,kalan:L.remaining,siradaki:L.next?.date}}),
    kumbaralar:s.goals.map(g=>{const G=D.goal(s,g.id);return{ad:g.name,hedef:g.target,biriken:G.saved,hedef_tarih:g.deadline,aylik_gereken:G.perMonth}}),
    borc_alacak:(s.debts||[]).map(x=>{const d=D.debt(s,x.id);return{kisi:d.person,yon:d.dir==='lent'?'bana borçlu':'ben borçluyum',tutar:d.amount,kalan:d.remaining,vade:d.due||null}}),
    duzenli:s.recurring.map(r=>({ad:r.name,tur:r.type==='income'?'gelir':'gider',tutar:r.amount,gun:r.day})),
    butceler:D.budgetStatus(s).map(b=>({kategori:cat(b.category).name,limit:b.limit,harcanan:b.spent})),
    yaklasan:D.upcoming(s).slice(0,10).map(x=>({tarih:x.date,ad:x.title,tutar:x.amount})),
    islem_sutunlari:['tarih','tür','açıklama','kategori','hesap','tutar(− çıkış,+ giriş)','taksit'],islemler:txs}};

/* ---------- Canlı kur (anahtarsız, ücretsiz kaynaklar) ---------- */
const Rates={busy:false,
  async fetch(manual){if(this.busy)return;this.busy=true;const s=Store.get(),out={...s.settings.rates};let ok=0;
    const get=async(u)=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),9000);try{const r=await fetch(u,{signal:c.signal});return r.ok?await r.json():null}catch(e){return null}finally{clearTimeout(tm)}};
    const fx=await get('https://api.frankfurter.dev/v1/latest?base=TRY&symbols=USD,EUR');   // Avrupa Merkez Bankası referans kurları
    if(fx&&fx.rates&&fx.rates.USD>0){out.USD=U.r2(1/fx.rates.USD);out.EUR=U.r2(1/fx.rates.EUR);ok++}
    const au=await get('https://api.gold-api.com/price/XAU');                               // ons altın (USD)
    if(au&&au.price>0&&out.USD>0){out.XAU=U.r2(au.price/31.1034768*out.USD);ok++}
    this.busy=false;
    if(ok)Store.dispatch({type:'settings/update',payload:{rates:out,ratesAt:Date.now()}});
    if(manual)Toast.show(ok?'✓ Kurlar güncellendi':'⚠️ Kurlar alınamadı, internet bağlantını kontrol et');return ok},
  auto(){const st=Store.get().settings;if(st.autoRates===false||!navigator.onLine)return;if(Date.now()-(st.ratesAt||0)>6*3600e3)this.fetch(false)}};

/* ---------- Takvim (.ics) dışa aktarma: telefon takvimi gerçek bildirim gönderir ---------- */
const ICS={
  esc:v=>String(v).replace(/\\/g,'\\\\').replace(/[;,]/g,m=>'\\'+m).replace(/\n/g,'\\n'),
  d:s=>s.replace(/-/g,''),
  next:s=>U.addDays(s,1),
  build(o){const s=Store.get(),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cuzdan//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Cüzdan Ödemeleri','X-WR-TIMEZONE:Europe/Istanbul'];
    const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    const trig={0:'PT9H',1:'-PT15H',3:'-P2DT15H'};   // tüm gün etkinliğinde: aynı gün 09:00, 1 gün önce 09:00, 3 gün önce 09:00
    const alarms=o.alarms.map(a=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Cüzdan hatırlatması','TRIGGER:'+trig[a],'END:VALARM']).flat();
    let n=0;const ev=(uid,date,title,desc,rrule)=>{n++;L.push('BEGIN:VEVENT','UID:'+uid+'@cuzdan','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+this.d(date),'DTEND;VALUE=DATE:'+this.d(this.next(date)),
      'SUMMARY:'+this.esc(title),'DESCRIPTION:'+this.esc(desc),...(rrule?['RRULE:'+rrule]:[]),'TRANSP:TRANSPARENT',...alarms,'END:VEVENT')};
    if(o.cards)s.accounts.filter(a=>a.type==='credit').forEach(a=>{const m=D.cardSummary(s,a.id);const first=m.lastRemaining>0?m.lastDue:m.openDue;
      ev('card-'+a.id,first,a.name+' son ödeme',`Kredi kartı son ödeme günü. Güncel tutar için Cüzdan'ı aç.`,'FREQ=MONTHLY;BYMONTHDAY='+Math.min(28,a.credit.dueDay))});
    if(o.rec)s.recurring.forEach(r=>{const c=D.recurCycle(r);ev('rec-'+r.id,c.date,(r.type==='income'?'Gelir: ':'')+r.name+' · '+U.money(r.amount,{raw:true}),'Düzenli '+(r.type==='income'?'gelir':'ödeme'),'FREQ=MONTHLY;BYMONTHDAY='+Math.min(28,r.day))});
    if(o.loans)s.loans.forEach(l0=>{const l=D.loan(s,l0.id);l.schedule.filter(x=>!x.paid).forEach(x=>ev('loan-'+l.id+'-'+x.k,x.date,`${l.name} ${x.k+1}/${l.count} · ${U.money(x.amount,{raw:true})}`,'Kredi taksiti'))});
    if(o.debts)(s.debts||[]).forEach(x=>{const d=D.debt(s,x.id);if(d.due&&!d.done)ev('debt-'+d.id,d.due,(d.dir==='lent'?d.person+' sana ödeyecek':d.person+' kişisine ödeme')+' · '+U.money(d.remaining,{raw:true}),d.note||'Borç / alacak vadesi')});
    if(o.goals)s.goals.forEach(g0=>{const g=D.goal(s,g0.id);if(g.deadline&&!g.done)ev('goal-'+g.id,g.deadline,'Kumbara hedefi: '+g.name,`Hedef ${U.money(g.target,{raw:true})}, biriken ${U.money(g.saved,{raw:true})}`)});
    L.push('END:VCALENDAR');return{text:L.join('\r\n'),count:n}},
  async share(o){const{text,count}=this.build(o);if(!count){Toast.show('Aktarılacak hatırlatma yok');return}
    const file=new File([text],'cuzdan-hatirlatmalar.ics',{type:'text/calendar'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Cüzdan hatırlatmaları'});return}}catch(e){if(e.name==='AbortError')return}
    Exporter.download(text,'cuzdan-hatirlatmalar.ics','text/calendar;charset=utf-8');Toast.show(`📅 ${count} hatırlatma hazır; dosyayı açıp takvime ekle`,4500)}};
