C.todayPanel=(s,ui)=>{const nw=D.netWorth(s),T=U.today(),liq=D.liquidAt(s,T),prev=D.liquidAt(s,U.addMonths(T,-1));
  const ch=prev?U.r2((liq-prev)/Math.abs(prev)*100):null,cc=ch===null||Math.abs(ch)<.05?'flat':ch>0?'up':'down';
  return `<section class="glass gw-panel today-panel"><div class="tp-bal"><div class="gw-title"><h2>Kullanılabilir bakiye</h2></div>
    <div class="hero-amount" data-count="${liq}" data-fmt="big" data-key="liq">${U.bigMoney(liq)}</div>
    <div class="gw-meta"><span class="gw-chg ${cc}">${ch===null?'İlk ay':(ch>0?'+':ch<0?'−':'')+'%'+Math.abs(ch).toLocaleString('tr-TR',{maximumFractionDigits:1})}</span>geçen aya göre</div>
    <div class="tp-foot"><span>Net varlık <b class="num" data-count="${nw.net}" data-fmt="money" data-key="net">${U.money(nw.net,{dec:false})}</b></span>${s.settings.moodColors!==false||D.mood(s).lvl?C.moodPill(s):''}</div></div>
    <div class="tp-flow">${C.flow(s,ui,{bare:true})}</div></section>`};
C.upKey=x=>x.kind==='stmt'?'stmt:'+x.accId+':'+x.idx:x.kind==='loan'?'loan:'+x.id:x.kind==='debt'?'debt:'+x.id:'';
C.payments=s=>{const all=D.upcoming(s),keys=new Set(all.map(C.upKey).filter(Boolean)),list=all.slice(0,3);
  const alerts=D.insights(s).filter(i=>i.sev==='danger'&&!(i.key&&keys.has(i.key)));
  const al=alerts.map(i=>{const act=i.on?i.on:i.go?`App.push('${i.go[0]}',${JSON.stringify(i.go[1])})`:'';
    return `<button class="row pay-alert ${act?'pressable':''}" ${act?`onclick="${U.esc(act)}"`:''}><span class="gw-chip sev-danger">${C.ic(i.icon)}</span><div class="mid"><b>${U.esc(i.title)}</b><span>${i.text}</span></div></button>`}).join('');
  const more=all.length-list.length;
  return `<section class="glass gw-panel pay-panel" id="home-pay">${al||list.length?`<div class="list">${al}${list.map(C.upItem).join('')}</div>`
      :`<div class="pay-ok">${C.ic('check')}<span><b>Yaklaşan ödeme yok</b>Önümüzdeki 5 hafta temiz.</span></div>`}
    ${more>0?`<button class="pay-more pressable" onclick="App.go('plan','cal')">${more} ödeme daha · Takvimde gör${C.ic('chev')}</button>`:''}</section>`};
C.cardsPanel=(s,ui)=>{const w=C.wallet(s,ui),rest=s.accounts.filter(a=>a.type!=='credit');
  const rows=rest.map(a=>{const b=D.balance(s,a.id);return `<button class="row pressable" data-acc="${a.id}" onclick="App.openAcc('${a.id}')"><span class="ic" style="background:${grad(a.color)};color:#fff">${C.ic(accIcon(a))}</span>
    <div class="mid"><b>${U.esc(a.name)}</b><span>${U.esc(a.bank||(U.lc(a.name)!==U.lc(ACCOUNT_TYPES[a.type].name)?ACCOUNT_TYPES[a.type].name:'Hesap'))}${a.currency!=='TRY'?' · ≈ '+U.money(D.toTRY(s,b,a.currency),{dec:false}):''}</span></div><div class="end"><b class="num ${b<0?'neg':''}">${U.money(b,{cur:a.currency})}</b></div></button>`}).join('');
  return `<section class="glass gw-panel cards-panel ${w?'':'no-cards'}">${w?`<div class="cp-wallet">${w}</div>`:''}<div class="cp-accts"><div class="gw-title"><h2>Hesaplar</h2></div>
    <div class="list">${rows}<button class="row pressable cp-add" onclick="AccForm.open()"><span class="ic">${C.ic('plus')}</span><div class="mid"><b>Hesap ekle</b></div></button></div></div></section>`};
WIDGETS.today={name:'Bugün · bakiye ve nakit akışı',icon:'wallet',sizes:['l'],r:(s,ui)=>C.todayPanel(s,ui)};
WIDGETS.payments={name:'Ödemeler ve uyarılar',icon:'calendar',sizes:['l'],r:s=>C.payments(s)};

/* Ana Sayfa grupları: ardışık widget'lar tek başlık altında toplanır */
const HOME_GROUPS={today:{t:'Bugün'},pay:{t:'Ödemeler',link:["App.go('plan','cal')",'Takvim']},cards:{t:'Kartlar ve hesaplar',link:["App.push('accounts',{})",'Tümü']},recent:{t:'Son işlemler',link:["App.go('txs')",'Tümü']}};
const HOME_GROUP_OF={today:'today',net:'today',flow:'today',payments:'pay',nextpay:'pay',budget:'pay',debts:'pay',limit:'pay',future:'pay',cards:'cards',recent:'recent',goals:'recent',goalmini:'recent'};
const homeGroupOf=(id,size)=>id==='budget'&&size!=='s'?null:HOME_GROUP_OF[id]||null;
const WIDGET_DEFAULT=[['today','l'],['payments','l'],['budget','s'],['debts','s'],['cards','l'],['recent','m'],['goals','m']];
const WIDGET_KEEP_ON_MIGRATE=['limit','goalmini','spending','installments','future'];
const Widgets={draft:null,
  list(s){if(UI.homeEdit&&this.draft)return this.draft;let w=s.settings.widgets;if(!Array.isArray(w))w=this.migrate(s);return w.filter(x=>WIDGETS[x[0]])},
  /* yeni varsayılan düzen; eski kayıttan yalnızca varsayılanda olmayan ek widget'lar (limit, taksit yükü…) korunur */
  migrate(s,old){const keep=(Array.isArray(old)?old:[]).filter(x=>WIDGETS[x[0]]&&WIDGET_KEEP_ON_MIGRATE.includes(x[0])&&!WIDGET_DEFAULT.some(d=>d[0]===x[0]));
    return [...WIDGET_DEFAULT.map(x=>[...x]),...keep.map(x=>[...x])]},
  toAlerts(){const el=document.getElementById('home-pay')||document.querySelector('.hg[data-g=pay]');Haptic.tap();
    if(el)el.scrollIntoView({behavior:Motion.reduced()?'auto':'smooth',block:'start'});else App.go('plan','cal')},
  edit(on){if(on){if(UI.homeEdit)return;UI.homeEdit=true;this.draft=this.list(Store.get()).map(x=>[...x]);Haptic.success();if(UI.tab!=='home'||UI.stack.length){UI.tab='home';UI.stack=[]}}
    else{if(!UI.homeEdit)return;UI.homeEdit=false;const d=this.draft;this.draft=null;if(d){Store.dispatch({type:'settings/update',payload:{widgets:d}});Toast.show('✓ Ana Sayfa kaydedildi')}}
    App.render()},
  remove(id){this.draft=this.draft.filter(x=>x[0]!==id);Haptic.tap();App.render()},
  resize(id){const w=this.draft.find(x=>x[0]===id),sz=WIDGETS[id].sizes;w[1]=sz[(sz.indexOf(w[1])+1)%sz.length];Haptic.tap();App.render()},
  add(id,size){const ex=this.draft.find(x=>x[0]===id);if(ex)ex[1]=size;else this.draft.unshift([id,size]);Sheet.close();Haptic.success();App.render();window.scrollTo({top:0,behavior:'smooth'})},
  gallery(){const on=new Map(this.draft.map(x=>[x[0],x[1]]));const SZ={s:'Küçük',m:'Orta',l:'Büyük'};
    Sheet.open(Sheet.head('Widget ekle',{left:'Kapat',right:''})+`<div class="wg-list">${Object.entries(WIDGETS).map(([id,w])=>`<div class="wg-row glass">${C.icb(w.icon,'#0a84ff')}
      <div class="mid"><b>${w.name}</b><span>${on.has(id)?'Ana Sayfada · '+SZ[on.get(id)]:'Ekli değil'}</span></div>
      <div class="wg-sz">${w.sizes.map(z=>`<button class="chip pressable ${on.get(id)===z?'on':''}" onclick="Widgets.add('${id}','${z}')">${SZ[z]}</button>`).join('')}</div></div>`).join('')}</div>`)},
  editBar(){return `<div class="w-editbar glass"><button onclick="Widgets.gallery()">${C.ic('plus')}Ekle</button><span>Basılı tut ve sürükle</span><button class="done" onclick="Widgets.edit(false)">Bitti</button></div>`},
  /* basılı tut → düzenleme; düzenlemede sürükle-bırak */
  init(){let lp=null;
    const skip='.swipe-fg,[data-lp],input,textarea,select,.seg,.lc-wrap,.w-del,.w-size,.carousel .acc-tile:active';
    document.addEventListener('pointerdown',e=>{if(e.button>0||UI.homeEdit)return;const w=e.target.closest&&e.target.closest('.wgrid .w');if(!w||e.target.closest(skip))return;
      lp={x:e.clientX,y:e.clientY,t:setTimeout(()=>{lp=null;Gesture.blockClick();this.edit(true)},600)}},{passive:true});
    const cancel=e=>{if(lp&&(!e||e.type!=='pointermove'||Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>8)){clearTimeout(lp.t);lp=null}};
    document.addEventListener('pointermove',cancel,{passive:true});document.addEventListener('pointerup',cancel);document.addEventListener('pointercancel',cancel);
    addEventListener('scroll',()=>cancel(),{passive:true});
    /* sürükleme: dokunmatik (bekle-sürükle) */
    document.addEventListener('touchstart',e=>{const sh=e.target.closest&&e.target.closest('.w-shield');if(!sh)return;const t=e.touches[0];
      const d=this.d={el:sh.parentElement,x:t.clientX,y:t.clientY,started:false,touch:true};d.tm=setTimeout(()=>{if(this.d===d)this.start(d.x,d.y)},180)},{passive:true});
    document.addEventListener('touchmove',e=>{const d=this.d;if(!d||!d.touch)return;const t=e.touches[0];
      if(!d.started){if(Math.hypot(t.clientX-d.x,t.clientY-d.y)>8){clearTimeout(d.tm);this.d=null}return}
      if(e.cancelable)e.preventDefault();this.move(t.clientX,t.clientY)},{passive:false});
    const tend=()=>{const d=this.d;if(!d||!d.touch)return;clearTimeout(d.tm);if(d.started)this.drop();this.d=null};
    document.addEventListener('touchend',tend);document.addEventListener('touchcancel',tend);
    /* sürükleme: fare */
    document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;const sh=e.target.closest&&e.target.closest('.w-shield');if(!sh)return;this.d={el:sh.parentElement,x:e.clientX,y:e.clientY,started:false}});
    document.addEventListener('pointermove',e=>{const d=this.d;if(!d||d.touch||e.pointerType==='touch')return;if(!d.started){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<5)return;this.start(d.x,d.y)}this.move(e.clientX,e.clientY)});
    document.addEventListener('pointerup',e=>{const d=this.d;if(!d||d.touch||e.pointerType==='touch')return;if(d.started){Gesture.blockClick();this.drop()}this.d=null})},
  start(x,y){const d=this.d;if(!d)return;d.started=true;const r=d.el.getBoundingClientRect();d.ox=x-r.left;d.oy=y-r.top;
    const g=d.el.cloneNode(true);g.classList.add('w-ghost');g.style.cssText=`width:${r.width}px;height:${r.height}px;left:${r.left}px;top:${r.top}px`;document.body.appendChild(g);d.ghost=g;
    d.el.classList.add('w-ph');Haptic.success();this.scrollLoop()},
  /* animasyon sırasındaki kaymayı (translate) çıkararak gerçek yerleşim konumu */
  lrect(el){const r=el.getBoundingClientRect(),t=(getComputedStyle(el).translate||'').split(' ').map(parseFloat),tx=t[0]||0,ty=t[1]||0;return{left:r.left-tx,right:r.right-tx,top:r.top-ty,bottom:r.bottom-ty}},
  move(x,y){const d=this.d;if(!d||!d.started||!isFinite(x)||!isFinite(y))return;d.lx=x;d.ly=y;d.ghost.style.left=(x-d.ox)+'px';d.ghost.style.top=(y-d.oy)+'px';
    const grid=document.getElementById('wgrid');const items=[...grid.querySelectorAll(':scope>.w')];const me=items.indexOf(d.el);
    if(performance.now()-(d.lastSwap||0)<120)return;
    const tgt=items.find(el=>{if(el===d.el)return false;const r=this.lrect(el);return x>r.left&&x<r.right&&y>r.top&&y<r.bottom});if(!tgt)return;
    const ti=items.indexOf(tgt),first=new Map(items.map(el=>[el,el.getBoundingClientRect()]));d.lastSwap=performance.now();
    grid.insertBefore(d.el,ti>me?tgt.nextSibling:tgt);Haptic.tap();
    items.forEach(el=>{if(el===d.el)return;const a=first.get(el),b=el.getBoundingClientRect();const dx=a.left-b.left,dy=a.top-b.top;if(!dx&&!dy)return;
      el.style.transition='none';el.style.translate=`${dx}px ${dy}px`;requestAnimationFrame(()=>{el.style.transition='translate .3s var(--ease)';el.style.translate='0 0'})})},
  scrollLoop(){const d=this.d;if(!d||!d.started)return;const y=d.ly??d.y;if(y<110)scrollBy(0,-9);else if(y>innerHeight-130)scrollBy(0,9);if(d.lx!=null&&(y<110||y>innerHeight-130))this.move(d.lx,y);requestAnimationFrame(()=>this.scrollLoop())},
  drop(){const d=this.d;if(!d)return;const r=d.el.getBoundingClientRect(),g=d.ghost;g.style.transition='left .25s var(--ease),top .25s var(--ease),transform .25s';g.style.left=r.left+'px';g.style.top=r.top+'px';g.style.transform='scale(1)';
    setTimeout(()=>{g.remove();d.el.classList.remove('w-ph');const order=[...document.querySelectorAll('#wgrid>.w')].map(el=>el.dataset.wid);
      this.draft.sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));document.querySelectorAll('#wgrid>.w').forEach(el=>{el.style.translate='';el.style.transition=''});App.render()},250)}};
Screens.home=(s,ui)=>{if(!s.accounts.length)return Onboard.render(s,ui);const edit=!!ui.homeEdit,runs=[];
  const items=Widgets.list(s).map(([id,size])=>{const def=WIDGETS[id];let inner='';try{inner=def.r(s,ui,size)||''}catch(e){inner=''}
    if(!inner&&!edit)return '';if(!inner)inner=`<div class="w-empty glass">${C.ic(def.icon)}<b>${def.name}</b><span>Şu an gösterilecek veri yok</span></div>`;
    return `<section class="w w-${size}" data-key="w-${id}-${size}" data-wid="${id}" aria-label="${U.esc(def.name)}">${inner}${edit?`<div class="w-shield" aria-hidden="true"></div><button class="w-del" onclick="Widgets.remove('${id}')" aria-label="${U.esc(def.name)} kaldır">${C.ic('minus')}</button>${def.sizes.length>1?`<button class="w-size" onclick="Widgets.resize('${id}')" aria-label="${U.esc(def.name)} boyutunu değiştir">${C.ic('layout')}</button>`:''}`:''}</section>`});
  let body;if(edit)body=items.join('');else{Widgets.list(s).forEach(([id,size],i)=>{if(!items[i])return;const g=homeGroupOf(id,size),last=runs[runs.length-1];
      if(last&&last.g===g)last.h.push(items[i]);else runs.push({g,h:[items[i]]})});
    body=runs.map(r=>{const G=r.g&&HOME_GROUPS[r.g];return `<div class="hg" ${r.g?`data-g="${r.g}"`:''} role="group" ${G?`aria-label="${U.esc(G.t)}"`:''}>${G?`<div class="section-head"><h2>${G.t}</h2>${G.link?`<button onclick="${G.link[0]}">${G.link[1]}${C.ic('chev')}</button>`:''}</div>`:''}<div class="hg-body">${r.h.join('')}</div></div>`}).join('')}
  return `<div class="stagger">${C.topbar(s)}</div>${edit?Widgets.editBar():''}<div class="wgrid ${edit?'editing':'grouped'}" id="wgrid">${body}</div>
    ${edit?'':`<div class="home-edit"><button class="glass pressable" onclick="Widgets.edit(true)">${C.ic('layout')}Widget'ları düzenle</button></div><p class="overflow-note">İpucu: bir widget'a basılı tutarak da düzenleyebilirsin</p>`}`};

/* ---------- Ortak hesap yardımcıları ---------- */
const Calc={
  /* Eylül 2026 BDDK/TCMB azami akdi faiz tavanları (aylık %) · bankan daha düşük uygulayabilir */
  capRate:debt=>debt<30000?3.25:debt<=180000?3.75:4.25,
  TAX:1.30,   // faize KKDF %15 + BSMV %15
  /* tutar metni → sayı: "₺1.234,56" · "1,234.56" · "250.00" · "TRY 99,90" */
  amount(str){if(str==null)return null;let v=String(str).replace(/\s/g,'').replace(/[^\d.,]/g,'');if(!v)return null;
    const ld=v.lastIndexOf('.'),lc=v.lastIndexOf(',');
    if(ld>-1&&lc>-1){const dec=ld>lc?'.':',';v=v.split(dec===','?'.':',').join('');v=v.replace(dec,'.')}
    else if(lc>-1){const tail=v.length-lc-1;v=tail===3&&v.split(',').length>1&&!/^0/.test(v)&&v.length>4?v.replace(/,/g,''):v.replace(/,/g,'.')}
    else if(ld>-1){const parts=v.split('.'),tail=parts[parts.length-1].length;if(parts.length>2||tail===3)v=v.replace(/\./g,'')}
    const n=parseFloat(v);return isFinite(n)&&n>0?U.r2(n):null},
  pv(total,n,r){const p=total/n;let pv=0;for(let k=1;k<=n;k++)pv+=p/Math.pow(1+r,k);return U.r2(pv)},
  /* asgari / sabit ödeme senaryosu (yeni harcama yok varsayımı) */
  payoff(debt,{minRate,rate,fixed}){let bal=debt,paid=0,interest=0,m=0;const series=[bal];
    while(bal>0.5&&m<600){const pay=Math.min(bal,fixed?fixed:Math.max(bal*minRate,50));paid+=pay;bal-=pay;m++;
      const i=bal*rate*this.TAX;interest+=i;bal+=i;series.push(bal);if(fixed&&i>=fixed&&m>2)return{never:true,months:m,paid,interest,series}}
    return{never:bal>0.5,months:m,paid:U.r2(paid),interest:U.r2(interest),series}}};

  const push=(key,name,prev,cur,rec)=>{if(cur.date.slice(0,7)<cutoff||seen[key]===cur.id)return;const d=U.r2(cur.amount-prev.amount);if(d<=0.009||d<prev.amount*.01)return;
    out.push({key,name,prev:prev.amount,cur:cur.amount,diff:d,pct:Math.round(d/prev.amount*100),txId:cur.id,recId:rec?.id||null,stale:rec?rec.amount<cur.amount-0.009:false})};
  for(const r of s.recurring){if(r.type==='income')continue;names.add(U.norm(r.name));
    const txs=Object.entries(r.paid||{}).sort((a,b)=>a[0].localeCompare(b[0])).map(([,id])=>D.tx(s,id)).filter(t=>t&&t.amount>0);
    if(txs.length>=2)push('r:'+r.id,r.name,txs[txs.length-2],txs[txs.length-1],r)}
  const by={};s.transactions.filter(t=>t.kind==='expense'&&t.category==='subscription'&&t.merchant&&!names.has(U.norm(t.merchant))).forEach(t=>{const k=U.norm(t.merchant).replace(/[^a-z0-9]/g,'');if(k)(by[k]=by[k]||[]).push(t)});
  for(const[k,list]of Object.entries(by)){list.sort((a,b)=>a.date.localeCompare(b.date));if(list.length<2)continue;const cur=list[list.length-1],prev=list[list.length-2];
    if(cur.date.slice(0,7)!==prev.date.slice(0,7))push('m:'+k,cur.merchant,prev,cur,null)}
  return out.sort((a,b)=>b.diff-a.diff)});

   credit.limitHistory = [{from:'YYYY-MM-DD', limit}] (artan tarih). credit.limit her zaman bugünkü limit. */
D.limitHist=acc=>{const c=acc?.credit;if(!c)return[];const h=Array.isArray(c.limitHistory)?c.limitHistory.filter(x=>x&&x.from&&+x.limit>=0):[];
  return h.length?[...h].sort((a,b)=>a.from.localeCompare(b.from)):[{from:'2000-01-01',limit:+c.limit||0}]};
D.limitAt=(acc,date)=>{const h=D.limitHist(acc);let v=h[0]?.limit||0;for(const x of h){if(x.from<=date)v=+x.limit;else break}return v};
const Limits={
  add(acc,from,limit){const h=D.limitHist(acc).filter(x=>x.from!==from);h.push({from,limit:U.r2(limit)});h.sort((a,b)=>a.from.localeCompare(b.from));
    const c={...acc.credit,limitHistory:h};c.limit=D.limitAt({credit:c},U.today());return{...acc,credit:c}},
  remove(acc,from){let h=D.limitHist(acc).filter(x=>x.from!==from);if(!h.length)h=[{from:'2000-01-01',limit:+acc.credit.limit||0}];
    const c={...acc.credit,limitHistory:h};c.limit=D.limitAt({credit:c},U.today());return{...acc,credit:c}}};

{const _cs=D.cardSummary;D.cardSummary=U.memo((s,accId)=>{const r=_cs(s,accId),acc=D.account(s,accId);

  if(Math.abs(lim-r.limit)>0.009){const d=lim-r.limit;out={...r,limit:lim,available:U.r2(r.available+d),usage:lim?Math.max(0,r.used)/lim:0}}
  const sub=+acc.credit?.subLimit;
  if(r.shared&&sub>0){const usedOwn=Math.max(0,U.r2(r.own-D.statements(s,accId).credit)),subAv=U.r2(sub-usedOwn);
    out={...out,rootAvailable:out.available,rootLimit:out.limit,subLimit:sub,usedOwn,limit:sub,available:U.r2(Math.min(out.available,subAv)),usage:usedOwn/sub}}
  return out})}

/* ---------- Ziraat ekstre ayrıştırıcı (yapay zekâsız) ----------
   Çıktı Gemini'nin ekstre şemasıyla aynıdır → StatementImport.normalize ile kontrol ekranına gider. */
const ZParse={
  AMT:/-?\d{1,3}(?:\.\d{3})*,\d{2}|-?\d+,\d{2}/g,
  DATE:/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})\b/,
  iso(d,m,y){y=+y;if(y<100)y+=2000;d=+d;m=+m;if(!(m>=1&&m<=12&&d>=1&&d<=31))return null;return `${y}-${U.p2(m)}-${U.p2(d)}`},
  num(s){return U.r2(parseFloat(String(s).replace(/\./g,'').replace(',','.')))},
  low:s=>String(s).replace(/İ/g,'i').replace(/I/g,'ı').toLocaleLowerCase('tr'),
  ascii:s=>ZParse.low(s).replace(/[ıi]/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c'),
  pretty(s){s=String(s).replace(/\s{2,}/g,' ').trim();let p;do{p=s;s=s.replace(/\s+(TR|TUR|TURKEY|TÜRKİYE|TURKIYE|ISTANBUL|İSTANBUL|ANKARA|IZMIR|İZMİR|BURSA|ANTALYA|KOCAELI|KOCAELİ)$/i,'').trim()}while(s!==p);
    if(s!==s.toUpperCase())return s;return s.split(' ').map(w=>{const l=w.replace(/İ/g,'i').toLowerCase();return l.charAt(0).toLocaleUpperCase('tr')+l.slice(1)}).join(' ')},

{const _p=ZParse.parse.bind(ZParse);ZParse.parse=function(raw){const r=_p(raw),text=String(raw||'').replace(/ /g,' ').replace(/\r/g,''),A=this.ascii(text);

    const pm=prev.match(this.DATE);if(!pm)continue;const d=this.iso(pm[1],pm[2],pm[3]);const t=[...r.transactions].reverse().find(x=>x.date===d);if(t&&t.description.length<40)t.description=this.pretty(t.description+' '+this.pretty(l))}
  /* Bankkart Lira */
  const num=v=>v?this.num(v.replace('-','')):null;
  const bal=num(this.head(text,['bankkart lira bakiyesi','toplam bankkart lira','kullanilabilir bankkart lira','bankkart lira bakiye']));
  const earned=num(this.head(text,['kazanilan bankkart lira','donem ici kazanilan bankkart lira','bankkart lira kazanimi','bankkart lira kazanci']));
  const used=num(this.head(text,['kullanilan bankkart lira','harcanan bankkart lira']));
  if(bal!=null||earned!=null||used!=null)r.points={balance:bal,earned,used};
  return r}}

D.flow=U.memo((s,mode)=>{const T=U.today(),now=new Date(),cur=t=>D.account(s,t.accountId)?.currency||'TRY',B=[];
  if(mode==='week'){for(let k=6;k>=0;k--){const d=U.addDays(T,-k);B.push({from:d,to:d,label:U.fmtDate(d),tip:U.dayHeader(d)})}}
  else if(mode==='year'){const first=U.parse(s.transactions.reduce((m,x)=>x.date<m?x.date:m,T));
    const n=Math.max(2,Math.min(12,(now.getFullYear()-first.getFullYear())*12+now.getMonth()-first.getMonth()+1));
    for(let k=n-1;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1),y=d.getFullYear(),m=d.getMonth();
      B.push({from:U.monthStart(y,m),to:k?U.monthEnd(y,m):T,label:U.mon(m),tip:U.MONTHS[m]+' '+y})}}
  else{const y=now.getFullYear(),m=now.getMonth();for(let i=1;i<=U.dim(y,m);i++){const d=U.iso(new Date(y,m,i));B.push({from:d,to:d,label:U.mon(m)+' '+U.p2(i),tip:U.fmtDate(d,true),future:d>T})}}

  const totI=U.r2(pts.reduce((a,p)=>a+p.inc,0)),totE=U.r2(pts.reduce((a,p)=>a+p.exp,0));
  if(mode!=='year'){let a=0,b=0;pts.forEach(p=>{a+=p.inc;b+=p.exp;p.inc=U.r2(a);p.exp=U.r2(b)})}
  return{pts,inc:totI,exp:totE}});

/* ---------- 95_cz_features.js ----------
   Bankayla eşitle · ekstre karşılaştırma (içe aktarmadan önce) · ay sonu tahmini · taksit takvimi
   hızlı ekleme (URL, sık kullanılanlar, Siri) · harcama formunda fiş tarama
   Tek isim alanı: CzX. Durum: credit.limitHistory / credit.lastSync (hesap), settings.czInstComfort. */
const CzX={
  valid:d=>/^\d{4}-\d{2}-\d{2}$/.test(d||''),
  group(s,rootId){return s.accounts.filter(x=>x.type==='credit'&&(x.id===rootId||x.credit.sharedWith===rootId)).map(x=>x.id)},
  /* kategori: anahtar ("market") ya da Türkçe ad ("Market", "yeme") kabul edilir */
  catKey(v){const k=U.lc(v).trim();if(!k)return '';const all=expenseCats();if(all.includes(k))return k;
    const hit=all.find(c=>U.lc(cat(c).name)===k)||all.find(c=>U.lc(cat(c).name).startsWith(k)||k.startsWith(U.lc(cat(c).name).split(' ')[0]));
    return hit||''},
  whenReady(fn,tries=0){const ok=Security.unlocked&&!document.getElementById('lock');if(ok)return setTimeout(fn,500);if(tries<240)setTimeout(()=>this.whenReady(fn,tries+1),500)},
  baseUrl:()=>String(location.href).split(/[?#]/)[0]
};

/* ===================== 1) Bankayla eşitle ===================== */
CzX.sync={id:null,
  open(id,keep){const s=Store.get(),a0=D.account(s,id);if(!a0||a0.type!=='credit')return;const root=D.limitRoot(s,a0),m=D.cardSummary(s,root.id);this.id=root.id;if(!keep)this.done=null;
    Sheet.open(Sheet.head('Bankayla eşitle',{left:'Kapat',right:''})+'<i data-full hidden></i>'+
      `<p class="muted sm cz-lead">Bankanın uygulamasında görünen <b>Güncel borç</b> ve <b>Kullanılabilir limit</b> değerlerini yaz. Cüzdan farkı gösterir ve tek dokunuşla düzeltir.${root.id!==a0.id?` Sanal kart, ${U.esc(root.name)} limitini paylaştığı için eşitleme ana kart üzerinden yapılır.`:''}</p>
      <div class="grid2"><label class="field"><span>Güncel borç (₺)</span><input class="input num" id="cz-sd" inputmode="decimal" autocomplete="off" placeholder="${F.money(U.r2(m.used))}"></label>
        <label class="field"><span>Kullanılabilir limit (₺)</span><input class="input num" id="cz-sa" inputmode="decimal" autocomplete="off" placeholder="${F.money(U.r2(m.available))}"></label></div>
      <div id="cz-sync-out">${this.out()}</div>`,
      bd=>{bd.querySelectorAll('#cz-sd,#cz-sa').forEach(el=>el.addEventListener('input',()=>{const o=Sheet.el('#cz-sync-out');if(o)o.innerHTML=this.out()}))})},
  vals(){const s=Store.get(),root=D.account(s,this.id),m=D.cardSummary(s,this.id),d=U.parseNum(Sheet.val('#cz-sd')),a=U.parseNum(Sheet.val('#cz-sa'));
    const hasD=Number.isFinite(d),hasA=Number.isFinite(a),lim=D.limitAt(root,U.today()),implied=hasD&&hasA?U.r2(d+a):null;
    return{s,root,m,d,a,hasD,hasA,lim,implied,dDiff:hasD?U.r2(d-m.used):0,aDiff:hasA?U.r2(a-m.available):0,lDiff:implied!=null?U.r2(implied-lim):0}},
  out(){if(!this.id||!Sheet.el('#cz-sd'))return this.table(null);const v=this.vals(),acts=[];
    const fixD=v.hasD&&Math.abs(v.dDiff)>=0.01,fixL=v.implied!=null&&v.implied>0&&Math.abs(v.lDiff)>=0.01;
    let verdict='';
    if(this.done&&!v.hasD&&!v.hasA)verdict=`<div class="cz-verdict ok">${C.ic('check')}<span>${this.done}</span></div>`;
    else if(v.hasD||v.hasA){const ok=!fixD&&!fixL&&(!v.hasA||Math.abs(v.aDiff)<0.01);
      verdict=ok?`<div class="cz-verdict ok">${C.ic('check')}<span>Cüzdan bankayla birebir aynı.</span></div>`
        :`<div class="cz-verdict warn">${C.ic('alert')}<span>${fixD?`Borçta ${U.money(Math.abs(v.dDiff))} fark var: Cüzdan'da ${v.dDiff>0?'eksik harcama':'fazla harcama ya da eksik iade/ödeme'} olabilir.`:''}${fixD&&fixL?'<br>':''}${fixL?`Banka limitini ${U.money(v.implied,{dec:false})} gösteriyor; Cüzdan'da ${U.money(v.lim,{dec:false})} kayıtlı.`:''}${!fixD&&!fixL&&v.hasA?`Kullanılabilir limitte ${U.money(Math.abs(v.aDiff))} fark var. Borcu da yazarsan nedenini bulalım.`:''}</span></div>`}
    if(fixL)acts.push(`<button class="btn pressable" onclick="CzX.sync.apply('limit')">${C.ic('card')}Limiti ${U.money(v.implied,{dec:false})} olarak güncelle</button>`);
    if(fixD){const o=D.openIdx(v.root.credit);acts.push(`<button class="btn pressable" onclick="CzX.sync.apply('debt')">${C.ic('edit')}${U.money(Math.abs(v.dDiff))} düzeltme ekle · ${D.stmtName(o)}</button>`)}
    if(fixD&&fixL)acts.unshift(`<button class="btn primary pressable" onclick="CzX.sync.apply('all')">${C.ic('check')}İkisini de düzelt</button>`);
    return verdict+this.table(v)+acts.join('')+`<p class="muted xs cz-note">Düzeltme, açık dönemin (${D.stmtName(D.openIdx(D.account(Store.get(),this.id).credit))}) ekstresine tek bir işlem olarak eklenir; sonradan silebilirsin. Limit değişikliği bugünden itibaren geçerli olur, eski ekstreler eski limitle kalır.</p>`},
  table(v){if(!v)return '';const n=x=>U.money(x).replace(/\s*₺$/,''),cell=(b,a,diff,has)=>`<span class="num">${has?n(b):'—'}</span><span class="num">${n(a)}</span><span class="num ${has&&Math.abs(diff)>=0.01?'cz-bad':'cz-ok'}">${has?(Math.abs(diff)<0.01?'✓':(diff>0?'+':'−')+n(Math.abs(diff))):''}</span>`;
    return `<div class="glass cz-cmp" role="table" aria-label="Banka ve Cüzdan karşılaştırması"><div class="cz-cmp-h" role="row"><span>₺</span><span>Banka</span><span>Cüzdan</span><span>Fark</span></div>
      <div class="cz-cmp-r" role="row"><b>Güncel borç</b>${cell(v.d,v.m.used,v.dDiff,v.hasD)}</div>
      <div class="cz-cmp-r" role="row"><b>Kullanılabilir</b>${cell(v.a,v.m.available,v.aDiff,v.hasA)}</div>
      <div class="cz-cmp-r" role="row"><b>Limit</b>${cell(v.implied,v.lim,v.lDiff,v.implied!=null)}</div></div>`},
  apply(what){const v=this.vals();if(!v.hasD&&what!=='limit'){Toast.show('Güncel borcu yaz');return}

    if((what==='limit'||what==='all')&&v.implied!=null&&v.implied>0&&Math.abs(v.lDiff)>=0.01){root=Limits.add(root,T,v.implied);msg.push('limit '+U.money(v.implied,{dec:false}))}

    if((what==='debt'||what==='all')&&v.hasD&&Math.abs(v.dDiff)>=0.01){diff=v.dDiff;const base={id:U.uid(),accountId:v.root.id,amount:U.r2(Math.abs(diff)),date:T,merchant:'Banka düzeltmesi',category:'other',note:'Bankayla eşitleme',source:'adjust'};
      acts.push({type:'upsert',col:'transactions',item:diff>0?{...base,kind:'expense',installments:1}:{...base,kind:'refund'}});msg.push('borç '+U.money(v.d))}
    if(!acts.length&&root===v.root){Toast.show('Düzeltilecek fark yok');return}
    root={...root,credit:{...root.credit,lastSync:{date:T,debt:v.hasD?U.r2(v.d):null,available:v.hasA?U.r2(v.a):null}}};
    acts.unshift({type:'upsert',col:'accounts',item:root});
    Store.dispatch({type:'batch',actions:acts});
    /* doğrula: yeniden hesapla; FIFO dağıtımı nedeniyle kalan kuruş farkı olursa bir kez daha düzelt */
    if(v.hasD&&diff){let m2=D.cardSummary(Store.get(),v.root.id),rest=U.r2(v.d-m2.used);
      if(Math.abs(rest)>=0.01){const t=acts.find(a=>a.col==='transactions').item,amt=U.r2(t.amount+(t.kind==='expense'?rest:-rest));
        if(amt>0)Store.dispatch({type:'upsert',col:'transactions',item:{...t,amount:amt}});m2=D.cardSummary(Store.get(),v.root.id);rest=U.r2(v.d-m2.used)}
      if(Math.abs(rest)>=0.01){Haptic.error&&Haptic.error();Toast.show(`⚠️ Düzeltme sonrası ${U.money(Math.abs(rest))} fark kaldı; ekstreleri kontrol et`,5000)}}
    Haptic.success();Toast.show('✓ Bankayla eşitlendi'+(msg.length?' · '+msg.join(', '):''));
    this.done=`Eşitlendi: ${msg.join(' · ')||'güncel'}. Borç ${U.money(D.cardSummary(Store.get(),this.id).used)}, kullanılabilir ${U.money(D.cardSummary(Store.get(),this.id).available)}.`;
    this.open(this.id,true)},
  /* kart sayfası paneli: son eşitleme + limit geçmişi */
  panel(s,a){const root=D.limitRoot(s,a)||a,ls=root.credit.lastSync,h=D.limitHist(root).filter(x=>x.from>'2000-01-02').slice(-3).reverse(),T=U.today();

      <button class="mini-btn" onclick="CzX.sync.open('${a.id}')">Eşitle</button></div>
      <div class="cz-lh"><span class="cz-lh-t">Limit geçmişi</span>${h.length?h.map((x,i)=>{const prev=all[all.indexOf(x)-1];return `<span class="cz-lh-i"><b class="num">${U.money(x.limit,{dec:false})}</b><small>${U.fmtDate(x.from)}${prev?` · ${x.limit>=prev.limit?'+':'−'}${U.money(Math.abs(x.limit-prev.limit),{dec:false})}`:''}${x.from>T?' · ileri tarihli':''}</small></span>`}).join(''):`<span class="cz-lh-i"><b class="num">${U.money(D.limitAt(root,T),{dec:false})}</b><small>değişiklik yok</small></span>`}
      <button class="cz-lh-more pressable" onclick="LimitSheet.open('${a.id}')" aria-label="Limit geçmişinin tamamı">Tümü ›</button></div></div>`}
};

/* ===================== 3) Ay sonu tahmini ===================== */
D.czProjection=U.memo((s,accId)=>{const a=D.account(s,accId);if(!a||a.type!=='credit')return null;
  const c=a.credit,o=D.openIdx(c),st=D.stmtAt(s,accId,o),T=U.today(),from=U.addDays(T,-29);
  const recent=s.transactions.filter(t=>t.accountId===accId&&t.date>=from&&t.date<=T&&t.source!=='adjust');
  const spent=recent.filter(t=>t.kind==='expense'&&(+t.installments||1)===1).reduce((x,t)=>x+t.amount,0)-recent.filter(t=>t.kind==='refund'&&!t.refOf).reduce((x,t)=>x+t.amount,0);
  const daily=U.r2(Math.max(0,spent)/30),days=Math.max(0,U.daysUntil(st.cut));
  const inst=U.r2(st.lines.filter(l=>l.kind==='inst'&&l.n>1).reduce((x,l)=>x+l.amount,0));
  const extra=U.r2(daily*days),projected=U.r2(st.total+extra),last=D.stmtAt(s,accId,o-1).total,m=D.cardSummary(s,accId);
  return{idx:o,cut:st.cut,days,daily,current:U.r2(st.total-inst),inst,extra,total:st.total,projected,last,available:m.available,
    vsLast:last>0?(projected-last)/last:null,overAvail:m.available>0&&projected>0.8*m.available,overLast:last>0&&projected>last*1.25}});
CzX.proj={
  panel(s,a){const P=D.czProjection(s,a.id);if(!P)return '';const max=Math.max(P.projected,P.last,1),w=x=>Math.max(0,Math.min(100,x/max*100)).toFixed(1);
    const warn=P.overAvail||P.overLast;
    return `<div class="glass cz-panel cz-proj"><div class="cz-ph"><div><b>Ay sonu tahmini · ${D.stmtName(P.idx)} ekstresi</b><span>Kesime ${P.days?P.days+' gün':'bugün'} · ${U.fmtDate(P.cut)}</span></div>
      <b class="num cz-big ${warn?'cz-bad':''}">${U.money(P.projected,{dec:false})}</b></div>
      <div class="cz-bar" role="img" aria-label="Şu ana kadar ${U.money(P.total,{dec:false})}, tahmini ek ${U.money(P.extra,{dec:false})}"><span class="cz-bar-now" style="width:${w(Math.max(0,P.total))}%"></span><span class="cz-bar-add" style="width:${w(P.extra)}%"></span>${P.last>0?`<i class="cz-bar-last" style="left:${w(P.last)}%" title="Geçen ekstre"></i>`:''}</div>
      <div class="cz-legend"><span><i class="cz-sw now"></i>Şu ana kadar ${U.money(P.current,{dec:false})}</span>${P.inst?`<span><i class="cz-sw now"></i>Taksitler ${U.money(P.inst,{dec:false})}</span>`:''}<span><i class="cz-sw add"></i>Tahmini ek ${U.money(P.extra,{dec:false})}</span>${P.last>0?`<span><i class="cz-sw last"></i>Geçen ekstre ${U.money(P.last,{dec:false})}</span>`:''}</div>
      <p class="muted xs cz-note">Son 30 günde bu kartta günde ortalama ${U.money(P.daily,{dec:false})} tek çekim harcama × kesime kalan ${P.days} gün, bu döneme düşen taksitler dahil.${P.vsLast!=null?` Geçen ekstreye göre ${P.vsLast>=0?'%'+Math.round(P.vsLast*100)+' fazla':'%'+Math.round(-P.vsLast*100)+' az'}.`:''}${P.overAvail?(P.available>0?` ⚠️ Kullanılabilir limitin (${U.money(P.available,{dec:false})}) %80'ini aşıyor.`:' ⚠️ Kullanılabilir limit kalmadı.'):''}</p></div>`}
};
{const _ins=D.insights;D.insights=U.memo(s=>{const out=[..._ins(s)];
  s.accounts.filter(a=>a.type==='credit').forEach(a=>{const P=D.czProjection(s,a.id);if(!P||P.projected<=0||!(P.overAvail||P.overLast))return;
    out.unshift({sev:P.overAvail?'danger':'warn',icon:'up',title:a.name+' · ay sonu tahmini',
      text:`${D.stmtName(P.idx)} ekstresi bu hızla ~${U.money(P.projected,{dec:false})} olacak`+(P.overAvail?(P.available>0?`; kullanılabilir limitin (${U.money(P.available,{dec:false})}) %80'ini aşıyor.`:`; kartta kullanılabilir limit kalmadı (${U.money(P.available,{dec:false})}).`):`, geçen ekstreden %${Math.round(P.vsLast*100)} fazla.`),go:['card',{id:a.id}]})});
  return out})}

    this.st.acc=accId||'';if(!this.st.card||!D.account(s,this.st.card))this.st.card=accId||cards[0].id;const st=this.st,cf=s.settings.czInstComfort;
    Sheet.open(Sheet.head('Taksit takvimi',{left:'Kapat',right:''})+'<i data-full hidden></i>'+
      `<label class="field"><span>Kart</span><select class="input" onchange="CzX.inst.set('acc',this.value)">${F.accOpts(cards,st.acc,`<option value="" ${st.acc?'':'selected'}>Tüm kartlar</option>`)}</select></label>
      <div class="glass cz-panel"><div id="cz-ic-chart">${this.chart()}</div></div>

CzX.cmp={
  calc(){const I=ImportSheet,s=Store.get(),acc=D.account(s,I.accId);if(!acc||acc.type!=='credit')return null;const c=acc.credit,m=I.meta||{},rows=I.rows||[];
    const dates=rows.map(r=>r.date).filter(CzX.valid).sort(),idx=CzX.valid(m.cut)?D.stmtIdx(c,m.cut):dates.length?D.stmtIdx(c,dates[dates.length-1]):D.openIdx(c);

    const used=new Set(),dd=(x,y)=>Math.abs(U.daysUntil(x)-U.daysUntil(y)),tok=x=>new Set(U.norm(x).split(' ').filter(w=>w.length>=3));
    const sim=(a,b)=>{const A=tok(a),B=tok(b);let n=0;A.forEach(w=>{if(B.has(w)||[...B].some(v=>v.startsWith(w)||w.startsWith(v)))n++});return n};

  },

CzY.sh={api:null,uid:null,email:null,spaces:[],invites:[],items:{},un:[],itemUn:null,itemSid:null,ym:null,cur:null,err:'',ready:false,
  SID:'cz_y_sid',
  adapter(){return this.api||(Cloud.api&&Cloud.api.sdk&&Cloud.api.sdk.Fs?this.fb:null)},
  myName(){return Store.get().settings.name||(this.email||'').split('@')[0]||'Ben'},
  sync(){const u=Cloud.user,uid=u?u.uid:null,A=this.adapter();if(uid===this.uid&&(!uid||this.un.length||!A))return;
    this.stop();this.uid=uid;this.email=u&&u.email?String(u.email).toLowerCase():null;if(!uid||!A)return;
    try{this.un.push(A.watchSpaces(uid,list=>{this.spaces=list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'tr'));this.ready=true;this.err='';this.refresh()},e=>this.fail(e)));
      if(this.email)this.un.push(A.watchInvites(this.email,list=>{this.invites=list.filter(x=>!(x.members||[]).includes(uid));this.refresh()},e=>this.fail(e)))}catch(e){this.fail(e)}},
  stop(){this.un.forEach(f=>{try{f&&f()}catch(e){}});this.un=[];this.unItems();this.spaces=[];this.invites=[];this.items={};this.ready=false},
  unItems(){if(this.itemUn){try{this.itemUn()}catch(e){}}this.itemUn=null;this.itemSid=null},
  watch(sid){if(!sid||this.itemSid===sid)return;this.unItems();const A=this.adapter();if(!A)return;this.itemSid=sid;
    try{this.itemUn=A.watchItems(sid,list=>{this.items[sid]=list;this.refresh()},e=>this.fail(e))}catch(e){this.fail(e)}},
  fail(e){this.err=Cloud.human(e);this.refresh()},
  refresh(){clearTimeout(this._rt);this._rt=setTimeout(()=>{const top=App.current();if((top&&top.name==='czShared')||(!top&&UI.tab==='plan'))App.render()},40)},
  selected(){let sid=this.cur;if(!sid){try{sid=localStorage.getItem(this.SID)}catch(e){}}const sp=this.spaces.find(x=>x.id===sid)||this.spaces[0]||null;if(sp&&!this.cur)this.cur=sp.id;return sp},
  pick(sid){this.cur=sid;try{localStorage.setItem(this.SID,sid)}catch(e){}Haptic.tap();App.render()},
  month(d){const[y,m]=(this.ym||U.today().slice(0,7)).split('-').map(Number);this.ym=U.monthStart(y,m-1+d).slice(0,7);Haptic.tap();App.render()},
  stats(items,ym){const list=items.filter(x=>String(x.date||'').startsWith(ym)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const byCat={},byMem={};let total=0;list.forEach(x=>{const a=+x.amount||0;total+=a;byCat[x.category]=(byCat[x.category]||0)+a;const k=x.by||'?';const mm=byMem[k]=byMem[k]||{name:x.byName||'Üye',v:0,n:0};mm.v+=a;mm.n++});
    return{list,total:U.r2(total),cats:Object.entries(byCat).map(([k,v])=>({k,v:U.r2(v)})).sort((a,b)=>b.v-a.v),mems:Object.entries(byMem).map(([uid,v])=>({uid,...v,v:U.r2(v.v)})).sort((a,b)=>b.v-a.v)}},
  /* --- eylemler --- */
  newSheet(){Sheet.open(Sheet.head('Yeni ortak bütçe',{left:'Vazgeç',right:''})+

/* Firestore uyarlayıcısı: Cloud'un yüklediği firebase-firestore modülünü (Cloud.api.sdk.Fs) kullanır */
CzY.sh.fb={
  F(){return Cloud.api.sdk},
  list(q){return q.docs.map(d=>({id:d.id,...d.data()}))},
  watchSpaces(uid,cb,eb){const{Fs,db}=this.F();return Fs.onSnapshot(Fs.query(Fs.collection(db,'shared'),Fs.where('members','array-contains',uid)),q=>cb(this.list(q)),eb)},
  watchInvites(email,cb,eb){const{Fs,db}=this.F();return Fs.onSnapshot(Fs.query(Fs.collection(db,'shared'),Fs.where('invites','array-contains',email)),q=>cb(this.list(q)),eb)},
  async create(d){const{Fs,db}=this.F();const r=await Fs.addDoc(Fs.collection(db,'shared'),{...d,createdAt:Fs.serverTimestamp()});return r.id},
  invite(sid,email){const{Fs,db}=this.F();return Fs.updateDoc(Fs.doc(db,'shared',sid),{invites:Fs.arrayUnion(email)})},
  cancelInvite(sid,email){const{Fs,db}=this.F();return Fs.updateDoc(Fs.doc(db,'shared',sid),{invites:Fs.arrayRemove(email)})},
  join(sid,uid,email,name){const{Fs,db}=this.F();return Fs.updateDoc(Fs.doc(db,'shared',sid),{members:Fs.arrayUnion(uid),invites:Fs.arrayRemove(email),emails:Fs.arrayUnion(email),['names.'+uid]:name})},
  watchItems(sid,cb,eb){const{Fs,db}=this.F();return Fs.onSnapshot(Fs.query(Fs.collection(db,'shared',sid,'items'),Fs.orderBy('date','desc'),Fs.limit(1000)),q=>cb(this.list(q)),eb)},
  async addItem(sid,it){const{Fs,db}=this.F();const r=await Fs.addDoc(Fs.collection(db,'shared',sid,'items'),{...it,createdAt:Fs.serverTimestamp()});return r.id},
  removeItem(sid,id){const{Fs,db}=this.F();return Fs.deleteDoc(Fs.doc(db,'shared',sid,'items',id))}
};
