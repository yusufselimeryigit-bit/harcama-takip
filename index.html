<style>
/* =====================================================================
   DESIGN SYSTEM · Liquid Glass
   Tokens → Base → Glass primitives → Components → Screens → Motion
   ===================================================================== */

/* ---------- 1. Tokens (GlassWorkspace) ----------
   shadcn-style semantic tokens for light + dark; older component names are aliased below.
   Glass controls (--gw-*) are written inline on <html> by GW.apply() from localStorage. */
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --r-xl:27px;--r-lg:17px;--r-md:15px;--r-sm:12px;--pad:14px;
  --gw-blur:14px;--gw-opacity:.30;--gw-saturation:1.2;--gw-edge:.6;--gw-tint:#eadbc7;
  --indigo:#5e5ce6;--purple:#8f6ae8;--pink:#e0466c;--yellow:#e3b40b;--teal:#3fb6c6;
}
[data-theme=light]{
  --background:#f3ece3;--foreground:#2a1f17;--muted-foreground:#6b5a4b;--faint:#988775;
  --primary-def:#8b5a2b;--primary-foreground:#fffaf3;--chart-inc:var(--primary);
  --card:#fffaf3;--secondary:#ece2d5;--muted:#d9c9b5;--border:rgba(70,45,20,.12);--popover:#fdf8f1;--surface:#fbf4ea;--gw-panel:#ffffff;
  --gw-shade:rgba(250,243,234,.20);--gw-tint-a:12%;--gw-highlight:#ffffff;--gw-panel-shadow:rgba(70,45,20,.55);
  --green:#2f7d45;--red:#b8412f;--orange:#a35a00;
  --fill:rgba(70,45,20,.07);--sep:rgba(70,45,20,.1);--hi:#ffffff;--drop:rgba(60,38,16,.45);
}
[data-theme=dark]{
  --background:#17110c;--foreground:#f8f1e7;--muted-foreground:#cdbfae;--faint:#9a8a78;
  --primary-def:#f3e8d8;--primary-foreground:#2b2017;--chart-inc:#fff8ee;
  --card:#3a2e24;--secondary:#5a4a3b;--muted:#120c08;--border:rgba(255,240,220,.13);--popover:#261d16;--surface:#2a2019;--gw-panel:#7a6450;
  --gw-shade:rgba(20,11,4,.28);--gw-tint-a:12%;--gw-highlight:#fff6ea;--gw-panel-shadow:rgba(0,0,0,.8);
  --green:#9bd8a6;--red:#ff9282;--orange:#f2b56d;
  --fill:rgba(255,244,230,.09);--sep:rgba(255,244,230,.1);--hi:rgba(255,246,234,.5);--drop:rgba(0,0,0,.7);
}
html[data-theme=dark][data-oled="1"]{--gw-shade:rgba(10,5,2,.62)}
:root{
  --primary:var(--accent-user,var(--primary-def));
  --primary-soft:color-mix(in srgb,var(--primary) 15%,transparent);
  --bg:var(--background);--text:var(--foreground);--text2:var(--muted-foreground);--text3:var(--faint);
  --blue:var(--primary);--accent:var(--primary);
  --glass:color-mix(in srgb,var(--gw-panel) calc((.16 + var(--gw-opacity) * .5) * 100%),transparent);
  --glass-2:color-mix(in srgb,var(--card) 72%,transparent);
  --glass-strong:color-mix(in srgb,var(--surface) calc(var(--gw-opacity) * 100%),transparent);
  --sheet:color-mix(in srgb,var(--popover) calc(max(.82,var(--gw-opacity)) * 100%),transparent);
  --toast:color-mix(in srgb,var(--popover) 94%,transparent);
  --glass-border:var(--border);--glass-hi:var(--hi);--sheen:transparent;
  --shadow:0 20px 52px -25px var(--drop);--shadow-sm:0 8px 22px -20px var(--gw-panel-shadow);--g-shadow:var(--shadow-sm);
  --solid:var(--card);--lens:var(--primary-soft);--blob-op:0;
  --gw-tint-l:color-mix(in srgb,var(--gw-tint) var(--gw-tint-a),transparent);
  --gw-ring:inset 0 1px 0 color-mix(in srgb,var(--gw-highlight) calc(var(--gw-edge) * 100%),transparent),inset 0 0 0 1px color-mix(in srgb,var(--gw-highlight) calc(var(--gw-edge) * 34%),transparent);
  --gw-card-ring:inset 0 1px 0 color-mix(in srgb,var(--gw-highlight) calc(var(--gw-edge) * 75%),transparent),0 8px 22px -20px var(--gw-panel-shadow);
}

/* ---------- 2. Base ---------- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);transition:background .4s var(--ease)}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  padding:calc(var(--sat) + 8px) 0 calc(var(--sab) + 110px)}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--text);font-size:16px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}


/* ---------- 3. Glass primitives ----------
   .glass = the lighter card that sits inside a glass panel (no backdrop blur: cheap on iPhone).
   Real glass material lives on chrome only, see "GlassWorkspace" at the end. */
.glass{position:relative;background:var(--glass);border-radius:var(--r-lg);box-shadow:var(--gw-card-ring);isolation:isolate}
.glass-strong{background:var(--glass-strong)}
.pressable{transition:transform .45s var(--spring),opacity .2s;will-change:transform;user-select:none;-webkit-user-select:none}
.pressable:active{transform:scale(.96);transition-duration:.1s}

/* ---------- 4. Layout ---------- */
.section{margin-top:26px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.section-head h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.section-head button{color:var(--blue);font-size:15px}
.muted{color:var(--text2)}.faint{color:var(--text3)}.sm{font-size:13px}.xs{font-size:11.5px}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--orange)}

/* ---------- 5. Components ---------- */
/* Top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 4px}
.topbar .t-sub{font-size:13px;color:var(--text2);font-weight:500}
.topbar h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:1px}
.top-actions{display:flex;gap:10px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 4px 14px rgba(94,92,230,.45)}

/* Hero */
.hero{padding:22px 22px 18px;border-radius:var(--r-xl);margin-top:16px;overflow:hidden}
.hero::after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;
  background:radial-gradient(circle,rgba(10,132,255,.45),transparent 70%);z-index:-1}
.hero-label{font-size:13px;color:var(--text2);font-weight:600;letter-spacing:.02em}
.hero-amount{font-size:44px;font-weight:800;letter-spacing:-.04em;margin:4px 0 14px;line-height:1.05}
.hero-amount .dec{font-size:24px;font-weight:700;color:var(--text2)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12.5px;padding:7px 11px;border-radius:20px;background:var(--glass-2);border:1px solid var(--glass-border);font-weight:600}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--sep)}
.hero-foot b{display:block;font-size:20px;letter-spacing:-.02em;margin-top:2px}
.delta{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:12px}
.delta.up{color:var(--red);background:rgba(255,69,58,.14)}
.delta.down{color:var(--green);background:rgba(48,209,88,.14)}
.delta.flat{color:var(--text2);background:var(--fill)}

/* Quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;border-radius:var(--r-md);font-size:12px;font-weight:600}
.qa .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;color:#fff}
.qa .soon{position:absolute;top:6px;right:6px;font-size:9px;padding:2px 5px;border-radius:6px;background:var(--fill);color:var(--text2)}

/* Card carousel */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px var(--pad) 14px;margin:0 calc(-1*var(--pad));scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.ccard{text-align:left;flex:0 0 82%;max-width:330px;height:190px;border-radius:var(--r-lg);padding:18px;color:#fff;scroll-snap-align:center;
  position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.ccard::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%),radial-gradient(circle at 90% 120%,rgba(255,255,255,.22),transparent 55%)}
.ccard>*{position:relative}
.ccard .cc-top{display:flex;justify-content:space-between;align-items:flex-start}
.ccard .cc-name{font-weight:700;font-size:16px}.ccard .cc-bank{font-size:12px;opacity:.8}
.ccard .chip{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,#f6e27a,#c9a227);opacity:.9}
.ccard .cc-lbl{font-size:11.5px;opacity:.8;font-weight:600}
.ccard .cc-amt{font-size:27px;font-weight:800;letter-spacing:-.03em}
.ccard .cc-bar{height:6px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin-top:8px}
.ccard .cc-bar span{display:block;height:100%;background:#fff;border-radius:4px;transition:width .8s var(--ease)}
.ccard .cc-foot{display:flex;justify-content:space-between;font-size:12px;opacity:.92;margin-top:8px}
.acc-tile{text-align:left;flex:0 0 42%;max-width:170px;height:190px;border-radius:var(--r-lg);padding:16px;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:space-between}
.acc-tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.acc-tile .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.add-tile{display:grid;place-items:center;text-align:center;color:var(--text2);font-weight:600;font-size:13px}
.add-tile span{font-size:30px;display:block;color:var(--blue)}

/* Insights */
.insights{display:flex;flex-direction:column;gap:10px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md)}
.insight .ic{flex-shrink:0;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px}
.insight b{display:block;font-size:14.5px;margin-bottom:2px}
.insight p{font-size:13px;color:var(--text2)}
.sev-danger .ic{background:rgba(255,69,58,.18)}.sev-warn .ic{background:rgba(255,159,10,.18)}
.sev-info .ic{background:rgba(10,132,255,.18)}.sev-good .ic{background:rgba(48,209,88,.18)}

/* Segmented control */
.seg{position:relative;display:flex;background:var(--fill);border-radius:11px;padding:2px}
.seg button{position:relative;z-index:1;flex:1;padding:7px 12px;font-size:13px;font-weight:600;border-radius:9px;transition:color .3s}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:9px;background:var(--glass-hi);box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .45s var(--spring),width .3s}
[data-theme=dark] .seg .thumb{background:rgba(255,255,255,.18)}

/* Donut */
.spend{padding:18px}
.spend-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.donut-wrap{display:flex;align-items:center;gap:18px;margin-top:16px}
.donut{position:relative;width:170px;height:170px;flex-shrink:0}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:20;stroke-linecap:round;transition:opacity .3s,stroke-width .3s var(--spring);cursor:pointer}
.donut circle.track{stroke:var(--fill);cursor:default}
.donut circle.dim{opacity:.25}.donut circle.on{stroke-width:25}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut-center b{font-size:21px;letter-spacing:-.02em}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.legend button{display:flex;align-items:center;gap:8px;font-size:13px;text-align:left;width:100%;transition:opacity .3s}
.legend button.dim{opacity:.35}
.legend .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.legend .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{color:var(--text2);font-variant-numeric:tabular-nums}

/* Installment bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:4px 2px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bar-col .v{font-size:10.5px;color:var(--text2);height:16px;white-space:nowrap}
.bar-stack{flex:1;width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:9px;overflow:hidden;background:var(--fill)}
.bar-stack span{display:block;width:100%;transform-origin:bottom}
.bar-col .l{font-size:11.5px;color:var(--text2);margin-top:6px;font-weight:600}
.bar-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--text2)}
.bar-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Lists */
.list{border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:64px;right:0;height:1px;background:var(--sep)}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:12.5px;color:var(--text2)}
.row .end{text-align:right;flex-shrink:0}
.row .end b{font-size:15px;display:block}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;margin-top:3px}
.badge.red{background:rgba(255,69,58,.16);color:var(--red)}.badge.orange{background:rgba(255,159,10,.16);color:var(--orange)}
.badge.blue{background:rgba(10,132,255,.16);color:var(--blue)}.badge.green{background:rgba(48,209,88,.16);color:var(--green)}
.mini-btn{font-size:12px;font-weight:700;color:var(--blue);padding:5px 10px;border-radius:9px;background:rgba(10,132,255,.13);margin-top:4px}

/* Progress */
.prog{height:7px;border-radius:5px;background:var(--fill);overflow:hidden}
.prog span{display:block;height:100%;border-radius:5px;transition:width .8s var(--ease)}

/* Empty / welcome */
.welcome{padding:26px 22px;text-align:center;border-radius:var(--r-xl);margin-top:16px}
.welcome .big-ic{font-size:46px}
.welcome h2{font-size:22px;letter-spacing:-.02em;margin:10px 0 6px}
.welcome p{color:var(--text2);font-size:14px;margin-bottom:6px}

/* Buttons */
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-size:16px;font-weight:700;text-align:center;margin-top:12px;background:var(--fill)}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--indigo));color:#fff;box-shadow:0 8px 22px rgba(10,132,255,.35)}
.btn.danger{color:var(--red)}

/* Floating tab bar */
.tabbar{position:fixed;left:50%;bottom:calc(12px + var(--sab));transform:translateX(-50%);
  width:min(calc(100% - 28px),430px);height:68px;border-radius:34px;display:flex;align-items:center;padding:0 8px;z-index:50;
  background:var(--glass-strong);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
.tab{position:relative;z-index:1;flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:600;color:var(--text2);transition:color .3s}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue)}
.tab-ind{position:absolute;top:7px;height:54px;border-radius:27px;background:var(--glass-2);border:1px solid var(--glass-border);transition:transform .55s var(--spring),width .4s var(--ease)}
.tab-add{position:relative;z-index:1;width:54px;height:54px;margin:0 4px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:300;
  background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 20px rgba(94,92,230,.5),inset 0 1px 0 rgba(255,255,255,.4)}

/* Sheet (bottom modal) */
.sheet-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
.sheet{width:100%;max-width:520px;max-height:93vh;overflow-y:auto;border-radius:32px 32px 0 0;padding:8px 20px calc(28px + var(--sab));
  background:var(--sheet);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--glass-border);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:sheetUp .5s var(--ease)}
.sheet-backdrop.closing{animation:fadeOut .25s forwards}
.sheet-backdrop.closing .sheet{animation:sheetDown .25s ease-in forwards}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--text3);margin:2px auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head h3{font-size:20px;letter-spacing:-.02em}
.sheet-head button{font-size:15px;color:var(--blue);font-weight:600}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:12.5px;color:var(--text2);margin:0 4px 6px;font-weight:600}
.input{width:100%;padding:14px;border-radius:14px;border:1px solid transparent;background:var(--fill);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .2s}
.input:focus{border-color:var(--blue)}
input[type=date].input{min-height:50px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount-in{width:100%;text-align:center;font-size:46px;font-weight:800;letter-spacing:-.04em;background:none;border:0;outline:none;padding:10px 0 2px}
.amount-cur{text-align:center;color:var(--text2);font-size:13px;font-weight:600}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:14px;background:var(--fill);font-size:11px;font-weight:600;border:2px solid transparent}
.cat-opt .e{font-size:21px}
.cat-opt.on{border-color:var(--blue);background:rgba(10,132,255,.14)}
.preview{margin-top:14px;padding:13px 14px;border-radius:14px;background:rgba(10,132,255,.1);font-size:13.5px;color:var(--text2);line-height:1.5}
.preview b{color:var(--text)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--text)}
.action-list .row{padding:15px 4px}
.action-list .row+.row::before{left:54px}

/* Toast */
.toasts{position:fixed;top:calc(var(--sat) + 10px);left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;padding:12px 18px;border-radius:22px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);
  background:var(--glass-strong);box-shadow:var(--shadow);animation:toastIn .5s var(--spring)}
.toast.out{animation:toastOut .3s forwards}

/* AI */
.ai-card{padding:18px;border-radius:var(--r-lg)}
.ai-card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:linear-gradient(135deg,rgba(94,92,230,.9),rgba(191,90,242,.45),rgba(100,210,255,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ai-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.ai-head b{font-size:16px}
.ai-orb{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:conic-gradient(from 0deg,#0a84ff,#bf5af2,#ff375f,#64d2ff,#0a84ff);
  animation:spin 7s linear infinite;box-shadow:0 0 18px rgba(191,90,242,.45)}
.ai-orb.busy{animation-duration:1.1s;box-shadow:0 0 26px rgba(191,90,242,.8)}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-headline{font-size:15.5px;font-weight:600;line-height:1.42;margin-bottom:6px}
.tip{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--sep)}
.tip .pr{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.tip b{font-size:14px;display:block}.tip p{font-size:13px;color:var(--text2);margin-top:2px;line-height:1.4}
.save-pill{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--green);background:rgba(48,209,88,.13);padding:3px 8px;border-radius:8px}
.score{font-size:12px;font-weight:800;padding:5px 9px;border-radius:10px;background:rgba(94,92,230,.18);color:#8f8dff;white-space:nowrap}
.ai-sub{font-size:11.5px;font-weight:700;color:var(--text2);letter-spacing:.05em;margin:12px 0 2px}
.shimmer{height:12px;border-radius:6px;margin:11px 0;background:linear-gradient(90deg,var(--fill) 25%,var(--glass-2) 50%,var(--fill) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.err-box{margin:4px 0 10px;padding:11px 13px;border-radius:13px;background:rgba(255,69,58,.12);color:var(--red);font-size:13.5px}
.ai-banner{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45;color:var(--text);
  background:linear-gradient(135deg,rgba(94,92,230,.2),rgba(191,90,242,.14));border:1px solid rgba(160,140,255,.3)}
.scan-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.scan-btn{padding:22px 10px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.scan-btn .e{font-size:32px}
.scan-prev{position:relative;margin-top:14px;border-radius:18px;overflow:hidden;background:var(--fill);min-height:120px;display:grid;place-items:center}
.scan-prev img{display:block;width:100%;max-height:320px;object-fit:contain}
.scan-prev .doc{font-size:54px;padding:26px}
.scan-prev .beam{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#bf5af2,#64d2ff,transparent);
  box-shadow:0 0 18px #bf5af2;animation:beam 1.8s ease-in-out infinite alternate}
@keyframes beam{from{top:4%}to{top:94%}}
.link{color:var(--blue);text-decoration:none;font-weight:600}

/* ---------- 6. Motion ---------- */
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes toastIn{from{transform:translateY(-30px) scale(.9);opacity:0}}
@keyframes toastOut{to{transform:translateY(-20px);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dasharray:0 999}}
.enter .stagger>*{animation:rise .6s var(--ease) both}
.enter .stagger>*:nth-child(2){animation-delay:.04s}.enter .stagger>*:nth-child(3){animation-delay:.08s}
.enter .stagger>*:nth-child(4){animation-delay:.12s}.enter .stagger>*:nth-child(5){animation-delay:.16s}
.enter .stagger>*:nth-child(6){animation-delay:.2s}.enter .stagger>*:nth-child(7){animation-delay:.24s}
.enter .stagger>*:nth-child(n+8){animation-delay:.28s}
.enter .bar-stack span{animation:grow .8s var(--ease) both}
.enter .donut circle.s{animation:draw 1s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* =====================================================================
   v3 · Sayfalar, detaylar, takvim, matrix, kilit ekranı, yazdırma
   ===================================================================== */
/* Pages & navigation */
.page-head{display:flex;justify-content:space-between;align-items:center;padding:4px 0 0;min-height:44px}
.back{font-size:17px;color:var(--blue);font-weight:600;padding:8px 12px 8px 0;display:flex;align-items:center;gap:4px}
.back b{font-size:30px;font-weight:300;line-height:20px;margin-top:-4px}
.page-title{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 4px 2px}
.page-sub{font-size:13.5px;color:var(--text2);margin:0 4px}
.head-btn{color:var(--blue);font-weight:600;font-size:16px;padding:8px 0 8px 12px}
.enter-push{animation:pushIn .42s var(--ease)}
.enter-pop{animation:popIn .38s var(--ease)}
@keyframes pushIn{from{transform:translateX(40px);opacity:0}}
@keyframes popIn{from{transform:translateX(-26px);opacity:.2}}

/* Search, chips, filters */
.search{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:14px;background:var(--fill);margin-top:14px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;padding:12px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px var(--pad) 2px;margin:0 calc(-1*var(--pad));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:20px;font-size:13.5px;font-weight:600;background:var(--glass);border:1px solid var(--glass-border);transition:background .25s,color .25s}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.filters select{padding:10px 12px;font-size:14px}
.sumbar{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text2);margin:14px 4px 0;flex-wrap:wrap}
.sumbar b{color:var(--text)}
.day-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text2);margin:18px 6px 8px}

/* Stats & action buttons */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:14px;border-radius:var(--r-md)}
.stat .l{font-size:12px;color:var(--text2);font-weight:600}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.stat .s{font-size:11.5px;color:var(--text3);margin-top:2px}
.actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:var(--r-md);font-size:12px;font-weight:600;text-align:center}
.act .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--fill)}
.ccard.big{flex:none;width:100%;max-width:none;height:205px;margin-top:10px;cursor:default}

/* Statements */
.stmt{padding:14px 16px;border-radius:var(--r-md);margin-bottom:10px}
.stmt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.stmt-top b{font-size:15.5px}
.stmt-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:12px;color:var(--text2)}
.stmt-nums b{display:block;color:var(--text);font-size:14.5px;margin-top:2px}
.stmt-lines{margin-top:10px;border-top:1px solid var(--sep)}
.sline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--sep)}
.sline span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{margin-top:0;padding:11px 8px;font-size:14px}

/* Detail */
.dhero{text-align:center;padding:24px 18px 20px;border-radius:var(--r-xl);margin-top:8px}
.dhero .ic{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:31px;margin:0 auto 10px}
.dhero .amt{font-size:38px;font-weight:800;letter-spacing:-.03em}
.dhero .t{font-size:17px;font-weight:700;margin-top:4px}
.info .row{padding:13px 16px}
.info .row .mid{font-size:14px;color:var(--text2)}
.info .row .end{font-weight:600;font-size:14.5px;max-width:62%;white-space:normal;text-align:right}
.att img{width:100%;border-radius:16px;display:block}
.countdown{display:flex;gap:10px;margin-top:10px}
.countdown>div{flex:1;padding:12px;border-radius:14px;background:var(--fill);text-align:center}
.countdown b{display:block;font-size:22px;letter-spacing:-.02em}

/* Matrix */
.matrix-wrap{overflow-x:auto;margin:12px calc(-1*var(--pad)) 0;padding:0 var(--pad) 6px}
.matrix{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.matrix th,.matrix td{padding:10px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--sep)}
.matrix th{color:var(--text2);font-weight:700;font-size:11.5px}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--solid);z-index:1;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.matrix td.zero{color:var(--text3)}
.matrix tr.tot td{font-weight:800;border-bottom:0;padding-top:12px}
.matrix .now{background:rgba(10,132,255,.12)}
.matrix td:first-child small{display:block;color:var(--text2);font-weight:500;font-size:11px}

/* Calendar */
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 10px}
.cal-nav b{font-size:18px;letter-spacing:-.01em}
.cal-nav button{width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--blue);background:var(--fill)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:12px 10px;border-radius:var(--r-lg)}
.cal .wd{text-align:center;font-size:11px;color:var(--text3);font-weight:700;padding-bottom:6px}
.cal .d{min-height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding-top:5px;font-size:14px;font-weight:600;position:relative}
.cal .d .n{width:25px;height:25px;display:grid;place-items:center;border-radius:50%}
.cal .d.today .n{background:var(--blue);color:#fff}
.cal .d.sel{background:var(--glass-2);box-shadow:inset 0 0 0 1.5px var(--blue)}
.cal .d .sp{font-size:8.5px;color:var(--text2);font-weight:700}
.cal .dots{display:flex;gap:2px;position:absolute;bottom:4px}
.cal .dots i{width:5px;height:5px;border-radius:50%}

/* Rings, goals */
.ring{position:relative;display:inline-grid;place-items:center}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-linecap:round;transition:stroke-dasharray 1s var(--ease)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{padding:16px 12px;border-radius:var(--r-md);text-align:center}
.goal b{display:block;margin-top:8px;font-size:14.5px}
.goal-row{display:flex;gap:10px;overflow-x:auto;padding:4px var(--pad) 8px;margin:0 calc(-1*var(--pad));scrollbar-width:none}
.goal-row::-webkit-scrollbar{display:none}
.goal-row .goal{flex:0 0 140px}

/* Charts */
.lchart{width:100%;height:auto;display:block;overflow:visible}
.lchart text{font-size:10px;fill:var(--text2);font-family:var(--font)}
.dbars{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:10px}
.dbars span{flex:1;border-radius:3px 3px 1px 1px;background:var(--blue);min-height:2px;opacity:.85}
.dbars span.z{background:var(--fill)}
.dbars-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text3);margin-top:5px}
.cmp{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--sep)}
.cmp:first-child{border-top:0}
.cmp .e{font-size:18px;width:26px;text-align:center}
.cmp .mid{flex:1;min-width:0}
.cmp .mid b{font-size:14px;display:block}
.cmp .bar2{height:6px;border-radius:4px;background:var(--fill);margin-top:6px;overflow:hidden}
.cmp .bar2 span{display:block;height:100%;border-radius:4px}
.cmp .end{text-align:right;font-size:13.5px;font-weight:700}
.cmp .end small{display:block;font-size:11.5px;font-weight:700}

/* Lock screen */
#lock{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:20px}
#lock.out{animation:fadeOut .35s forwards}
#lock h2{font-size:20px;margin-top:14px}
.lock-dots{display:flex;gap:16px;margin:22px 0 34px}
.lock-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text2);transition:background .15s}
.lock-dots i.on{background:var(--text);border-color:var(--text)}
.lock-dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 24px}
.key{width:76px;height:76px;border-radius:50%;font-size:30px;font-weight:400;display:grid;place-items:center}
.key.ghost{background:none;border:0;box-shadow:none;font-size:15px;font-weight:600;color:var(--blue)}
.key.ghost::before{display:none}

/* Toast action, tags, misc */
.toast{display:flex;align-items:center;gap:14px}
.toast-act{color:var(--blue);font-weight:800;font-size:14px;padding:2px 0}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--fill);color:var(--text2);margin-left:5px;vertical-align:2px}
.empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px}
.empty .e{font-size:42px;display:block;margin-bottom:8px}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap}
.emoji-row button{width:42px;height:42px;border-radius:12px;background:var(--fill);font-size:21px;border:2px solid transparent}
.emoji-row button.on{border-color:var(--blue)}
.imp-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--sep)}
.imp-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue);flex-shrink:0}
.imp-row .mid{flex:1;min-width:0}
.imp-row .mid b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-row .mid span{font-size:12px;color:var(--text2)}
.imp-row .end{text-align:right;font-weight:700;font-size:14px;flex-shrink:0}
.switch{position:relative;width:51px;height:31px;flex-shrink:0;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:.3s}
.switch span::after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--sep);font-size:15px}
.set-row:last-child{border-bottom:0}
.set-row small{display:block;color:var(--text2);font-size:12px;margin-top:2px}
.quick-amts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick-amts button{padding:9px 12px;border-radius:12px;background:var(--fill);font-size:13px;font-weight:700}
.quick-amts button small{display:block;font-size:10.5px;color:var(--text2);font-weight:600}
.overflow-note{font-size:12px;color:var(--text3);text-align:center;margin-top:12px}

/* Print (PDF) */
#print{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important;padding:0!important;min-height:0}
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#111;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:10.5pt}
  #print h1{font-size:18pt;margin:0 0 2px}
  #print h2{font-size:12.5pt;margin:18px 0 6px}
  #print .meta{color:#555;font-size:9.5pt}
  #print table{width:100%;border-collapse:collapse;margin:6px 0}
  #print th,#print td{border-bottom:1px solid #ddd;padding:5px 6px;text-align:left;vertical-align:top}
  #print th{background:#f3f4f7;font-size:9pt;color:#333}
  #print .r{text-align:right;white-space:nowrap}
  #print .sum{display:flex;gap:10px;margin:12px 0}
  #print .sum div{flex:1;border:1px solid #ddd;border-radius:8px;padding:8px 10px}
  #print .sum b{display:block;font-size:13pt}
  #print .foot{margin-top:18px;color:#888;font-size:8.5pt}
}

/* =====================================================================
   v4 · Tasarım yenilemesi: ikonlar, Wallet kartları, hareketler, kişiselleştirme
   ===================================================================== */
/* OLED yerine koyu gri seçeneği */
/* Yoğunluk: kompakt */
html.compact .row{padding:9px 14px}
html.compact .section{margin-top:18px}
html.compact .hero{padding:16px 18px 14px}
html.compact .hero-amount{font-size:36px;margin-bottom:10px}
html.compact .stat{padding:11px 12px}
html.compact .qa{padding:10px 4px 9px}
html.compact .row .ic{width:34px;height:34px}
body{zoom:var(--zoom,1)}

/* SVG ikonlar */
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
.i-emoji{line-height:1;display:block}
.ic svg.i{width:21px;height:21px}
.qa .ic svg.i,.act .ic svg.i{width:22px;height:22px}
.icon-btn svg.i{width:20px;height:20px}
.empty .e svg.i{width:44px;height:44px;margin:0 auto;stroke-width:1.5;color:var(--text3)}
.cat-opt .e svg.i{width:22px;height:22px}
.cat-opt .e{color:var(--text2)}
.cat-opt.on .e{color:var(--blue)}
.pill svg.i,.chip svg.i,.btn svg.i,.mini-btn svg.i{display:inline-block;vertical-align:-3px;width:15px;height:15px;margin-right:4px}
.btn svg.i{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.search svg.i{color:var(--text2)}
.tab-add svg.i{width:26px;height:26px;stroke-width:2.2}
.scan-btn .e svg.i{width:34px;height:34px;color:var(--blue)}
.goal .ring .in svg.i,.dhero .ring .in svg.i{width:46%;height:46%}
.ring .in{color:var(--text)}
.dhero .ic svg.i{width:30px;height:30px}
.icon-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icon-pick button{aspect-ratio:1;border-radius:13px;background:var(--fill);display:grid;place-items:center;border:2px solid transparent;color:var(--text2)}
.icon-pick button.on{border-color:var(--blue);color:var(--blue);background:rgba(10,132,255,.12)}
.icon-pick svg.i{width:22px;height:22px}

/* Daha belirgin Liquid Glass: kenar ışığı + hafif kırılma */

/* Wallet: üst üste kart yığını */
.wallet{position:relative;transition:height .5s var(--spring);margin-top:2px}
.wslot{position:absolute;left:0;right:0;transition:transform .55s var(--spring);will-change:transform}
.wslot .ccard{width:100%;max-width:none;flex:none}
.wallet.single .wslot{position:relative}
.flipper{position:relative;height:200px;perspective:1200px}
.flip-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s var(--spring)}
.flipper.flipped .flip-inner{transform:rotateY(180deg)}
.flip-inner>.ccard{position:absolute;inset:0;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-inner>.ccard.cc-back{transform:rotateY(180deg)}
.ccard{height:200px}
.flipper{transform:perspective(900px) rotateX(var(--ty,0deg)) rotateY(var(--tx,0deg));transition:transform .3s var(--ease)}
.wslot:not(.front) .flipper{transform:none}
.flip-inner>.ccard.cc-back{transform:rotateY(180deg)!important}
.flip-inner>.ccard:not(.cc-back){transform:none}
.ccard .sheen{position:absolute;inset:-40%;background:radial-gradient(circle at calc(50% + var(--sx,0%)) calc(30% + var(--sy,0%)),rgba(255,255,255,.28),transparent 45%);pointer-events:none;mix-blend-mode:soft-light}
.cc-flip{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);color:#fff;z-index:2}
.cc-flip svg.i{width:17px;height:17px}
.ccard.cc-back .cc-rows{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:12px}
.ccard.cc-back .cc-rows b{display:block;font-size:15px;margin-top:2px}
.ccard .stripe{height:34px;margin:0 -18px;background:rgba(0,0,0,.45)}
.ccard .net{position:absolute;right:16px;top:16px;font-weight:800;font-style:italic;font-size:13px;opacity:.75;letter-spacing:.04em}
/* Kart desenleri */
.cs-metal{background-blend-mode:overlay,normal!important}
.cs-metal::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.06) 0 2px,rgba(0,0,0,.05) 2px 4px),linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(0,0,0,.25));pointer-events:none}
.cs-glass{background:rgba(255,255,255,.12)!important;-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.25);color:var(--text)!important}
[data-theme=dark] .cs-glass{color:#fff!important}
.cs-glass::after{content:"";position:absolute;width:70%;height:120%;right:-20%;top:-30%;border-radius:50%;background:var(--cc1);filter:blur(40px);opacity:.75;z-index:-1}
.cs-glass{isolation:isolate}
.cs-mesh::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.35),transparent 35%),radial-gradient(circle at 85% 80%,var(--cc2),transparent 50%),radial-gradient(circle at 70% 10%,rgba(255,214,10,.35),transparent 40%);pointer-events:none}
.cs-carbon{background:#1c1c1e!important}
.cs-carbon::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 3px,transparent 3px 6px),repeating-linear-gradient(-45deg,rgba(255,255,255,.03) 0 3px,transparent 3px 6px),linear-gradient(135deg,var(--cc1) -60%,transparent 60%);pointer-events:none}
.cs-minimal{background:var(--cc1)!important}
.cs-minimal::before{background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 50%)!important}
.style-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.style-pick button{height:62px;border-radius:12px;position:relative;overflow:hidden;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:flex-end;padding:8px;border:2px solid transparent}
.style-pick button.on{border-color:var(--text)}

/* İçgörü şeridi */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px var(--pad) 8px;margin:0 calc(-1*var(--pad));scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .insight{flex:0 0 86%;scroll-snap-align:center;padding:12px 14px;align-items:center}
.strip .insight p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.strip .insight b{font-size:14px}
.sev-danger .ic{color:var(--red)}.sev-warn .ic{color:var(--orange)}.sev-info .ic{color:var(--blue)}.sev-good .ic{color:var(--green)}
.dots-ind{display:flex;justify-content:center;gap:5px;margin-top:2px}
.dots-ind i{width:6px;height:6px;border-radius:3px;background:var(--text3);transition:width .3s,background .3s}
.dots-ind i.on{width:16px;background:var(--text2)}

/* Kaydırma (swipe) satırları */
.swipe{position:relative;overflow:hidden}
.swipe+.swipe::before{content:"";position:absolute;top:0;left:64px;right:0;height:1px;background:var(--sep);z-index:2}
.swipe .row::before{display:none}
.swipe-fg{position:relative;z-index:1;background:var(--solid);transition:transform .35s var(--spring);touch-action:pan-y}
.list .swipe-fg{background:transparent}
.swipe.open-l .swipe-fg,.swipe.open-r .swipe-fg,.swipe.dragging .swipe-fg{background:var(--solid)}
.swipe.dragging .swipe-fg{transition:none}
.swipe-acts{position:absolute;top:0;bottom:0;display:flex}
.swipe-acts.r{right:0}.swipe-acts.l{left:0}
.swipe-acts button{width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:11.5px;font-weight:700}
.swipe-acts button svg.i{width:20px;height:20px}
.sw-red{background:var(--red)}.sw-blue{background:var(--blue)}.sw-orange{background:var(--orange)}.sw-green{background:var(--green)}.sw-gray{background:#8e8e93}
.swipe-hint{font-size:11.5px;color:var(--text3);text-align:right;margin:6px 6px 0}

/* Uzun basma bağlam menüsü */
.ctx-bd{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn .2s}
.ctx{position:fixed;z-index:301;width:240px;border-radius:16px;overflow:hidden;background:var(--sheet);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);box-shadow:0 20px 50px rgba(0,0,0,.4);animation:ctxIn .35s var(--spring);transform-origin:top center}
.ctx button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 16px;font-size:15.5px;border-bottom:1px solid var(--sep)}
.ctx button:last-child{border-bottom:0}
.ctx button.danger{color:var(--red)}
.ctx button svg.i{width:19px;height:19px}
@keyframes ctxIn{from{transform:scale(.6);opacity:0}}
.lifted{transform:scale(1.03)!important;box-shadow:0 18px 40px rgba(0,0,0,.35);z-index:302;position:relative;border-radius:16px}

/* Grafik okuma (scrub) */
.lc-wrap{position:relative;touch-action:pan-y}
.lc-tip{position:absolute;top:-6px;transform:translateX(-50%);padding:5px 9px;border-radius:9px;font-size:11.5px;font-weight:700;white-space:nowrap;pointer-events:none;background:var(--glass-strong);box-shadow:var(--shadow-sm);opacity:0;transition:opacity .15s}
.lc-tip small{display:block;font-weight:500;color:var(--text2);font-size:10.5px}
.lc-line{position:absolute;top:18px;bottom:20px;width:1px;background:var(--text3);opacity:0;pointer-events:none}
.lc-wrap.scrub .lc-tip,.lc-wrap.scrub .lc-line{opacity:1}

/* Isı haritası */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat .wd{font-size:10.5px;color:var(--text3);text-align:center;font-weight:700}
.heat .c{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--text2);background:var(--fill)}
.heat .c.hot{color:#fff}
.heat-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:10.5px;color:var(--text3);margin-top:8px}
.heat-legend i{width:12px;height:12px;border-radius:3px}

/* Sankey */
.sankey{width:100%;height:auto;display:block}
.sankey text{font-family:var(--font);font-size:10.5px;fill:var(--text)}
.sankey text.v{fill:var(--text2);font-size:9.5px}

/* Ana Sayfa düzenleme */
.edit-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--sep)}
.edit-row .nm{flex:1;font-weight:600}
.edit-row .mv{width:34px;height:34px;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--text2)}
.edit-row .mv svg.i{width:17px;height:17px}
.home-edit{display:flex;justify-content:center;margin:26px 0 4px}
.home-edit button{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:20px;font-size:13.5px;font-weight:600;color:var(--text2)}
.home-edit svg.i{width:16px;height:16px}

/* Kişiselleştirme seçicileri */
.accent-pick{display:flex;gap:10px;flex-wrap:wrap}
.accent-pick button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.accent-pick button.on{border-color:var(--text)}
.appicon-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.appicon-pick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text2)}
.appicon-pick img{width:58px;height:58px;border-radius:14px;border:2px solid transparent;box-shadow:var(--shadow-sm)}
.appicon-pick button.on img{border-color:var(--blue)}

/* Konfeti */
#confetti{position:fixed;inset:0;z-index:600;pointer-events:none}

/* İlk açılış sihirbazı */
.ob{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;padding:20px 4px}
.ob-step{animation:pushIn .5s var(--ease)}
.ob-hero{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;margin:0 auto 18px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 18px 40px rgba(94,92,230,.45)}
.ob-hero svg.i{width:48px;height:48px;stroke-width:1.6}
.ob h2{font-size:28px;letter-spacing:-.03em;text-align:center}
.ob p.lead{color:var(--text2);text-align:center;margin:8px 10px 18px;font-size:15px}
.ob-dots{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
.ob-dots i{width:8px;height:8px;border-radius:4px;background:var(--text3);transition:width .3s}
.ob-dots i.on{width:22px;background:var(--blue)}
.ob-feats{display:grid;gap:10px;margin:6px 0 10px}
.ob-feat{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px}
.ob-feat .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--blue);background:rgba(10,132,255,.14)}
.ob-feat b{display:block;font-size:14.5px}.ob-feat span{font-size:12.5px;color:var(--text2)}
.ob .skip{display:block;margin:14px auto 0;color:var(--text2);font-size:14px;font-weight:600}

/* Sayarak animasyon sırasında sabit genişlik */
[data-count]{font-variant-numeric:tabular-nums}

.swipe-acts{visibility:hidden}
.swipe.dragging .swipe-acts,.swipe.open-l .swipe-acts.l,.swipe.open-r .swipe-acts.r{visibility:visible}
body.onboarding .tabbar{transform:translate(-50%,160%);transition:transform .5s var(--ease)}
.tabbar{transition:transform .5s var(--ease)}
.ccard-mini{background-size:cover}

/* ===================== v5: sohbet, ses, borç ===================== */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:86px}
.bubble{max-width:86%;padding:11px 14px;border-radius:20px;font-size:14.5px;line-height:1.45;animation:rise .35s var(--ease) both;word-wrap:break-word}
.bubble.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--glass-2);border:1px solid var(--glass-border);border-bottom-left-radius:6px}
.bubble.err{color:var(--red)}
.bubble .md-li{display:block;padding-left:14px;position:relative}
.bubble .md-li::before{content:"•";position:absolute;left:2px;color:var(--text2)}
.bubble.typing{display:flex;gap:5px;padding:14px 16px}
.bubble.typing i{width:7px;height:7px;border-radius:50%;background:var(--text2);animation:blink 1.2s infinite}
.bubble.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sab));width:min(calc(100% - 28px),490px);display:flex;gap:8px;padding:6px 6px 6px 16px;border-radius:26px;z-index:40;background:var(--glass-strong)}
.chat-bar input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px;color:var(--text)}
.chat-bar .send{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex-shrink:0}
.chat-bar .send svg.i{width:20px;height:20px;stroke-width:2.3}
.mic{display:grid;place-items:center;width:88px;height:88px;border-radius:50%;margin:8px auto 0;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 10px 30px rgba(94,92,230,.45)}
.mic svg.i{width:38px;height:38px}
.mic.on{animation:pulse 1.2s infinite;background:linear-gradient(135deg,#ff375f,#ff9f0a)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,55,95,.5)}70%{box-shadow:0 0 0 22px rgba(255,55,95,0)}100%{box-shadow:0 0 0 0 rgba(255,55,95,0)}}
textarea.input{font-family:inherit}
.seg button{padding:7px 6px}
.sheet-backdrop.swap,.sheet-backdrop.swap .sheet{animation:none}

/* =====================================================================
   v6 · Apple Liquid Glass + iPhone düzen düzeltmeleri
   ===================================================================== */
:root{--dock-h:64px}


/* Basma hissi: cam düğmeler su damlası gibi hafifçe büyür ve parlar (iOS 26) */
.glass.pressable:active{transform:scale(1.035);filter:brightness(1.15) saturate(1.1);transition-duration:.12s}
.row.pressable:active,.sline.pressable:active{transform:none;background:var(--fill)}
.btn.pressable:active,.chip.pressable:active,.mini-btn:active{transform:scale(.96)}
.ccard.pressable:active{transform:scale(.985)}

/* ---------- Tipografi (Apple büyük başlık) ---------- */
.topbar h1,.page-title{font-size:34px;font-weight:700;letter-spacing:-.025em}
.topbar{gap:12px}.topbar>div:first-child{min-width:0}
.topbar .t-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{flex-shrink:0;gap:8px}
.icon-btn,.avatar{width:40px;height:40px}

/* ---------- Durum çubuğu (saat/pil) alanı + kayan gezinme çubuğu ---------- */
#sbar{position:fixed;top:0;left:0;right:0;height:calc(var(--sat) + 14px);z-index:44;pointer-events:none;
  background:linear-gradient(var(--bg) 0%,color-mix(in srgb,var(--bg) 70%,transparent) var(--sat),transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent)}
#navbar{position:fixed;top:0;left:0;right:0;z-index:45;padding-top:var(--sat);height:calc(var(--sat) + 48px);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:inset 0 -.5px 0 var(--sep);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
#navbar.show{opacity:1;pointer-events:auto}
.nb-in{height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;max-width:520px;margin:0 auto}
.nb-title{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw;transform:translateY(6px);transition:transform .3s var(--ease)}
#navbar.show .nb-title{transform:none}
.nb-back{justify-self:start;color:var(--blue);font-size:17px;font-weight:500;display:flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 2px}
.nb-back b{font-size:30px;font-weight:300;line-height:20px;margin-top:-3px}
.nb-back.hide{visibility:hidden}

/* ---------- Alt bar: iOS 26 tarzı ayrık cam kapsül + yuvarlak ekle düğmesi ---------- */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 10px);z-index:50;display:flex;justify-content:center;gap:10px;padding:0 14px;pointer-events:none;
  transition:transform .5s var(--ease),opacity .3s}
.dock>*{pointer-events:auto}
.tabbar{position:relative!important;left:auto!important;bottom:auto!important;transform:none!important;width:auto!important;flex:1;max-width:400px;
  height:var(--dock-h);border-radius:calc(var(--dock-h)/2);display:flex;align-items:center;padding:0 5px;touch-action:none;user-select:none;-webkit-user-select:none;
  background:var(--glass-strong);transition:height .45s var(--spring),border-radius .45s var(--spring)}
.tab{flex:1;min-width:0;height:calc(var(--dock-h) - 10px);border-radius:calc((var(--dock-h) - 10px)/2);gap:3px;font-size:10.5px;font-weight:600;color:var(--text2);
  -webkit-touch-callout:none;transition:color .25s,height .45s var(--spring)}
.tab svg{width:25px;height:25px;transition:transform .35s var(--spring)}
.tab span{line-height:1;transition:opacity .25s,max-height .35s var(--ease);max-height:14px;overflow:hidden}
.tab.on{color:var(--blue)}
.tab.pressable:active{transform:none}
.tab-ind{position:absolute;top:5px;bottom:5px;left:0;border:0;border-radius:calc((var(--dock-h) - 10px)/2);z-index:0;pointer-events:none;
  background:var(--lens);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.12);
  transition:transform .55s var(--spring),width .4s var(--ease),background .25s,box-shadow .25s}
.tab{position:relative;z-index:1}
/* Sürükleme: seçim göstergesi parmağı izleyen büyüteç merceğe dönüşür */
.lens-drag .tab-ind{transition:transform .14s var(--ease),width .2s;background:rgba(255,255,255,.06);
  box-shadow:0 12px 30px rgba(0,0,0,.28),inset 0 0 0 1.2px rgba(255,255,255,.45),inset 0 2px 6px rgba(255,255,255,.25),inset 0 -2px 8px rgba(0,0,0,.12)}
[data-theme=light] .lens-drag .tab-ind{background:rgba(255,255,255,.35)}
.lens-drag .tab.hover{color:var(--blue)}
.lens-drag .tab.hover svg{transform:scale(1.2)}
.lens-drag .tab:not(.hover){color:var(--text2)}
.dock-add{width:var(--dock-h);height:var(--dock-h);border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:var(--blue);
  background:color-mix(in srgb,var(--blue) 20%,var(--glass-strong));transition:width .45s var(--spring),height .45s var(--spring)}
.dock-add svg.i{width:28px;height:28px;stroke-width:2.2}
/* Aşağı kaydırınca küçülür, yukarı kaydırınca açılır */
.dock.mini{--dock-h:52px}
.dock.mini .tab span{opacity:0;max-height:0}
.dock.mini .tab svg{width:23px;height:23px}
body.onboarding .dock,body.kb .dock,body.typing .dock{transform:translateY(170%);opacity:0;pointer-events:none}
body.onboarding .tabbar{transform:none!important}

/* Bölümlü kontroller de sürüklenebilir mercek */
.seg{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.seg button{padding:7px 4px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:32px}
.seg .thumb{transition:transform .5s var(--spring),width .3s,box-shadow .2s}
.seg.lens-drag .thumb{transition:transform .12s var(--ease);box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.45);transform-origin:center}
.seg.lens-drag button.hover{color:var(--blue)}

/* ---------- Alt pencereler: yüzen cam kart (iOS 26) ---------- */
.sheet-backdrop{top:var(--vvt,0px);bottom:auto;height:var(--vvh,100%);background:rgba(0,0,0,.28)}
.sheet{width:calc(100% - 16px);margin:0 8px 8px;border-radius:34px;border:0;max-height:calc(100% - var(--sat) - 16px);
  background:var(--sheet);-webkit-backdrop-filter:blur(50px) saturate(190%);backdrop-filter:blur(50px) saturate(190%);
  box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.18),inset 0 0 0 .5px rgba(255,255,255,.12);
  padding:6px 18px calc(18px + var(--sab))}
body.kb .sheet{padding-bottom:18px}
.sheet-head{margin:0 -8px 6px;min-height:44px}
.sheet-head button{min-height:44px;min-width:44px;padding:0 8px;font-size:16px}
.sheet-head h3{font-size:17px;font-weight:700;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.grabber{margin:4px auto 6px}
.section-head{align-items:center}
.section-head button{min-height:40px;padding:0 0 0 12px}
.mini-btn{min-height:32px;padding:7px 12px}
.ob .skip{padding:12px 16px}
a.link{display:inline-block;padding:9px 0}

/* ---------- Form alanları: Safari'de tarih kutusunun taşıp yanındakinin üstüne binmesini engelle ---------- */
.grid2>*,.field,.filters>*{min-width:0}
.input{min-width:0;max-width:100%}
input[type=date].input{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;text-align:left;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0;padding:0}
select.input{text-overflow:ellipsis;white-space:nowrap;overflow:hidden;padding-right:28px;
  background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}

/* ---------- Taşma/çakışma güvenlikleri ---------- */
.legend .nm{min-width:0}
.legend button{min-height:26px}
.row .mid>b,.row .mid>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{max-width:48%}
.row .end b{white-space:nowrap}
.pills{row-gap:8px}
.pill{white-space:nowrap}
.spend-top{flex-wrap:wrap;row-gap:12px}
.spend-top .seg{flex:1 1 180px;max-width:220px}
.hero-foot{gap:10px;flex-wrap:wrap}
.cc-foot{gap:8px}
.cc-foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa{min-width:0}
.qa,.act{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:370px){
  .donut{width:140px;height:140px}
  .donut-wrap{gap:12px}
  .quick{gap:8px}.qa{font-size:11px}
  .stats{gap:8px}.stat .v{font-size:17px}
  .hero-amount{font-size:38px}
  .topbar h1,.page-title{font-size:30px}
}

/* ---------- Kart çevirme: Safari'de iki yüzün üst üste görünmesini engelle (backface yerine görünürlük değişimi) ---------- */
.flip-inner{transition:transform .5s cubic-bezier(.45,0,.25,1)}
.flip-inner>.ccard{transition:opacity 0s linear .25s}
.flip-inner>.ccard.cc-back{opacity:0;pointer-events:none}
.flipper.flipped .flip-inner>.ccard.cc-back{opacity:1;pointer-events:auto}
.flipper.flipped .flip-inner>.ccard:not(.cc-back){opacity:0;pointer-events:none}

/* ---------- Bildirim: tek seferde tek, Dynamic Island hizasında cam hap ---------- */
.toasts{top:calc(var(--sat) + 8px)}
.toast{background:var(--toast);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border-radius:24px;padding:12px 18px;max-width:min(92vw,440px);box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.18)}

/* ---------- Klavye açıkken sohbet çubuğu klavyenin üstünde ---------- */
.chat-bar{bottom:calc(var(--sab) + var(--dock-h) + 22px);transition:bottom .25s var(--ease)}
body.kb .chat-bar,body.typing .chat-bar{bottom:calc(var(--kb,0px) + 10px)}
.chat{padding-bottom:calc(var(--dock-h) + 70px)}

/* ---------- Bağlam menüsü, kilit ekranı: cam ---------- */
.ctx{background:var(--sheet);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);border-radius:20px}
#lock{padding-top:calc(var(--sat) + 20px)}
/* Bildirim: başlıkların üstüne binmesin diye alt barın hemen üstünde (iOS Mail "Geri Al" gibi); pencere açıkken üstte */
.toasts{top:auto;bottom:calc(var(--sab) + var(--dock-h) + 24px);flex-direction:column-reverse}
body.kb .toasts,body.typing .toasts{bottom:calc(var(--kb,0px) + 12px)}
body:has(#sheet) .toasts,body.onboarding .toasts{bottom:auto;top:calc(var(--sat) + 8px)}
@keyframes toastIn{from{transform:translateY(24px) scale(.92);opacity:0}}
@keyframes toastOut{to{transform:translateY(16px) scale(.96);opacity:0}}

/* =====================================================================
   v7 · Hareket, widget'lar, marka rozetleri, hikâye, erişilebilirlik, iPad
   ===================================================================== */
html{overscroll-behavior-y:none}
body.sheet-open,body.story-open{overflow:hidden}

/* ---------- Pencere sürükleme ---------- */
.sheet{overscroll-behavior:contain;transition:height .38s var(--ease)}
.sheet.dragging{user-select:none;-webkit-user-select:none}
.grab-zone{height:26px;margin:-6px -18px 0;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.grab-zone .grabber{margin:0;width:40px;height:5px;background:var(--text3)}
.sheet-head{touch-action:none;cursor:grab}
.sheet-head button{cursor:pointer}

/* ---------- Aşağı çekip yenile: sıvı damla ---------- */
#ptr{position:fixed;top:calc(var(--sat) + 8px);left:50%;z-index:46;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  color:var(--blue);background:var(--toast,var(--glass-strong));-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.25);transform:translate(-50%,-70px) scale(.5);opacity:0;pointer-events:none}
#ptr.show{opacity:1}
#ptr svg.i{width:20px;height:20px;transform:rotate(calc(var(--p,0) * 180deg));transition:transform .2s}
#ptr.ready svg.i{transform:rotate(180deg)}
#ptr.spin svg.i{display:none}
#ptr.spin::after{content:"";width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}

/* ---------- Kayan rakamlar ---------- */
.odo{display:inline-block;height:1.08em;overflow:hidden;vertical-align:top;line-height:1.08em}
.odo-s{display:flex;flex-direction:column;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.odo-s>span{height:1.08em;line-height:1.08em;display:block}
.hero-amount,.wt-v,.cc-amt,.hero-foot b{line-height:1.08}

/* ---------- Yumuşak grafik geçişleri (Morph ile aynı öğeler güncellenir) ---------- */
.donut circle.s{transition:stroke-dasharray .7s var(--ease),stroke-dashoffset .7s var(--ease),stroke .4s,opacity .3s,stroke-width .3s var(--spring)}
.bar-stack span,.rb-stack i,.dbars span,.wt-mini i{transition:height .6s var(--ease),background .3s}
.cat-row .cb span,.cmp .bar2 span,.prog span,.cc-bar span{transition:width .7s var(--ease)}
.heat .c{transition:background .4s}
.legend button,.rb-col{transition:opacity .3s}

/* ---------- Karttan sayfaya geçiş (View Transitions) ---------- */
::view-transition-group(hero){animation-duration:.48s;animation-timing-function:cubic-bezier(.2,.85,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s}
::view-transition-old(hero),::view-transition-new(hero){height:100%;object-fit:cover}

/* ---------- Kenardan geri ---------- */
body.edge-back #screen{will-change:transform}
body.edge-back .dock{opacity:.6}

/* ---------- Marka rozetleri ---------- */
.ic.brand{font-weight:800;letter-spacing:-.02em;line-height:1;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.18);font-family:var(--font)}
.dhero .ic.brand{width:62px;height:62px;border-radius:20px}

/* ---------- Ruh hali hapı ---------- */
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mood{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap;background:var(--fill);color:var(--text2)}
.mood i{width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 8px #30d158}
.mood.m1 i{background:#ff9f0a;box-shadow:0 0 8px #ff9f0a}.mood.m1{color:var(--orange)}
.mood.m2 i{background:#ff453a;box-shadow:0 0 8px #ff453a;animation:pulse-dot 1.4s infinite}.mood.m2{color:var(--red)}
@keyframes pulse-dot{50%{opacity:.35}}

/* ---------- Widget ızgarası ---------- */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;align-items:start}
.w{position:relative;min-width:0}
.w-m,.w-l{grid-column:1/-1}
.w>*:first-child,.w>.section:first-child,.w>.hero{margin-top:0!important}
.w>.chips{margin-top:-4px;margin-bottom:-6px;padding-top:0}
.w>.section>.section-head{margin-top:2px}
.wt{width:100%;min-height:158px;border-radius:24px;padding:14px 14px 13px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:3px;overflow:hidden}
.wt-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-ic svg.i{width:17px;height:17px}
.wt-v{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:auto;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-s{font-size:12px;color:var(--text2);line-height:1.3;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wt-mini{position:absolute;top:14px;right:14px;display:flex;align-items:flex-end;gap:3px;height:28px}
.wt-mini i{width:5px;border-radius:2px;background:var(--purple);opacity:.85}.wt-mini i.f{opacity:.2}
.wt-ring{position:absolute;top:12px;right:12px}
.wt-ring .ring .in{display:none}
.wt-prog{width:100%;margin-top:6px;height:6px}
.w-empty{border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--text2);min-height:120px;justify-content:center}
.w-empty svg.i{width:26px;height:26px}.w-empty b{color:var(--text);font-size:14px}.w-empty span{font-size:12px}
/* Düzenleme modu: sallanma, kaldır, boyut, sürükle */
.wgrid.editing .w{animation:jiggle .26s ease-in-out infinite alternate;transform-origin:50% 50%}
.wgrid.editing .w:nth-child(2n){animation-delay:-.13s;animation-duration:.24s}
.wgrid.editing .w-l{animation-name:jiggle-sm}
@keyframes jiggle{from{transform:rotate(-.9deg)}to{transform:rotate(.9deg)}}
@keyframes jiggle-sm{from{transform:rotate(-.35deg)}to{transform:rotate(.35deg)}}
.w-shield{position:absolute;inset:0;z-index:5;border-radius:24px;touch-action:pan-y;cursor:grab;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.w-del,.w-size{position:absolute;z-index:6;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.w-del{top:-8px;left:-8px;background:#8e8e93;color:#fff}.w-del svg.i{width:16px;height:16px;stroke-width:3}
.w-size{bottom:-8px;right:-8px;background:var(--toast,#3a3a3c);color:var(--text)}.w-size svg.i{width:15px;height:15px}
.w-ph{opacity:.25;animation:none!important}
.w-ghost{position:fixed;z-index:400;pointer-events:none;transform:scale(1.05);box-shadow:0 30px 60px rgba(0,0,0,.45);border-radius:24px;opacity:.96;transition:none}
.w-ghost .w-del,.w-ghost .w-size{display:none}
.w-editbar{position:sticky;top:calc(var(--sat) + 6px);z-index:46;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:6px;border-radius:24px}
.w-editbar button{display:flex;align-items:center;gap:4px;min-height:40px;padding:0 14px;border-radius:20px;font-weight:700;font-size:15px;color:var(--blue)}
.w-editbar button.done{background:var(--blue);color:#fff}
.w-editbar span{font-size:12px;color:var(--text2);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-editbar svg.i{width:18px;height:18px;stroke-width:2.4}
.wg-list{display:flex;flex-direction:column;gap:10px}
.wg-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;flex-wrap:wrap}
.wg-row .mid{flex:1;min-width:120px}.wg-row .mid b{display:block;font-size:15px}.wg-row .mid span{font-size:12px;color:var(--text2)}
.wg-sz{display:flex;gap:6px}.wg-sz .chip{padding:7px 12px;font-size:12.5px}

/* ---------- Gökkuşağı çubuklar ---------- */
.rb{display:flex;align-items:flex-end;gap:6px;height:var(--rbh,150px)}
.rb-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.rb-col.dim{opacity:.4}
.rb-v{font-size:10px;color:var(--text2);height:13px;white-space:nowrap}
.rb-stack{flex:1;width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:9px;overflow:hidden;background:var(--fill);gap:1.5px}
.rb-stack.fut{opacity:.35}
.rb-stack i{display:block;width:100%;min-height:0}
.rb-col.on .rb-stack{box-shadow:0 0 0 2px var(--blue)}
.rb-l{font-size:10.5px;color:var(--text2);font-weight:600;white-space:nowrap}
.rb-sum{margin:12px 4px 0;font-size:13px;color:var(--text2)}.rb-sum b{color:var(--text)}
.rb-cats{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:12px}
.rb-cats i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:0}

/* ---------- Eğilim kartları ---------- */
.trends{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trend{padding:14px;border-radius:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.trend b{font-size:14px;line-height:1.3}
.tr-top{display:flex;justify-content:space-between;align-items:center}
.tr-top .ic{width:34px;height:34px;border-radius:11px}
.tr-badge{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:800;padding:4px 8px;border-radius:10px}
.tr-badge svg.i{width:13px;height:13px;stroke-width:2.6}
.tr-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin-top:auto}
.tr-bot .muted{min-width:0}
.spark{flex-shrink:0}
@media (max-width:370px){.trends{grid-template-columns:1fr}}

/* ---------- Ay özeti düğmesi + hikâye ---------- */
.recap-btn{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:14px 16px;border-radius:22px;text-align:left}
.recap-btn>span:nth-child(2){flex:1;min-width:0}
.recap-btn b{display:block;font-size:15.5px}.recap-btn small{font-size:12.5px;color:var(--text2)}
.rc-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ff375f,#5e5ce6,#0a84ff)}
.rc-ic svg.i{width:22px;height:22px}
#story{position:fixed;inset:0;z-index:700;color:#fff;transition:background .5s;animation:storyIn .35s var(--ease);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#story.out{animation:storyOut .28s forwards}
@keyframes storyIn{from{transform:scale(.94);opacity:0}}
@keyframes storyOut{to{transform:translateY(40px) scale(.96);opacity:0}}
.st-bars{position:absolute;top:calc(var(--sat) + 10px);left:12px;right:12px;display:flex;gap:4px;z-index:3}
.st-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.st-bars i b{display:block;height:100%;width:0;background:#fff}
.st-bars i.done b{width:100%}
.st-bars i.cur b{animation:stbar 6s linear forwards}
#story.paused .st-bars i.cur b{animation-play-state:paused}
@keyframes stbar{to{width:100%}}
.st-x{position:absolute;top:calc(var(--sat) + 22px);right:12px;z-index:4;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.2)}
.st-nav{position:absolute;inset:0;display:flex;z-index:1}
.st-nav button{flex:1;height:100%}.st-prev{max-width:34%}
.st-body{position:absolute;inset:calc(var(--sat) + 70px) 24px calc(var(--sab) + 30px);display:flex;align-items:center;z-index:2;pointer-events:none}
.st-card{width:100%;max-width:460px;margin:0 auto;animation:rise .55s var(--ease) both}
.st-ic{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin-bottom:22px}
.st-ic svg.i{width:36px;height:36px}.st-ic .ic.brand{width:72px;height:72px;border-radius:22px}
.st-k{font-size:17px;font-weight:600;opacity:.85}
.st-big{font-size:clamp(40px,12vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin:6px 0 12px;word-break:break-word}
.st-sub{font-size:17px;line-height:1.45;opacity:.92}
.st-cats{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.st-cats>div{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.st-cats i{height:10px;border-radius:5px;display:block}
.st-acts{display:flex;gap:10px;margin-top:28px;pointer-events:auto;position:relative;z-index:3}
.st-acts .btn{margin:0}
.st-acts .btn:not(.primary){background:rgba(255,255,255,.18);color:#fff}

/* ---------- Saydamlığı azalt ---------- */
html.solid .ambient{display:none}
html.solid{--gw-opacity:.94!important;--gw-blur:0px!important;--gw-saturation:1!important}
html.solid .glass,html.solid .sheet,html.solid #navbar,html.solid .toast,html.solid .ctx,html.solid #sbar,html.solid .tabbar,html.solid .dock-add{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html.solid .sheet-backdrop{background:rgba(0,0,0,.5)}
html.solid #sbar{background:var(--bg)}

/* ---------- Yüksek kontrast ---------- */
html.hc[data-theme=dark]{--muted-foreground:#d3dbd9;--faint:#a7b1ae;--sep:rgba(255,255,255,.28);--fill:rgba(255,255,255,.16);--border:rgba(255,255,255,.3)}
html.hc[data-theme=light]{--muted-foreground:#2c3533;--faint:#55605d;--sep:rgba(0,0,0,.25);--fill:rgba(0,0,0,.1);--border:rgba(0,0,0,.3)}
html.hc .glass{box-shadow:var(--g-shadow),inset 0 0 0 1.5px var(--text3)}
html.hc .tab:not(.on){color:var(--text)}
html.hc .btn,html.hc .chip,html.hc .mini-btn{box-shadow:inset 0 0 0 1px var(--text3)}

/* Klavye odağı (klavye / anahtar kontrolüyle kullananlar için) */
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:12px}
.tab:focus-visible,.seg button:focus-visible{outline-offset:-2px}

/* ---------- iPad / yatay: geniş ekran ---------- */
html.wide .wgrid{grid-template-columns:repeat(4,1fr)}
html.wide .w-m{grid-column:span 2}
html.wide .w-l{grid-column:1/-1}
html.wide .dock{padding:0 24px}
.split{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr);gap:32px;align-items:start}
.split-l{position:sticky;top:calc(var(--sat) + 8px);max-height:calc(100vh - var(--sat) - 110px);overflow-y:auto;padding:0 6px 20px;margin:0 -6px;scrollbar-width:thin;overscroll-behavior:contain}
.split-l .wgrid{grid-template-columns:1fr 1fr}
.split-l .w-m,.split-l .w-l{grid-column:1/-1}
.split-r{min-width:0}

.tr-bot{flex-direction:column;align-items:stretch;gap:6px}
.tr-bot .spark{width:100%;height:30px;display:block}
.tr-avg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head h3:focus{outline:none}

/* ===================== v8 · araçlar, rozetler ===================== */
.wi-card{padding:12px 14px;margin-top:12px;border-radius:20px}
.wi-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:15px}.wi-h .i{width:18px;height:18px;color:var(--blue)}
.wi-kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:.5px solid var(--sep,rgba(128,128,128,.2));font-size:14px}
.wi-kv:last-child{border-bottom:0}.wi-kv span{color:var(--text2)}.wi-kv b{text-align:right}
.wi-t{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.wi-t th{text-align:left;font-weight:600;color:var(--text2);font-size:11.5px;padding:4px 0}.wi-t td{padding:5px 0;border-top:.5px solid var(--sep,rgba(128,128,128,.2))}
.wi-t th:not(:first-child),.wi-t td:not(:first-child){text-align:right}
button.stat{text-align:left;font:inherit;color:inherit;width:100%;display:block}
.steps{margin:0;padding:12px 14px 12px 34px;border-radius:20px;font-size:14px;line-height:1.5}
.steps li{margin:6px 0}.steps li::marker{color:var(--blue);font-weight:700}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--fill,rgba(128,128,128,.14));padding:6px 9px;border-radius:9px;margin:6px 0 4px;display:inline-block}
.code i{color:var(--blue);font-style:normal;font-weight:600}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:6px 0 0}
.streak-hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px}
.sh-fire{font-size:44px;line-height:1;filter:drop-shadow(0 4px 14px rgba(255,159,10,.45))}
.sh-n{font-size:30px;font-weight:800;letter-spacing:-.5px}
.streak-week{display:flex;justify-content:space-between;gap:4px;margin:12px 4px 4px}
.streak-week>span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text2);flex:1}
.streak-week i{width:22px;height:22px;border-radius:50%;background:var(--fill,rgba(128,128,128,.16));display:block}
.streak-week .ok i{background:linear-gradient(135deg,#ffd60a,#ff9f0a);box-shadow:0 2px 8px rgba(255,159,10,.4)}
.streak-week .x i{background:rgba(255,69,58,.22);box-shadow:inset 0 0 0 2px rgba(255,69,58,.55)}
.streak-week .pre i{opacity:.35}
.streak-week.sm{margin:0;gap:5px;flex:0 0 auto}.streak-week.sm>span{flex:0 0 auto}.streak-week.sm i{width:13px;height:13px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badges .badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:12px 6px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-border);opacity:.45;filter:grayscale(1)}
.badges .badge.on{opacity:1;filter:none}
.badges .badge .be{font-size:30px;line-height:1.1}.badges .badge b{font-size:12.5px;line-height:1.2}.badges .badge small{font-size:10.5px;color:var(--text2);line-height:1.25}
.streak-w{width:100%;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:10px 8px;align-items:center;padding:14px 16px;border-radius:24px;text-align:left;font:inherit;color:inherit}
.sw-l{display:flex;align-items:center;gap:10px;min-width:0}.sw-f{font-size:30px;line-height:1}
.sw-l b{display:block;font-size:20px;font-weight:800}.sw-l small{display:block;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-b{grid-column:1/-1;font-size:12.5px;color:var(--text2)}

/* ===================== v9 · alt bar sabitleme, Ziraat modülü, bulut ===================== */
/* Alt bar: her zaman ekranın altına sabit, kaydırmada boyut/konum değişmez; içerik altında yumuşakça kaybolur */
body{min-height:100dvh;padding-bottom:calc(var(--sab) + var(--dock-h) + 44px)}
.dock{bottom:0;padding:0 14px calc(var(--sab) + 10px);transform:translate3d(0,0,0);-webkit-transform:translate3d(0,0,0);will-change:transform;contain:layout style;
  transition:transform .35s var(--ease),opacity .25s}
.dock::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(100% + 26px);z-index:-1;pointer-events:none;
  background:linear-gradient(to top,var(--bg) 0%,color-mix(in srgb,var(--bg) 82%,transparent) 45%,transparent 100%)}
html.wide .dock::before{display:none}
.tabbar,.dock-add{transform:translateZ(0)}
@supports not (height:100dvh){body{min-height:100vh}}

/* Ziraat hazır kurulum */
.zr-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zr-p{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:18px;font-size:12px;font-weight:600;line-height:1.2;text-align:center;min-height:86px}
