U.md=t=>U.esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,3}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-•*]\s+(.+)$/gm,'<span class="md-li">$1</span>').replace(/<\/span>\n/g,'</span>').replace(/\n/g,'<br>');

/* ---------- Ek AI şemaları ve şablonları ---------- */
Schemas.voice=()=>({type:'object',properties:{
  kind:{type:'string',enum:['expense','income']},amount:{type:['number','null']},merchant:{type:['string','null']},
  category:{type:'string',enum:[...expenseCats(),...incomeCats()]},account_hint:{type:['string','null'],description:'Söylenen hesap/kart adı'},
  installments:{type:'integer',minimum:1,maximum:36},date:{type:['string','null'],format:'date'},note:{type:['string','null']}},required:['kind','amount','category','installments']});
Schemas.letter={type:'object',properties:{subject:{type:'string'},body:{type:'string'}},required:['subject','body']};
Prompts.voice=(text,s)=>({thinking:'minimal',maxTokens:1024,schema:Schemas.voice(),
  system:`Kullanıcının Türkçe söylediği/yazdığı cümleden tek bir harcama veya gelir kaydı çıkar. Bugün ${U.today()} (${U.DAYS[new Date().getDay()]}). "dün", "geçen cuma" gibi ifadeleri tarihe çevir; tarih yoksa null.
Tutarı sayı ver ("450 lira"→450, "bin iki yüz"→1200). "3 taksit" → installments=3, yoksa 1. Mağaza/açıklamayı kısa ve düzgün yaz. Kullanıcının hesapları: ${s.accounts.map(a=>a.name).join(', ')}. ${catHint()}`,
  input:text});
Prompts.chat=(q,history,ctx)=>({thinking:'medium',maxTokens:4096,
  system:`Sen kullanıcının kişisel finans asistanısın. Türkçe, kısa ve net cevap ver. Yalnızca aşağıdaki verilere dayan; hesaplamaları dikkatle yap ve gerekirse nasıl hesapladığını tek cümleyle söyle.
Veri yoksa ya da yetersizse bunu açıkça söyle, tahmin uydurma. Tutarları "1.250 ₺" biçiminde yaz. Gerektiğinde madde işaretleri (- ) ve **kalın** kullan. Hisse/kripto gibi yatırım tavsiyesi verme.
KULLANICI VERİSİ (JSON):\n${JSON.stringify(ctx)}`,
  input:(history.length?'Önceki konuşma:\n'+history.slice(-6).map(m=>(m.role==='user'?'Kullanıcı: ':'Asistan: ')+m.text).join('\n')+'\n\n':'')+'Yeni soru: '+q});
Prompts.letter=(o)=>({thinking:'low',maxTokens:2048,schema:Schemas.letter,
  system:'Türkçe, kibar ve resmi bir abonelik iptal e-postası yaz. Kısa tut (en fazla 150 kelime). Uydurma sözleşme/müşteri numarası yazma; gerekiyorsa [köşeli parantez] ile yer tutucu bırak.',
  input:`Hizmet: ${o.name}\nAylık ücret: ${U.money(o.amount,{raw:true})}\nAbone adı: ${o.user||'[Ad Soyad]'}\nTarih: ${U.fmtDate(U.today(),'y')}\nİstek: aboneliğin bir sonraki fatura döneminden önce iptali, otomatik yenilemenin durdurulması, iptalin yazılı olarak onaylanması.`});
const Voice={
  local(text,s){const t=U.lc(text);const num=t.replace(/(\d)\.(\d{3})/g,'$1$2').match(/(\d+(?:[.,]\d+)?)\s*(?:lira|tl|₺)?/);const amount=num?U.parseNum(num[1]):null;
    const inst=(t.match(/(\d+)\s*taksit/)||[])[1];const income=/(aldım|geldi|yattı|maaş|harçlık|kazandım|gelir)/.test(t);
    const acc=s.accounts.find(a=>U.norm(a.name).split(' ').some(w=>w.length>=3&&t.includes(w)));
    const mm=text.match(/([A-ZÇĞİÖŞÜ][\wçğıöşüÇĞİÖŞÜ&]+(?:\s[A-ZÇĞİÖŞÜ][\wçğıöşü]+)?)'?(?:da|de|ta|te|dan|den|tan|ten)\b/)||text.match(/^([A-ZÇĞİÖŞÜa-zçğıöşü&]+)/);
    const merchant=mm?mm[1]:'';const rec=merchant&&D.recallMerchant(s,merchant,income?'income':'expense');
    const date=/dün/.test(t)?U.addDays(U.today(),-1):U.today();
    return{kind:income?'income':'expense',amount,merchant,category:rec?.category||(income?'income':'other'),accountId:acc?.id||rec?.accountId,installments:inst?+inst:1,date}},
  async parse(text){const s=Store.get();let r;
    if(Secrets.get()){try{const a=await AIActions.run('voice',()=>AI.call(Prompts.voice(text,s)));
      const acc=a.account_hint&&s.accounts.find(x=>U.norm(x.name).split(' ').some(w=>w.length>=3&&U.norm(a.account_hint).includes(w)));const rec=a.merchant&&D.recallMerchant(s,a.merchant,a.kind);
      r={kind:a.kind,amount:a.amount,merchant:a.merchant||'',category:rec?.category||a.category,accountId:acc?.id||rec?.accountId,installments:a.installments||1,date:/^\d{4}-\d{2}-\d{2}$/.test(a.date||'')&&a.date<=U.today()?a.date:U.today(),note:a.note||''}}
      catch(e){Toast.show('AI kullanılamadı, basit çözümleme yapıldı');r=this.local(text,s)}}
    else r=this.local(text,s);
    return r}};

C.mobileTools=s=>{const n=s.accounts.length?D.insights(s).filter(i=>i.sev==='danger'||i.sev==='warn').length:0;

    <button class="icon-btn glass pressable m-only gw-av-m" onclick="App.openSettings()" aria-label="Ayarlar">${U.esc((s.settings.name||'?')[0].toLocaleUpperCase('tr'))}</button>`};
C.tabHead=(title,sub,right='',cls='')=>`<header class="topbar gw-head ${cls}"><div><div class="t-sub">${sub||''}</div><h1>${title}</h1></div><div class="top-actions">${right}</div></header>`;
C.pageHead=(title,sub,right='')=>`<div class="page-head"><button class="back pressable" onclick="App.back()"><b>‹</b>Geri</button>${right}</div>
  <h1 class="page-title">${title}</h1>${sub?`<div class="page-sub">${sub}</div>`:''}`;
C.chips=(opts,val,fn)=>`<div class="chips">${opts.map(([k,l])=>`<button class="chip pressable ${k===val?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
C.segmented=(opts,val,fn)=>{const i=Math.max(0,opts.findIndex(o=>o[0]===val)),w=100/opts.length;
  return `<div class="seg"><span class="thumb" style="width:calc(${w}% - 1.33px);transform:translateX(${i*100}%)"></span>${opts.map(([k,l])=>`<button onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`};
C.ring=(pct,size=72,color='var(--blue)',inner='',stroke=8)=>{const r=(size-stroke)/2,c=2*Math.PI*r,p=Math.max(0,Math.min(1,pct||0));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle r="${r}" cx="${size/2}" cy="${size/2}" stroke="var(--fill)" stroke-width="${stroke}"/>
    <circle r="${r}" cx="${size/2}" cy="${size/2}" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${Math.max(.01,p*c)} ${c}"/></svg><span class="in" style="color:${color}">${inner}</span></div>`};
C.empty=(icon,text,btn='')=>`<div class="empty"><span class="e">${C.ic(icon)}</span>${text}${btn}</div>`;
C.section=(title,right,body)=>`<div class="section"><div class="section-head"><h2>${title}</h2>${right||''}</div>${body}</div>`;
C.badge=st=>{const[l,c]=D.ST[st]||[st,'blue'];return `<span class="badge ${c}">${l}</span>`};

/* --- Kaydırılabilir satır: sola/sağa kaydırınca eylemler --- */
C.swipe=(inner,{l=[],r=[],lp=''}={})=>{const b=([label,icon,cls,on])=>`<button class="${cls}" onclick="event.stopPropagation();Gesture.closeAll();${on}">${C.ic(icon)}${label}</button>`;
  return `<div class="swipe">${l.length?`<div class="swipe-acts l">${l.map(b).join('')}</div>`:''}${r.length?`<div class="swipe-acts r">${r.map(b).join('')}</div>`:''}
    <div class="swipe-fg" data-l="${l.length}" data-r="${r.length}" ${lp?`data-lp="${lp}"`:''}>${inner}</div></div>`};

/* --- Çizgi grafik (SVG) + parmakla değer okuma --- */
C.lineChart=(pts,{h=150,color='var(--blue)',labels=true,id='lc',fmt='money'}={})=>{if(!pts.length)return '';
  const W=340,H=h,pad=8,vals=pts.map(p=>p.value),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const x=i=>pad+i*(W-2*pad)/Math.max(1,pts.length-1),y=v=>pad+(H-28)*(1-(v-mn)/rng);
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.value).toFixed(1)).join(' ');
  const area=d+` L${x(pts.length-1).toFixed(1)} ${H-20} L${x(0).toFixed(1)} ${H-20} Z`,li=pts.length-1;
  const lbl=labels?pts.map((p,i)=>i%Math.ceil(pts.length/6)===0||i===li?`<text x="${x(i)}" y="${H-4}" text-anchor="${i===0?'start':i===li?'end':'middle'}">${U.esc(p.label)}</text>`:'').join(''):'';
  return `<div class="lc-wrap" data-pts="${U.esc(JSON.stringify(pts.map(p=>[p.tip||p.label,p.value])))}" data-fmt="${fmt}"><svg class="lchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(li)}" cy="${y(pts[li].value)}" r="4.5" fill="${color}" stroke="var(--bg)" stroke-width="2"/>${lbl}</svg><div class="lc-line"></div><div class="lc-tip"></div></div>`};

/* --- Isı haritası (ayın günleri harcamaya göre renklenir) --- */
C.heatmap=(daily,y,m)=>{const mx=Math.max(1,...daily),lead=(new Date(y,m,1).getDay()+6)%7;
  return `<div class="heat">${['Pt','Sa','Ça','Pe','Cu','Ct','Pz'].map(d=>`<span class="wd">${d}</span>`).join('')}${'<span></span>'.repeat(lead)}
    ${daily.map((v,i)=>{const p=v?Math.round(18+v/mx*82):0;return `<span class="c ${p>55?'hot':''}" style="${v?`background:color-mix(in srgb,var(--blue) ${p}%,var(--fill))`:''}" title="${U.money(v,{dec:false})}">${i+1}</span>`}).join('')}</div>
    <div class="heat-legend">az ${[20,45,70,100].map(p=>`<i style="background:color-mix(in srgb,var(--blue) ${p}%,var(--fill))"></i>`).join('')} çok</div>`};

/* --- Para akışı (Sankey): gelir → kategoriler / birikim --- */
C.sankey=(income,cats)=>{const exp=cats.reduce((a,c)=>a+c.value,0);if(exp<=0&&income<=0)return '';
  const src=[{name:'Gelir',value:income,color:'#30d158'}];if(exp>income)src.push({name:'Birikim / borç',value:U.r2(exp-income),color:'#ff453a'});
  const top=cats.slice(0,6),rest=cats.slice(6).reduce((a,c)=>a+c.value,0);const dst=[...top];if(rest>0)dst.push({name:'Diğer',value:rest,color:'#8e8e93'});
  if(income>exp)dst.push({name:'Kalan',value:U.r2(income-exp),color:'#30d158',save:true});
  const T=Math.max(income,exp),W=340,H=Math.max(170,dst.length*30),G=6,k=Math.min((H-G*(src.length-1))/T,(H-G*(dst.length-1))/T);
  let y=0;src.forEach(n=>{n.y=y;n.h=Math.max(2,n.value*k);y+=n.h+G});y=0;dst.forEach(n=>{n.y=y;n.h=Math.max(2,n.value*k);y+=n.h+G});
  const x1=16,x2=196,mx=(x1+x2)/2;let ribbons='';
  let si=0,sOff=0;for(const t of dst){let need=t.value,tOff=0;while(need>0.009&&si<src.length){const s=src[si],avail=s.value-sOff,take=Math.min(avail,need);
    const ys0=s.y+sOff*k,ys1=ys0+take*k,yt0=t.y+tOff*k,yt1=yt0+take*k;
    ribbons+=`<path d="M${x1} ${ys0}C${mx} ${ys0} ${mx} ${yt0} ${x2} ${yt0}L${x2} ${yt1}C${mx} ${yt1} ${mx} ${ys1} ${x1} ${ys1}Z" fill="${t.color}" opacity=".32"/>`;
    sOff+=take;tOff+=take;need-=take;if(sOff>=s.value-0.009){si++;sOff=0}}}
  const nodes=src.map(n=>`<rect x="6" y="${n.y}" width="10" height="${n.h}" rx="3" fill="${n.color}"/>`).join('')+dst.map(n=>`<rect x="${x2}" y="${n.y}" width="10" height="${n.h}" rx="3" fill="${n.color}"/>
    <text x="${x2+16}" y="${n.y+n.h/2-1}" dominant-baseline="middle">${U.esc(n.name)}</text><text class="v" x="${x2+16}" y="${n.y+n.h/2+11}" dominant-baseline="middle">${U.money(n.value,{dec:false})}</text>`).join('');
  const lt=src.map(n=>`<text x="22" y="${n.y+12}" style="font-weight:700">${U.esc(n.name)}</text><text class="v" x="22" y="${n.y+25}">${U.money(n.value,{dec:false})}</text>`).join('');
  return `<svg class="sankey" viewBox="0 0 ${W} ${H}">${ribbons}${nodes}${lt}</svg>`};

/* --- Hero (net varlık) --- */
D.liquidAt=(s,E)=>U.r2(s.accounts.filter(a=>a.type!=='credit').reduce((sum,a)=>{let b=+a.opening||0;for(const t of s.transactions)if(t.date<=E)b+=D.effect(t,a.id);return sum+D.toTRY(s,b,a.currency)},0));
C.hero=s=>{const nw=D.netWorth(s),mc=D.monthCompare(s),T=U.today(),liq=D.liquidAt(s,T),prev=D.liquidAt(s,U.addMonths(T,-1));
  const ch=prev?U.r2((liq-prev)/Math.abs(prev)*100):null,cc=ch===null||Math.abs(ch)<.05?'flat':ch>0?'up':'down';
  const main=s.accounts.filter(a=>a.type!=='credit').map(a=>({a,b:D.toTRY(s,D.balance(s,a.id),a.currency),k:a.type==='checking'?1:0})).sort((x,y)=>y.k-x.k||y.b-x.b)[0];
  const row=main?(()=>{const a=main.a,b=D.balance(s,a.id);return `<button class="gw-acc" data-acc="${a.id}" onclick="App.openAcc('${a.id}')" aria-label="${U.esc(a.name)} ayrıntıları">
      <span class="gw-box">${C.ic(a.type==='checking'?'card':accIcon(a))}</span><span class="mid"><b>${U.esc(a.name)}</b><small>${a.last4?'•••• '+U.esc(String(a.last4).slice(-4))+' · ':(U.lc(a.name)!==U.lc(ACCOUNT_TYPES[a.type].name)?ACCOUNT_TYPES[a.type].name+' · ':'')}${U.money(b,{cur:a.currency,dec:false})}</small></span>
      <span class="gw-arrow">${C.ic('send')}</span></button>`})():'';
  return `<section class="glass gw-panel hero gw-bal"><div class="gw-title"><h2>Kullanılabilir bakiye</h2>${C.ic('wallet')}</div>
    <div class="hero-amount" data-count="${liq}" data-fmt="big" data-key="liq">${U.bigMoney(liq)}</div>
    <div class="gw-meta"><span class="gw-chg ${cc}">${ch===null?'İlk ay':(ch>0?'+':ch<0?'−':'')+'%'+Math.abs(ch).toLocaleString('tr-TR',{maximumFractionDigits:1})}</span>geçen aya göre${s.settings.moodColors!==false?C.moodPill(s):''}</div>
    <div class="gw-foot"><span>Net varlık <b class="num" data-count="${nw.net}" data-fmt="money" data-key="net">${U.money(nw.net,{dec:false})}</b></span></div>
    ${row}</section>`};

C.quick=()=>`<div class="quick">${[['scan','camera','Fiş Tara'],['expense','minus','Harcama'],['transfer','transfer','Transfer'],['pay','send','Kart Öde']]
  .map(([k,ic,l])=>`<button class="qa glass pressable" onclick="App.quick('${k}')"><span class="ic">${C.ic(ic)}</span>${l}</button>`).join('')}</div>`;

C.templates=s=>!s.templates.length?'':`<div class="chips">${s.templates.map(t=>`<button class="chip pressable" style="display:flex;align-items:center" onclick="App.useTemplate('${t.id}')"><span style="color:${cat(t.category).color};margin-right:6px">${C.ic(cat(t.category).icon)}</span>${U.esc(t.name)} · ${U.money(t.amount,{dec:false})}</button>`).join('')}
  <button class="chip pressable" onclick="TemplateForm.list()" aria-label="Şablonlar">${C.ic('sliders')}</button></div>`;

/* --- Kredi kartı (ön + arka yüz, desenli) --- */
C.ccStyle=a=>{const g=GRADIENTS[(a.color||0)%GRADIENTS.length];return `--cc1:${g[0]};--cc2:${g[1]};background:linear-gradient(135deg,${g[0]},${g[1]})`};
C.creditCard=(s,a,{flip=true}={})=>{const m=D.cardSummary(s,a.id),u=Math.min(100,Math.max(0,m.usage*100)),st=a.style||'aurora';
  return `<div class="ccard cs-${st}" style="${C.ccStyle(a)}"><span class="sheen"></span>
    <div class="cc-top"><div><div class="cc-name">${U.esc(a.name)}</div><div class="cc-bank">${m.shared?'Ortak limit · '+U.esc(m.root.name):U.esc(a.bank||'Kredi Kartı')}</div></div><div class="chip"></div></div>
    <div><div class="cc-lbl">Kullanılabilir limit</div><div class="cc-amt num" data-count="${m.available}" data-fmt="money" data-key="av-${a.id}">${U.money(m.available)}</div>
      <div class="cc-bar"><span style="width:${100-u}%"></span></div>
      <div class="cc-foot"><span>${m.dueNow>0?'Ödenecek '+U.money(m.dueNow,{dec:false}):'Dönem içi '+U.money(m.openTotal,{dec:false})}</span><span style="margin-right:${flip?38:0}px">${m.dueNow>0?'Son ödeme '+U.fmtDate(m.lastDue):'Kesim '+U.fmtDate(m.openCut)}</span></div></div>
    ${flip?`<button class="cc-flip pressable" onclick="event.stopPropagation();App.flipCard('${a.id}',this)" aria-label="Kartı çevir">${C.ic('flip')}</button>`:''}</div>`};
C.cardBack=(s,a)=>{const m=D.cardSummary(s,a.id),st=a.style||'aurora';
  return `<div class="ccard cc-back cs-${st}" style="${C.ccStyle(a)};justify-content:flex-start;gap:12px"><span class="sheen"></span><div class="stripe"></div>
    <div class="cc-rows"><div>Hesap kesim<b>${U.fmtDate(m.openCut)}</b></div><div>Son ödeme<b>${U.fmtDate(m.lastDue)}</b></div>
      <div>Ekstre kalan<b class="num">${U.money(m.lastRemaining,{dec:false})}</b></div><div>Asgari<b class="num">${U.money(m.minPay,{dec:false})}</b></div>
      <div>Limit<b class="num">${U.money(m.limit,{dec:false})}</b></div><div>Aktif taksit<b>${m.activeInstallments}</b></div></div>
    <button class="cc-flip pressable" onclick="event.stopPropagation();App.flipCard('${a.id}',this)" aria-label="Kartı çevir">${C.ic('flip')}</button></div>`};
C.cardFlip=(s,a,ui)=>`<div class="flipper ${ui.flipped&&ui.flipped[a.id]?'flipped':''}"><div class="flip-inner">${C.creditCard(s,a)}${C.cardBack(s,a)}</div></div>`;
/* Apple Wallet tarzı yığın: arkadaki karta dokun → öne gelir; öndeki karta dokun → detay */
C.wallet=(s,ui)=>{const cards=s.accounts.filter(a=>a.type==='credit');if(!cards.length)return '';
  let order=[...cards];const sel=cards.find(a=>a.id===ui.walletSel);if(sel)order=[...order.filter(a=>a!==sel),sel];
  const peek=60,n=order.length;
  return `<div class="wallet ${n===1?'single':''}" style="height:${200+(n-1)*peek}px">${order.map((a,i)=>`<div class="wslot ${i===n-1?'front':''}" data-id="${a.id}" style="transform:translateY(${i*peek}px);z-index:${i+1}" onclick="App.walletTap('${a.id}',${i===n-1})">${C.cardFlip(s,a,ui)}</div>`).join('')}</div>`};
C.accTile=(s,a)=>{const b=D.balance(s,a.id),t=ACCOUNT_TYPES[a.type];
  return `<button class="acc-tile glass pressable" data-acc="${a.id}" onclick="App.openAcc('${a.id}')">
    <span class="ic" style="background:${grad(a.color)};color:#fff">${C.ic(accIcon(a))}</span>
    <div><div class="muted xs">${t.name}</div><div style="font-weight:600;font-size:14px;margin:2px 0 4px">${U.esc(a.name)}</div>
    <div class="v num ${b<0?'neg':''}">${U.money(b,{cur:a.currency})}</div>${a.currency!=='TRY'?`<div class="faint xs">≈ ${U.money(D.toTRY(s,b,a.currency),{dec:false})}</div>`:''}</div></button>`};
C.accTiles=s=>{const rest=s.accounts.filter(a=>a.type!=='credit');
  return `<div class="carousel" data-keep-scroll="acc" style="margin-top:12px">${rest.map(a=>C.accTile(s,a)).join('')}
    <button class="acc-tile glass pressable add-tile" onclick="AccForm.open()"><div><span>+</span>Hesap ekle</div></button></div>`};

/* --- İçgörüler: kaydırılabilir şerit --- */
C.insightCard=i=>`<div class="insight glass sev-${i.sev} ${i.go||i.on?'pressable':''}" ${i.on?`onclick="${U.esc(i.on)}"`:i.go?`onclick="App.push('${i.go[0]}',${U.esc(JSON.stringify(i.go[1]))})"`:''}><span class="ic">${C.ic(i.icon)}</span><div><b>${U.esc(i.title)}</b><p>${i.text}</p></div></div>`;
C.insights=s=>{const list=D.insights(s).slice(0,6);if(!list.length)return '';
  return C.section('Akıllı Özet',`<span class="muted sm">${list.length} uyarı</span>`,`<div class="strip" data-dots="ins">${list.map(C.insightCard).join('')}</div>
    ${list.length>1?`<div class="dots-ind" id="dots-ins">${list.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}`)};

/* --- AI Koç --- */
C.coach=s=>{const ai=s.ai||{},busy=ai.pending?.coach,err=ai.errors?.coach,c=ai.coach,key=!!Secrets.get(),d=c?.data;
  const PR={high:'var(--red)',medium:'var(--orange)',low:'var(--green)'},V={cancel:['scissors','red','İptal et'],review:['search','orange','Gözden geçir'],keep:['check','green','Kalsın']};
  let body='';
  if(!key)body=`<p class="muted sm">Harcamalarını analiz edip sana özel tasarruf önerileri ve gereksiz abonelik uyarıları üretir.</p><button class="btn primary pressable" onclick="App.openSettings('ai')">Gemini'yi bağla</button>`;
  else if(busy)body=`<div class="shimmer" style="width:92%"></div><div class="shimmer" style="width:70%"></div><div class="shimmer" style="width:84%"></div><p class="muted xs">Gemini son 3 ayını inceliyor…</p>`;
  else if(d)body=`<div class="ai-headline">${U.esc(d.headline)}</div>
    ${(d.tips||[]).map(t=>`<div class="tip"><span class="pr" style="background:${PR[t.priority]||'var(--blue)'}"></span><div><b>${U.esc(t.title)}</b><p>${U.esc(t.detail)}</p>${t.monthly_saving>0?`<span class="save-pill">≈ ${U.money(t.monthly_saving,{dec:false})}/ay tasarruf</span>`:''}</div></div>`).join('')}
    ${d.subscriptions?.length?`<div class="ai-sub">ABONELİKLER</div>${d.subscriptions.map(x=>{const v=V[x.verdict]||V.review;const rr=Store.get().recurring.find(r=>U.norm(r.name)===U.norm(x.name));return `<div class="tip"><span style="color:var(--${v[1]==='red'?'red':v[1]==='orange'?'orange':'green'})">${C.ic(v[0])}</span><div><b>${U.esc(x.name)} <span class="badge ${v[1]}">${v[2]}</span></b><p>${U.esc(x.reason)}</p>${x.verdict!=='keep'?`<button class="mini-btn" style="margin-top:6px" onclick="LetterSheet.open('${U.esc(x.name).replace(/'/g,"\\'")}',${rr?rr.amount:0})">İptal metni hazırla</button>`:''}</div></div>`}).join('')}`:''}`;
  else body=`<p class="muted sm">Son 3 ayının özetini Gemini'ye gönderip kişisel tavsiyeler al. Kart numarası veya işlem listesi gönderilmez, sadece özet.</p><button class="btn primary pressable" onclick="AIActions.coach()">${C.ic('sparkles')}Analiz et</button>`;
  return `<div class="section"><div class="glass ai-card"><div class="ai-head"><span class="ai-orb ${busy?'busy':''}"></span>
    <div style="flex:1;min-width:0"><b>AI Finans Koçu</b><div class="muted xs">${d&&!busy?'Gemini · '+C.relTime(c.at):'Google Gemini ile'}</div></div>
    ${d&&!busy?`<span class="score">${d.health_score}/1000</span>`:''}</div>
    ${err&&!busy?`<div class="err-box">${U.esc(err)}</div>`:''}${body}
    ${key&&!busy?`<div class="btn-row">${d?`<button class="btn pressable" onclick="AIActions.coach()">${C.ic('flip')}Yenile</button>`:''}<button class="btn pressable" onclick="App.push('chat',{})">${C.ic('chat')}Asistana sor</button></div>`:''}</div></div>`};

/* --- Harcama dağılımı (donut) --- */
C.donut=(items,total,sel)=>{const R=70,CIRC=2*Math.PI*R;let off=0;const gap=items.length>1?3:0;
  const segs=items.map((it,i)=>{const len=total?Math.max(0,it.amount)/total*CIRC:0;
    const el=`<circle class="s ${sel!==null?(sel===i?'on':'dim'):''}" r="${R}" cx="90" cy="90" stroke="${it.color}" stroke-dasharray="${Math.max(.01,len-gap)} ${CIRC}" stroke-dashoffset="${-off}" onclick="App.selSeg(${i})"/>`;
    off+=len;return el}).join('');
  const center=sel!==null&&items[sel]?`<span class="muted xs" style="color:${items[sel].color}">${U.esc(items[sel].name)}</span><b class="num">${U.money(items[sel].amount,{dec:false})}</b><span class="faint xs">%${Math.round(items[sel].amount/total*100)}</span>`
    :`<span class="muted xs">Toplam</span><b class="num">${U.money(total,{dec:false})}</b><span class="faint xs">${items.length} kategori</span>`;
  return `<div class="donut"><svg viewBox="0 0 180 180"><circle class="track" r="${R}" cx="90" cy="90"/>${segs}</svg><div class="donut-center">${center}</div></div>`};
C.spending=(s,ui)=>{const[from,to,label]=D.periodRange(ui.period);const by=D.sumBy(D.spendIn(s,from,to));
  const items=Object.entries(by).filter(([,v])=>v>0).map(([k,v])=>({key:k,amount:U.r2(v),...cat(k)})).sort((a,b)=>b.amount-a.amount);
  const total=U.r2(items.reduce((a,b)=>a+b.amount,0)),sel=ui.seg!==null&&ui.seg<items.length?ui.seg:null;
  return `<div class="section"><div class="glass spend"><div class="spend-top"><div><div style="font-weight:700;font-size:17px">Harcama Dağılımı</div><div class="muted xs">${label}</div></div>
    ${C.segmented([['week','Hafta'],['month','Ay'],['year','Yıl']],ui.period,'App.setPeriod')}</div>
    ${items.length?`<div class="donut-wrap">${C.donut(items,total,sel)}<div class="legend">${items.slice(0,6).map((it,i)=>`<button class="${sel!==null&&sel!==i?'dim':''}" onclick="App.selSeg(${i})"><span class="sw" style="background:${it.color}"></span><span class="nm">${it.name}</span><span class="pc">%${Math.round(it.amount/total*100)}</span></button>`).join('')}</div></div>`
      :`<p class="muted sm" style="padding:30px 0;text-align:center">Bu dönemde harcama yok.</p>`}</div></div>`};

C.installments=s=>{const L=D.installmentLoad(s);if(!L||!L.cols.some(c=>c.tot))return '';
  return C.section('Taksit Yükü',`<button onclick="App.push('matrix',{})">Matrix ›</button>`,`<div class="glass pressable" style="padding:18px 16px 14px" onclick="App.push('matrix',{})">
    <div class="bars">${L.cols.map(c=>`<div class="bar-col"><span class="v">${c.tot?U.short(c.tot):''}</span><div class="bar-stack">${c.parts.map(p=>`<span style="height:${L.max?p.v/L.max*100:0}%;background:${grad(p.acc.color)}"></span>`).join('')}</div><span class="l">${U.mon(D.ym(c.i)[1])}</span></div>`).join('')}</div>
    <div class="bar-legend">${L.cards.map(a=>`<span><i style="background:${grad(a.color)}"></i>${U.esc(a.name)}</span>`).join('')}</div></div>`)};

/* --- Yaklaşan ödemeler (kompakt; kaydır → öde) --- */
C.dueBadge=(date,kind)=>{const n=U.daysUntil(date);
  return kind==='open'?`<span class="badge blue">${U.fmtDate(date)}</span>`:n<0?`<span class="badge red">${-n} gün gecikti</span>`:n<=3?`<span class="badge orange">${n===0?'Bugün':n+' gün kaldı'}</span>`:`<span class="badge blue">${U.fmtDate(date)}</span>`};
C.upItem=x=>{const pay=x.kind==='stmt'?`PaySheet.open('${x.accId}')`:x.kind==='rec'?`RecurringForm.pay('${x.id}')`:x.kind==='loan'?`LoanForm.pay('${x.id}')`:x.kind==='debt'?`DebtForm.settle('${x.id}')`:'';
  const go=x.kind==='stmt'||x.kind==='open'?`App.push('card',{id:'${x.accId}'})`:x.kind==='loan'?`App.push('loan',{id:'${x.id}'})`:x.kind==='debt'?`DebtForm.person('${U.esc(x.person||'').replace(/'/g,"\\'")}')`:`RecurringForm.open('${x.id}')`;
  const icon=x.kind==='stmt'?'card':x.kind==='open'?'receipt':x.kind==='loan'?'bank':x.icon;
  return C.swipe(`<div class="row pressable" onclick="${go}">${x.kind==='rec'?C.nameIc(x.title,icon,x.color):C.icb(icon,x.color)}<div class="mid"><b>${U.esc(x.title)}</b><span>${U.esc(x.sub)}</span></div>
    <div class="end"><b class="num ${x.income?'pos':''}">${x.income?'+':''}${U.money(x.amount)}</b>${C.dueBadge(x.date,x.kind)}</div></div>`,
    {r:pay?[[x.income?'Aldım':'Öde',x.income?'check':'send','sw-green',pay]]:[]})};
C.upcoming=(s,limit=3)=>{const all=D.upcoming(s),list=all.slice(0,limit);if(!list.length)return '';
  return C.section('Yaklaşan Ödemeler',`<button onclick="App.go('plan')">${all.length>limit?'+'+(all.length-limit)+' · ':''}Takvim ›</button>`,`<div class="glass list">${list.map(C.upItem).join('')}</div><div class="swipe-hint">‹ ödemek için sola kaydır</div>`)};

/* --- Kumbaralar (mini) --- */
C.goalsRow=s=>{if(!s.goals.length)return '';const act=s.goals.filter(g=>!D.goal(s,g.id).done).length;return `<section class="glass gw-panel gw-goals"><div class="gw-title"><h2>Birikim hedefleri</h2><button onclick="App.go('plan','goals')">${act} aktif</button></div>${s.goals.map(g0=>{const g=D.goal(s,g0.id),p=Math.round(Math.min(1,g.pct||0)*100);return `<button class="gw-goal ${g.done?'done':''}" onclick="App.push('goal',{id:'${g.id}'})">
    <span class="top"><span class="gw-chip">${C.ic(g.icon||'target')}</span><span class="mid"><b>${U.esc(g.name)}</b><small class="num">${U.money(g.saved,{dec:false})} / ${U.money(g.target,{dec:false})}${g.done?' · tamamlandı':g.perMonth?' · ayda '+U.money(g.perMonth,{dec:false}):''}</small></span><span class="pc num">%${p}</span></span>
    <span class="gw-track" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" aria-label="${U.esc(g.name)}"><i style="width:${p}%"></i></span></button>`}).join('')}</section>`};

/* --- İşlem satırı --- */
C.txVis=(s,t,ctx)=>{const c=cat(t.category),a=D.account(s,t.accountId),b=D.account(s,t.toAccountId);
  switch(t.kind){
    case 'income':return{icon:c.icon,color:c.color,title:t.merchant||c.name,sub:c.name+(a?' · '+a.name:''),sign:1};
    case 'transfer':return{icon:'transfer',color:'#32ade6',title:t.merchant||'Transfer',sub:(a?.name||'?')+' → '+(b?.name||'?'),sign:ctx?(t.toAccountId===ctx?1:-1):0,amt:ctx&&t.toAccountId===ctx?(t.toAmount??t.amount):t.amount,cur:ctx&&t.toAccountId===ctx?b?.currency:a?.currency};
    case 'payment':return{icon:'send',color:'#0a84ff',title:'Kart borcu ödemesi',sub:(a?.name||'Dış hesap')+' → '+(b?.name||'Kart'),sign:ctx&&t.toAccountId===ctx?1:-1};
    case 'refund':{const o=t.refOf&&D.tx(s,t.refOf);return{icon:'refund',color:'#30d158',title:'İade · '+(o?.merchant||t.merchant||'Alışveriş'),sub:(a?.name||'')+(o?' · '+cat(o.category).name:''),sign:1}}
    case 'goal':{const g=s.goals.find(x=>x.id===t.goalId);return{icon:g?.icon||'piggy',color:gcol(g?.color),title:(g?.name||'Kumbara'),sub:(t.dir==='out'?'Kumbaradan → ':'Kumbaraya ← ')+(a?.name||''),sign:ctx===t.goalId?(t.dir==='out'?-1:1):(t.dir==='out'?1:-1)}}
    case 'loan':{const l=s.loans.find(x=>x.id===t.loanId);return{icon:'bank',color:'#8e8e93',title:(l?.name||'Kredi')+' taksiti',sub:a?.name||'',sign:-1}}
    case 'debt':{const d=(s.debts||[]).find(x=>x.id===t.debtId);const lbl=t.settle?(t.dir==='in'?'Tahsilat':'Borç ödemesi'):(t.dir==='out'?'Borç verildi':'Borç alındı');return{icon:'people',color:t.dir==='in'?'#30d158':'#ff453a',title:(d?.person||t.merchant||'Kişi')+' · '+lbl,sub:(a?.name||'Hesaba işlenmedi')+(d?.note?' · '+d.note:''),sign:t.dir==='in'?1:-1}}
    default:return{icon:c.icon,color:c.color,title:t.merchant||c.name,sub:c.name+(a?' · '+a.name:'')+(t.installments>1?' · '+t.installments+' taksit':''),sign:-1}}};
C.txRow=(s,t,ctx,extra='')=>{const v=C.txVis(s,t,ctx),refunded=t.kind==='expense'&&D.refundMap(s)[t.id];
  const amt=v.amt??t.amount,cur=v.cur||D.account(s,t.accountId)?.currency||'TRY',editable=['expense','income','transfer'].includes(t.kind);
  const inner=`<div class="row pressable" onclick="App.push('tx',{id:'${t.id}'})">${C.vic(v)}
    <div class="mid"><b>${U.esc(v.title)}${refunded?'<span class="tag">iade</span>':''}${t.source==='ocr'?'<span class="tag">AI</span>':''}</b><span>${U.esc(v.sub)}</span></div>
    <div class="end"><b class="num ${v.sign>0?'pos':''}">${v.sign>0?'+':v.sign<0?'−':''}${U.money(amt,{cur})}</b><span class="muted xs">${extra||U.relDate(t.date)}</span></div></div>`;
  return C.swipe(inner,{l:editable?[['Düzenle','edit','sw-blue',`TxForm.open('${t.id}')`]]:[],r:[['Sil','trash','sw-red',`App.deleteTx('${t.id}')`],...(t.kind==='expense'&&!refunded?[['İade','refund','sw-orange',`RefundSheet.open('${t.id}')`]]:[])],lp:'tx:'+t.id})};
C.dayGroups=(s,list,ctx,{limit=150,balances}={})=>{if(!list.length)return C.empty('receipt','Bu filtrede işlem yok.');
  const groups=[];list.slice(0,limit).forEach(t=>{const g=groups[groups.length-1];if(g&&g.date===t.date)g.items.push(t);else groups.push({date:t.date,items:[t]})});
  return `<div class="glass list tx-days">`+groups.map(g=>{const net=g.items.reduce((a,t)=>{const v=C.txVis(s,t,ctx);return a+(v.sign||0)*(v.amt??t.amount)},0);
    return `<div class="day"><div class="day-h"><span>${U.dayHeader(g.date)}</span><span class="num">${net?U.money(net,{sign:true,dec:false}):''}</span></div>
      <div class="day-rows">${g.items.map(t=>C.txRow(s,t,ctx,balances?('Bakiye '+U.money(balances[t.id],{dec:false})):' ')).join('')}</div></div>`}).join('')+`</div>`
    +(list.length>limit?`<p class="overflow-note">İlk ${limit} işlem gösteriliyor · ${list.length} işlem var. Filtreyle daralt.</p>`:'')};
C.gwTx=(s,t)=>{const v=C.txVis(s,t),a=D.account(s,t.accountId),refunded=t.kind==='expense'&&D.refundMap(s)[t.id];
  const amt=v.amt??t.amount,cur=v.cur||a?.currency||'TRY',editable=['expense','income','transfer'].includes(t.kind);
  const catName=['expense','income','refund'].includes(t.kind)?cat(t.category).name:(KINDS[t.kind]||'');
  const pill=refunded?['İade edildi','warn']:t.installments>1?[t.installments+' taksit','info']:t.kind==='income'?['Gelen','ok']:t.kind==='refund'?['İade','ok']
    :t.kind==='expense'?[{credit:'Kart',checking:'Banka',cash:'Nakit',fx:'Döviz'}[a?.type]||'Harcama','']:[KINDS[t.kind]||'',''];
  const inner=`<div class="row pressable gw-tx" onclick="App.push('tx',{id:'${t.id}'})">${C.vic(v)}<div class="mid"><b>${U.esc(v.title)}</b><span>${U.esc(catName)} · ${U.relDate(t.date)}</span></div>
    ${pill[0]?`<span class="gw-pill ${pill[1]}">${U.esc(pill[0])}</span>`:''}<div class="end"><b class="num ${v.sign>0?'pos':''}">${v.sign>0?'+':v.sign<0?'−':''}${U.money(amt,{cur})}</b></div></div>`;
  return C.swipe(inner,{l:editable?[['Düzenle','edit','sw-blue',`TxForm.open('${t.id}')`]]:[],r:[['Sil','trash','sw-red',`App.deleteTx('${t.id}')`],...(t.kind==='expense'&&!refunded?[['İade','refund','sw-orange',`RefundSheet.open('${t.id}')`]]:[])],lp:'tx:'+t.id})};
C.recent=s=>{const list=[...s.transactions].sort((a,b)=>b.date.localeCompare(a.date)||s.transactions.indexOf(b)-s.transactions.indexOf(a)).slice(0,6);if(!list.length)return '';
  return `<section class="glass gw-panel gw-recent"><div class="gw-title dup"><h2>Son işlemler</h2><button onclick="App.go('txs')">Tümü ${C.ic('chev')}</button></div><div class="list">${list.map(t=>C.gwTx(s,t)).join('')}</div></section>`};

/* --- İşlemler: filtre penceresi, etkin filtre çipleri, ⋯ menüsü --- */
const TxFilter={
  RANGES:[['month','Aylık'],['3m','Son 3 ay'],['all','Tüm zamanlar']],
  TYPES:[['','Hepsi'],['move','Transfer & ödeme'],['inst','Taksitli'],['ocr','AI ile']],
  count(f){return (f.acc?1:0)+(f.cat?1:0)+(f.type?1:0)+(f.range!=='month'?1:0)},
  label(f){if(f.range==='3m')return 'Son 3 ay';if(f.range==='all')return 'Tüm zamanlar';if(f.range==='last'){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return U.MONTHS[d.getMonth()]}
    const ym=f.ym||U.today().slice(0,7),y=+ym.slice(0,4),m=+ym.slice(5,7)-1;return U.MONTHS[m]+(y!==new Date().getFullYear()?' '+y:'')},
  chips(s,f){const out=[];if(f.range!=='month')out.push(['range',this.label(f)]);if(f.type)out.push(['type',this.TYPES.find(x=>x[0]===f.type)[1]]);
    if(f.acc){const a=D.account(s,f.acc);out.push(['acc',a?a.name:'Hesap'])}if(f.cat)out.push(['cat',cat(f.cat).name]);
    if(!out.length)return '';
    return `<div class="fchips" role="list" aria-label="Etkin filtreler">${out.map(([k,l])=>`<button class="fchip pressable" role="listitem" onclick="TxFilter.unset('${k}')" aria-label="${U.esc(l)} filtresini kaldır">${U.esc(l)}${C.ic('close')}</button>`).join('')}${out.length>1?`<button class="fchip clear pressable" onclick="TxFilter.clear(true)">Temizle</button>`:''}</div>`},
  open(){const s=Store.get(),f=UI.txf,n=this.count(f),ch=(opts,val,k)=>`<div class="chips wrap">${opts.map(([v,l])=>`<button class="chip pressable ${v===val?'on':''}" aria-pressed="${v===val}" onclick="TxFilter.set('${k}','${v}')">${l}</button>`).join('')}</div>`;
    const accOpts=`<option value="">Tüm hesaplar</option>`+s.accounts.map(a=>`<option value="${a.id}" ${f.acc===a.id?'selected':''}>${U.esc(a.name)}</option>`).join('');
    const catOpts=`<option value="">Tüm kategoriler</option>`+[...expenseCats(),...incomeCats().filter(k=>k!=='other')].map(k=>`<option value="${k}" ${f.cat===k?'selected':''}>${cat(k).name}</option>`).join('');
    const cnt=D.filterTx(s,f).length;
    Sheet.open(Sheet.head('Filtrele',{left:'',right:'Bitti',onRight:'Sheet.close()'})+
      `<div class="field"><span>Tarih aralığı</span>${ch(this.RANGES,f.range==='last'?'month':f.range,'range')}</div>
      <div class="field"><span>Hesap</span><select class="input" onchange="TxFilter.set('acc',this.value)" aria-label="Hesap">${accOpts}</select></div>
      <div class="field"><span>Kategori</span><select class="input" onchange="TxFilter.set('cat',this.value)" aria-label="Kategori">${catOpts}</select></div>
      <div class="field"><span>İşlem türü</span>${ch(this.TYPES,f.type||'','type')}</div>
      <div class="btn-row"><button class="btn pressable" onclick="TxFilter.clear()" ${n?'':'disabled'}>Filtreleri temizle</button><button class="btn primary pressable" onclick="Sheet.close()">${cnt} işlemi göster</button></div>`)},
  set(k,v){const f=UI.txf;f[k]=v;if(k==='type'&&v)f.kind='all';if(k==='range')f.ym='';Haptic.tap();App.render();this.open()},
  unset(k){const f=UI.txf;f[k]=k==='range'?'month':'';if(k==='range')f.ym='';Haptic.tap();App.render()},
  clear(closed){Object.assign(UI.txf,{type:'',range:'month',ym:'',acc:'',cat:''});Haptic.tap();App.render();if(!closed)this.open()},
  more(){Sheet.open(Sheet.head('İşlemler',{left:'Kapat',right:''})+`<div class="glass list action-list" style="padding:0 12px">
      <button class="row pressable" onclick="Sheet.close();App.exportFiltered()">${C.icb('download','#30d158')}<div class="mid"><b>CSV indir</b><span>Görünen işlemler · Excel / Numbers</span></div></button>
      <button class="row pressable" onclick="Sheet.close();App.togglePrivacy()">${C.icb(PRIVACY?'eye':'eyeoff','#0a84ff')}<div class="mid"><b>${PRIVACY?'Tutarları göster':'Tutarları gizle'}</b><span>Tüm ekranlarda •••• olarak gösterir</span></div></button></div>`)}};

/* --- Ekstre kartı --- */
C.statement=(s,acc,st,open)=>{const exp=open,o=D.openIdx(acc.credit);
  const lineHtml=l=>{const t=l.tx,n=l.n>1?` <span class="tag">${l.k+1}/${l.n}</span>`:'';
    return `<div class="sline pressable" onclick="App.push('tx',{id:'${(l.kind==='refund'&&l.orig?l.orig:t).id}'})"><span>${l.kind==='refund'?'İade · ':''}${U.esc(t.merchant||(l.orig&&l.orig.merchant)||cat(t.category).name)}${n}</span><span class="num ${l.amount<0?'pos':''}">${l.amount<0?'+':''}${U.money(Math.abs(l.amount))}</span></div>`};
  return `<div class="glass stmt"><div class="stmt-top" onclick="App.toggleStmt(${st.idx})"><div><b>${D.stmtName(st.idx)} ekstresi</b>
      <div class="muted xs">Kesim ${U.fmtDate(st.cut)} · Son ödeme ${U.fmtDate(st.due)}</div></div><div style="text-align:right">${C.badge(st.status)}<div class="faint xs" style="margin-top:4px">${exp?'▲ gizle':'▼ detay'}</div></div></div>
    <div class="stmt-nums"><div>Toplam<b class="num">${U.money(st.total)}</b></div><div>Ödenen<b class="num">${U.money(st.paid)}</b></div><div>Kalan<b class="num ${st.remaining>0&&st.idx<o?'warn':''}">${U.money(st.remaining)}</b></div></div>
    ${st.remaining>0&&st.idx<o?`<div class="muted xs" style="margin-top:8px">Asgari ödeme ${U.money(st.minPay)}${st.minLeft>0?' · kalan asgari <b>'+U.money(st.minLeft)+'</b>':' · karşılandı'}${st.interest?` · tahmini faiz <b class="neg">${U.money(st.interest)}</b>`:''}</div>`:''}
    ${exp?`<div class="stmt-lines">${st.lines.length?st.lines.map(lineHtml).join(''):'<p class="muted sm" style="padding:10px 0">Bu dönemde harcama yok.</p>'}</div>
      <div class="btn-row">${st.remaining>0&&st.idx<=o?`<button class="btn primary pressable" onclick="PaySheet.open('${acc.id}',${st.idx})">Öde</button>`:''}
      ${st.lines.length?`<button class="btn pressable" onclick="Reports.printStatement('${acc.id}',${st.idx})">${C.ic('doc')}PDF</button>`:''}</div>`:''}</div>`};

/* --- Bütçe satırı --- */
C.budgetRow=b=>{const c=cat(b.category),col=b.over?'var(--red)':b.ratio>.8||b.willExceed?'var(--orange)':'var(--green)';
  return `<button class="row pressable" style="flex-wrap:wrap" onclick="BudgetForm.open('${b.id}')">${C.icb(c.icon,c.color)}<div class="mid"><b>${c.name}</b>
    <span>${U.money(b.spent,{dec:false})} / ${U.money(b.limit,{dec:false})}${b.exhaustDay?' · ayın '+U.dayLoc(b.exhaustDay)+' biter':b.over?'':' · günlük '+U.money(b.daily,{dec:false})}</span></div>
    <div class="end"><b class="num" style="color:${col}">${b.over?'Aşıldı':U.money(b.left,{dec:false})}</b><span class="muted xs">${b.over?U.money(-b.left,{dec:false})+' fazla':'kaldı'}</span></div>
    <div class="prog" style="width:100%;margin:10px 0 2px 50px"><span style="width:${Math.min(100,b.ratio*100)}%;background:${col}"></span></div></button>`};

/* ---------- 60_screens.js ---------- */

/* ===================== ui/screens · sekmeler ===================== */
const Screens={
  /* --- İşlem geçmişi --- */
  txs(s,ui){const f=ui.txf,n=TxFilter.count(f);
    return C.tabHead('İşlemler','',`<button class="icon-btn glass pressable" onclick="TxFilter.more()" aria-label="Diğer seçenekler">${C.ic('more')}</button>`,'tx-head')+
      `<div class="tx-tools"><div class="search">${C.ic('search')}<input id="tx-q" type="search" placeholder="Mağaza, not, tutar ara" aria-label="İşlem ara" value="${U.esc(f.q)}" oninput="App.txSearch(this.value)" autocomplete="off"></div>
        <button class="gw-btn tx-fbtn pressable ${n?'on':''}" onclick="TxFilter.open()" aria-label="Filtrele${n?', '+n+' filtre etkin':''}">${C.ic('sliders')}<span>Filtrele</span>${n?`<i class="fbadge num">${n}</i>`:''}</button></div>
      <div class="tx-seg">${C.segmented([['all','Tümü'],['expense','Gider'],['income','Gelir']],['expense','income'].includes(f.kind)?f.kind:'all','App.txKind')}</div>
      ${TxFilter.chips(s,f)}
      <div id="tx-list">${Screens.txList(s,ui)}</div>`},
  txList(s,ui){const f=ui.txf,list=D.filterTx(s,f),cur=U.today().slice(0,7),atNow=f.range==='month'&&(!f.ym||f.ym===cur);
    const exp=list.filter(t=>t.kind==='expense').reduce((a,t)=>a+t.amount,0),inc=list.filter(t=>t.kind==='income'||t.kind==='refund').reduce((a,t)=>a+t.amount,0);
    return `<div class="tx-period"><button class="pressable" onclick="App.txMonth(-1)" aria-label="Önceki ay">${C.ic('chev')}</button><b>${TxFilter.label(f)}</b><button class="pressable" onclick="App.txMonth(1)" aria-label="Sonraki ay" ${atNow?'disabled':''}>${C.ic('chev')}</button>
      <span class="tp-sum" aria-label="${list.length} işlem"><span class="num">${exp?'−':''}${U.money(exp,{dec:false})}</span><span class="num pos">${inc?'+':''}${U.money(inc,{dec:false})}</span></span></div>`+C.dayGroups(s,list)},

  /* --- Planla: takvim, bütçe, düzenli ödemeler, kumbaralar --- */
  plan(s,ui){const tab=ui.planTab;
    const add={debts:`<button class="icon-btn glass pressable" onclick="DebtForm.open()">${C.ic('plus')}</button>`,cal:'',budget:`<button class="icon-btn glass pressable" onclick="BudgetForm.open()">${C.ic('plus')}</button>`,rec:`<button class="icon-btn glass pressable" onclick="RecurringForm.open()">${C.ic('plus')}</button>`,goals:`<button class="icon-btn glass pressable" onclick="GoalForm.open()">${C.ic('plus')}</button>`}[tab];
    const seg=tab==='debts'?'goals':tab,debts=C.section('Borç ve alacak',`<button onclick="DebtForm.open()">Ekle</button>`,Screens.debts(s,ui));
    return C.tabHead('Planla','Takvim, bütçe ve hedefler',add)+`<div style="margin-top:12px">${C.segmented([['cal','Takvim'],['budget','Bütçe'],['rec','Düzenli'],['goals','Kumbara']],seg,'App.planTab')}</div>`+

  calendar(s,ui){const{y,m}=ui.cal,days=D.calendar(s,y,m),first=new Date(y,m,1),lead=(first.getDay()+6)%7,T=U.today();
    const sel=ui.cal.sel&&days[ui.cal.sel]?ui.cal.sel:(T.slice(0,7)===U.monthStart(y,m).slice(0,7)?T:U.monthStart(y,m));

    const all=Object.values(days).flatMap(v=>v.events).filter(e=>!e.info&&!e.done&&!e.income),planned=U.r2(all.reduce((a,e)=>a+e.amount,0));

        <div class="end"><b class="num ${e.income?'pos':''}">${e.amount!=null?U.money(e.amount):''}</b>${btn}</div></div>`}).join('');

      ${dv.txs.length?`<div class="glass list">${dv.txs.map(t=>C.txRow(s,t,null,' ')).join('')}</div>`:dv.events.length?'':`<p class="muted sm" style="text-align:center;padding:16px">Bu gün için kayıt yok.</p>`}`},
  budget(s){const st=D.budgetStatus(s),t=new Date(),left=U.dim(t.getFullYear(),t.getMonth())-t.getDate();

    const lim=st.reduce((a,b)=>a+b.limit,0),sp=st.reduce((a,b)=>a+b.spent,0),pr=st.reduce((a,b)=>a+b.projected,0);

/* ===================== ui/sheets · alt pencereler ve formlar ===================== */
const Sheet={
  open(html,onMount){const old=document.getElementById('sheet'),top=old?old.firstElementChild.scrollTop:0;this.close(true);const bd=document.createElement('div');bd.className='sheet-backdrop'+(old?' swap':'');bd.id='sheet';
    bd.innerHTML=`<div class="sheet" role="dialog"><div class="grabber"></div>${html}</div>`;
    bd.addEventListener('click',e=>{if(e.target===bd)this.close()});document.body.appendChild(bd);
    const sh=bd.firstElementChild;let y0=null,dy=0;   // aşağı kaydırarak kapatma
    sh.addEventListener('touchstart',e=>{if(sh.scrollTop<=0&&!e.target.closest('input,select,textarea,.seg'))y0=e.touches[0].clientY},{passive:true});
    sh.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);if(dy>0){sh.style.transform=`translateY(${dy}px)`;sh.style.transition='none'}},{passive:true});
    sh.addEventListener('touchend',()=>{if(y0===null)return;sh.style.transition='transform .35s var(--ease)';if(dy>110)this.close();else sh.style.transform='';y0=null;dy=0});
    if(old)sh.scrollTop=top;   // aynı pencere yenilenince kayma animasyonu ve kaydırma konumu korunur
    onMount&&onMount(bd)},
  close(instant){const bd=document.getElementById('sheet');if(!bd)return;if(instant){bd.remove();return}
    bd.classList.add('closing');setTimeout(()=>bd.remove(),240)},
  el:sel=>document.querySelector('#sheet '+sel),
  val:sel=>{const e=document.querySelector('#sheet '+sel);return e?e.value:''},
  head:(title,{left='Vazgeç',right='Kaydet',onRight=''}={})=>`<div class="sheet-head">${left?`<button onclick="Sheet.close()">${left}</button>`:'<span style="width:50px"></span>'}<h3 tabindex="-1">${title}</h3>${right?`<button onclick="${onRight}">${right}</button>`:'<span style="width:50px"></span>'}</div>`
};

const F={
  accOpts:(list,sel,extra='')=>extra+list.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${U.esc(a.name)}${a.currency!=='TRY'?' ('+a.currency+')':''}</option>`).join(''),
  catGrid:(cats,sel,fn)=>`<div class="cat-grid">${cats.map(k=>`<button class="cat-opt pressable ${sel===k?'on':''}" onclick="${fn}('${k}')"><span class="e" style="${sel===k?'':'color:'+cat(k).color}">${C.ic(cat(k).icon)}</span>${U.esc(cat(k).name.split(' ')[0])}</button>`).join('')}</div>`,
  catOpts:(cats,sel)=>cats.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${U.esc(cat(k).name)}</option>`).join(''),
  emojis:(sel,fn)=>{const cur=ICONS[sel]?sel:EMOJI_ALIAS[sel]||sel;return `<div class="icon-pick">${ICON_CHOICES.map(e=>`<button class="pressable ${e===cur?'on':''}" onclick="${fn}('${e}')">${C.ic(e)}</button>`).join('')}</div>`},
  swatches:(sel,fn)=>`<div class="swatches">${GRADIENTS.map((g,i)=>`<button class="swatch pressable ${sel===i?'on':''}" style="background:${grad(i)}" onclick="${fn}(${i})"></button>`).join('')}</div>`,
  money:v=>v===''||v==null?'':String(v).replace('.',','),
  nonCredit:()=>Store.get().accounts.filter(a=>a.type!=='credit'),
  credit:()=>Store.get().accounts.filter(a=>a.type==='credit')
};

/* --- İşlem formu: harcama / gelir / transfer --- */
const TxForm={draft:null,aiMeta:null,
  open(id,preset={}){const s=Store.get();if(!s.accounts.length){Toast.show('Önce bir hesap ekle');return AccForm.open()}
    const t=id&&D.tx(s,id);this.catTouched=!!(preset.prefill&&preset.prefill.category);
    if(t&&!['expense','income','transfer'].includes(t.kind))return Toast.show('Bu işlem türü düzenlenemez; silip yeniden ekleyebilirsin.');
    const kind=t?.kind||preset.type||'expense',nc=F.nonCredit();
    this.draft=t?{...t}:{id:'',kind,amount:'',merchant:'',category:kind==='income'?'income':'market',
      accountId:(kind==='expense'?s.accounts[0]:nc[0]||s.accounts[0]).id,toAccountId:'',toAmount:null,date:U.today(),installments:1,note:'',source:'manual'};
    if(!t&&kind==='transfer'){this.draft.toAccountId=(nc.find(a=>a.id!==this.draft.accountId)||{}).id||''}
    if(!t&&preset.prefill)Object.entries(preset.prefill).forEach(([k,v])=>{if(v!==undefined&&v!==null)this.draft[k]=v});
    if(!t&&preset.attach)this.draft._attach=preset.attach;
    if(!t&&preset.recurring)this.draft._rec=preset.recurring;
    this.aiMeta=t?null:(preset.ai||null);this.fixAccounts();this.render()},
  fixAccounts(){const s=Store.get(),d=this.draft,nc=F.nonCredit();
    if(d.kind!=='expense'&&D.isCredit(s,d.accountId))d.accountId=nc[0]?.id||'';
    if(d.kind==='transfer'&&(!d.toAccountId||d.toAccountId===d.accountId))d.toAccountId=(nc.find(a=>a.id!==d.accountId)||{}).id||'';
    if(!D.isCredit(s,d.accountId))d.installments=1},
  banner(){const m=this.aiMeta;if(!m)return '';const w=[];
    if(!m.matched)w.push('Kart eşleşmedi'+(m.cardHint?` (“${U.esc(m.cardHint)}”)`:'')+', hesabı kontrol et.');
    if(m.currency&&m.currency!=='TRY')w.push(`Belge ${m.currency} ile; tutarı TL'ye çevirmen gerekebilir.`);
    if(m.installments>1&&!D.isCredit(Store.get(),this.draft.accountId))w.push(`Belgede ${m.installments} taksit yazıyor; kredi kartı seçersen plana işlenir.`);
    if(m.notes)w.push(U.esc(m.notes));
    if(m.voice)return `<div class="ai-banner">🎙️ <b>Söylediğinden dolduruldu.</b> Kaydetmeden önce kontrol et.${!m.matched?'<br>Hesap belirtilmedi, doğru hesabı seç.':''}</div>`;
    return `<div class="ai-banner">✨ <b>Gemini ile dolduruldu</b>${m.confidence!=null?' · güven %'+Math.round(m.confidence*100):''}${m.itemCount?' · '+m.itemCount+' kalem okundu':''}. Kaydetmeden önce kontrol et.${w.length?'<br>⚠️ '+w.join('<br>⚠️ '):''}</div>`},
  render(){const s=Store.get(),d=this.draft,acc=D.account(s,d.accountId),to=D.account(s,d.toAccountId),isCredit=acc?.type==='credit',k=d.kind;
    const nc=F.nonCredit(),title=d.id?'Düzenle':{expense:'Harcama Ekle',income:'Gelir Ekle',transfer:'Transfer'}[k];
    const fx=k==='transfer'&&acc&&to&&acc.currency!==to.currency;
    Sheet.open(Sheet.head(title,{onRight:'TxForm.save()'})+
      `${d.id||d._rec?'':C.segmented([['expense','Harcama'],['income','Gelir'],['transfer','Transfer']],k,'TxForm.setKind')}
      <input class="amount-in num" id="tx-amount" inputmode="decimal" placeholder="0" value="${F.money(d.amount)}" autocomplete="off">
      <div class="amount-cur">${acc?.currency&&acc.currency!=='TRY'?acc.currency:'Türk Lirası'}</div>${this.banner()}
      ${k==='transfer'?`<div class="grid2"><label class="field"><span>Nereden</span><select class="input" onchange="TxForm.set('accountId',this.value)">${F.accOpts(nc,d.accountId)}</select></label>
        <label class="field"><span>Nereye</span><select class="input" onchange="TxForm.set('toAccountId',this.value)">${F.accOpts(nc.filter(a=>a.id!==d.accountId),d.toAccountId)}</select></label></div>
        ${fx?`<label class="field"><span>Alınan tutar (${to.currency}) · kur ${U.money(s.settings.rates[to.currency]||s.settings.rates[acc.currency]||0,{raw:true})}</span><input class="input" id="tx-toamount" inputmode="decimal" value="${F.money(d.toAmount)}" placeholder="otomatik hesaplanır"></label>`:''}
        <label class="field"><span>Açıklama</span><input class="input" id="tx-merchant" value="${U.esc(d.merchant)}" placeholder="ör. ATM'den para çekme"></label>`
      :`<label class="field"><span>${k==='income'?'Açıklama':'Nereden / ne aldın?'}</span><input class="input" id="tx-merchant" list="tx-mlist" value="${U.esc(d.merchant)}" placeholder="${k==='income'?'ör. Aylık harçlık':'ör. Migros, Kulaklık'}" autocomplete="off"><datalist id="tx-mlist">${D.merchantNames(s).map(n=>`<option value="${U.esc(n)}">`).join('')}</datalist></label><div id="tx-hint"></div>
        <div class="field" id="tx-cats"><span>Kategori</span>${F.catGrid(k==='income'?incomeCats():expenseCats(),d.category,'TxForm.setCat')}</div>
        <div class="grid2"><label class="field"><span>Hesap</span><select class="input" onchange="TxForm.set('accountId',this.value)">${F.accOpts(k==='income'?nc:s.accounts,d.accountId)}</select></label>
        <label class="field"><span>Tarih</span><input class="input" type="date" id="tx-date" value="${d.date}"></label></div>`}
      ${k==='transfer'?`<label class="field"><span>Tarih</span><input class="input" type="date" id="tx-date" value="${d.date}"></label>`:''}
      ${isCredit&&k==='expense'?`<label class="field"><span>Taksit</span><select class="input" id="tx-inst">${INSTALLMENT_OPTS.map(n=>`<option value="${n}" ${+d.installments===n?'selected':''}>${n===1?'Tek çekim':n+' taksit'}</option>`).join('')}</select></label>`:''}
      <label class="field"><span>Not</span><input class="input" id="tx-note" value="${U.esc(d.note||'')}" placeholder="opsiyonel"></label>
      ${k==='expense'?`<label class="btn pressable" style="font-size:14px">${C.ic('image')}${d._attach||d.attachmentId?'Belge eklendi · değiştir':'Fiş / fatura görseli ekle'}<input type="file" accept="image/*,application/pdf" hidden onchange="TxForm.attach(this)"></label>`:''}
      <div id="tx-preview"></div>
      ${d.id?`<button class="btn danger pressable" onclick="App.deleteTx('${d.id}')">${C.ic('trash')}İşlemi sil</button>`:''}`,
      bd=>{bd.querySelectorAll('#tx-amount,#tx-merchant,#tx-date,#tx-inst,#tx-note,#tx-toamount').forEach(el=>{el.addEventListener('input',()=>this.sync());el.addEventListener('change',()=>this.sync())});
        const me=bd.querySelector('#tx-merchant');if(me){me.addEventListener('input',()=>this.learn());me.addEventListener('change',()=>this.learn())}this.learn(true);
        this.preview();if(!d.id&&!d.amount)setTimeout(()=>bd.querySelector('#tx-amount')?.focus(),350)})},
  sync(){const d=this.draft;if(!Sheet.el('#tx-amount'))return;d.amount=Sheet.val('#tx-amount');d.merchant=Sheet.val('#tx-merchant');d.date=Sheet.val('#tx-date')||U.today();d.note=Sheet.val('#tx-note');
    const i=Sheet.el('#tx-inst');d.installments=i?+i.value:1;if(Sheet.el('#tx-toamount'))d.toAmount=Sheet.val('#tx-toamount');this.preview()},
  set(k,v){this.sync();this.draft[k]=v;this.fixAccounts();Haptic.tap();this.render()},
  setCat(c){this.catTouched=true;this.set('category',c)},
  /* mağaza hafızası: aynı yer için son kategoriyi otomatik seç, son tutar/hesabı öner */
  learn(silent){const s=Store.get(),d=this.draft,box=Sheet.el('#tx-hint');if(!box||d.kind==='transfer')return;const r=d.merchant&&D.recallMerchant(s,d.merchant,d.kind);
    if(!r){box.innerHTML='';return}
    if(!d.id&&!this.catTouched&&!this.aiMeta&&r.category!==d.category&&(d.kind==='income'?incomeCats():expenseCats()).includes(r.category)){d.category=r.category;const g=Sheet.el('#tx-cats');if(g)g.innerHTML='<span>Kategori</span>'+F.catGrid(d.kind==='income'?incomeCats():expenseCats(),d.category,'TxForm.setCat')}
    const acc=D.account(s,r.accountId);const diff=(acc&&acc.id!==d.accountId)||(!U.parseNum(d.amount)&&r.amount);
    box.innerHTML=d.id?'':`<div class="preview" style="margin-top:8px;display:flex;align-items:center;gap:10px;padding:10px 12px">${C.ic('sparkles')}<span style="flex:1">Son seferki: <b>${U.money(r.amount)}</b>${acc?' · '+U.esc(acc.name):''}${r.installments>1?' · '+r.installments+' taksit':''} · ${cat(r.category).name}</span>${diff?`<button class="mini-btn" onclick="TxForm.useLast()">Kullan</button>`:''}</div>`},
  useLast(){this.sync();const s=Store.get(),d=this.draft,r=D.recallMerchant(s,d.merchant,d.kind);if(!r)return;
    if(!U.parseNum(d.amount))d.amount=r.amount;if(D.account(s,r.accountId)&&!(d.kind==='income'&&D.isCredit(s,r.accountId)))d.accountId=r.accountId;d.category=r.category;if(r.installments>1)d.installments=r.installments;this.fixAccounts();this.render()},
  setKind(k){this.sync();const d=this.draft;d.kind=k;d.category=k==='income'?'income':'market';
    if(k!=='expense'&&!F.nonCredit().length){Toast.show('Bunun için önce vadesiz veya nakit hesap ekle');d.kind='expense';d.category='market'}
    if(k==='transfer'&&F.nonCredit().length<2){Toast.show('Transfer için en az iki nakit/vadesiz/döviz hesabı gerekir');d.kind='expense';d.category='market'}
    this.fixAccounts();this.render()},
  async attach(inp){const f=inp.files&&inp.files[0];if(!f)return;this.sync();try{const m=await Media.prepare(f,1600);this.draft._attach=m.dataUrl;Toast.show('Belge eklendi');this.render()}catch(e){Toast.show('⚠️ '+AI.human(e))}},
  preview(){const s=Store.get(),d=this.draft,box=Sheet.el('#tx-preview');if(!box)return;const acc=D.account(s,d.accountId),amt=U.parseNum(d.amount);
    if(!acc||!(amt>0)){box.innerHTML='';return}
    if(d.kind==='transfer'){const to=D.account(s,d.toAccountId);if(!to){box.innerHTML='';return}
      const recv=this.toAmountFor(amt);box.innerHTML=`<div class="preview">${U.esc(acc.name)}: <b>${U.money(D.balance(s,acc.id),{cur:acc.currency})}</b> → <b>${U.money(D.balance(s,acc.id)-(d.id?0:amt),{cur:acc.currency})}</b><br>${U.esc(to.name)}: +<b>${U.money(recv,{cur:to.currency})}</b></div>`;return}
    if(d.kind!=='expense'){box.innerHTML='';return}
    if(acc.type==='credit'){const n=+d.installments||1,f=D.stmtIdx(acc.credit,d.date),parts=U.split(amt,n),m=D.cardSummary(s,acc.id),after=U.r2(m.available-(d.id?0:amt));
      box.innerHTML=`<div class="preview">${n>1?`Aylık <b>${U.money(parts[0])}</b> × ${n} taksit<br>`:''}İlk ödeme <b>${D.stmtName(f)} ekstresi</b> (son ödeme ${U.fmtDate(D.dueDate(acc.credit,f))})${n>1?`<br>Son taksit <b>${D.stmtName(f+n-1)}</b>`:''}
        ${d.id?'':`<br>Kullanılabilir limit: <b>${U.money(m.available)}</b> → <b style="color:${after<0?'var(--red)':'inherit'}">${U.money(after)}</b>`}</div>`}
    else{const b=D.balance(s,acc.id),after=b-amt,od=+acc.overdraft||0;box.innerHTML=d.id?'':`<div class="preview">Bakiye: <b>${U.money(b,{cur:acc.currency})}</b> → <b style="color:${after<-od?'var(--red)':after<0?'var(--orange)':'inherit'}">${U.money(after,{cur:acc.currency})}</b>${after<0?(od&&after>=-od?' · KMH kullanılır':' · yetersiz bakiye'):''}</div>`}},
  toAmountFor(amt){const s=Store.get(),d=this.draft,a=D.account(s,d.accountId),b=D.account(s,d.toAccountId);if(!a||!b||a.currency===b.currency)return amt;
    const manual=U.parseNum(d.toAmount);if(manual>0)return manual;const r=s.settings.rates,tl=D.toTRY(s,amt,a.currency);return U.r2(b.currency==='TRY'?tl:tl/(+r[b.currency]||1))},
  async save(){this.sync();const s=Store.get(),d=this.draft,amt=U.parseNum(d.amount);
    if(!(amt>0)){Toast.show('Geçerli bir tutar gir');Haptic.error();return}
    if(!D.account(s,d.accountId)){Toast.show('Hesap seç');return}
    if(d.kind==='transfer'&&(!D.account(s,d.toAccountId)||d.toAccountId===d.accountId)){Toast.show('Farklı bir hedef hesap seç');return}
    const item={...d,id:d.id||U.uid(),amount:U.r2(amt),merchant:(d.merchant||'').trim(),note:(d.note||'').trim(),installments:d.kind==='expense'?(+d.installments||1):1};
    if(d.kind==='transfer'){const a=D.account(s,d.accountId),b=D.account(s,d.toAccountId);item.toAmount=a.currency!==b.currency?this.toAmountFor(amt):null;item.category='';delete item.installments}
    else{delete item.toAccountId;delete item.toAmount}
    if(d._attach){const aid=d.attachmentId||U.uid();try{await Attach.put(aid,d._attach);item.attachmentId=aid}catch(e){Toast.show('⚠️ Belge kaydedilemedi')}}
    const rec=d._rec;delete item._attach;delete item._rec;
    if(rec){const r=s.recurring.find(x=>x.id===rec.id);item.recurringId=rec.id;
      Store.dispatch({type:'batch',actions:[{type:'upsert',col:'transactions',item},...(r?[{type:'upsert',col:'recurring',item:{...r,paid:{...(r.paid||{}),[rec.ym]:item.id}}}]:[])]})}
    else Store.dispatch({type:'upsert',col:'transactions',item});
    Haptic.success();Sheet.close();Toast.show(d.id?'✓ Güncellendi':'✓ Kaydedildi')}
};

/* --- Hesap formu --- */
const AccForm={draft:null,
  open(id){const s=Store.get(),a=id&&D.account(s,id);
    this.draft=a?JSON.parse(JSON.stringify(a)):{id:'',type:'credit',name:'',bank:'',color:s.accounts.length%GRADIENTS.length,currency:'TRY',opening:'',overdraft:'',
      credit:{limit:'',cutDay:15,dueDay:25,sharedWith:'',minRate:20,contractRate:'',lateRate:''}};
    if(!this.draft.credit)this.draft.credit={limit:'',cutDay:15,dueDay:25,sharedWith:'',minRate:20,contractRate:'',lateRate:''};this.render()},
  render(){const s=Store.get(),d=this.draft,cr=d.type==='credit',c=d.credit;
    const roots=s.accounts.filter(a=>a.type==='credit'&&a.id!==d.id&&!a.credit.sharedWith);const isRoot=d.id&&s.accounts.some(a=>a.credit?.sharedWith===d.id);
    Sheet.open(Sheet.head(d.id?'Hesabı Düzenle':'Yeni Hesap',{onRight:'AccForm.save()'})+
      `${d.id?'':`<div class="field"><span>Hesap türü</span><div class="cat-grid">${Object.entries(ACCOUNT_TYPES).map(([k,t])=>`<button class="cat-opt pressable ${d.type===k?'on':''}" onclick="AccForm.set('type','${k}')"><span class="e">${C.ic(t.icon)}</span>${t.name.split(' ')[0]}</button>`).join('')}</div></div>`}
      <div class="grid2"><label class="field"><span>Ad</span><input class="input" id="ac-name" value="${U.esc(d.name)}" placeholder="${cr?'ör. Bonus Kart':d.type==='cash'?'ör. Cüzdan':'ör. Maaş Hesabı'}"></label>
      <label class="field"><span>Banka / not</span><input class="input" id="ac-bank" value="${U.esc(d.bank)}" placeholder="opsiyonel"></label></div>
      ${cr?`<label class="field"><span>Limit</span><select class="input" id="ac-shared" ${isRoot?'disabled':''} onchange="AccForm.set('sharedWith',this.value)"><option value="">Kendi limiti var</option>${roots.map(r=>`<option value="${r.id}" ${c.sharedWith===r.id?'selected':''}>${U.esc(r.name)} ile ortak (sanal/ek kart)</option>`).join('')}</select></label>
        ${c.sharedWith?'':`<label class="field"><span>Kart limiti (₺)</span><input class="input" id="ac-limit" inputmode="decimal" value="${F.money(c.limit)}" placeholder="10.000"></label>`}
        <div class="grid2"><label class="field"><span>Hesap kesim günü</span><input class="input" id="ac-cut" type="number" inputmode="numeric" min="1" max="31" value="${c.cutDay}"></label>
        <label class="field"><span>Son ödeme günü</span><input class="input" id="ac-due" type="number" inputmode="numeric" min="1" max="31" value="${c.dueDay}"></label></div>
        <label class="field"><span>Asgari ödeme oranı (%)</span><input class="input" id="ac-min" type="number" inputmode="decimal" min="0" max="100" value="${c.minRate}"></label>
        <div class="grid2"><label class="field"><span>Akdi faiz (aylık %)</span><input class="input" id="ac-cr" inputmode="decimal" value="${F.money(c.contractRate)}" placeholder="opsiyonel"></label>
        <label class="field"><span>Gecikme faizi (aylık %)</span><input class="input" id="ac-lr" inputmode="decimal" value="${F.money(c.lateRate)}" placeholder="opsiyonel"></label></div>
        <p class="muted xs" style="margin:6px 4px 0">Faiz oranları sık değişir; bankanın güncel oranını girersen geciken ekstrelerde tahmini faiz gösterilir.</p>`
      :`<div class="grid2">${d.type==='fx'?`<label class="field"><span>Birim</span><select class="input" onchange="AccForm.set('currency',this.value)">${[['USD','Dolar ($)'],['EUR','Euro (€)'],['XAU','Gram altın']].map(([k,l])=>`<option value="${k}" ${d.currency===k?'selected':''}>${l}</option>`).join('')}</select></label>`:''}
        <label class="field"><span>${d.id?'Açılış bakiyesi':'Mevcut bakiye'}</span><input class="input" id="ac-open" inputmode="decimal" value="${F.money(d.opening)}" placeholder="0"></label>
        ${d.type==='checking'?`<label class="field"><span>KMH / ek hesap limiti</span><input class="input" id="ac-od" inputmode="decimal" value="${F.money(d.overdraft||'')}" placeholder="yoksa boş"></label>`:''}</div>`}
      <div class="field"><span>Renk</span>${F.swatches(d.color,'AccForm.setColor')}</div>
      ${cr?`<div class="field"><span>Kart deseni</span><div class="style-pick">${CARD_STYLES.map(([k,l])=>`<button class="ccard-mini cs-${k} pressable ${(d.style||'aurora')===k?'on':''}" style="${C.ccStyle(d)}" onclick="AccForm.set('style','${k}')"><span style="position:relative;z-index:1">${l}</span></button>`).join('')}</div></div>`:''}
      ${d.id?`<button class="btn danger pressable" onclick="AccForm.remove()">Hesabı sil</button>`:''}`)},
  sync(){const d=this.draft;if(!Sheet.el('#ac-name'))return;const v=Sheet.val;d.name=v('#ac-name');d.bank=v('#ac-bank');
    const map={'#ac-limit':'limit','#ac-cut':'cutDay','#ac-due':'dueDay','#ac-min':'minRate','#ac-cr':'contractRate','#ac-lr':'lateRate'};
    Object.entries(map).forEach(([q,k])=>{if(Sheet.el(q))d.credit[k]=v(q)});if(Sheet.el('#ac-open'))d.opening=v('#ac-open');if(Sheet.el('#ac-od'))d.overdraft=v('#ac-od')},
  set(k,v){this.sync();const d=this.draft;if(k==='sharedWith')d.credit.sharedWith=v;else d[k]=v;if(k==='type')d.currency=v==='fx'?'USD':'TRY';Haptic.tap();this.render()},
  setColor(i){this.set('color',i)},
  save(keepOpen){this.sync();const d=this.draft,cr=d.type==='credit';
    if(!d.name.trim()){Toast.show('Hesaba bir ad ver');return false}
    const out={id:d.id||U.uid(),type:d.type,name:d.name.trim(),bank:d.bank.trim(),color:d.color,style:cr?(d.style||'aurora'):undefined,currency:cr?'TRY':d.currency,opening:cr?0:U.r2(U.parseNum(d.opening)||0)};
    if(d.type==='checking')out.overdraft=U.r2(U.parseNum(d.overdraft)||0);
    if(cr){const c=d.credit,cut=parseInt(c.cutDay),due=parseInt(c.dueDay),lim=c.sharedWith?0:U.parseNum(c.limit);
      if(!(cut>=1&&cut<=31&&due>=1&&due<=31)){Toast.show('Günler 1–31 arasında olmalı');return false}
      if(!c.sharedWith&&!(lim>=0)){Toast.show('Geçerli bir limit gir');return false}
      const pr=v=>{const n=U.parseNum(v);return n>0?n:''};
      out.credit={limit:U.r2(lim||0),cutDay:cut,dueDay:due,sharedWith:c.sharedWith||'',minRate:Math.min(100,Math.max(0,U.parseNum(c.minRate)||20)),contractRate:pr(c.contractRate),lateRate:pr(c.lateRate)}}
    const isEdit=!!d.id,item=this.postSave?this.postSave(out,d):out;d.id=item.id;
    Store.dispatch({type:'upsert',col:'accounts',item});Haptic.success();if(keepOpen===true)return true;Sheet.close();Toast.show(isEdit?'✓ Hesap güncellendi':'✓ Hesap eklendi');return true},
  remove(){const n=Store.get().transactions.filter(t=>t.accountId===this.draft.id).length;
    if(!confirm(n?`Bu hesaba ait ${n} işlem de silinecek. Emin misin?`:'Hesap silinsin mi?'))return;
    Store.dispatch({type:'remove',col:'accounts',id:this.draft.id});Sheet.close();App.back(true);Toast.show('Hesap silindi')}
};

/* --- Kart borcu ödeme --- */

/* --- PIN kurulumu ve kilit ekranı --- */
const PinSetup={step:1,first:'',buf:'',len:4,
  open(){this.step=1;this.first='';this.buf='';this.len=Store.get().security.pinLen||4;this.render()},
  render(){Sheet.open(Sheet.head(this.step===1?'PIN belirle':'PIN\'i tekrar gir',{left:'Vazgeç',right:''})+
    `${this.step===1?C.segmented([['4','4 haneli'],['6','6 haneli']],String(this.len),'PinSetup.setLen'):''}
    <div style="display:flex;flex-direction:column;align-items:center;margin-top:10px"><div class="lock-dots" id="pin-dots">${Array.from({length:this.len},(_,i)=>`<i class="${i<this.buf.length?'on':''}"></i>`).join('')}</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="key glass pressable" onclick="PinSetup.press('${k}')">${k}</button>`).join('')}</div></div>`)},
  setLen(l){this.len=+l;this.buf='';this.render()},
  async press(k){Haptic.tap();if(k==='⌫')this.buf=this.buf.slice(0,-1);else if(this.buf.length<this.len)this.buf+=k;
    document.querySelectorAll('#pin-dots i').forEach((e,i)=>e.classList.toggle('on',i<this.buf.length));
    if(this.buf.length<this.len)return;
    if(this.step===1){this.first=this.buf;this.buf='';this.step=2;setTimeout(()=>this.render(),150)}
    else if(this.buf===this.first){Store.dispatch({type:'security/update',payload:{pinHash:await Security.hash(this.buf),pinLen:this.len}});Security.unlocked=true;Haptic.success();Sheet.close();Toast.show('🔒 PIN kilidi açıldı');setTimeout(()=>SettingsSheet.open('security'),300)}
    else{const d=document.getElementById('pin-dots');d.classList.add('shake');Haptic.error();Toast.show('PIN\'ler eşleşmedi, baştan dene');this.step=1;this.buf='';this.first='';setTimeout(()=>this.render(),450)}}
};
const LockScreen={buf:'',
  show(){let el=document.getElementById('lock');if(el)el.remove();const sec=Store.get().security,s=Store.get();this.buf='';
    el=document.createElement('div');el.id='lock';el.innerHTML=`<div class="ambient"><i></i><i></i><i></i></div><div class="avatar" style="width:64px;height:64px;font-size:26px">${U.esc((s.settings.name||'?')[0].toUpperCase())}</div>
      <h2>Cüzdan kilitli</h2><div class="muted sm">PIN'ini gir</div><div class="lock-dots" id="lock-dots">${Array.from({length:sec.pinLen||4},()=>'<i></i>').join('')}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9,sec.bioId&&Security.bioAvailable()?'bio':'',0,'⌫'].map(k=>k===''?'<span></span>':k==='bio'?`<button class="key ghost pressable" onclick="LockScreen.bio()" aria-label="Face ID">${C.ic('faceid')}</button>`:`<button class="key glass pressable" onclick="LockScreen.press('${k}')">${k}</button>`).join('')}</div>`;
    document.body.appendChild(el);if(sec.bioId&&Security.bioAvailable())setTimeout(()=>this.bio(),450)},
  async press(k){if(Date.now()<Security.blockedUntil){Toast.show('Çok fazla deneme. '+Math.ceil((Security.blockedUntil-Date.now())/1000)+' sn bekle');return}
    Haptic.tap();const len=Store.get().security.pinLen||4;if(k==='⌫')this.buf=this.buf.slice(0,-1);else if(this.buf.length<len)this.buf+=k;
    document.querySelectorAll('#lock-dots i').forEach((e,i)=>e.classList.toggle('on',i<this.buf.length));
    if(this.buf.length<len)return;
    if(await Security.hash(this.buf)===Store.get().security.pinHash){Security.fails=0;this.unlock()}
    else{Security.fails++;if(Security.fails>=5){Security.blockedUntil=Date.now()+30000;Security.fails=0}Haptic.error();const d=document.getElementById('lock-dots');d.classList.add('shake');
      setTimeout(()=>{d.classList.remove('shake');this.buf='';d.querySelectorAll('i').forEach(e=>e.classList.remove('on'))},420)}},
  async bio(){try{await Security.bioVerify();this.unlock()}catch(e){}},
  unlock(){Security.unlocked=true;Haptic.success();const el=document.getElementById('lock');if(el){el.classList.add('out');setTimeout(()=>el.remove(),340)}Reminders.run()}
};

const VoiceSheet={rec:null,

  toggle(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(this.rec){this.rec.stop();return}

/* --- AI Asistan (sohbet) --- */
const Chat={msgs:[],busy:false,
  SUGGEST:['Bu ay en çok nereye harcadım?','Geçen aya göre neler değişti?','Önümüzdeki ay kart borcum ne kadar olacak?','Telefon hedefime ne zaman ulaşırım?','Kafe harcamalarım ne kadar?','Hangi abonelikleri iptal edebilirim?'],
  async ask(q){q=(q||'').trim();if(!q||this.busy)return;const s=Store.get();
    if(!Secrets.get()){App.openSettings('ai');return}
    if(!s.settings.chatConsent){if(!confirm('Asistan, sorunu cevaplamak için son 4 ayın işlem listesini (mağaza adları ve tutarlar) ve hesap özetini Google Gemini\'ye gönderir. Devam edilsin mi?'))return;
      Store.dispatch({type:'settings/update',payload:{chatConsent:true}})}
    this.msgs.push({role:'user',text:q});this.busy=true;App.render();this.scroll();
    try{const a=await AIActions.run('chat',()=>AI.call(Prompts.chat(q,this.msgs.slice(0,-1),D.chatContext(Store.get()))));this.msgs.push({role:'ai',text:String(a)})}
    catch(e){this.msgs.push({role:'ai',text:'⚠️ '+AI.human(e),err:true})}
    this.busy=false;App.render();this.scroll()},
  scroll(){setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),60)},
  send(){const el=document.getElementById('chat-in');if(!el)return;const v=el.value;el.value='';this.ask(v)},
  clear(){this.msgs=[];App.render()}};
Pages.chat=(s)=>{const key=!!Secrets.get();
  return C.pageHead('Asistan','Verilerine soru sor · Google Gemini',Chat.msgs.length?`<button class="head-btn" onclick="Chat.clear()">Temizle</button>`:'')+
    `<div class="chat">${!Chat.msgs.length?`<div class="glass ai-card" style="margin-top:14px"><div class="ai-head"><span class="ai-orb"></span><div><b>Merhaba ${U.esc(s.settings.name||'')}!</b><div class="muted xs">Harcamaların, kartların, kredilerin ve hedeflerin hakkında sor.</div></div></div>
        ${key?'':`<button class="btn primary pressable" onclick="App.openSettings('ai')">Gemini'yi bağla</button>`}</div>
      <div class="chips" style="flex-wrap:wrap;margin:0;padding:14px 0 0">${Chat.SUGGEST.map(q=>`<button class="chip pressable" onclick="Chat.ask('${q.replace(/'/g,"\\'")}')">${q}</button>`).join('')}</div>`:''}
    ${Chat.msgs.map(m=>`<div class="bubble ${m.role}${m.err?' err':''}">${m.role==='ai'?U.md(m.text):U.esc(m.text)}</div>`).join('')}
    ${Chat.busy?`<div class="bubble ai typing"><i></i><i></i><i></i></div>`:''}</div>
    <div class="chat-bar glass"><input id="chat-in" placeholder="Bir şey sor…" autocomplete="off" onkeydown="if(event.key==='Enter')Chat.send()" ${Chat.busy?'disabled':''}><button class="send pressable" onclick="Chat.send()" aria-label="Gönder">${C.ic('arrowup')}</button></div>`};

/* =====================================================================
   v6 · Liquid Glass etkileşimleri
   Lens   : alt bar ve bölümlü kontrollerde parmakla sürüklenen cam mercek
   NavBar : büyük başlık kaybolunca beliren cam gezinme çubuğu (+ durum çubuğu alanı)
   Dock   : aşağı kaydırınca küçülen alt bar
   KB     : klavye açıkken alt barı gizle, pencereleri görünür alana sığdır
   ===================================================================== */
const Lens={st:null,
  init(){document.addEventListener('pointerdown',e=>{if(e.button>0)return;const c=e.target.closest&&e.target.closest('#tabbar,.seg');if(c)this.start(c,e)},{passive:true});
    document.addEventListener('pointermove',e=>this.move(e),{passive:true});

/* ---------- Gökkuşağı çubuklar (Apple Card tarzı) ---------- */
D.rainbow=U.memo((s,mode)=>{const T=U.today(),t=new Date(),cols=[];
  if(mode==='week'){const dow=(t.getDay()+6)%7,st=U.addDays(T,-dow);['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].forEach((l,i)=>{const d=U.addDays(st,i);cols.push({label:l,from:d,to:d,future:d>T,title:U.dayHeader(d)})})}
  else if(mode==='month'){const y=t.getFullYear(),m=t.getMonth(),n=U.dim(y,m);for(let a=1;a<=n;a+=7){const b=Math.min(n,a+6),from=U.iso(new Date(y,m,a)),to=U.iso(new Date(y,m,b));cols.push({label:a+'–'+b,from,to,future:from>T,title:`${a}–${b} ${U.MONTHS[m]}`})}}
  else{const y=t.getFullYear();for(let m=0;m<12;m++){const from=U.monthStart(y,m),to=U.monthEnd(y,m);cols.push({label:U.mon(m),from,to,future:from>T,title:U.MONTHS[m]+' '+y})}}
  const tot={};cols.forEach(c=>{const by=D.sumBy(D.spendIn(s,c.from,c.to));c.by=by;c.total=U.r2(Object.values(by).reduce((a,b)=>a+Math.max(0,b),0));Object.entries(by).forEach(([k,v])=>tot[k]=(tot[k]||0)+v)});
  const order=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);const max=Math.max(1,...cols.map(c=>c.total));
  return{cols,order,max,total:U.r2(cols.reduce((a,c)=>a+c.total,0)),active:cols.filter(c=>!c.future).length||1}});
C.rainbow=(s,mode,sel,{h=150,fn='App.rbSel'}={})=>{const R=D.rainbow(s,mode);const S=sel!=null&&R.cols[sel]?R.cols[sel]:null;
  const bars=R.cols.map((c,i)=>`<button class="rb-col ${sel===i?'on':''} ${sel!=null&&sel!==i?'dim':''}" onclick="${fn}(${i})" aria-label="${U.esc(c.title)}: ${U.money(c.total,{raw:true})}">
      <span class="rb-v">${c.total?U.short(c.total):''}</span><span class="rb-stack ${c.future?'fut':''}">${R.order.filter(k=>c.by[k]>0).map(k=>`<i style="height:${c.by[k]/R.max*100}%;background:${cat(k).color}"></i>`).join('')}</span><span class="rb-l">${c.label}</span></button>`).join('');
  const sum=S?`<div class="rb-sum"><b>${U.esc(S.title)}</b> · ${U.money(S.total,{dec:false})}<div class="rb-cats">${R.order.filter(k=>S.by[k]>0).slice(0,4).map(k=>`<span><i style="background:${cat(k).color}"></i>${cat(k).name} ${U.money(S.by[k],{dec:false})}</span>`).join('')}</div></div>`
    :`<div class="rb-sum"><b>Toplam ${U.money(R.total,{dec:false})}</b> · ortalama ${U.money(R.total/R.active,{dec:false})}/${mode==='week'?'gün':mode==='month'?'hafta':'ay'}<div class="rb-cats">${R.order.slice(0,4).map(k=>`<span><i style="background:${cat(k).color}"></i>${cat(k).name}</span>`).join('')}</div></div>`;
  return `<div class="rb" style="--rbh:${h}px">${bars}</div>${sum}`};

/* ---------- Eğilimler (Apple Sağlık tarzı) ---------- */
D.trends=U.memo(s=>{const t=new Date(),months=[];for(let k=4;k>=1;k--){const d=new Date(t.getFullYear(),t.getMonth()-k,1);months.push({y:d.getFullYear(),m:d.getMonth()})}
  const by=months.map(x=>D.sumBy(D.spendIn(s,U.monthStart(x.y,x.m),U.monthEnd(x.y,x.m))));if(by.filter(b=>Object.keys(b).length).length<2)return[];
  const keys=[...new Set(by.flatMap(b=>Object.keys(b)))],out=[];
  for(const k of keys){const arr=by.map(b=>U.r2(Math.max(0,b[k]||0))),recent=arr[3],prev=arr.slice(0,3).filter((v,i)=>v>0||by[i]&&Object.keys(by[i]).length);
    const base=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:0;if(Math.max(recent,base)<150)continue;
    const pct=base?(recent-base)/base*100:100;if(Math.abs(pct)<12)continue;let streak=1;
    for(let i=3;i>0;i--){if((pct>0&&arr[i]>arr[i-1])||(pct<0&&arr[i]<arr[i-1]))streak++;else break}
    out.push({key:k,...cat(k),dir:pct>0?'up':'down',pct:Math.round(Math.abs(pct)),arr,recent,base:U.r2(base),streak:Math.min(streak,4),labels:months.map(x=>U.mon(x.m)),score:Math.abs(recent-base)})}
  return out.sort((a,b)=>b.score-a.score).slice(0,4)});
C.spark=(arr,color,w=90,h=34)=>{const mx=Math.max(...arr,1),mn=Math.min(...arr,0),r=mx-mn||1;const p=arr.map((v,i)=>[(i/(arr.length-1))*(w-6)+3,h-4-(v-mn)/r*(h-8)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${p.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`};
C.trendCard=tr=>{const up=tr.dir==='up',col=up?'#ff9f0a':'#30d158';
  const txt=`${tr.name} harcaman ${tr.streak>=3?tr.streak-1+' aydır '+(up?'artıyor':'azalıyor'):'geçen ay '+(up?'arttı':'azaldı')}`;
  return `<div class="trend glass"><div class="tr-top">${C.icb(tr.icon,tr.color)}<span class="tr-badge" style="color:${col};background:${col}22">${C.ic(up?'arrowup':'arrowdown')}%${tr.pct}</span></div>
    <b>${U.esc(txt)}</b><div class="tr-bot">${C.spark(tr.arr,col)}<span class="muted xs tr-avg">Ort. ${U.money(tr.base,{dec:false})} → <b>${U.money(tr.recent,{dec:false})}</b></span></div></div>`};
C.trends=(s,n=4)=>{const list=D.trends(s).slice(0,n);return list.length?`<div class="trends">${list.map(C.trendCard).join('')}</div>`:''};

    if(r.biggest)out.push({bg:g('#ff9f0a','#ff375f'),k:'En büyük harcama',big:U.money(r.biggest.amount,{dec:false,raw:true}),sub:`${r.biggest.merchant||cat(r.biggest.category).name} · ${U.fmtDate(r.biggest.date,true)}${r.biggest.installments>1?' · '+r.biggest.installments+' taksit':''}`,icon:cat(r.biggest.category).icon});
    const last=Math.min(r.daily.length,y===new Date().getFullYear()&&m===new Date().getMonth()?new Date().getDate():r.daily.length),zero=r.daily.slice(0,last).filter(v=>v<=0).length;
    const wd=[0,0,0,0,0,0,0];r.daily.forEach((v,i)=>{wd[new Date(y,m,i+1).getDay()]+=v});const bw=wd.indexOf(Math.max(...wd));

    out.push({bg:g('#5e5ce6','#32ade6'),k:'Birikim',big:r.saveRate!==null?'%'+Math.max(0,Math.round(r.saveRate*100)):U.money(dep,{dec:false,raw:true}),
      sub:[r.income?`Gelir ${U.money(r.income,{dec:false,raw:true})}, net ${U.money(r.net,{dec:false,sign:true,raw:true})}`:'',dep?`Kumbaralara ${U.money(dep,{dec:false,raw:true})} attın`:'',s.budgets.length?`${s.budgets.length} bütçenin ${kept} tanesinde kaldın`:''].filter(Boolean).join(' · ')||'Bu ay birikim kaydı yok',icon:'piggy'});

  open(y,m){const s=Store.get();this.y=y;this.m=m;this.slides=this.build(s,y,m);this.i=0;

    document.getElementById('story')?.remove();const el=document.createElement('div');el.id='story';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',U.MONTHS[m]+' özeti');
    el.innerHTML=`<div class="st-bars">${this.slides.map(()=>'<i><b></b></i>').join('')}</div><button class="st-x" onclick="Recap.close()" aria-label="Kapat">${C.ic('close')}</button><div class="st-body" id="st-body"></div>
